<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atelier de dialogues — Caravane</title>
<style>

:root{
  --fond:#1C1A17; --fond-clair:#26231F; --bord:#3A352E;
  --encre:#E8E1D4; --encre-pale:#9C9484;
  --or:#C9A227; --minium:#E0755C; --vert:#6E9B6A; --azur:#4A7BC8;
  --r:3px;
}
*{margin:0;padding:0;box-sizing:border-box;font:inherit;color:inherit;background:none;border:none}
html,body{height:100%}
body{
  font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--fond);color:var(--encre);
  display:flex;flex-direction:column;overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
button{cursor:pointer;user-select:none}
input,select,textarea{background:var(--fond);border:1px solid var(--bord);border-radius:var(--r);
  padding:5px 7px;color:var(--encre);width:100%;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:1px solid var(--or);border-color:var(--or)}
select{cursor:pointer}
option,optgroup{background:var(--fond-clair)}
textarea{resize:vertical;line-height:1.5}
input[type=checkbox]{width:auto;accent-color:var(--or)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#3A352E;border-radius:5px}

#barre{flex:none;display:flex;align-items:center;gap:6px;padding:7px 10px;
  background:var(--fond-clair);border-bottom:1px solid var(--bord);flex-wrap:wrap}
#barre h1{font-size:15px;font-weight:600;letter-spacing:.02em;margin-right:6px;white-space:nowrap}
#barre h1 b{color:var(--or)}
.outil{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--bord);
  border-radius:var(--r);background:var(--fond);font-size:13px;white-space:nowrap;
  text-decoration:none}
.outil:hover{border-color:var(--encre-pale)}
.outil.fort{background:var(--or);color:#1C1A17;border-color:var(--or);font-weight:600}
.outil.danger{color:var(--minium);border-color:#5A2A20}
.outil.petit{padding:3px 8px;font-size:12px}
.sep{width:1px;align-self:stretch;background:var(--bord);margin:0 3px}
.pousse{margin-left:auto}

#scene{flex:1;min-height:0;display:flex}
#carnet{flex:none;width:236px;background:var(--fond-clair);border-right:1px solid var(--bord);
  display:flex;flex-direction:column;min-height:0}
#carnet>input{margin:8px;width:auto;flex:none}
#liste{flex:1;overflow-y:auto;padding:0 8px 8px}
.groupe{font-size:11px;font-variant:small-caps;letter-spacing:.09em;color:var(--or);
  padding:9px 4px 4px}
.entree{display:flex;align-items:center;gap:7px;width:100%;text-align:left;padding:6px 8px;
  border:1px solid transparent;border-radius:var(--r);margin-bottom:3px;font-size:13px}
.entree:hover{background:#2E2A22}
.entree.actif{background:#2E2A22;border-color:var(--or)}
.entree .jeton{width:22px;height:22px;flex:none}
.entree .jeton svg{width:100%;height:100%;display:block}
.entree .txt{flex:1;min-width:0;line-height:1.25}
.entree b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entree span{font-size:11px;color:var(--encre-pale)}
.entree.faux b{color:var(--minium)}

#feuille{flex:1;min-width:0;overflow-y:auto;padding:14px 16px 60px;display:flex;
  flex-direction:column;gap:13px}
#cote{flex:none;width:352px;background:var(--fond-clair);border-left:1px solid var(--bord);
  display:flex;flex-direction:column;min-height:0}
#onglets{flex:none;display:flex;border-bottom:1px solid var(--bord)}
#onglets button{flex:1;padding:8px 3px;font-size:11.5px;border-bottom:2px solid transparent;
  color:var(--encre-pale)}
#onglets button.actif{color:var(--or);border-bottom-color:var(--or)}
#volet{flex:1;overflow-y:auto;padding:12px}

.bloc{border:1px solid var(--bord);border-radius:var(--r);background:var(--fond-clair)}
.bloc>h2{font-size:12px;font-variant:small-caps;letter-spacing:.09em;color:var(--or);
  padding:7px 10px;border-bottom:1px solid var(--bord);display:flex;align-items:center;gap:8px}
.bloc>h2 .pousse{margin-left:auto}
.bloc>h2 button{font-size:11px;padding:2px 7px;border:1px solid var(--bord);border-radius:var(--r);
  color:var(--encre-pale)}
.bloc>h2 button:hover{color:var(--encre);border-color:var(--encre-pale)}
.bloc>.corps{padding:10px;display:flex;flex-direction:column;gap:9px}
.champ{display:grid;grid-template-columns:140px 1fr;gap:8px;align-items:start}
.champ>label{font-size:12.5px;color:var(--encre-pale);padding-top:6px;line-height:1.3}
.champ.large{grid-template-columns:1fr}
.champ.large>label{padding-top:0}
.aide{font-size:11.5px;color:var(--encre-pale);line-height:1.45;margin-top:3px}
.aide b{color:var(--encre)}
.rangee{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rangee>*{flex:1;min-width:0}
.rangee>.fixe{flex:none}
.mot{font-size:12px;color:var(--encre-pale);flex:none}
.vide{font-size:12.5px;color:var(--encre-pale);font-style:italic}

.piece{border:1px solid var(--bord);border-left:3px solid var(--azur);border-radius:var(--r);
  background:var(--fond)}
.piece>header{display:flex;align-items:center;gap:7px;padding:6px 9px;font-size:12.5px;
  border-bottom:1px solid var(--bord)}
.piece>header b{flex:1;min-width:0;color:var(--encre)}
.piece>header .rang{color:var(--or);font-variant:small-caps;letter-spacing:.07em;flex:none}
.piece>header button{font-size:11px;padding:1px 6px;border:1px solid var(--bord);
  border-radius:var(--r);color:var(--encre-pale)}
.piece>header button:hover{color:var(--encre);border-color:var(--encre-pale)}
.piece>.corps{padding:9px;display:flex;flex-direction:column;gap:8px}
.piece .explique{font-size:11.5px;color:var(--encre-pale);line-height:1.45}
.cond{border:1px solid var(--bord);border-radius:var(--r);padding:7px;display:flex;
  flex-direction:column;gap:6px}
.pile{display:flex;flex-direction:column;gap:7px}
.ajout{font-size:12px;padding:5px 9px;border:1px dashed var(--bord);border-radius:var(--r);
  color:var(--encre-pale);align-self:flex-start}
.ajout:hover{border-color:var(--or);color:var(--or)}

/* ── le commanditaire, en évidence ── */
.qui{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--bord);
  border-radius:var(--r);background:var(--fond)}
.qui .jeton{width:32px;height:32px;flex:none}
.qui .jeton svg{width:100%;height:100%;display:block}
.qui .txt{flex:1;min-width:0}
.qui b{display:block;font-size:14px}
.qui span{font-size:11.5px;color:var(--encre-pale)}
.qui.rien{border-style:dashed;color:var(--encre-pale)}

.glyphes{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:4px;
  max-height:150px;overflow-y:auto;padding:4px;border:1px solid var(--bord);border-radius:var(--r)}
.glyphes button{aspect-ratio:1;border:1px solid transparent;border-radius:var(--r);padding:4px}
.glyphes button:hover{border-color:var(--encre-pale)}
.glyphes button.actif{border-color:var(--or);background:#2E2A22}
.glyphes svg{width:100%;height:100%;display:block}

/* ── l'offre, dans les couleurs du jeu ── */
.offre{--velin:#E3D6B2;--velin-clair:#F0E7CE;--filet:#2B2116;
  --gencre:#2B2116;--gencre-pale:#6C5C46;--gminium:#A32C1C;--gor:#96751F;--gvert:#4C6A44;
  --display:'Iowan Old Style','Hoefler Text','Palatino Linotype',Palatino,Georgia,serif;
  background:var(--velin-clair);color:var(--gencre);border:1px solid var(--filet);
  border-radius:var(--r);padding:13px;font-family:var(--display)}
.offre .tete{display:flex;align-items:center;gap:11px;margin-bottom:9px}
.offre .ico{width:44px;height:44px;flex:none}
.offre .ico svg{width:100%;height:100%;display:block}
.offre .oeil{font-size:12px;font-variant:small-caps;letter-spacing:.13em;color:var(--gencre-pale)}
.offre h3{font-size:20px;font-weight:600;line-height:1.15}
.offre .recit{font-size:14.5px;line-height:1.5;margin-bottom:11px}
.offre .recit::first-letter{color:var(--gminium);font-size:1.05em}
.offre .lignes{display:grid;grid-template-columns:auto 1fr;gap:3px 9px;font-size:12.5px;
  font-family:system-ui,sans-serif;padding:8px 0;border-top:1px solid #2B211630;
  border-bottom:1px solid #2B211630}
.offre .lignes dt{color:var(--gencre-pale)}
.offre .lignes dd{font-weight:600}
.offre .prix{margin-top:9px;font-size:13px;font-family:system-ui,sans-serif}
.offre .prix b{color:var(--gor)}
.offre .fin{margin-top:10px;font-size:14px;line-height:1.5;padding:9px 10px;
  background:var(--velin);border-left:3px solid var(--gvert);border-radius:0 var(--r) var(--r) 0}
.offre .fin.mauvais{border-left-color:var(--gminium)}

/* ── le fil des jalons ── */
.fil{display:flex;flex-direction:column;gap:0}
.fil .etape{display:flex;gap:10px}
.fil .rail{flex:none;width:16px;display:flex;flex-direction:column;align-items:center}
.fil .pion{width:11px;height:11px;border-radius:50%;background:var(--or);flex:none;margin-top:4px}
.fil .pion.dep{background:var(--azur)}
.fil .pion.fin{background:var(--vert)}
.fil .trait{flex:1;width:2px;background:var(--bord);min-height:14px}
.fil .corps2{flex:1;min-width:0;padding-bottom:11px}
.fil b{font-size:13px}
.fil span{display:block;font-size:11.5px;color:var(--encre-pale)}
.fil .cout{font-size:11.5px;color:var(--or);font-variant-numeric:tabular-nums}

.avert{font-size:12.5px;padding:7px 9px;border-left:2px solid var(--minium);background:#2A211E;
  margin-bottom:6px;border-radius:0 var(--r) var(--r) 0;line-height:1.45}
.avert.doux{border-color:var(--or);background:#2A2620}
.avert.bien{border-color:var(--vert);background:#212A20}
.avert b{color:var(--encre)}
h4.section{font-size:11.5px;font-variant:small-caps;letter-spacing:.09em;color:var(--or);
  margin:12px 0 6px}
h4.section:first-child{margin-top:0}
.mesures{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:12.5px;
  font-variant-numeric:tabular-nums}
.mesures b{text-align:right}
.tableau{width:100%;font-size:12px;border-collapse:collapse}
.tableau td,.tableau th{padding:3px 5px;border-bottom:1px solid var(--bord);text-align:left}
.tableau th{color:var(--encre-pale);font-weight:400;font-size:11px}
.tableau td.n{text-align:right;font-variant-numeric:tabular-nums}

/* ── le volet des personnages ── */
.gens{display:flex;flex-direction:column;gap:7px}
.gens .carte{border:1px solid var(--bord);border-radius:var(--r);padding:8px 9px;
  background:var(--fond)}
.gens .carte.sien{border-color:var(--or);background:#2E2A22}
.gens .haut{display:flex;align-items:center;gap:8px}
.gens .jeton{width:26px;height:26px;flex:none}
.gens .jeton svg{width:100%;height:100%;display:block}
.gens .txt{flex:1;min-width:0}
.gens b{display:block;font-size:13px}
.gens .sous{font-size:11px;color:var(--encre-pale)}
.gens .extrait{font-size:11.5px;color:var(--encre-pale);line-height:1.45;margin-top:5px;
  font-style:italic}
.gens .rangee{margin-top:7px}
.gens .aucune{color:var(--or)}

#etat{flex:none;display:flex;gap:14px;padding:5px 11px;background:var(--fond-clair);
  border-top:1px solid var(--bord);font-size:12px;color:var(--encre-pale);
  font-variant-numeric:tabular-nums;flex-wrap:wrap}
#etat b{color:var(--encre);font-weight:600}
#etat .rouge{color:var(--minium)}
#toile-depot{position:fixed;inset:0;background:#1C1A17E0;display:none;align-items:center;
  justify-content:center;font-size:17px;color:var(--or);z-index:9;pointer-events:none}
#toile-depot.on{display:flex}
@media (max-width:1150px){#cote{width:310px}#carnet{width:190px}}
@media (max-width:880px){
  #scene{flex-direction:column}
  #carnet{width:auto;max-height:150px;border-right:none;border-bottom:1px solid var(--bord)}
  #cote{width:auto;max-height:46%;border-left:none;border-top:1px solid var(--bord)}
}

/* les blocs d'effet et de condition, comme dans l'atelier d'événements */
.effet{border:1px solid var(--bord);border-radius:var(--r);background:var(--fond)}
.effet>header{display:flex;align-items:center;gap:7px;padding:5px 8px;font-size:12.5px;
  background:#2A261F;border-bottom:1px solid var(--bord);border-radius:2px 2px 0 0}
.effet>header b{flex:1;min-width:0;color:var(--encre)}
.effet>header button{font-size:11px;color:var(--encre-pale);padding:1px 5px;
  border:1px solid var(--bord);border-radius:var(--r);background:var(--fond);flex:none}
.effet>header button:hover{color:var(--minium);border-color:#5A2A20}
.effet>.corps{padding:8px;display:flex;flex-direction:column;gap:7px}
.effet .explique{font-size:11.5px;color:var(--encre-pale);line-height:1.45}
.soucis{list-style:none;display:flex;flex-direction:column;gap:6px;margin-top:6px}
.soucis li{font-size:12px;line-height:1.45;padding-left:15px;position:relative;
  color:var(--encre-pale)}
.soucis li::before{content:'·';position:absolute;left:4px;color:var(--encre-pale)}
.soucis li.dur{color:var(--encre)}
.soucis li.dur::before{content:'!';color:var(--minium);font-weight:700}
.soucis b{color:var(--encre)}
h4.section{font-size:11px;font-variant:small-caps;letter-spacing:.09em;color:var(--or);
  margin:13px 0 2px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;font-size:12px;
  border:1px solid var(--bord);border-radius:12px;cursor:pointer}
.chip.actif{border-color:var(--or);color:var(--or)}
.chip input{display:none}

/* ── ce qui est propre aux dialogues ── */
.rep{border:1px solid var(--bord);border-left:3px solid var(--or);border-radius:var(--r);
  background:var(--fond)}
.rep>header{display:flex;align-items:center;gap:7px;padding:6px 9px;font-size:12.5px;
  background:#2A261F;border-bottom:1px solid var(--bord);border-radius:2px 2px 0 0}
.rep>header b{flex:1;min-width:0;color:var(--encre);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.rep>header .marque{font-size:10.5px;font-variant:small-caps;letter-spacing:.07em;
  padding:1px 6px;border:1px solid var(--bord);border-radius:9px;flex:none;
  color:var(--encre-pale)}
.rep>header .marque.debut{color:var(--or);border-color:#5A4A18}
.rep>header .marque.orphelin{color:var(--minium);border-color:#5A2A20}
.rep>header button{font-size:11px;padding:1px 6px;border:1px solid var(--bord);
  border-radius:var(--r);background:var(--fond);color:var(--encre-pale);flex:none}
.rep>header button:hover{color:var(--encre);border-color:var(--encre-pale)}
/* ── ce qui empêche une longue réponse de crever le panneau ──
   Une colonne flex donne à ses enfants la largeur de leur contenu tant qu'aucun
   min-width:0 ne l'autorise à rétrécir. Sans ces lignes, une réponse un peu
   longue — « Le bac du Gué, alors. » — poussait la réplique à 570 px dans une
   colonne de 340, et la fin passait sous le bord de l'écran. */
.rep>.corps{padding:9px;display:flex;flex-direction:column;gap:8px;min-width:0}
.rep>.corps>*,.reponse>.corps>*,.pile>*{min-width:0}
.reponse{min-width:0}
.champ.large{min-width:0}
.champ.large>*{min-width:0}
.rep.replie>.corps{display:none}

.reponse{border:1px solid var(--bord);border-left:3px solid var(--azur);
  border-radius:var(--r);background:var(--fond-clair)}
.reponse>header{display:flex;align-items:center;gap:6px;padding:5px 8px;font-size:12px}
.reponse>header b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;font-weight:400;color:var(--encre-pale)}
.reponse>header b i{color:var(--encre);font-style:normal}
.reponse>header button{font-size:11px;padding:1px 6px;border:1px solid var(--bord);
  border-radius:var(--r);background:var(--fond);color:var(--encre-pale);flex:none}
.reponse>.corps{padding:8px;display:flex;flex-direction:column;gap:7px;
  border-top:1px solid var(--bord);min-width:0}
.reponse.replie>.corps{display:none}
.reponse .mene{font-size:11px;color:var(--or);flex:none;font-variant:small-caps;
  letter-spacing:.06em}
.reponse .mene.nulle-part{color:var(--minium)}

/* le fil : la conversation vue de haut */
.fil{display:flex;flex-direction:column;gap:8px}
.noeud{border:1px solid var(--bord);border-radius:var(--r);padding:8px 9px;
  background:var(--fond);font-size:12px}
.noeud.depart{border-color:var(--or)}
.noeud.perdu{border-color:#5A2A20}
.noeud>b{display:block;font-size:12.5px;color:var(--or);margin-bottom:3px}
.noeud .dit{color:var(--encre-pale);line-height:1.4;font-style:italic;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.noeud ul{list-style:none;margin-top:6px;display:flex;flex-direction:column;gap:3px}
.noeud li{font-size:11.5px;color:var(--encre-pale);padding-left:13px;position:relative;
  line-height:1.4}
.noeud li::before{content:'↳';position:absolute;left:0;color:var(--bord)}
.noeud li em{color:var(--azur);font-style:normal}
.noeud li em.fin{color:var(--vert)}
.noeud li em.casse{color:var(--minium)}
.noeud li s{color:var(--encre-pale);opacity:.6}

/* l'aperçu : on joue la conversation pour de faux */
.jeu{--velin:#E3D6B2;--velin-clair:#F0E7CE;--filet:#2B2116;--gencre:#2B2116;
  --gencre-pale:#6B5B45;--gor:#8A6E1E;--gminium:#A3321C;
  background:var(--velin);color:var(--gencre);border-radius:var(--r);
  padding:13px;font-family:Georgia,'Iowan Old Style',serif}
.jeu .tete{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.jeu .ico{width:36px;height:36px;flex:none}
.jeu .ico svg{width:100%;height:100%;display:block}
.jeu .oeil{font-size:11px;font-variant:small-caps;letter-spacing:.12em;
  color:var(--gencre-pale)}
.jeu h3{font-size:18px;font-weight:600;line-height:1.15}
.jeu .dit{font-size:14.5px;line-height:1.5;padding-left:10px;
  border-left:2px solid var(--filet);margin-bottom:11px}
.jeu .rep-jeu{width:100%;text-align:left;background:var(--velin-clair);
  border:1px solid var(--filet);border-radius:2px;padding:8px 10px;margin-bottom:6px;
  color:var(--gencre);font-family:inherit;font-size:14px;font-weight:600}
.jeu .rep-jeu span{display:block;font-size:11.5px;font-weight:400;font-style:italic;
  color:var(--gencre-pale);margin-top:1px}
.jeu .rep-jeu:disabled{opacity:.45}
.jeu .fini{font-size:13px;color:var(--gencre-pale);font-style:italic;
  padding-top:8px;border-top:1px solid var(--filet)}
.chemin{font-size:11.5px;color:var(--encre-pale);margin-top:10px;line-height:1.5}
.chemin b{color:var(--encre)}

/* ── au doigt ──
   Les commandes minuscules de cet atelier s'élargissent sous un pointeur
   grossier, sans rien changer à la souris. (Les pastilles de teinte viennent de
   commun.js, qui a la même règle.) */
@media (pointer:coarse){
  [data-act^="couche-"],[data-act^="jalon-"],[data-act^="rep-"],[data-act^="reponse-"]{
    min-width:32px;min-height:32px}
  .rep>header button,.reponse>header button{min-width:30px;min-height:30px;
    padding:4px 7px;font-size:12.5px}
}
</style>
</head>
<body>

<div id="barre">
  <h1>Atelier de <b>dialogues</b></h1>
  <button class="outil" id="b-nouveau">+ Dialogue</button>
  <button class="outil" id="b-dupliquer">Dupliquer</button>
  <button class="outil danger" id="b-supprimer">Supprimer</button>
  <span class="sep"></span>
  <button class="outil" id="b-ouvrir">Ouvrir un recueil…</button>

<script id="reference" type="application/json">
{"vocabulaire":{"format":"caravane.vocabulaire.v1","apropos":"Le catalogue de tout ce qu'un événement peut dire. Le générateur en tire ses formulaires, la documentation en tire son tutoriel, et les vérifications en tirent leurs règles. Ajouter une entrée ici suffit à la faire apparaître partout.","formes":{"direct":{"nom":"Issue certaine","explique":"Le choix a une seule fin, connue d'avance. On paie, on attend, on repart : pas de dé, pas de surprise.","quand":"La plupart des choix prudents, et tous les choix qui ne font que raconter.","champs":["effets","texte"]},"jet":{"nom":"Jet de dé","explique":"On lance un dé à vingt faces, auquel s'ajoutent le karma et l'état du convoi. Selon le total, l'issue change.","quand":"Dès que le résultat doit dépendre de la chance et de la valeur de la troupe.","champs":["jet","reussi","rate"],"variante":{"nom":"Jet gradué","explique":"Au lieu de deux issues, on découpe le résultat en paliers : un coup de maître, un résultat honnête, un échec, un désastre. Le premier palier dont les bornes conviennent l'emporte, et le dernier sans bornes ramasse le reste.","champs":["jet.paliers"]}},"pari":{"nom":"Pari","explique":"On mise une somme. Si l'on gagne, on la double ; si l'on perd, elle disparaît. La difficulté se calcule toute seule à partir de la chance annoncée.","quand":"Les jeux de hasard, les défis, les paris de taverne.","champs":["pari","gagne","perd"]},"selon":{"nom":"Selon l'état du convoi","explique":"L'issue ne dépend pas du sort mais de ce que vous avez : assez d'or, assez de place, un chien, un garde. Deux fins, l'une pour oui, l'autre pour non.","quand":"Quand vouloir ne suffit pas — payer un droit qu'on n'a peut-être pas les moyens de payer.","champs":["selon","oui","non"]}},"effets":{"or":{"nom":"Gagner ou perdre de l'or","explique":"Ajoute ou retire des pièces à la bourse. Un montant négatif retire ; la bourse ne descend jamais sous zéro.","parametres":{"de":{"nom":"Combien","type":"valeur","requis":true,"aide":"Négatif pour une perte. « -40 » retire 40 pièces ; « {selon: or, fois: -0.15} » en retire 15 %."}},"nomme":{"explique":"Le montant réellement bougé — utile quand la bourse était trop maigre.","exemple":"240"}},"reputation":{"nom":"Faire monter ou tomber la réputation","explique":"Ce que le monde marchand pense de vous. Elle ouvre des portes, fait baisser les prix, et permet de parlementer avec des gens peu recommandables. Elle reste entre 0 et 100.","parametres":{"de":{"nom":"Combien","type":"nombre","requis":true,"aide":"Négatif pour une perte. Comptez 2 à 6 pour un geste ordinaire, 9 ou plus pour une infamie."}}},"karma":{"nom":"Faire monter ou tomber le karma","explique":"La chance du convoi. Un karma haut ajoute un bonus à tous les jets de dé ; un karma bas les plombe. C'est la récompense discrète des bonnes actions. Entre 0 et 100.","parametres":{"de":{"nom":"Combien","type":"nombre","requis":true,"aide":"Négatif pour une perte. 3 à 5 pour un bon geste, 7 pour une mesquinerie."}}},"allonger":{"nom":"Rallonger le voyage","explique":"Ajoute des étapes au trajet en cours. Chaque étape coûte la solde des gardes, use les chariots et peut amener un autre événement. Quatre étapes au maximum par voyage, quoi qu'on empile.","parametres":{"de":{"nom":"Étapes en plus","type":"nombre","requis":true,"defaut":1,"aide":"1 pour une halte, 2 pour un détour sérieux."}},"nomme":{"explique":"Les étapes réellement ajoutées, une fois le plafond appliqué.","exemple":"2"}},"abimer":{"nom":"Abîmer les chariots","explique":"Use les essieux, les caisses et les bêtes. Un chariot pris pour cible souffre plus que les autres. Un essieu ou un cheval à zéro immobilise le chariot.","parametres":{"combien":{"nom":"Usure infligée","type":"valeur","requis":true,"aide":"3 pour une secousse, 8 à 15 pour un mauvais passage, 20 pour un accident."}}},"delester":{"nom":"Larguer de la cargaison","explique":"On jette une part du chargement — pour fuir plus vite, ou parce qu'on vous la prend. Les chariots les plus chargés perdent le plus.","parametres":{"part":{"nom":"Quelle fraction","type":"fraction","requis":true,"defaut":0.2,"aide":"0,25 largue un quart de la soute. Au-delà de 0,5 c'est une catastrophe."},"seulement":{"nom":"Seulement","type":"choix","valeurs":["tout","fragile","perissable"],"defaut":"tout","aide":"« fragile » ne casse que le verre et les enluminures."}},"nomme":{"explique":"La liste de ce qui a été perdu, prête à citer dans le texte.","exemple":"34 kg de blé et 12 kg de sel"}},"briserFragile":{"nom":"Casser ce qui est fragile","explique":"Une secousse, une tempête, un versement : seul ce qui se brise se brise. Le reste de la cargaison ne bouge pas.","parametres":{"part":{"nom":"Quelle fraction du fragile","type":"fraction","requis":true,"defaut":0.3}},"nomme":{"explique":"La liste de la casse.","exemple":"18 kg de verrerie"}},"reposer":{"nom":"Soigner la troupe","explique":"Rend de la santé au marchand et à ses gardes. Une bonne nuit, une source claire, des herbes trouvées au bord du chemin.","parametres":{"part":{"nom":"Quelle fraction rendue","type":"fraction","requis":true,"defaut":0.15,"aide":"0,07 pour une gorgée d'eau, 0,25 pour une vraie nuit."}}},"blesserTroupe":{"nom":"Blesser la troupe","explique":"Répartit des dégâts sur un ou plusieurs hommes. Les gardes encaissent plus souvent que le marchand. Un homme à zéro meurt ; si c'est le marchand, la partie s'arrête.","parametres":{"total":{"nom":"Dégâts à répartir","type":"valeur","requis":true,"aide":"14 à 30 pour une échauffourée, 40 et plus pour une vraie bataille."},"cibles":{"nom":"Combien d'hommes touchés","type":"nombre","defaut":1}},"nomme":{"explique":"Qui a souffert.","exemple":"{blesses.noms} donne « Corvin et Naya », {blesses.morts} donne les morts"}},"combat":{"nom":"Livrer bataille","explique":"La troupe se bat. L'issue dépend de la force des hommes, de leurs armes et de la menace du moment. On gagne du butin, ou on perd de la cargaison et des hommes.","parametres":{"bonus":{"nom":"Avantage","type":"nombre","defaut":1,"aide":"1 pour un combat franc, 0,85 si l'on est pris au dépourvu, 1,3 si l'on tend l'embuscade."}},"nomme":{"explique":"Le récit de la mêlée, déjà écrit. Citez-le tel quel.","exemple":"{melee} donne toute la phrase, {melee.butin} le seul montant"}},"charger":{"nom":"Charger de la marchandise","explique":"Met des kilos dans les chariots. S'il n'y a pas la place, on charge ce qu'on peut. Avec un prix au kilo, la marchandise s'achète ; sans prix, elle est offerte.","parametres":{"bien":{"nom":"Quelle marchandise","type":"bien","requis":true,"aide":"Une marchandise précise, ou « au hasard »."},"kg":{"nom":"Combien de kilos","type":"valeur","requis":true},"prixAuKilo":{"nom":"Prix au kilo","type":"valeur","aide":"Laissez vide pour un cadeau. « {selon: base, fois: 0.55} » pour une bonne affaire."}},"nomme":{"explique":"Ce qui a été chargé.","exemple":"{charge.kg} kg de {charge.bien}"}},"decharger":{"nom":"Céder de la marchandise","explique":"Retire des kilos de la soute. Avec un prix au kilo, elle se vend ; sans prix, elle est perdue ou donnée.","parametres":{"bien":{"nom":"Quelle marchandise","type":"bien","requis":true},"kg":{"nom":"Combien de kilos","type":"valeur","requis":true},"prixAuKilo":{"nom":"Prix au kilo","type":"valeur"}},"nomme":{"explique":"Ce qui est parti et ce que ça a rapporté.","exemple":"{cede.kg} kg pour {cede.gain} po"}},"armeTrouvee":{"nom":"Trouver une arme","explique":"Une arme ordinaire, tirée au hasard parmi les légères. Jamais une arme de légende — celles-là n'existent qu'en un exemplaire et ne se ramassent pas dans un fossé.","parametres":{},"nomme":{"explique":"Le nom de l'arme trouvée.","exemple":"une hache légère"}},"donnerArme":{"nom":"Donner une arme précise","explique":"Range une arme nommée dans la réserve. C'est par là que passent les armes de légende, quand le récit le justifie.","parametres":{"arme":{"nom":"Laquelle","type":"arme","requis":true}},"nomme":{"explique":"Le nom de l'arme.","exemple":"Excalibur"}},"chien":{"nom":"Adopter un chien","explique":"Un errant se laisse apprivoiser. Il flaire les mauvaises rencontres avant les hommes et se bat un peu aux côtés du marchand. Sans effet si le convoi en a déjà un.","parametres":{},"nomme":{"explique":"Le nom du chien.","exemple":"Ronce"}},"recruter":{"nom":"Recruter un garde","explique":"Un homme rejoint l'escorte, avec son métier et son arme. Il touchera une solde à chaque étape.","parametres":{"metier":{"nom":"Quel métier","type":"metier","defaut":"auHasard"},"arme":{"nom":"Avec quelle arme","type":"arme","aide":"Laissez vide pour une arme de son métier, tirée au hasard."}},"nomme":{"explique":"Le nom de la recrue.","exemple":"Maren"}},"rumeur":{"nom":"Lancer une rumeur de prix","explique":"On vous glisse qu'une marchandise vaut cher là où vous allez. Le prix y sera réellement plus haut à l'arrivée.","parametres":{"bien":{"nom":"Quelle marchandise","type":"bien","defaut":"auHasard"},"mult":{"nom":"Multiplicateur de prix","type":"nombre","defaut":1.45,"aide":"1,45 pour une rumeur vague, 1,9 pour un tuyau payé."}},"nomme":{"explique":"Le nom de la marchandise concernée.","exemple":"les épices"}},"escorte":{"nom":"Faire escorter le convoi","explique":"Des compagnons de route protègent la caravane pendant quelques étapes. Les mauvaises rencontres se font plus rares.","parametres":{"de":{"nom":"Combien d'étapes","type":"nombre","requis":true,"defaut":2}}}},"interrogations":{"or":{"nom":"L'or en bourse","unite":"pièces"},"etapes":{"nom":"Les étapes parcourues","unite":"étapes","explique":"Sert à mesurer l'avancement de la partie : tout devient plus cher et plus dangereux avec le temps."},"lieues":{"nom":"Les lieues au compteur","unite":"lieues"},"reputation":{"nom":"La réputation","unite":"0 à 100"},"karma":{"nom":"Le karma","unite":"0 à 100"},"gardes":{"nom":"Le nombre de gardes","unite":"hommes"},"troupe":{"nom":"Le marchand et ses gardes","unite":"hommes"},"place":{"nom":"La place libre dans les chariots","unite":"kg"},"charge":{"nom":"Les kilos chargés","unite":"kg"},"stock":{"nom":"Les kilos d'une marchandise","unite":"kg","demande":"bien"},"valeurSoute":{"nom":"La valeur marchande de la cargaison","unite":"pièces"},"etatConvoi":{"nom":"La santé du convoi","unite":"0 à 100","explique":"La moyenne des chariots et des hommes."},"chien":{"nom":"Un chien suit le convoi","unite":"oui ou non"},"vigilance":{"nom":"La vigilance de la troupe","unite":"0 à 100","explique":"Ce qui permet de voir venir une embuscade."},"agilite":{"nom":"L'agilité de la troupe","unite":"0 à 100","explique":"Ce qui permet de décrocher et de fuir."},"negoce":{"nom":"Le talent de négoce","unite":"0 à 100","explique":"Le meilleur de la caravane l'emporte."},"puissance":{"nom":"La force du marchand","unite":"0 à 3"},"armeFamille":{"nom":"Quelqu'un porte une arme de cette famille","unite":"oui ou non","demande":"famille"},"mise":{"nom":"La mise de jeu courante","unite":"pièces","explique":"Ce qu'on parie à ce stade de la partie. Croît avec les étapes."},"coutGarde":{"nom":"Le prix d'un garde","unite":"pièces"},"tribut":{"nom":"Ce qu'exigerait un pillard","unite":"pièces","explique":"Calculé sur l'or et la valeur de la cargaison."},"soin":{"nom":"Le coût des soins","unite":"pièces"}},"typesDeChamp":{"nombre":{"explique":"Un nombre simple."},"fraction":{"explique":"Une part, entre 0 et 1. 0,25 vaut un quart."},"valeur":{"explique":"Un nombre, une fourchette, une formule ou une référence — voir la documentation des valeurs."},"choix":{"explique":"Une valeur parmi une liste fermée."},"bien":{"explique":"Une marchandise de biens.json, ou « au hasard »."},"arme":{"explique":"Une arme de armes.json."},"metier":{"explique":"Un métier de garde, ou « au hasard »."},"texte":{"explique":"Du texte, qui accepte les trous entre accolades."},"booleen":{"explique":"Oui ou non."}},"moments":{"route":{"nom":"En chemin","explique":"Pendant un trajet, entre deux lieux."},"arrivee":{"nom":"À l'arrivée","explique":"En entrant dans un lieu, avant le marché."},"sejour":{"nom":"Pendant le séjour","explique":"Pendant qu'on est en ville, entre deux actions."}}},"vocabulairePersonnages":{"format":"caravane.vocabulaire-personnages.v1","apropos":"Le catalogue de ce qu'un personnage peut être et de ce qui fait mériter son lore. L'atelier de personnages en tire ses formulaires, comme l'atelier d'événements tire les siens de vocabulaire-evenements.json. Les deux se complètent : les conditions d'une couche peuvent aussi bien interroger la relation (ci-dessous) que l'état du convoi (l'autre catalogue).","roles":{"echevin":{"nom":"Échevin","explique":"Il tient un registre, une charge, un sceau. Il donne des autorisations et des ennuis.","feminin":"Échevine"},"marchand":{"nom":"Marchand","explique":"Il achète, il vend, il sait qui a besoin de quoi. Le commanditaire le plus naturel.","feminin":"Marchande"},"forgeron":{"nom":"Forgeron","explique":"Il fait et répare les armes et les essieux. Il connaît le métal, donc les mines.","feminin":"Forgeronne"},"aubergiste":{"nom":"Aubergiste","explique":"Tout passe par sa salle. C'est par lui qu'on apprend les choses avant les autres."},"capitaine":{"nom":"Capitaine de garde","explique":"Il tient la porte et les hommes. Il décide qui entre et qui attend."},"clerc":{"nom":"Clerc","explique":"Il écrit, il archive, il se souvient. Le lore ancien passe par lui."},"contrebandier":{"nom":"Contrebandier","explique":"Il connaît les chemins que personne ne relève, et le prix du silence.","feminin":"Contrebandière"},"guide":{"nom":"Guide","explique":"Il a fait la route cent fois. Il sait où l'eau est bonne et où l'on ne campe pas."},"ermite":{"nom":"Ermite","explique":"Il vit à l'écart et sait ce que la ville a oublié. Rarement bavard d'emblée."},"artisan":{"nom":"Artisan","explique":"Verrier, tisserand, enlumineur : celui qui fait ce que la caravane transporte.","feminin":"Artisane"},"prieur":{"nom":"Prieur","explique":"Il tient un temple, une règle, une mémoire. Le lore religieux est chez lui.","feminin":"Prieure"},"noble":{"nom":"Noble","explique":"Il a des terres, une dette d'honneur et le bras long. On ne lui refuse pas facilement."},"mineur":{"nom":"Mineur","explique":"Il descend. Il sait ce qu'il y a en dessous, et ce qu'on n'en remonte pas.","feminin":"Mineuse"},"batelier":{"nom":"Batelier","explique":"Il tient un bac, une barque, un quai. Indispensable aux ports.","feminin":"Batelière"},"veneur":{"nom":"Veneur","explique":"Il chasse et suit les traces. Il voit passer ce que les routes ne montrent pas.","feminin":"Veneuse"}},"accords":{"f":{"nom":"Féminin","explique":"Les textes s'accordent au féminin : « elle est arrivée »."},"m":{"nom":"Masculin","explique":"Les textes s'accordent au masculin : « il est arrivé »."}},"interrogations":{"rencontres":{"nom":"Combien de fois on l'a croisé","unite":"rencontres","explique":"Monte d'un à chaque fois qu'on lui parle. La façon la plus simple de faire mériter une couche : on ne se confie pas à un inconnu."},"missionsPour":{"nom":"Missions accomplies pour lui","unite":"missions","explique":"Ce qu'on a fait pour lui, et non ce qu'on lui a dit. Le lore le plus profond devrait coûter ça."},"couchesConnues":{"nom":"Couches déjà découvertes","unite":"couches","explique":"Pour enchaîner : la troisième révélation n'a de sens qu'après les deux premières."}},"trous":{"nom":{"explique":"Son nom seul.","exemple":"Orlanne"},"titre":{"explique":"Son titre, s'il en a un.","exemple":"Dame"},"appellation":{"explique":"Titre et nom ensemble, avec l'élision qui convient.","exemple":"Dame Orlanne"},"role":{"explique":"Ce qu'il fait, en toutes lettres.","exemple":"échevine"},"lieu":{"explique":"Le lieu où on le trouve.","exemple":"Aurelium"},"contree":{"explique":"La contrée de ce lieu.","exemple":"les Terres humaines"},"il":{"explique":"Le pronom accordé.","exemple":"elle"},"le":{"explique":"L'article défini accordé.","exemple":"la"},"e":{"explique":"La marque d'accord à coller à un participe.","exemple":"arrivé{e} donne « arrivée »"}}},"vocabulaireObjets":{"format":"caravane.vocabulaire-objets.v1","apropos":"Le catalogue de la cinquième famille : l'objet unique, celui qui n'existe qu'en un exemplaire, qui porte du lore et qui se mérite. Les marchandises, les armes ordinaires, les chariots et les pièces gardent leurs propres fichiers — ce sont des choses qu'on achète, pas des choses qu'on trouve. Comme les autres catalogues, celui-ci est ouvert : décrivez un genre, un pouvoir ou une provenance qui manque, il est ajouté.","genres":{"relique":{"nom":"Relique","explique":"Un objet qu'on ne se procure pas : un fragment, une enseigne, un ossement monté sur socle. Sa valeur est ce qu'on raconte de lui."},"arme":{"nom":"Arme de légende","explique":"Elle se porte et elle frappe. C'est la seule famille qui touche au combat — les trois armes mythiques du jeu sont déjà de celles-là."},"document":{"nom":"Document","explique":"Un registre, une lettre, une carte, un sauf-conduit. Le meilleur porteur de lore : il dit quelque chose sur quelqu'un ou sur un lieu."},"bijou":{"nom":"Bijou","explique":"Léger, cher, et facile à faire changer de mains. Bon support pour ce qui se vole et se revend."},"outil":{"nom":"Outil","explique":"Une lunette, un astrolabe, un jeu de clés. Il fait quelque chose de concret pour la caravane."},"insigne":{"nom":"Insigne","explique":"Un sceau, un anneau, une plaque. Il ne vaut rien et il ouvre des portes : c'est ce qu'on montre."},"curiosite":{"nom":"Curiosité","explique":"Une chose dont personne ne sait plus l'usage. Elle n'a d'autre pouvoir que d'intriguer — et c'est parfois assez."}},"pouvoirs":{"aptitude":{"nom":"Améliorer une aptitude","explique":"Tant qu'on l'a dans les chariots, la troupe est meilleure à quelque chose. Le bonus s'ajoute à la moyenne de la troupe et se voit dans tous les jets qui s'en servent.","parametres":{"quoi":{"nom":"Quelle aptitude","type":"choix","requis":true,"valeurs":["vigilance","agilite","negoce","endurance"],"aide":"Vigilance pour voir venir, agilité pour décrocher, négoce pour les prix, endurance pour encaisser."},"de":{"nom":"De combien","type":"nombre","requis":true,"defaut":5,"aide":"3 est discret, 8 se sent, 15 change une partie. Les aptitudes vont de 0 à 100."}}},"chance":{"nom":"Porter chance","explique":"Un bonus permanent au karma, donc à tous les jets de dé. C'est le pouvoir le plus large et le plus difficile à équilibrer : n'allez pas loin.","parametres":{"de":{"nom":"De combien","type":"nombre","requis":true,"defaut":6,"aide":"Le karma va de 0 à 100 et donne +1 au dé tous les 17 points. 17 vaut donc un point de dé entier."}}},"arme":{"nom":"Être une arme","explique":"L'objet se porte et frappe. Il se range dans la réserve d'armes et s'équipe comme les autres — mais il n'existe qu'en un exemplaire, et il disparaît avec celui qui le portait.","parametres":{"famille":{"nom":"Quelle famille","type":"familleArme","requis":true},"frappe":{"nom":"Force de frappe","type":"nombre","requis":true,"defaut":0.9,"aide":"Les armes ordinaires vont de 0,26 à 0,95. Les trois armes mythiques du jeu sont à 0,82, 0,95 et 1,25."},"garde":{"nom":"Parade","type":"nombre","defaut":0.1,"aide":"Ce qui est encaissé au lieu d'être subi. 0 pour une hache, 0,22 pour une arme équilibrée."}}},"ouvreCouche":{"nom":"Révéler du lore","explique":"Le posséder ouvre une couche chez un personnage — le document qui dit ce qu'il n'aurait jamais raconté. C'est le pouvoir qui lie les objets aux gens.","parametres":{"personnage":{"nom":"Chez qui","type":"personnage","requis":true},"couche":{"nom":"Laquelle","type":"couche","requis":true,"aide":"Une couche de ce personnage. Chargez le répertoire de personnages pour les voir."}}},"laissezPasser":{"nom":"Ouvrir un passage","explique":"Le montrer suffit là où l'on serait refoulé : une frontière, un quartier fermé, une porte gardée.","parametres":{"lieu":{"nom":"Où","type":"lieu","requis":true,"aide":"Chargez un monde.json pour choisir. Laissez vide pour un passe-partout."}}},"prix":{"nom":"Peser sur les prix","explique":"On vous fait un meilleur prix, ou on vous en donne un meilleur. Le sceau d'une guilde, la recommandation d'un comptoir.","parametres":{"sens":{"nom":"Dans quel sens","type":"choix","requis":true,"valeurs":["achat","vente","les deux"],"defaut":"les deux"},"part":{"nom":"De combien","type":"fraction","requis":true,"defaut":0.08,"aide":"0,08 fait 8 % de mieux. Au-delà de 0,2 le commerce ne veut plus rien dire."}}}},"provenances":{"mission":{"nom":"Au bout d'une mission","explique":"On l'obtient en accomplissant une mission écrite. C'est la façon la plus sûre de faire mériter un objet : il a fallu aller quelque part et le rapporter.","parametres":{"mission":{"nom":"Quelle mission","type":"mission","requis":true,"aide":"La clé de la mission. L'atelier de missions les proposera ; d'ici là, écrivez-la et notez-la."},"quand":{"nom":"À quel moment","type":"choix","valeurs":["à la fin","en cours de route"],"defaut":"à la fin"}}},"evenement":{"nom":"Dans un événement","explique":"On tombe dessus en chemin. Réservez-le aux objets qu'on peut trouver sans les chercher.","parametres":{"evenement":{"nom":"Quel événement","type":"texte","aide":"La clé de l'événement, si vous en avez déjà écrit un."}}},"personnage":{"nom":"Détenu par quelqu'un","explique":"Quelqu'un l'a et pourrait s'en séparer. Il faudra le convaincre, l'acheter, ou le lui prendre.","parametres":{"personnage":{"nom":"Qui","type":"personnage","requis":true}}},"lieu":{"nom":"Se trouve quelque part","explique":"Il est là, dans une échoppe ou dans des ruines. Avec un prix, il s'achète ; sans prix, il faut une raison d'y avoir accès.","parametres":{"lieu":{"nom":"Où","type":"lieu","requis":true},"prix":{"nom":"Prix demandé","type":"nombre","aide":"Laissez vide s'il ne se vend pas — il faudra alors une autre façon de l'obtenir."}}},"depart":{"nom":"Dans les bagages au départ","explique":"Le marchand l'a depuis toujours et ne sait peut-être pas ce que c'est. Excellent pour un objet dont le lore se découvre en cours de partie.","parametres":{}}},"interrogations":{"couchesConnues":{"nom":"Couches déjà découvertes","unite":"couches","explique":"Pour enchaîner les révélations sur l'objet lui-même."},"etapesPorte":{"nom":"Étapes depuis qu'on l'a","unite":"étapes","explique":"Le temps passé avec l'objet. Ce qu'on ne comprend qu'à force de l'avoir sous les yeux."},"montre":{"nom":"Fois qu'on l'a montré","unite":"fois","explique":"Combien de fois on l'a sorti devant quelqu'un. Les objets parlent quand on les fait parler."}},"trous":{"nom":{"explique":"Le nom de l'objet.","exemple":"Le registre des péages"},"il":{"explique":"Le pronom accordé.","exemple":"elle"},"le":{"explique":"L'article défini accordé.","exemple":"la"},"un":{"explique":"L'article indéfini accordé.","exemple":"une"},"e":{"explique":"La marque d'accord à coller à un participe.","exemple":"retrouvé{e}"},"ancien":{"explique":"Le nom de son ancien propriétaire, s'il en a un.","exemple":"Dame Orlanne"},"lieu":{"explique":"Le lieu d'où il vient.","exemple":"Aurelium"},"poids":{"explique":"Son poids en kilos.","exemple":"2"},"valeur":{"explique":"Ce qu'il vaut, s'il vaut quelque chose.","exemple":"6 200"}}},"vocabulaireMissions":{"format":"caravane.vocabulaire-missions.v1","apropos":"Le catalogue des missions écrites — celles qu'on compose à la main, une par une, par opposition aux offres que le moteur tire au sort à chaque marché. Une mission est une chaîne de jalons : reçue de quelqu'un, elle avance ailleurs et se conclut. Comme les autres catalogues, celui-ci est ouvert.","principe":"Le lien entre une mission et son commanditaire est stocké dans la mission, jamais dans le personnage. On écrit donc ses personnages tranquillement, sans leur attribuer quoi que ce soit, et on revient plus tard leur confier une mission sans jamais rouvrir personnages.json.","jalons":{"atteindre":{"nom":"Arriver quelque part","explique":"Le jalon tombe quand le convoi entre dans le lieu. C'est le jalon le plus simple, et souvent le premier : il faut bien aller là-bas.","parametres":{"lieu":{"nom":"Où","type":"lieu","requis":true}}},"livrer":{"nom":"Livrer de la marchandise","explique":"Il faut arriver quelque part avec les kilos demandés dans les chariots. La marchandise part au moment de la livraison — elle ne se revend pas au marché du coin.","parametres":{"bien":{"nom":"Quelle marchandise","type":"bien","requis":true},"kg":{"nom":"Combien de kilos","type":"nombre","requis":true,"defaut":20},"lieu":{"nom":"Où","type":"lieu","requis":true}}},"rencontrer":{"nom":"Parler à quelqu'un","explique":"Il faut trouver la personne là où elle se tient et lui parler. Le jalon compte une rencontre de plus à son compteur — celui qui fait mériter son lore.","parametres":{"personnage":{"nom":"Qui","type":"personnage","requis":true}}}},"recompenses":{"or":{"nom":"De l'or","explique":"La prime. Rien n'oblige une mission écrite à en donner, mais c'est ce que le joueur attend d'abord.","parametres":{"de":{"nom":"Combien","type":"nombre","requis":true,"defaut":300,"aide":"Les offres tirées au sort donnent 150 à 900 po selon l'avancement. Une mission écrite peut se permettre davantage : elle ne revient pas."}}},"reputation":{"nom":"De la réputation","explique":"Ce que le monde marchand pense de vous. Entre 0 et 100.","parametres":{"de":{"nom":"Combien","type":"nombre","requis":true,"defaut":8,"aide":"Négatif pour une perte. Les contrats ordinaires donnent 4 à 6."}}},"karma":{"nom":"Du karma","explique":"La chance du convoi, donc tous les jets de dé. La récompense discrète de ce qui n'était pas obligé.","parametres":{"de":{"nom":"Combien","type":"nombre","requis":true,"defaut":4}}},"objet":{"nom":"Un objet unique","explique":"L'objet passe dans les chariots. C'est la façon la plus sûre de faire mériter un objet — il a fallu aller quelque part et le rapporter. L'objet doit déclarer de son côté qu'il vient de cette mission.","parametres":{"objet":{"nom":"Lequel","type":"objet","requis":true,"aide":"Chargez votre objets.json pour choisir. L'atelier vérifie que l'objet pointe bien vers cette mission."}}},"ouvreCouche":{"nom":"Une couche de lore","explique":"Accomplir la mission ouvre une couche chez un personnage. C'est ce qui rend un service payant autrement qu'en pièces : on apprend quelque chose.","parametres":{"personnage":{"nom":"Chez qui","type":"personnage","requis":true},"couche":{"nom":"Laquelle","type":"couche","requis":true}}}},"trous":{"commanditaire":{"explique":"Le nom de celui qui donne la mission, titre compris.","exemple":"Dame Orlanne"},"il":{"explique":"Son pronom, accordé.","exemple":"elle"},"ici":{"explique":"Le lieu où la mission est proposée.","exemple":"Aurelium"},"la":{"explique":"Le lieu du dernier jalon — là où ça se termine.","exemple":"Bas-Ferrant"},"delai":{"explique":"Le nombre d'étapes accordé.","exemple":"14"},"prime":{"explique":"L'or promis, s'il y en a.","exemple":"400"},"objet":{"explique":"Le nom de l'objet promis, s'il y en a un.","exemple":"Le registre des péages"}}},"vocabulaireDialogues":{"format":"caravane.vocabulaire-dialogues.v1","apropos":"Le catalogue de ce qu'un dialogue peut dire, demander et faire. Un dialogue est une conversation écrite d'avance : le personnage parle, on lui répond, et selon la réponse la conversation continue ailleurs. Il réutilise en entier le vocabulaire des événements — les dix-huit effets, les interrogations, les quatre écritures d'un montant — et n'ajoute que ce qui n'a de sens qu'en conversation : la mémoire de ce qu'on s'est dit, et le fait de confier une mission.","principe":"Un dialogue appartient à un personnage et se joue quand on lui parle en ville. Il se compose de répliques nommées : chacune est ce que le personnage dit, suivi des réponses qu'on peut lui faire. Une réponse mène à une autre réplique, ou clôt la conversation. Rien n'est écrit en code : les conditions et les effets sont ceux du catalogue.","champs":{"cle":{"nom":"La clé","explique":"Le nom technique du dialogue, unique dans tout le fichier. Minuscules, chiffres et tirets.","requis":true,"exemple":"orlanne-le-registre"},"personnage":{"nom":"Qui parle","explique":"La clé du personnage à qui ce dialogue appartient. Il se joue quand on lui parle, là où il se tient.","requis":true,"exemple":"orlanne"},"titre":{"nom":"Le titre","explique":"Ce qu'on lit sur le bouton, dans l'onglet des gens. Une poignée de mots, du point de vue du joueur.","requis":true,"exemple":"Le registre raturé"},"si":{"nom":"Quand il se propose","explique":"Des conditions, toutes vraies pour que le dialogue apparaisse. Vide, il se propose toujours.","requis":false},"priorite":{"nom":"La priorité","explique":"Quand plusieurs dialogues d'un même personnage sont ouverts en même temps, le plus haut se propose en premier. Par défaut zéro.","requis":false,"defaut":0},"rejouable":{"nom":"On peut le rejouer","explique":"Par défaut un dialogue ne se joue qu'une fois : une conversation qu'on a eue, on l'a eue. Coché, il reste offert — c'est ce qu'il faut pour un marchand chez qui l'on repasse.","requis":false,"defaut":false},"entree":{"nom":"Par où l'on commence","explique":"Le nom de la première réplique. À défaut, la première de la liste.","requis":false,"defaut":"accueil"},"repliques":{"nom":"Les répliques","explique":"La conversation elle-même, une réplique par nom. Chacune porte ce que le personnage dit et les réponses qu'on peut lui faire.","requis":true}},"replique":{"dit":{"nom":"Ce qu'il dit","explique":"Le texte du personnage. Accepte les trous entre accolades. Pour plusieurs variantes dont le jeu tire une au hasard, écrivez un tableau de textes — dans l'atelier, une ligne vide entre chacune suffit.","requis":true,"exemple":["« Marchand. »","« Vous voilà. »"]},"oeil":{"nom":"La didascalie","explique":"Une ligne en petites capitales au-dessus du texte : où l'on est, ce qu'il fait pendant qu'il parle. Facultative.","requis":false,"exemple":"Sous l'auvent de la halle"},"effets":{"nom":"Ce qui arrive en y entrant","explique":"Des effets joués une fois, au moment où la réplique s'affiche. Sert à donner ce qu'on vient de promettre, plutôt que de l'accrocher à la réponse.","requis":false},"reponses":{"nom":"Ce qu'on peut répondre","explique":"Les boutons offerts au joueur, dans l'ordre. Une réplique sans réponse clôt la conversation.","requis":false}},"reponse":{"txt":{"nom":"La réponse","explique":"Ce que le joueur dit, écrit à la première personne. Court : c'est un bouton.","requis":true,"exemple":"Je veux bien m'en charger."},"si":{"nom":"Quand elle est possible","explique":"Des conditions. Non remplies, la réponse s'affiche grisée plutôt que de disparaître : voir qu'une porte existe et qu'elle est fermée vaut mieux que ne pas la voir.","requis":false},"sinon":{"nom":"Pourquoi elle est fermée","explique":"La raison montrée sous une réponse grisée. Sans elle, la réponse est simplement cachée.","requis":false,"exemple":"Il vous faudrait cinquante pièces."},"effets":{"nom":"Ce qu'elle fait","explique":"Les effets joués quand on la choisit, avant d'aller à la réplique suivante.","requis":false},"vers":{"nom":"La suite","explique":"Le nom de la réplique où l'on va. Absent, la conversation se termine.","requis":false},"fin":{"nom":"Elle clôt","explique":"Ferme la conversation explicitement, même si une suite est indiquée. Sert à en sortir d'un mot.","requis":false}},"interrogations":{"souvenir":{"nom":"Ce qu'on s'est dit","unite":"oui ou non","explique":"Un souvenir posé par un dialogue précédent. C'est ce qui fait qu'une conversation se rappelle la précédente.","demande":"nom"},"dialogueVu":{"nom":"Un dialogue déjà joué","unite":"fois","explique":"Combien de fois cette conversation a été menée jusqu'au bout. Zéro si jamais.","demande":"dialogue"},"rencontres":{"nom":"Les fois où on lui a parlé","unite":"fois","explique":"Le compteur de rencontres d'un personnage. Sans précision, celui à qui l'on parle.","demande":"personnage"},"missionEtat":{"nom":"Où en est
