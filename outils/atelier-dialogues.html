/* ── se voir au clavier ──
   Le contour par défaut du navigateur est un liseré noir : sur un fond de
   vélin brûlé il est invisible, et l'on ne sait plus où l'on est. Celui-ci ne
   paraît qu'au clavier — :focus-visible — donc la souris n'y voit rien. */
:focus-visible{outline:2px solid var(--or);outline-offset:2px;border-radius:2px}
#bandeau a:focus-visible,#bandeau button:focus-visible{outline-offset:1px}
`;

let bandeauVue='codex', bandeauCherche='', bandeauPose=false;

const rondBandeau=()=>`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"`+
  ` fill="none" stroke="currentColor" stroke-width="2"/></svg>`;
function jetonBandeau(e){
  if(e.svg)return `<svg viewBox="0 0 24 24">${e.svg}</svg>`;
  if(e.glyphe)return svgGlypheDe(e.glyphe,'currentColor')||rondBandeau();
  return rondBandeau();
}

function installerBandeau(){
  if(bandeauPose||typeof document==='undefined')return;
  bandeauPose=true;
  const st=document.createElement('style');
  st.textContent=STYLE_BANDEAU;
  document.head.appendChild(st);

  const ici=pageIci();
  const poignee=document.createElement('button');
  poignee.id='bandeau-poignee';
  poignee.type='button';
  poignee.setAttribute('aria-expanded','false');
  poignee.title='Ce que vous avez écrit';
  poignee.setAttribute('aria-label','Ce que vous avez écrit');
  poignee.innerHTML='<span class="compte"></span>';

  const voile=document.createElement('div');
  voile.id='bandeau-voile';

  const b=document.createElement('aside');
  b.id='bandeau';
  b.setAttribute('aria-label','Ce que vous avez écrit');
  b.innerHTML=`
    <div class="tete"><h2>Ce que vous avez écrit</h2>
      <button class="fermer" type="button" id="bd-fermer">Fermer</button></div>
    <nav id="bd-outils">`+OUTILS_TOUS.map(o=>
      `<a href="${o.f}" style="--teinte:${o.t}"${o.f===ici?' class="ici" aria-current="page"':''}
        ><span class="pion"></span>${ech(o.nom)}</a>`).join('')+`</nav>
    <div class="corps">
      <div id="bd-vues">
        <button type="button" data-bvue="codex" class="actif">Le codex</button>
        <button type="button" data-bvue="charpente">La charpente</button>
      </div>
      <div id="bd-codex"></div>
      <div id="bd-charpente" hidden></div>
    </div>`;

  document.body.appendChild(poignee);
  document.body.appendChild(voile);
  document.body.appendChild(b);

  /* Fermé, le tiroir reste dans la page : sans inert, la tabulation traverse
     ses dix liens hors écran avant d'atteindre quoi que ce soit. Ouvert, le
     focus y entre — sinon il faudrait retraverser toute la page pour lire ce
     qu'on vient d'ouvrir — et à la fermeture il revient d'où il venait. */
  let dOu=null;
  const inerter=o=>{
    b.toggleAttribute('inert',!o);
    b.setAttribute('aria-hidden',String(!o));
  };
  const ouvrir=o=>{
    if(o&&!b.classList.contains('ouvert'))dOu=document.activeElement;
    b.classList.toggle('ouvert',o);
    voile.classList.toggle('ouvert',o);
    poignee.setAttribute('aria-expanded',String(o));
    inerter(o);
    if(o){
      rendreBandeau();
      const premier=$('#bd-cherche',b)||$('#bd-fermer',b);
      if(premier)premier.focus({preventScroll:true});
    }else{
      /* On rend le focus d'où il venait — mais une ouverture au clavier depuis
         une page qui n'avait rien de focalisé le laisserait sur le corps, et
         l'on repartirait du haut. La poignée est alors le bon endroit : c'est
         là qu'on vient de refermer. */
      const cible=(dOu&&dOu.isConnected&&dOu!==document.body)?dOu:poignee;
      dOu=null;
      if(cible&&cible.focus)cible.focus({preventScroll:true});
    }
  };
  inerter(false);
  poignee.onclick=()=>ouvrir(!b.classList.contains('ouvert'));
  voile.onclick=()=>ouvrir(false);
  $('#bd-fermer',b).onclick=()=>ouvrir(false);
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&b.classList.contains('ouvert')){ouvrir(false);}
  });
  b.addEventListener('click',e=>{
    const t=e.target.closest('[data-bvue]');
    if(!t)return;
    bandeauVue=t.dataset.bvue;
    rendreBandeau();
  });
  b.addEventListener('input',e=>{
    if(e.target.id!=='bd-cherche')return;
    bandeauCherche=e.target.value;
    const p=e.target.selectionStart;
    rendreCodexBandeau();
    const c=$('#bd-cherche',b);
    if(c){c.focus();c.setSelectionRange(p,p);}
  });

  /* Le compteur sur la poignée dit, sans l'ouvrir, combien de choses on a
     écrites. C'est ce qui donne envie d'aller voir. */
  const compter=()=>{
    chargerDepot();
    const n=depotCodex().reduce((s,c)=>s+c.entrees.length,0);
    $('.compte',poignee).textContent=n||'';
    if(b.classList.contains('ouvert'))rendreBandeau();
  };
  suivreDepot(compter);
  addEventListener('pageshow',compter);
  compter();
  suivreLesChamps();
}

function rendreBandeau(){
  chargerDepot();
  const codex=bandeauVue==='codex';
  $('#bd-codex').hidden=!codex;
  $('#bd-charpente').hidden=codex;
  document.querySelectorAll('#bd-vues button').forEach(x=>
    x.classList.toggle('actif',x.dataset.bvue===bandeauVue));
  if(codex)rendreCodexBandeau(); else rendreCharpenteBandeau();
}

function rendreCodexBandeau(){
  const boite=$('#bd-codex');
  if(!boite)return;
  const cats=depotCodex();
  const q=bandeauCherche.trim().toLowerCase();
  const garde=e=>!q||((e.nom+' '+e.cle+' '+e.detail).toLowerCase().indexOf(q)>=0);
  const total=cats.reduce((n,c)=>n+c.entrees.length,0);
  if(!total){
    boite.innerHTML=`<p class="bloc" id="bd-vide">Rien encore. Ce que vous créerez dans les
      ateliers viendra se ranger ici, par catégorie — et un bouton rouvrira chaque élément
      dans l'outil qui l'a fait.</p>`;
    return;
  }
  const pleines=cats.filter(c=>c.entrees.length);
  const vus=pleines.reduce((n,c)=>n+c.entrees.filter(garde).length,0);
  let h=`<input id="bd-cherche" placeholder="Chercher dans le codex…"
    value="${ech(bandeauCherche)}" autocomplete="off" spellcheck="false">`;
  if(q&&!vus)h+=`<p class="rien" id="bd-rien">Rien de ce nom-là dans le codex.</p>`;
  h+=pleines.map(c=>{
    const gardees=c.entrees.filter(garde);
    if(q&&!gardees.length)return '';
    const n=c.entrees.length;
    const ouvert=(q||n<=8)?' open':'';
    return `<details class="cat"${ouvert} data-cat="${ech(c.nom)}">
      <summary><span class="chevron">▶</span>${ech(c.titre)}
        <span class="compte">${n} ${ech(n>1?c.des:c.un)}</span></summary>
      <div class="entrees">`+
      (gardees.length?gardees.map(e=>`
        <div class="entree" style="--teinte:${ech(e.teinte)}">
          <span class="jeton">${jetonBandeau(e)}</span>
          <span class="txt"><b>${ech(e.nom||e.cle||'sans nom')}</b>
            <small>${ech(e.detail)}${e.detail&&e.manque?' · ':''}`+
            `${e.manque?`<span class="manque">${ech(e.manque)}</span>`:''}</small></span>
          <a class="ouvrir" href="${ech(e.lien)}">Ouvrir</a>
        </div>`).join('')
        :`<p class="rien">Rien de ce nom-là ici.</p>`)+
      `</div></details>`;
  }).join('');
  boite.innerHTML=h;
}

function rendreCharpenteBandeau(){
  const boite=$('#bd-charpente');
  if(!boite)return;
  const c=depotCharpente();
  if(!c.compte.missions&&!c.compte.dialogues){
    boite.innerHTML=`<p class="bloc">Rien à charpenter. Écrivez des <b>missions</b> et des
      <b>conversations</b> : dès qu'une conversation confie une mission, ou qu'une mission
      accomplie en ouvre une autre, l'enchaînement paraîtra ici.</p>`;
    return;
  }
  let h=`<div class="bloc"><div class="mesures">
    <span>Missions d'histoire</span><b>${c.compte.missions}</b>
    <span>Conversations</span><b>${c.compte.dialogues}</b>
    <span>Enchaînements</span><b>${c.compte.liens}</b>
    <span>Départs</span><b>${c.compte.racines}</b></div>
    <p style="margin-top:8px">Ce qui n'attend rien est en haut ; on descend vers ce que
      cela ouvre. Un élément déjà vu plus haut n'est pas redéveloppé.</p></div>`;
  if(c.soucis.length){
    const durs=c.soucis.filter(x=>x.dur), doux=c.soucis.filter(x=>!x.dur);
    h+=`<div class="trous"><h3>Les trous de la charpente</h3><ul>`+
      durs.map(x=>`<li class="dur">${x.txt}</li>`).join('')+
      doux.map(x=>`<li>${x.txt}</li>`).join('')+`</ul></div>`;
  }
  h+=c.arbres.map(a=>`<div class="tronc">${brancherBandeau(a,true)}</div>`).join('');
  boite.innerHTML=h;
}

function brancherBandeau(n,racine){
  const teinte=(n.qui&&n.qui.teinte)||(n.genre==='mission'?'#4A7BC8':'#6E9B6A');
  const dessin=n.qui?svgGlypheDe(n.qui.glyphe,'currentColor'):'';
  const genre=n.genre==='mission'?'mission':'conversation';
  let h='';
  if(!racine&&n.relation)h+=`<span class="lien-dit">↳ <b>${ech(n.relation)}</b></span>`;
  h+=`<div class="oeud${n.repris?' repris':''}${n.boucle?' boucle':''}"
        style="--teinte:${ech(teinte)}">
    <span class="jeton">${dessin||rondBandeau()}</span>
    <span class="txt"><b>${ech(n.nom)}</b>
      <span class="qui"><span class="genre">${genre}</span>`+
      (n.qui?` · <i>${ech(n.qui.nom)}</i>`+
        (n.qui.inconnu?' <b style="color:var(--minium)">(inconnu)</b>'
          :n.qui.lieu?' à '+ech(n.qui.lieu):'')
       :n.genre==='mission'?' · sans commanditaire':'')+
      `</span>`+
      (n.mentions.length&&!n.repris
        ?`<span class="mentions">${n.mentions.map(ech).join(' · ')}</span>`:'')+
    `</span>`+
    (n.repris?`<span class="renvoi">↩ plus haut</span>`
      :n.boucle?`<span class="renvoi" style="color:var(--minium)">↺ boucle</span>`
      :`<a class="ouvrir" href="${ech(n.lien)}">Ouvrir</a>`)+
  `</div>`;
  if(n.enfants&&n.enfants.length)
    h+=n.enfants.map((e,i)=>`<div class="branche${
      i===n.enfants.length-1&&!(e.enfants||[]).length?' terminale':''
    }">${brancherBandeau(e)}</div>`).join('');
  return h;
}

/* On l'installe dès que le corps existe : les ateliers appellent leur propre
   amorce, et aucun n'a à penser au bandeau. */
if(typeof document!=='undefined'){
  if(document.readyState==='loading')
    document.addEventListener('DOMContentLoaded',installerBandeau);
  else installerBandeau();
}

</script>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════════
   L'ATELIER DE DIALOGUES
   ───────────────────────────────────────────────────────────────────────────
   Une conversation appartient à quelqu'un, se compose de répliques nommées, et
   chaque réponse mène à une autre réplique ou clôt l'échange. Trois choses
   demandent du soin, et ce sont les trois que l'atelier surveille :

     — le personnage à qui l'on attache la conversation existe bien, et l'on
       voit tout de suite qui se tient où ;
     — chaque réponse mène quelque part de connu, et aucune réplique n'est
       injoignable ;
     — les conditions d'apparition se disent en français — « quand la mission
       est accomplie » — et pas en clés.

   Le vocabulaire vient de data/vocabulaire-dialogues.json, les effets et les
   interrogations de celui des événements : un dialogue ne peut rien faire
   qu'un événement ne sache déjà faire.                                      */

const REF=JSON.parse(document.getElementById('reference').textContent);
const V=REF.vocabulaire;
const VD=REF.vocabulaireDialogues;

/* ═══════════════ le modèle ═══════════════ */
let R={format:'caravane.dialogues.v1',dialogues:[]};
let GENS=null, MISSIONS=null, OBJETS=null;
let sel=0, onglet='apercu', filtre='';
let replies={};              /* nom de réplique → repliée ou non */
let JEU=null;                /* l'aperçu en cours */

const DLG=()=>R.dialogues[sel]||null;
racineEst(DLG);
sectionEst('dialogues',()=>R);
sauvegardeEst('caravane.atelier-dialogues.v1',()=>({sel:sel,onglet:onglet}));

function relire(){
  const c=depotLire('dialogues');
  if(c&&Array.isArray(c.dialogues))R=c;
  mondeDuDepot();
  GENS=depotLire('personnages');
  MISSIONS=depotLire('missions');
  OBJETS=depotLire('objets');
  const d=relireSauve();
  if(!d)return !!c;
  sel=Math.max(0,Math.min(R.dialogues.length-1,d.sel|0));
  if(d.onglet)onglet=d.onglet;
  return true;
}

/* ═══════════════ ce qu'on sait du reste du monde ═══════════════ */
const listeGens=()=>((GENS&&GENS.personnages)||[])
  .filter(p=>p.cle).map(p=>[p.cle,appellationDe(p)+(p.lieu?' — '+nomLieu(p.lieu):'')]);
const gensPar=cle=>((GENS&&GENS.personnages)||[]).find(p=>p.cle===cle)||null;
const listeMissions=()=>((MISSIONS&&MISSIONS.missions)||[])
  .filter(m=>m.cle).map(m=>[m.cle,m.titre||m.cle]);
const listeObjets=()=>((OBJETS&&OBJETS.objets)||[])
  .filter(o=>o.cle).map(o=>[o.cle,o.nom||o.cle]);
function nomLieu(cle){
  const l=((MONDE&&MONDE.lieux)||[]).find(x=>x.cle===cle);
  return l?l.nom:cle;
}
function appellationDe(p){
  if(!p)return '';
  const t=(p.titre||'').trim(), n=p.nom||p.cle||'';
  if(!t)return n;
  if(/ de$/.test(t))return /^[aeiouyàâäéèêëîïôöûüh]/i.test(n)
    ?t.slice(0,-3)+' d\''+n:t+' '+n;
  return t+' '+n;
}
function couchesDe(cle){
  const p=gensPar(cle);
  return ((p&&p.couches)||[]).map((c,i)=>[c.cle||String(i),c.titre||('couche '+(i+1))]);
}

/* ═══════════════ les répliques ═══════════════ */
const repliques=d=>(d&&d.repliques)||{};
const nomsRepliques=d=>Object.keys(repliques(d));
const entreeDe=d=>d.entree||nomsRepliques(d)[0]||'';

/* Où mène chaque réponse : c'est ce que l'atelier doit rendre évident. */
function menePar(d){
  const vus={};
  Object.entries(repliques(d)).forEach(([nom,r])=>{
    (r.reponses||[]).forEach(c=>{
      if(c.fin||!c.vers)return;
      (vus[c.vers]=vus[c.vers]||[]).push(nom);
    });
  });
  return vus;
}
/* Ce qu'on atteint depuis l'entrée : le reste est du texte que personne ne lira. */
function joignables(d){
  const dep=entreeDe(d);
  if(!dep||!repliques(d)[dep])return {};
  const vu={},pile=[dep];
  while(pile.length){
    const n=pile.pop();
    if(vu[n])continue;
    vu[n]=true;
    ((repliques(d)[n]||{}).reponses||[]).forEach(c=>{
      if(!c.fin&&c.vers&&repliques(d)[c.vers]&&!vu[c.vers])pile.push(c.vers);
    });
  }
  return vu;
}
/* Renommer une réplique emmène avec elle tout ce qui pointait dessus. */
function renommer(d,avant,apres){
  apres=slug(apres);
  if(!apres||apres===avant||repliques(d)[apres])return false;
  const neuf={};
  Object.entries(repliques(d)).forEach(([n,r])=>{neuf[n===avant?apres:n]=r;});
  d.repliques=neuf;
  if(d.entree===avant)d.entree=apres;
  Object.values(d.repliques).forEach(r=>(r.reponses||[]).forEach(c=>{
    if(c.vers===avant)c.vers=apres;
  }));
  if(replies[avant]!==undefined){replies[apres]=replies[avant];delete replies[avant];}
  return true;
}
function nomLibre(d,base){
  let n=slug(base)||'suite',i=2;
  while(repliques(d)[n])n=slug(base)+'-'+(i++);
  return n;
}

/* ═══════════════ les conditions, en français ═══════════════
   C'est le point qui décide si l'outil sert : « quand la mission est
   accomplie » doit se choisir dans deux listes, jamais s'écrire. */

/* Deux formes : celle du menu déroulant, et celle qui se met dans une phrase.
   « est pas encore acceptée » ne se dit pas. */
const ETATS_MISSION=[['offerte','pas encore acceptée'],['cours','en cours'],
  ['faite','accomplie'],['ratee','échouée']];
const DIT_ETAT={offerte:'n\'est pas encore acceptée',cours:'est en cours',
  faite:'est accomplie',ratee:'a échoué'};

function toutesInterrogations(){
  const out={};
  Object.entries(V.interrogations||{}).forEach(([k,d])=>{out[k]=d;});
  Object.entries(VD.interrogations||{}).forEach(([k,d])=>{out[k]=d;});
  return out;
}
/* La précision que telle interrogation réclame, et où la prendre. */
function champPrecision(ch,demande,c){
  if(demande==='mission')return listeMissions().length
    ?champ('Laquelle',choixListe(ch+'.mission',listeMissions(),'— quelle mission ? —'))
    :champ('Laquelle',`<p class="vide">Chargez un <b>carnet de missions</b>, ou `+
      `écrivez la clé.</p>`+texte(ch+'.mission','le-registre-rature'));
  if(demande==='personnage')return champ('De qui',
    choixListe(ch+'.personnage',listeGens(),'— celui à qui l\'on parle —'));
  if(demande==='objet')return listeObjets().length
    ?champ('Lequel',choixListe(ch+'.objet',listeObjets(),'— quel objet ? —'))
    :champ('Lequel',texte(ch+'.objet','registre-des-peages'));
  if(demande==='couche'){
    const qui=c.personnage||(DLG()&&DLG().personnage);
    const l=couchesDe(qui);
    return champ('De qui',choixListe(ch+'.personnage',listeGens(),
      '— celui à qui l\'on parle —'))+
      champ('Laquelle',l.length?choixListe(ch+'.couche',l,'— quelle couche ? —')
        :`<p class="vide">Ce personnage n'a pas de couche.</p>`);
  }
  if(demande==='dialogue')return champ('Lequel',
    choixListe(ch+'.dialogue',R.dialogues.filter(x=>x.cle)
      .map(x=>[x.cle,x.titre||x.cle]),'— quelle conversation ? —'));
  if(demande==='nom')return champ('Sous quel nom',texte(ch+'.nom','a-promis-le-registre'),
    'Le nom exact posé par l\'effet <b>Retenir quelque chose</b>. Minuscules et tirets.');
  if(demande==='bien')return champ('Quelle marchandise',
    choixListe(ch+'.bien',Object.entries(REF.biens)));
  if(demande==='famille')return champ('Quelle famille',
    choixListe(ch+'.famille',Object.entries(REF.familles)));
  return '';
}

function blocConditions(ch,avecSinon,rien){
  const l=lire(ch)||[];
  const tout=toutesInterrogations();
  const propres=Object.keys(VD.interrogations||{});
  const opts=[
    ['La conversation',propres.map(k=>[k,tout[k].nom])],
    ['Le convoi',Object.keys(V.interrogations||{}).map(k=>[k,V.interrogations[k].nom])]
  ];
  return `<div class="pile">`+(l.length?'':`<p class="vide">${ech(rien||'Aucune.')}</p>`)+
    l.map((c,i)=>{
      const d=tout[c.quoi]||{};
      const oui=(d.unite||'')==='oui ou non';
      const etat=c.quoi==='missionEtat';
      return `<div class="effet"><header><b>${ech(d.nom||c.quoi||'?')}</b>`+
        `<button data-act="cond-oter" data-ch="${ech(ch)}" data-i="${i}">✕</button></header>`+
        `<div class="corps">`+
        champ('Ce qu\'on regarde',
          `<select data-ch="${ech(ch+'.'+i+'.quoi')}" data-t="txt">`+
          opts.map(([g,ks])=>`<optgroup label="${ech(g)}">`+
            ks.map(([k,n])=>`<option value="${ech(k)}"${k===c.quoi?' selected':''}>`+
              `${ech(n)}</option>`).join('')+`</optgroup>`).join('')+`</select>`,
          d.explique?ech(d.explique):'')+
        (d.demande?champPrecision(ch+'.'+i,d.demande,c):'')+
        (etat?champ('Elle doit être',
            choixListe(ch+'.'+i+'.vaut',ETATS_MISSION,'— quel état ? —'),
            'C\'est ainsi qu\'on ouvre une conversation <b>quand une mission est '+
            'accomplie</b>, et pas avant.')
         :oui?champ('Doit valoir',choixOuiNon(ch+'.'+i+'.vaut'))
         :champ('Au moins',nombre(ch+'.'+i+'.min'))+
          champ('Au plus',nombre(ch+'.'+i+'.max')))+
        (avecSinon?champ('Pourquoi c\'est fermé',
          texte(ch+'.'+i+'.sinon','Il vous faudrait cinquante pièces.'),
          'Le joueur lit ceci sous la réponse grisée. <b>Sans elle, la réponse est '+
          'simplement cachée</b> — et il ne saura jamais qu\'elle existait.'):'')+
        `</div></div>`;}).join('')+
    `<button class="ajout" data-act="cond-ajout" data-ch="${ech(ch)}">`+
    `+ Ajouter une condition</button></div>`;
}

/* Ce que les conditions racontent, en une phrase. */
function ditConditions(l){
  const tout=toutesInterrogations();
  if(!l||!l.length)return 'toujours';
  return l.map(c=>{
    const d=tout[c.quoi]||{nom:c.quoi};
    if(c.quoi==='missionEtat'){
      const m=(listeMissions().find(x=>x[0]===c.mission)||[null,c.mission])[1];
      return `« ${m||'une mission'} » `+(DIT_ETAT[c.vaut]||('est '+(c.vaut||'?')));
    }
    if(c.quoi==='souvenir')
      return (c.vaut===false||c.vaut==='non'?'on n\'a pas ':'on a ')+
        `retenu « ${c.nom||'?'} »`;
    if((d.unite||'')==='oui ou non')
      return d.nom.toLowerCase()+' : '+((c.vaut===false||c.vaut==='non')?'non':'oui');
    const b=[];
    if(c.min!==undefined&&c.min!=='')b.push('au moins '+c.min);
    if(c.max!==undefined&&c.max!=='')b.push('au plus '+c.max);
    return d.nom.toLowerCase()+(b.length?' '+b.join(' et '):'');
  }).join(', et ');
}

/* ═══════════════ les effets ═══════════════ */
function toutEffets(){
  const out={};
  Object.entries(V.effets||{}).forEach(([k,d])=>{out[k]=d;});
  Object.entries(VD.effets||{}).forEach(([k,d])=>{out[k]=d;});
  return out;
}
function reglageEffet(ch,d,dd){
  let corps;
  if(dd.type==='valeur')corps=nombre(ch);
  else if(dd.type==='fraction'||dd.type==='nombre')
    corps=nombre(ch,dd.defaut!==undefined?String(dd.defaut):'',
      dd.type==='fraction'?'0.01':'any');
  else if(dd.type==='choix')corps=choixListe(ch,dd.valeurs.map(x=>[x,x]),
    dd.requis?'':'— au choix —');
  else if(dd.type==='bien')corps=choixListe(ch,[['auHasard','Au hasard']].concat(
    Object.entries(REF.biens)),dd.requis?'':'— rien —');
  else if(dd.type==='arme')corps=choixListe(ch,Object.entries(REF.armes),
    dd.requis?'':'— au hasard —');
  else if(dd.type==='metier')corps=choixListe(ch,[['auHasard','Au hasard']].concat(
    Object.entries(REF.metiers)),'');
  else if(dd.type==='booleen'||dd.type==='oui-non')corps=coche(ch,'oui');
  else corps=texte(ch);
  return champ(dd.nom,corps,(dd.aide||'')+(dd.requis?' <b>Obligatoire.</b>':''));
}
function blocEffets(ch){
  const l=lire(ch)||[];
  const tous=toutEffets();
  const propres=Object.keys(VD.effets||{});
  return `<div class="pile">`+l.map((e,i)=>{
    const d=tous[e.faire]||{nom:e.faire,explique:'Effet inconnu du catalogue.',parametres:{}};
    return `<div class="effet"><header><b>${ech(d.nom)}</b>`+
      `<button data-act="effet-haut" data-ch="${ech(ch)}" data-i="${i}" title="Monter">↑</button>`+
      `<button data-act="effet-bas" data-ch="${ech(ch)}" data-i="${i}" title="Descendre">↓</button>`+
      `<button data-act="effet-oter" data-ch="${ech(ch)}" data-i="${i}">✕</button>`+
      `</header><div class="corps"><p class="explique">${ech(d.explique)}</p>`+
      Object.entries(d.parametres||{}).map(([p,dd])=>{
        /* les trois effets de conversation prennent leurs listes dans le dépôt */
        if(e.faire==='mission'&&p==='mission')
          return listeMissions().length
            ?champ('Laquelle',choixListe(ch+'.'+i+'.mission',listeMissions(),
              '— quelle mission ? —'),ech(dd.aide||''))
            :champ('Laquelle',texte(ch+'.'+i+'.mission','le-registre-rature'),
              'Chargez un <b>carnet de missions</b> pour les choisir dans une liste.');
        if(e.faire==='ouvrirCouche'&&p==='personnage')
          return champ('Chez qui',choixListe(ch+'.'+i+'.personnage',listeGens(),
            '— celui à qui l\'on parle —'),ech(dd.aide||''));
        if(e.faire==='ouvrirCouche'&&p==='couche'){
          const qui=e.personnage||(DLG()&&DLG().personnage);
          const cs=couchesDe(qui);
          return champ('Laquelle',cs.length
            ?choixListe(ch+'.'+i+'.couche',cs,'— quelle couche ? —')
            :`<p class="vide">Ce personnage n'a pas de couche à délier.</p>`,
            ech(dd.aide||''));
        }
        return reglageEffet(ch+'.'+i+'.'+p,d,dd);
      }).join('')+
      (d.nomme?champ('Retenir sous le nom',texte(ch+'.'+i+'.nomme','perdu'),
        ech(d.nomme.explique)):'')+
      `</div></div>`;}).join('')+
    `<select class="ajout" data-act="effet-ajout" data-ch="${ech(ch)}">`+
    `<option value="">+ Ajouter un effet…</option>`+
    `<optgroup label="La conversation">`+
    propres.map(k=>`<option value="${ech(k)}">${ech(tous[k].nom)}</option>`).join('')+
    `</optgroup><optgroup label="Le convoi">`+
    Object.keys(V.effets||{}).map(k=>
      `<option value="${ech(k)}">${ech(V.effets[k].nom)}</option>`).join('')+
    `</optgroup></select></div>`;
}

/* ═══════════════ la feuille ═══════════════ */
function rendreFeuille(){
  const f=$('#feuille');
  const garde=f.scrollTop;
  const d=DLG();
  if(!d){
    f.innerHTML=`<p class="vide">Aucune conversation. Le bouton <b>+ Dialogue</b>
      en commence une, et <b>Exemple</b> en montre une complète.</p>`;
    return;
  }
  const noms=nomsRepliques(d);
  const vus=menePar(d);
  const atteints=joignables(d);
  const p=gensPar(d.personnage);

  let h=`<div class="bloc"><h2>La conversation</h2><div class="corps">`+
    champ('Clé',`<div class="rangee">${texte('cle','orlanne-le-registre')}`+
      `<button class="outil fixe" data-act="cle-auto">Depuis le titre</button></div>`,
      'Minuscules, chiffres et tirets. Elle ne se voit pas en jeu.')+
    champ('Titre',texte('titre','Elle vous fait signe'),
      'Ce qu\'on lit sur le bouton, dans l\'onglet des gens. Du point de vue du '+
      'joueur, pas du personnage.')+
    champ('Qui parle',listeGens().length
      ?choixListe('personnage',listeGens(),'— à choisir —')
      :`<p class="vide">Aucun personnage. Écrivez-en dans <b>l'atelier de
         personnages</b> : ils apparaîtront ici tout seuls.</p>`,
      p?`<span class="aide">${ech(appellationDe(p))} se tient `+
        `${p.lieu?'à <b>'+ech(nomLieu(p.lieu))+'</b>':'<b>nulle part</b>'}. `+
        `C'est là qu'on aura cette conversation.</span>`
       :'La conversation se joue quand on lui parle, là où il se tient.')+
    champ('Priorité',nombre('priorite','0'),
      'Quand plusieurs conversations de la même personne sont ouvertes, la plus '+
      'haute se propose en premier.')+
    champ('Rejouable',`<div class="chips">${coche('rejouable',
      'on peut la reprendre autant qu\'on veut')}</div>`,
      'Sans cela, elle ne se joue <b>qu\'une fois</b> — ce qui est presque toujours '+
      'ce qu\'on veut. Cochez pour un aubergiste chez qui l\'on repasse.')+
    `</div></div>`;

  h+=`<div class="bloc"><h2>Quand elle se propose<span class="pousse"></span>`+
    `<span class="aide" style="margin:0">${ech(ditConditions(d.si))}</span></h2>`+
    `<div class="corps">`+
    blocConditions('si',false,'Aucune — elle se propose dès le départ.')+
    `<p class="aide">Pour une suite qui n'arrive qu'après coup, prenez <b>Où en est
      une mission</b> et mettez-la sur <b>accomplie</b>. Le jeu ne la montrera pas
      avant.</p></div></div>`;

  h+=`<div class="bloc"><h2>Les répliques<span class="pousse"></span>`+
    `<button data-act="rep-ajout">+ Réplique</button>`+
    `<button data-act="tout-plier">${Object.keys(replies).length?'Tout déplier':'Tout plier'}</button>`+
    `</h2><div class="corps">`;
  if(!noms.length)h+=`<p class="vide">Aucune réplique. La première est ce que le
    personnage dit en vous abordant.</p>`;
  noms.forEach(nom=>{
    const r=d.repliques[nom];
    const estEntree=nom===entreeDe(d);
    const orphelin=!atteints[nom];
    const plie=!!replies[nom];
    h+=`<div class="rep${plie?' replie':''}"><header>`+
      `<button data-act="rep-plier" data-n="${ech(nom)}">${plie?'▸':'▾'}</button>`+
      `<b>${ech(nom)}</b>`+
      (estEntree?`<span class="marque debut">on commence ici</span>`
        :orphelin?`<span class="marque orphelin">personne n'y mène</span>`
        :`<span class="marque">${(vus[nom]||[]).length} entrée${(vus[nom]||[]).length>1?'s':''}</span>`)+
      (estEntree?'':`<button data-act="rep-entree" data-n="${ech(nom)}"
         title="Commencer par celle-ci">⌂</button>`)+
      `<button data-act="rep-copier" data-n="${ech(nom)}" title="Dupliquer">⧉</button>`+
      `<button data-act="rep-oter" data-n="${ech(nom)}">✕</button>`+
      `</header><div class="corps">`+
      champ('Son nom',`<input data-rep-nom="${ech(nom)}" value="${ech(nom)}"
        autocomplete="off" spellcheck="false">`,
        'Il ne se voit pas en jeu. Le changer emmène avec lui toutes les réponses '+
        'qui y mènent.')+
      champ('Didascalie',texte(`repliques.${nom}.oeil`,'Sous l\'auvent de la halle'),
        'Une ligne au-dessus du nom, en petites capitales. Facultative.')+
      champ('Ce qu\'il dit',texte(`repliques.${nom}.dit`,'',4),
        'Les accolades citent le contexte : <b>{il}</b>, <b>{role}</b>, <b>{ici}</b>. '+
        'Une ligne vide entre deux paragraphes fait deux variantes, tirées au hasard.',
        true)+
      champ('En y entrant',blocEffets(`repliques.${nom}.effets`),
        'Joué une fois, à l\'affichage. Sert à donner ce qu\'on vient de promettre.',
        true)+
      champ('Ce qu\'on peut répondre',blocReponses(d,nom),'',true)+
      `</div></div>`;
  });
  h+=`</div></div>`;

  f.innerHTML=h;
  f.scrollTop=garde;
}

function blocReponses(d,nom){
  const r=d.repliques[nom];
  const l=r.reponses||[];
  const ch=`repliques.${nom}.reponses`;
  const autres=nomsRepliques(d);
  return `<div class="pile">`+
    (l.length?'':`<p class="vide">Aucune — la conversation s'arrête ici.</p>`)+
    l.map((c,i)=>{
      const casse=!c.fin&&c.vers&&!d.repliques[c.vers];
      const mene=c.fin||!c.vers?'clôt'
        :casse?'mène nulle part':'→ '+c.vers;
      const plie=!!replies[nom+'#'+i];
      return `<div class="reponse${plie?' replie':''}"><header>`+
        `<button data-act="rep-plier" data-n="${ech(nom+'#'+i)}">${plie?'▸':'▾'}</button>`+
        `<b><i>${ech(c.txt||'sans texte')}</i></b>`+
        `<span class="mene${casse?' nulle-part':''}">${ech(mene)}</span>`+
        (i>0?`<button data-act="rp-haut" data-ch="${ech(ch)}" data-i="${i}">↑</button>`:'')+
        (i<l.length-1?`<button data-act="rp-bas" data-ch="${ech(ch)}" data-i="${i}">↓</button>`:'')+
        `<button data-act="rp-oter" data-ch="${ech(ch)}" data-i="${i}">✕</button>`+
        `</header><div class="corps">`+
        champ('La réponse',texte(`${ch}.${i}.txt`,'Je veux bien m\'en charger.'),
          'À la première personne, et court : c\'est un bouton.')+
        champ('Elle mène à',
          `<div class="rangee">`+
          choixListe(`${ch}.${i}.vers`,autres.map(n=>[n,n]),
            '— elle clôt la conversation —')+
          `<button class="outil fixe" data-act="rp-neuve" data-n="${ech(nom)}"
            data-i="${i}" title="Créer une réplique et y mener">+ Nouvelle</button>`+
          `</div>`,
          casse?`<b style="color:var(--minium)">« ${ech(c.vers)} » n'existe pas.</b>`
            :'Choisissez une réplique existante, ou <b>+ Nouvelle</b> pour en créer '+
             'une et y mener d\'un coup.')+
        champ('Elle est possible si',
          blocConditions(`${ch}.${i}.si`,true,'Toujours possible.'),
          '',true)+
        champ('Ce qu\'elle fait',blocEffets(`${ch}.${i}.effets`),'',true)+
        `</div></div>`;
    }).join('')+
    `<button class="ajout" data-act="rp-ajout" data-n="${ech(nom)}">`+
    `+ Ajouter une réponse</button></div>`;
}

/* ═══════════════ la liste ═══════════════ */
function rendreListe(){
  const q=filtre.trim().toLowerCase();
  const vus=R.dialogues.map((d,i)=>({d:d,i:i}))
    .filter(x=>!q||((x.d.titre||'')+' '+(x.d.cle||'')+' '+
      appellationDe(gensPar(x.d.personnage))).toLowerCase().indexOf(q)>=0);
  /* rangés par personnage : c'est ainsi qu'on les cherche */
  const par={};
  vus.forEach(x=>{
    const k=x.d.personnage||'';
    (par[k]=par[k]||[]).push(x);
  });
  const cles=Object.keys(par).sort((a,b)=>
    (a?appellationDe(gensPar(a))||a:'zzz').localeCompare(b?appellationDe(gensPar(b))||b:'zzz'));
  $('#liste').innerHTML=cles.map(k=>{
    const p=gensPar(k);
    const titre=k?(p?appellationDe(p):k+' — inconnu'):'Sans personne';
    return `<div class="groupe">${ech(titre)}</div>`+
      par[k].map(x=>{
        const pb=controler(x.d,x.i).some(s=>s.dur);
        const n=nomsRepliques(x.d).length;
        return `<button class="entree${x.i===sel?' actif':''}${pb?' faux':''}" `+
          `data-sel="${x.i}"><span class="txt"><b>${ech(x.d.titre||'sans titre')}</b>`+
          `<span>${n} réplique${n>1?'s':''}`+
          `${x.d.rejouable?' · rejouable':''}${pb?' · à corriger':''}</span></span></button>`;
      }).join('');
  }).join('')||`<p class="vide" style="padding:8px">Rien ici.</p>`;
}

/* ═══════════════ les contrôles ═══════════════ */
function controler(d,idx){
  const out=[];
  const dur=t=>out.push({dur:true,txt:t});
  const doux=t=>out.push({dur:false,txt:t});
  if(!d)return out;

  if(!d.cle)dur('Il manque la <b>clé</b>.');
  else if(!/^[a-z0-9-]+$/.test(d.cle))
    dur('La <b>clé</b> ne prend que des minuscules, des chiffres et des tirets.');
  else if(R.dialogues.some((x,i)=>i!==idx&&x.cle===d.cle))
    dur(`La clé <b>${ech(d.cle)}</b> sert déjà à une autre conversation.`);
  if(!d.titre)doux('Pas de <b>titre</b> : le bouton sera muet dans l\'onglet des gens.');

  if(!d.personnage)dur('Aucun <b>personnage</b> : la conversation ne se jouera nulle part.');
  else if(GENS&&!gensPar(d.personnage))
    dur(`Le personnage <b>${ech(d.personnage)}</b> n'existe pas dans le répertoire chargé.`);
  else {
    const p=gensPar(d.personnage);
    if(p&&!p.lieu)doux(`<b>${ech(appellationDe(p))}</b> n'a pas de lieu : on ne le `+
      `croisera nulle part, et la conversation dormira.`);
  }

  const noms=nomsRepliques(d);
  if(!noms.length){dur('Aucune <b>réplique</b> : il n\'y a rien à dire.');return out;}
  const dep=entreeDe(d);
  if(!d.repliques[dep])
    dur(`La conversation commence par <b>${ech(dep)}</b>, qui n'existe pas.`);

  const atteints=joignables(d);
  const perdus=noms.filter(n=>!atteints[n]);
  if(perdus.length)doux(`Personne ne mène à ${perdus.map(n=>'<b>'+ech(n)+'</b>').join(', ')} : `+
    `${perdus.length>1?'ces répliques ne seront jamais lues':'cette réplique ne sera jamais lue'}.`);

  let sansFin=true;
  noms.forEach(n=>{
    const r=d.repliques[n];
    if(!r.dit||(Array.isArray(r.dit)&&!r.dit.filter(Boolean).length))
      dur(`La réplique <b>${ech(n)}</b> ne dit rien.`);
    const reps=r.reponses||[];
    if(!reps.length&&atteints[n])sansFin=false;   /* elle clôt : c'est une sortie */
    reps.forEach((c,i)=>{
      const ou=`la réponse ${i+1} de <b>${ech(n)}</b>`;
      if(!c.txt)dur(`${ou[0].toUpperCase()+ou.slice(1)} n'a pas de texte.`);
      if(c.fin||!c.vers){if(atteints[n])sansFin=false;}
      else if(!d.repliques[c.vers])
        dur(`${ou[0].toUpperCase()+ou.slice(1)} mène à <b>${ech(c.vers)}</b>, qui n'existe pas.`);
      else if(c.vers===n)
        doux(`${ou[0].toUpperCase()+ou.slice(1)} renvoie à sa propre réplique : `+
          `le joueur tournera en rond.`);
      if((c.si||[]).length&&!c.sinon)
        doux(`${ou[0].toUpperCase()+ou.slice(1)} a une condition mais pas de raison : `+
          `elle sera <b>cachée</b> plutôt que grisée, et le joueur ne saura pas `+
          `qu'elle existait.`);
      controlerConditions(c.si,`${ou}`,dur,doux);
      controlerEffets(c.effets,`${ou}`,dur,doux);
    });
    controlerEffets(r.effets,`l'entrée de <b>${ech(n)}</b>`,dur,doux);
  });
  if(sansFin&&noms.length)
    doux('Aucune réponse ne clôt la conversation : le joueur ne pourra en sortir '+
      'que par la poignée.');

  controlerConditions(d.si,'la condition d\'apparition',dur,doux);

  /* les trous des textes */
  const connus=Object.keys(VD.trous||{});
  const inconnus={};
  noms.forEach(n=>{
    const r=d.repliques[n];
    [].concat(r.dit||[],(r.reponses||[]).map(c=>c.txt),
      (r.reponses||[]).map(c=>c.sinon)).forEach(t=>{
      String(t||'').replace(/\{([a-zA-Z0-9_.]+)\}/g,(m,k)=>{
        if(connus.indexOf(k)<0)inconnus[k]=1;return m;});
    });
  });
  Object.keys(inconnus).forEach(k=>
    doux(`Le trou <b>{${ech(k)}}</b> n'existe pas : il restera écrit tel quel à l'écran.`));

  return out;
}
function controlerConditions(l,ou,dur,doux){
  const tout=toutesInterrogations();
  (l||[]).forEach(c=>{
    const d=tout[c.quoi];
    if(!d){dur(`Dans ${ou}, on regarde <b>${ech(c.quoi||'rien')}</b>, qu'on ne sait pas lire.`);return;}
    if(d.demande&&!c[d.demande])
      dur(`Dans ${ou}, <b>${ech(d.nom)}</b> attend qu'on précise ${ech(d.demande)}.`);
    if(c.quoi==='missionEtat'){
      if(c.vaut&&!ETATS_MISSION.some(x=>x[0]===c.vaut))
        dur(`Dans ${ou}, l'état <b>${ech(c.vaut)}</b> n'existe pas.`);
      if(MISSIONS&&c.mission&&!listeMissions().some(x=>x[0]===c.mission))
        dur(`Dans ${ou}, la mission <b>${ech(c.mission)}</b> n'est pas dans le carnet chargé.`);
    }
    if(c.quoi==='objetPorte'&&OBJETS&&c.objet&&!listeObjets().some(x=>x[0]===c.objet))
      dur(`Dans ${ou}, l'objet <b>${ech(c.objet)}</b> n'est pas dans le coffre chargé.`);
    if(c.quoi==='dialogueVu'&&c.dialogue&&!R.dialogues.some(x=>x.cle===c.dialogue))
      dur(`Dans ${ou}, la conversation <b>${ech(c.dialogue)}</b> n'existe pas.`);
    if(c.quoi==='coucheOuverte'&&c.couche){
      const qui=c.personnage||(DLG()&&DLG().personnage);
      if(GENS&&gensPar(qui)&&!couchesDe(qui).some(x=>x[0]===c.couche))
        dur(`Dans ${ou}, <b>${ech(appellationDe(gensPar(qui)))}</b> n'a pas de couche `+
          `<b>${ech(c.couche)}</b>.`);
    }
    if((c.quoi==='souvenir')&&c.nom&&!souvenirsPoses().length)
      doux(`Dans ${ou}, on interroge le souvenir <b>${ech(c.nom)}</b> qu'aucune `+
        `conversation ne pose.`);
    else if(c.quoi==='souvenir'&&c.nom&&souvenirsPoses().indexOf(c.nom)<0)
      doux(`Dans ${ou}, le souvenir <b>${ech(c.nom)}</b> n'est posé nulle part. `+
        `Faute de frappe ?`);
  });
}
function controlerEffets(l,ou,dur,doux){
  const tous=toutEffets();
  (l||[]).forEach(e=>{
    const d=tous[e.faire];
    if(!d){dur(`Dans ${ou}, l'effet <b>${ech(e.faire||'rien')}</b> est inconnu.`);return;}
    Object.entries(d.parametres||{}).forEach(([p,dd])=>{
      if(dd.requis&&(e[p]===undefined||e[p]===''))
        dur(`Dans ${ou}, <b>${ech(d.nom)}</b> attend « ${ech(dd.nom)} ».`);
    });
    if(e.faire==='mission'&&MISSIONS&&e.mission&&!listeMissions().some(x=>x[0]===e.mission))
      dur(`Dans ${ou}, la mission <b>${ech(e.mission)}</b> n'est pas dans le carnet chargé.`);
    if(e.faire==='ouvrirCouche'&&e.couche){
      const qui=e.personnage||(DLG()&&DLG().personnage);
      if(GENS&&gensPar(qui)&&!couchesDe(qui).some(x=>x[0]===e.couche))
        dur(`Dans ${ou}, <b>${ech(appellationDe(gensPar(qui)))}</b> n'a pas de couche `+
          `<b>${ech(e.couche)}</b>.`);
    }
  });
}
/* Tous les souvenirs que le recueil pose : sert à repérer les fautes de frappe. */
function souvenirsPoses(){
  const out=[];
  R.dialogues.forEach(d=>Object.values(repliques(d)).forEach(r=>{
    const l=[].concat(r.effets||[],...(r.reponses||[]).map(c=>c.effets||[]));
    l.forEach(e=>{if(e.faire==='souvenir'&&e.nom&&out.indexOf(e.nom)<0)out.push(e.nom);});
  }));
  return out;
}

/* ═══════════════ le volet ═══════════════ */
function rendreVolet(){
  const v=$('#volet');
  if(onglet==='apercu')v.innerHTML=voletApercu();
  else if(onglet==='fil')v.innerHTML=voletFil();
  else if(onglet==='gens')v.innerHTML=voletGens();
  else v.innerHTML=voletControles();
}

/* — l'aperçu : on joue la conversation pour de faux — */
function sacEssai(){
  const p=gensPar(DLG()&&DLG().personnage)||{};
  const f=p.accord==='f';
  return {nom:p.nom||'',titre:p.titre||'',appellation:appellationDe(p)||'',
    role:'', il:f?'elle':'il', le:f?'la':'le', e:f?'e':'',
    ici:p.lieu?nomLieu(p.lieu):'quelque part', contree:'',
    or:'1 240', marchand:'Aldric'};
}
function voletApercu(){
  const d=DLG();
  if(!d)return `<p class="vide">Rien à montrer.</p>`;
  const noms=nomsRepliques(d);
  if(!noms.length)return `<p class="vide">Écrivez une première réplique.</p>`;
  if(!JEU||JEU.cle!==d.cle)JEU={cle:d.cle,ou:entreeDe(d),chemin:[],fini:false};
  const r=d.repliques[JEU.ou];
  if(!r)return `<p class="vide">La réplique <b>${ech(JEU.ou)}</b> n'existe pas.</p>`+
    `<button class="ajout" data-act="jeu-reprendre">Recommencer</button>`;
  const sac=sacEssai();
  const p=gensPar(d.personnage);
  const teinte=p?teinteDe(p.ico||{}):'#9C9484';
  let h=`<div class="jeu"><div class="tete">`+
    `<div class="ico">${p?svgGlypheDe((p.ico&&p.ico.glyphe)||'ermite',teinte):''}</div>`+
    `<div><p class="oeil">${ech(r.oeil||'')}</p>`+
    `<h3>${ech(appellationDe(p)||'—')}</h3></div></div>`+
    `<p class="dit">${trous(r.dit,sac)}</p>`;
  if(JEU.fini){
    h+=`<p class="fini">La conversation est close.</p></div>`;
  }else{
    const reps=r.reponses||[];
    if(!reps.length)h+=`<p class="fini">Aucune réponse : elle s'arrête ici.</p>`;
    h+=reps.map((c,i)=>{
      /* dans l'aperçu on ne cache rien : on montre ce que le joueur verrait,
         et ce qu'il ne verrait pas, pour que l'auteur juge des deux */
      const ferme=(c.si||[]).length;
      return `<button class="rep-jeu" data-act="jeu-rep" data-i="${i}">`+
        `${trous(c.txt,sac)||'—'}`+
        (ferme?`<span>fermée si : ${ech(ditConditions(c.si))}`+
          (c.sinon?` — « ${ech(c.sinon)} »`:' — <b>cachée</b>, faute de raison')+
          `</span>`:'')+`</button>`;
    }).join('');
    h+=`</div>`;
  }
  h+=`<div class="chemin"><b>Le chemin suivi :</b> `+
    (JEU.chemin.length?JEU.chemin.map(ech).join(' → ')+' → '+ech(JEU.ou):ech(JEU.ou))+
    `</div>`+
    `<button class="ajout" data-act="jeu-reprendre" style="margin-top:9px">`+
    `↺ Reprendre au début</button>`+
    `<p class="aide">On suit les branches sans rien appliquer : ni or, ni mission, ni
      souvenir. C'est pour lire, pas pour jouer.</p>`;
  return h;
}
function trous(t,sac){
  const x=Array.isArray(t)?t[0]:t;
  return ech(String(x==null?'':x)).replace(/\{([a-zA-Z0-9_.]+)\}/g,
    (m,k)=>sac[k]!==undefined&&sac[k]!==''?sac[k]:m);
}

/* — le fil : la conversation vue de haut — */
function voletFil(){
  const d=DLG();
  if(!d)return `<p class="vide">Rien à montrer.</p>`;
  const noms=nomsRepliques(d);
  if(!noms.length)return `<p class="vide">Aucune réplique.</p>`;
  const atteints=joignables(d);
  const dep=entreeDe(d);
  return `<p class="aide">Toute la conversation d'un coup d'œil. Une réplique
    bordée d'or est celle par où l'on commence ; une bordée de rouge, celle où
    personne ne mène.</p><div class="fil" style="margin-top:10px">`+
    noms.map(n=>{
      const r=d.repliques[n];
      const perdu=!atteints[n];
      return `<div class="noeud${n===dep?' depart':''}${perdu?' perdu':''}">`+
        `<b>${ech(n)}</b>`+
        `<p class="dit">${trous(r.dit,sacEssai())||'<i>rien</i>'}</p>`+
        ((r.reponses||[]).length?`<ul>`+(r.reponses||[]).map(c=>{
          const casse=!c.fin&&c.vers&&!d.repliques[c.vers];
          const fin=c.fin||!c.vers;
          return `<li>${(c.si||[]).length?'<s>si</s> ':''}${ech(c.txt||'—')} `+
            (fin?`<em class="fin">clôt</em>`
              :casse?`<em class="casse">${ech(c.vers)} ?</em>`
              :`<em>${ech(c.vers)}</em>`)+`</li>`;
        }).join('')+`</ul>`:`<ul><li><em class="fin">elle s'arrête ici</em></li></ul>`)+
        `</div>`;
    }).join('')+`</div>`;
}

/* — qui se tient où, et ce qu'il a déjà à dire — */
function voletGens(){
  const l=(GENS&&GENS.personnages)||[];
  if(!l.length)return `<p class="vide">Aucun personnage. Écrivez-en dans
    <b>l'atelier de personnages</b> : ils apparaîtront ici tout seuls, sans que
    vous ayez rien à charger.</p>`;
  const d=DLG();
  const combien={};
  R.dialogues.forEach(x=>{if(x.personnage)combien[x.personnage]=(combien[x.personnage]||0)+1;});
  return `<p class="aide">Tous ceux que vous avez écrits, et combien de
    conversations ils portent déjà. <b>Confier</b> attache celle qui est ouverte.</p>`+
    `<div class="pile" style="margin-top:10px">`+
    l.filter(p=>p.cle).map(p=>{
      const n=combien[p.cle]||0;
      const sien=d&&d.personnage===p.cle;
      return `<div class="gens">`+
        `<div class="jeton">${svgGlypheDe((p.ico&&p.ico.glyphe)||'ermite',
          teinteDe(p.ico||{}))}</div>`+
        `<div class="txt"><b>${ech(appellationDe(p))}</b>`+
        `<span class="sous">${p.lieu?ech(nomLieu(p.lieu)):'nulle part'} · `+
        `<span class="${n?'':'aucune'}">${n?n+' conversation'+(n>1?'s':''):'aucune conversation'}`+
        `</span></span>`+
        (p.premiere?`<p class="extrait">${ech(String(p.premiere).slice(0,90))}…</p>`:'')+
        (d?`<div class="rangee"><button class="outil petit" data-act="confier"
           data-q="${ech(p.cle)}"${sien?' disabled':''}>`+
           `${sien?'C\'est déjà lui':'Confier'}</button></div>`:'')+
        `</div></div>`;
    }).join('')+`</div>`;
}

function voletControles(){
  const d=DLG();
  if(!d)return `<p class="vide">Rien à contrôler.</p>`;
  const l=controler(d,sel);
  const durs=l.filter(x=>x.dur), doux=l.filter(x=>!x.dur);
  const noms=nomsRepliques(d);
  const reps=noms.reduce((s,n)=>s+((d.repliques[n].reponses||[]).length),0);
  let h=`<div class="mesures">`+
    `<span>Répliques</span><b>${noms.length}</b>`+
    `<span>Réponses</span><b>${reps}</b>`+
    `<span>Sorties</span><b>${noms.reduce((s,n)=>s+
      ((d.repliques[n].reponses||[]).filter(c=>c.fin||!c.vers).length||
       ((d.repliques[n].reponses||[]).length?0:1)),0)}</b>`+
    `<span>Souvenirs posés</span><b>${souvenirsPoses().length}</b>`+
    `</div>`;
  if(!l.length)return h+`<p class="aide" style="margin-top:12px;color:var(--vert)">
    ✓ Rien à redire. La conversation se tient.</p>`;
  if(durs.length)h+=`<h4 class="section" style="color:var(--minium)">À corriger</h4>`+
    `<ul class="soucis">`+durs.map(x=>`<li class="dur">${x.txt}</li>`).join('')+`</ul>`;
  if(doux.length)h+=`<h4 class="section">À regarder</h4>`+
    `<ul class="soucis">`+doux.map(x=>`<li>${x.txt}</li>`).join('')+`</ul>`;
  return h;
}

/* ═══════════════ tout refaire ═══════════════ */
function tout(){
  rendreListe();rendreFeuille();rendreVolet();majEtat();sauver();
}
function majEtat(){
  const n=R.dialogues.length;
  const faux=R.dialogues.filter((d,i)=>controler(d,i).some(s=>s.dur)).length;
  const rep=R.dialogues.reduce((s,d)=>s+nomsRepliques(d).length,0);
  $('#etat').innerHTML=
    `<span>${n} conversation${n>1?'s':''}</span>`+
    `<span>${rep} réplique${rep>1?'s':''}</span>`+
    `<span>${GENS?((GENS.personnages||[]).length+' personnages'):'aucun personnage'}</span>`+
    `<span>${MISSIONS?((MISSIONS.missions||[]).length+' missions'):'aucune mission'}</span>`+
    (faux?`<span class="rouge">${faux} à corriger</span>`:`<span>rien à corriger</span>`);
}

/* ═══════════════ créer, ouvrir, exporter ═══════════════ */
function neuf(){
  return {cle:'',titre:'',personnage:'',entree:'accueil',
    repliques:{accueil:{dit:'',reponses:[{txt:'',fin:true}]}}};
}
function ajouter(d){R.dialogues.push(d||neuf());sel=R.dialogues.length-1;JEU=null;tout();}

function accueillir(o){
  if(!o||typeof o!=='object')return toast('Fichier illisible.');
  if(Array.isArray(o.dialogues)){
    R=o;sel=0;JEU=null;replies={};
    depotEcrire('dialogues',R);tout();
    return toast(`${o.dialogues.length} conversation${o.dialogues.length>1?'s':''} reprise`+
      `${o.dialogues.length>1?'s':''}.`);
  }
  if(Array.isArray(o.personnages)){GENS=o;depotEcrire('personnages',o);tout();
    return toast(`${o.personnages.length} personnages chargés.`);}
  if(Array.isArray(o.missions)){MISSIONS=o;depotEcrire('missions',o);tout();
    return toast(`${o.missions.length} missions chargées.`);}
  if(Array.isArray(o.objets)){OBJETS=o;depotEcrire('objets',o);tout();
    return toast(`${o.objets.length} objets chargés.`);}
  if(Array.isArray(o.lieux)){mondeEst(o);tout();
    return toast(`Monde chargé : ${o.lieux.length} lieux.`);}
  toast('Ce fichier n\'est ni un recueil, ni un répertoire, ni un monde.');
}

/* ═══════════════ les commandes ═══════════════ */
$('#b-nouveau').onclick=()=>ajouter();
$('#b-dupliquer').onclick=()=>{
  const d=DLG();if(!d)return;
  const c=JSON.parse(JSON.stringify(d));
  c.cle=(c.cle||'dialogue')+'-bis';
  c.titre=(c.titre||'Sans titre')+' (copie)';
  ajouter(c);
};
$('#b-supprimer').onclick=()=>{
  if(!DLG())return;
  R.dialogues.splice(sel,1);
  sel=Math.max(0,Math.min(sel,R.dialogues.length-1));
  JEU=null;tout();
};
$('#b-exemple').onclick=()=>ajouter(JSON.parse(JSON.stringify(EXEMPLE)));
$('#b-ouvrir').onclick=()=>$('#fichier').click();
$('#b-exporter').onclick=()=>
  telecharger(FICHIERS_JEU.dialogues,nettoyer(JSON.parse(JSON.stringify(R))));

accueillirFichiers(accueillir);

$('#filtre').addEventListener('input',e=>{filtre=e.target.value;rendreListe();});
$$('#onglets button').forEach(b=>b.addEventListener('click',()=>{
  onglet=b.dataset.onglet;
  $$('#onglets button').forEach(x=>x.classList.toggle('actif',x===b));
  rendreVolet();sauver();
}));

ecouterSaisie((t,ch)=>{
  /* changer le titre ou le personnage change la liste de gauche */
  if(ch==='titre'||ch==='personnage'||ch==='cle')rendreListe();
  majEtat();rendreVolet();
});
/* renommer une réplique : on attend que le champ soit quitté, sinon on
   renommerait à chaque lettre tapée */
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset.repNom!==undefined){
    const d=DLG();
    if(d&&renommer(d,t.dataset.repNom,t.value))tout();
    else tout();                       /* nom refusé : on remet l'ancien */
    return;
  }
  /* Un menu déroulant qui change refait la feuille : ce qu'il choisit décide
     souvent de ce qui s'affiche autour — l'état d'une mission, la réplique
     visée, le résumé en tête de bloc. Taper au clavier, non : on perdrait le
     curseur à chaque lettre. */
  if(t.tagName==='SELECT'&&t.dataset.ch!==undefined)tout();
});

document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act],[data-sel]');
  if(!b)return;
  if(b.dataset.sel!==undefined){
    ev.preventDefault();sel=Number(b.dataset.sel);JEU=null;tout();return;
  }
  const a=b.dataset.act, d=DLG();
  if(a==='cle-auto'){ecrire('cle',slug(lire('titre')));tout();}
  else if(a==='rep-plier'){
    const n=b.dataset.n;
    if(replies[n])delete replies[n]; else replies[n]=1;
    rendreFeuille();
  }
  else if(a==='tout-plier'){
    if(Object.keys(replies).length)replies={};
    else nomsRepliques(d).forEach(n=>{replies[n]=1;});
    rendreFeuille();
  }
  else if(a==='rep-ajout'){
    const n=nomLibre(d,'suite');
    d.repliques[n]={dit:'',reponses:[]};
    tout();
  }
  else if(a==='rep-oter'){
    const n=b.dataset.n;
    const qui=menePar(d)[n]||[];
    if(qui.length&&!confirm(`${qui.length} réponse${qui.length>1?'s mènent':' mène'} `+
      `à « ${n} ». ${qui.length>1?'Elles ne mèneront':'Elle ne mènera'} plus nulle `+
      `part. Continuer ?`))return;
    delete d.repliques[n];
    /* on ne laisse pas de renvoi cassé derrière soi */
    Object.values(d.repliques).forEach(r=>(r.reponses||[]).forEach(c=>{
      if(c.vers===n){delete c.vers;c.fin=true;}
    }));
    if(d.entree===n)d.entree=nomsRepliques(d)[0]||'';
    JEU=null;tout();
  }
  else if(a==='rep-copier'){
    const n=b.dataset.n;
    const m=nomLibre(d,n);
    d.repliques[m]=JSON.parse(JSON.stringify(d.repliques[n]));
    tout();
  }
  else if(a==='rep-entree'){d.entree=b.dataset.n;JEU=null;tout();}
  else if(a==='rp-ajout'){
    const r=d.repliques[b.dataset.n];
    r.reponses=r.reponses||[];
    r.reponses.push({txt:'',fin:true});
    tout();
  }
  else if(a==='rp-oter'){const l=lire(b.dataset.ch);l.splice(Number(b.dataset.i),1);tout();}
  else if(a==='rp-haut'){bouger(lire(b.dataset.ch),Number(b.dataset.i),-1);tout();}
  else if(a==='rp-bas'){bouger(lire(b.dataset.ch),Number(b.dataset.i),1);tout();}
  else if(a==='rp-neuve'){
    /* créer une réplique et y mener d'un coup : c'est ainsi qu'on écrit une
       conversation, de proche en proche */
    const nom=b.dataset.n, i=Number(b.dataset.i);
    const c=d.repliques[nom].reponses[i];
    const m=nomLibre(d,slug(c.txt||'')||'suite');
    d.repliques[m]={dit:'',reponses:[]};
    c.vers=m;delete c.fin;
    tout();
  }
  else if(a==='cond-ajout'){
    const l=lire(b.dataset.ch)||[];
    l.push({quoi:'missionEtat',vaut:'faite'});
    ecrire(b.dataset.ch,l);tout();
  }
  else if(a==='cond-oter'){const l=lire(b.dataset.ch);l.splice(Number(b.dataset.i),1);tout();}
  else if(a==='effet-oter'){const l=lire(b.dataset.ch);l.splice(Number(b.dataset.i),1);tout();}
  else if(a==='effet-haut'){bouger(lire(b.dataset.ch),Number(b.dataset.i),-1);tout();}
  else if(a==='effet-bas'){bouger(lire(b.dataset.ch),Number(b.dataset.i),1);tout();}
  else if(a==='confier'){ecrire('personnage',b.dataset.q);tout();}
  else if(a==='jeu-rep'){
    const r=d.repliques[JEU.ou];
    const c=(r.reponses||[])[Number(b.dataset.i)];
    if(!c)return;
    JEU.chemin.push(JEU.ou);
    if(c.fin||!c.vers||!d.repliques[c.vers])JEU.fini=true;
    else JEU.ou=c.vers;
    rendreVolet();
  }
  else if(a==='jeu-reprendre'){JEU={cle:d.cle,ou:entreeDe(d),chemin:[],fini:false};rendreVolet();}
});
/* le menu déroulant qui ajoute un effet */
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset.act!=='effet-ajout'||!t.value)return;
  const l=lire(t.dataset.ch)||[];
  l.push({faire:t.value});
  ecrire(t.dataset.ch,l);
  t.value='';
  tout();
});

addEventListener('keydown',e=>{
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName))return;
  if(e.key==='n'&&!e.ctrlKey&&!e.metaKey){e.preventDefault();ajouter();}
  if(e.key==='ArrowDown'&&sel<R.dialogues.length-1){e.preventDefault();sel++;JEU=null;tout();}
  if(e.key==='ArrowUp'&&sel>0){e.preventDefault();sel--;JEU=null;tout();}
});

/* ── départ ── */
relire();
tout();
/* le codex du hub ouvre une conversation par son lien : #cle=… */
ouvrirDemande(R.dialogues,i=>{sel=i;JEU=null;tout();});
/* une teinte se choisit d'un clic, ici comme ailleurs */
ecouterTeintes(()=>tout());
/* un autre atelier a écrit dans le dépôt : on se remet à jour */
suivreDepot(()=>{relire();tout();});
habillerMobile(['Le recueil','La conversation','Aperçu']);
</script>
