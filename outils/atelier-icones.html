/* ═══════════════ les icônes ═══════════════
   Deux réservoirs, comme partout : les quarante-neuf dessins d'origine, livrés
   avec le jeu, et ceux que l'atelier d'icônes ajoute. Les seconds sont rangés
   dans le dépôt et apparaissent partout sans que rien d'autre change.

   La teinte se choisit librement. Les dix teintes nommées restent proposées
   comme raccourcis — elles disent quelque chose (danger, halte, trouvaille) —
   mais une couleur écrite à la main l'emporte. */
function glyphesTous(){
  const propres=depotLire('icones');
  const dessines={};
  ((propres&&propres.icones)||[]).forEach(i=>{if(i.cle&&i.svg)dessines[i.cle]=i.svg;});
  return Object.assign({},(typeof REF!=='undefined'&&REF.glyphes)||{},dessines);
}
function nomsGlyphes(){
  const propres=depotLire('icones');
  const noms={};
  ((propres&&propres.icones)||[]).forEach(i=>{if(i.cle)noms[i.cle]=i.nom||i.cle;});
  return noms;
}
const estGlypheDessine=k=>Object.prototype.hasOwnProperty.call(nomsGlyphes(),k);

/* ═══════════════ les rôles ═══════════════
   Même principe que les dessins : quinze rôles arrivent avec le jeu, et l'on en
   ajoute autant qu'on veut. Les vôtres vivent dans le dépôt, se choisissent
   comme les autres, et voyagent avec la sauvegarde.

   Un rôle porte son **féminin** quand le mot change — échevin, échevine. Le
   texte s'écrit une fois, avec {role}, et s'accorde sur le personnage. Beaucoup
   de rôles n'en ont pas besoin : guide, ermite, aubergiste sont les mêmes des
   deux côtés, et le champ reste vide. */
function rolesTous(){
  const miens=depotLire('roles');
  const propres={};
  ((miens&&miens.roles)||[]).forEach(r=>{
    if(!r||!r.cle)return;
    propres[r.cle]={nom:r.nom||r.cle,feminin:r.feminin||'',explique:r.explique||'',
                    ico:r.ico||null,mien:true};
  });
  const livres=(typeof REF!=='undefined'&&REF.vocabulairePersonnages
    &&REF.vocabulairePersonnages.roles)||{};
  return Object.assign({},livres,propres);
}
const estRoleMien=k=>{
  const r=rolesTous()[k];
  return !!(r&&r.mien);
};
/* Le rôle en toutes lettres, accordé. C'est ce que {role} donne dans un texte. */
function nomRole(cle,accord){
  const r=rolesTous()[cle];
  if(!r)return '';
  return (accord==='f'&&r.feminin)?r.feminin:r.nom;
}
/* Ce qui part avec les personnages : seulement les rôles dont ils se servent,
   pour que le jeu sache écrire {role} sans qu'on lui porte un second fichier. */
function rolesEmployes(personnages){
  const tous=rolesTous(), pris={};
  (personnages||[]).forEach(p=>{
    const r=p&&p.role&&tous[p.role];
    if(!r)return;
    pris[p.role]={nom:r.nom};
    if(r.feminin)pris[p.role].feminin=r.feminin;
    /* Le dessin du rôle part avec lui : c'est ce qui permet au jeu de le prêter
       à un personnage qui n'en a pas. Sans cela, donner une icône à « batelier »
       n'aurait servi qu'à décorer l'atelier. */
    if(r.ico&&(r.ico.glyphe||r.ico.nature||r.ico.teinte))
      pris[p.role].ico=Object.assign({},r.ico);
  });
  return pris;
}
function teinteDe(ico){
  if(ico&&ico.teinte)return ico.teinte;
  const t=(typeof REF!=='undefined'&&REF.natures)||{};
  return t[(ico||{}).nature]||'#9C9484';
}
function svgGlypheDe(cle,teinte){
  const g=glyphesTous()[cle];
  if(!g)return '';
  return `<svg viewBox="0 0 24 24" style="color:${teinte||'#9C9484'};--velin:#E3D6B2">`+
    `${g}</svg>`;
}
/* Le champ de teinte : les dix nommées, plus une couleur libre. */
function champTeinte(chNature,chTeinte){
  const nature=lire(chNature)||'';
  const libre=lire(chTeinte)||'';
  const t=(typeof REF!=='undefined'&&REF.natures)||{};
  const pastilles=Object.keys(t).map(k=>
    `<button type="button" class="teinte${!libre&&k===nature?' actif':''}"
      data-act="teinte-nommee" data-n="${ech(k)}" data-c="${ech(chNature)}"
      data-l="${ech(chTeinte)}" title="${ech(k)}"
      style="background:${t[k]}"></button>`).join('');
  const courante=libre||t[nature]||'#9C9484';
  return `<div class="teintes">${pastilles}
    <label class="teinte-libre${libre?' actif':''}" title="Une couleur à vous">
      <input type="color" value="${ech(courante)}" data-ch="${ech(chTeinte)}" data-t="txt">
    </label>
    ${libre?`<button type="button" class="outil petit" data-act="teinte-oter"
      data-l="${ech(chTeinte)}">Revenir à la teinte nommée</button>`:''}
  </div>`;
}

/* ═══════════════ les liens profonds ═══════════════
   Le codex du hub ouvre un élément directement dans son atelier :
   atelier-personnages.html#cle=orlanne */
function cleDemandee(){
  const m=/[#&]cle=([^&]+)/.exec(location.hash||'');
  return m?decodeURIComponent(m[1]):null;
}
function ouvrirDemande(liste,poser){
  const c=cleDemandee();
  if(!c)return false;
  const i=(liste||[]).findIndex(x=>x&&x.cle===c);
  if(i<0)return false;
  poser(i);
  return true;
}

/* ═══════════════ les champs engendrés ═══════════════ */
function champ(label,corps,aide,large){
  return `<div class="champ${large?' large':''}"><label>${ech(label)}</label><div>${corps}`+
    (aide?`<div class="aide">${aide}</div>`:'')+`</div></div>`;
}
function texte(ch,ph,lignes){
  const v=lire(ch);
  if(lignes)return `<textarea rows="${lignes}" data-ch="${ech(ch)}" data-t="txt" `+
    `placeholder="${ech(ph||'')}">${ech(Array.isArray(v)?v.join('\n\n'):v||'')}</textarea>`;
  return `<input data-ch="${ech(ch)}" data-t="txt" placeholder="${ech(ph||'')}" `+
    `value="${ech(v||'')}" autocomplete="off" spellcheck="false">`;
}
function nombre(ch,ph,pas){
  const v=lire(ch);
  return `<input type="number" step="${pas||'any'}" data-ch="${ech(ch)}" data-t="num" `+
    `placeholder="${ech(ph||'')}" value="${v===undefined||v===null?'':v}">`;
}
function choixListe(ch,options,vide){
  const v=lire(ch);
  return `<select data-ch="${ech(ch)}" data-t="txt">`+
    (vide?`<option value="">${ech(vide)}</option>`:'')+
    options.map(o=>{const[k,n]=Array.isArray(o)?o:[o,o];
      return `<option value="${ech(k)}"${k===v?' selected':''}>${ech(n)}</option>`;}).join('')+
    `</select>`;
}
/* Un « oui ou non » se choisit dans une liste mais se range en booléen. Le
   marqueur est explicite : le deviner d'après le nom du champ a fini par
   mordre — l'état d'une mission s'écrit lui aussi dans « vaut », et ce n'est
   pas un oui. */
function choixOuiNon(ch){
  const v=lire(ch);
  return `<select data-ch="${ech(ch)}" data-t="ouinon">`+
    `<option value="oui"${v===true?' selected':''}>oui</option>`+
    `<option value="non"${v!==true?' selected':''}>non</option></select>`;
}
function coche(ch,label){
  const v=lire(ch);
  return `<label class="chip${v?' actif':''}"><input type="checkbox" data-ch="${ech(ch)}" `+
    `data-t="bool"${v?' checked':''}>${ech(label)}</label>`;
}
function multi(ch,options,rien){
  const v=lire(ch)||[];
  if(!options.length)return `<p class="vide">${rien}</p>`;
  return `<div class="chips">`+options.map(o=>{
    const[k,n]=Array.isArray(o)?o:[o,o];
    return `<label class="chip${v.indexOf(k)>=0?' actif':''}"><input type="checkbox" `+
      `data-ch="${ech(ch)}" data-t="multi" value="${ech(k)}"${v.indexOf(k)>=0?' checked':''}>`+
      `${ech(n)}</label>`;}).join('')+`</div>`;
}
/* Les textes à trous : {ceci} entre accolades, remplacé par ce qu'on a sous la main. */
function trous(txt){
  const out=[], l=Array.isArray(txt)?txt:[txt];
  l.forEach(t=>{const re=/\{([a-zA-Z0-9_.]+)\}/g;let m;
    while((m=re.exec(String(t||''))))out.push(m[1]);});
  return out;
}
function boucher(txt,sac){
  const t=Array.isArray(txt)?pick(txt):txt;
  return String(t==null?'':t).replace(/\{([a-zA-Z0-9_.]+)\}/g,
    (m,k)=>sac[k]!==undefined?sac[k]:m);
}
/* Une valeur de texte : plusieurs paragraphes séparés par une ligne vide font
   plusieurs variantes, dont le jeu tire une au hasard. */
function texteSaisi(v){
  if(v.indexOf('\n\n')<0)return v;
  const l=v.split(/\n{2,}/).map(s=>s.trim()).filter(Boolean);
  return l.length>1?l:(l[0]||'');
}

/* ═══════════════ ouvrir et exporter ═══════════════ */
function telecharger(nom,donnees){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(donnees,null,2)],
    {type:'application/json'}));
  a.download=nom;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
/* Le dépôt de fichier, commun aux trois ateliers : on lit, on rend l'objet. */
function accueillirFichiers(surJson){
  let survol=0;
  const voile=$('#toile-depot');
  const lire1=f=>{const r=new FileReader();
    r.onload=()=>{let d;
      try{d=JSON.parse(r.result);}
      catch(e){alert('Ce fichier n\'est pas du JSON lisible.');return;}
      surJson(d);};
    r.readAsText(f);};
  addEventListener('dragenter',e=>{e.preventDefault();survol++;
    if(voile)voile.classList.add('on');});
  addEventListener('dragover',e=>e.preventDefault());
  addEventListener('dragleave',()=>{if(--survol<=0&&voile)voile.classList.remove('on');});
  addEventListener('drop',e=>{e.preventDefault();survol=0;
    if(voile)voile.classList.remove('on');
    if(e.dataTransfer.files[0])lire1(e.dataTransfer.files[0]);});
  const champFichier=$('#fichier');
  if(champFichier)champFichier.onchange=e=>{
    if(e.target.files[0])lire1(e.target.files[0]);
    e.target.value='';
  };
  return ()=>{if(champFichier)champFichier.click();};
}

/* ═══════════════ la disposition sur téléphone ═══════════════
   Sur un écran de 390 pixels, les trois colonnes empilées ne laissent que
   180 pixels au formulaire : on ne peut rien y écrire. Ici, on donne l'écran
   entier à **une** zone à la fois, et une barre en bas sert à passer de l'une à
   l'autre. Les boutons de la barre du haut se rangent dans un tiroir.

   Les quatre ateliers partagent la même ossature — #scene > aside, main, aside —
   donc ce code les sert tous les quatre sans qu'aucun n'ait à s'en occuper.

   Rien de tout cela ne s'active au-dessus de 860 pixels : sur un ordinateur,
   les trois colonnes restent côte à côte comme avant.                        */
const CSS_MOBILE=`
/* En grand écran, rien de tout cet habillage ne se voit : le tiroir est vide,
   la barre du bas n'a pas lieu d'être, et les trois zones tiennent ensemble. */
#tiroir,#voile-tiroir,#vues,#b-tiroir{display:none}
@media (max-width:860px){
  body{overflow:hidden}

  #barre h1{font-size:15px;flex:1;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;margin:0}
  #tiroir{position:fixed;left:0;right:0;top:0;z-index:20;
    background:var(--fond-clair);border-bottom:1px solid var(--bord);
    padding:10px;display:none;grid-template-columns:1fr 1fr;gap:8px;
    box-shadow:0 14px 30px #0009;max-height:78vh;overflow-y:auto}
  #tiroir.ouvert{display:grid}
  #tiroir .outil{justify-content:center;padding:11px 10px;font-size:13.5px}
  #tiroir .sep,#tiroir .pousse{display:none}
  #tiroir .plein{grid-column:1/-1}
  #voile-tiroir{position:fixed;inset:0;background:#0009;z-index:19;display:none}
  #voile-tiroir.ouvert{display:block}
  #b-tiroir{flex:none;display:inline-flex;align-items:center;gap:7px;
    padding:8px 12px;border:1px solid var(--bord);border-radius:var(--r);
    background:var(--fond);font-size:13px}
  #b-tiroir b{color:var(--or)}

  /* — une seule zone à l'écran — */
  #scene{flex-direction:column;position:relative}
  #scene>aside,#scene>main{display:none;width:auto;max-height:none;flex:1;

  #scene.vue-liste>aside:first-of-type{display:flex}
  #scene.vue-feuille>main{display:flex}

    border-top:2px solid transparent;display:flex;flex-direction:column;

  #vues button.actif{color:var(--or);border-top-color:var(--or)}
  #vues .pastille{font-size:16px;line-height:1}

  /* — l'état, sur une ligne qu'on peut faire défiler — */
  #etat{flex-wrap:nowrap;overflow-x:auto;gap:12px;font-size:11.5px;padding:5px 10px}
  #etat>span{white-space:nowrap;flex:none}

  .chip{padding:7px 12px;font-size:13px}

/* Les trois zones, dans l'ordre où la barre du bas les propose. Chaque atelier
   nomme la sienne : « le recueil », « le répertoire », « le coffre »… */
const PETIT='(max-width:860px)';
function installerMobile(noms){
  const scene=$('#scene');
  if(!scene)return;
  const barre=$('#barre');
  /* on range les boutons de la barre dans un tiroir, sans toucher au HTML */
  if(barre&&!$('#tiroir')){
    const tiroir=document.createElement('div');
    tiroir.id='tiroir';
    const voile=document.createElement('div');
    voile.id='voile-tiroir';
    /* Un retour au hub, en tête du tiroir : sur un téléphone, le bouton « page
       précédente » du navigateur n'est pas toujours à portée de pouce. */
    const retour=document.createElement('a');
    retour.className='outil plein';
    retour.href='index.html';
    retour.innerHTML='◂ Tous les ateliers';
    tiroir.appendChild(retour);
    const b=document.createElement('button');
    b.id='b-tiroir';b.innerHTML='<b>☰</b> Outils';
    barre.appendChild(b);
    /* Les boutons vivent dans la barre en grand écran, et dans le tiroir en
       petit. On les **déplace** au franchissement plutôt que de les cacher :
       cachés, la barre serait vide d'un côté ou le tiroir de l'autre. C'est
       aussi ce qui rend la même page utilisable au doigt et à la souris. */
    const outils=Array.prototype.slice.call(barre.children)
      .filter(el=>el.tagName!=='H1'&&el!==b);
    const q=matchMedia(PETIT);
    const ranger=()=>{
      const ou=q.matches?tiroir:barre;
      outils.forEach(el=>{if(el.parentNode!==ou)ou.appendChild(el);});
      /* le bouton du tiroir reste le dernier de la barre */
      if(!q.matches)barre.appendChild(b);
    };
    if(q.addEventListener)q.addEventListener('change',ranger);
    else q.addListener(ranger);
    ranger();
    document.body.appendChild(voile);
    document.body.appendChild(tiroir);
    const fermer=()=>{tiroir.classList.remove('ouvert');voile.classList.remove('ouvert');};
    b.onclick=()=>{const o=tiroir.classList.toggle('ouvert');
      voile.classList.toggle('ouvert',o);};
    voile.onclick=fermer;
    /* refermer dès qu'on a choisi quelque chose, sauf pour un menu déroulant */
    tiroir.addEventListener('click',e=>{
      if(e.target.closest('.outil'))setTimeout(fermer,60);});
  }
  /* la barre du bas */
  if(!$('#vues')){
    const zones=[['liste',noms&&noms[0]||'La liste','☰'],
                 ['feuille',noms&&noms[1]||'La fiche','✎'],
                 ['cote',noms&&noms[2]||'L\'aperçu','◫']];
    const v=document.createElement('div');
    v.id='vues';
    v.innerHTML=zones.map(([k,n,p])=>
      `<button data-vue="${k}"><span class="pastille">${p}</span>${ech(n)}</button>`).join('');
    const etat=$('#etat');
    if(etat)etat.parentNode.insertBefore(v,etat);
    else document.body.appendChild(v);
    v.addEventListener('click',e=>{
      const b=e.target.closest('[data-vue]');
      if(b)montrerVue(b.dataset.vue);
    });
  }
  montrerVue(localStorage.getItem('caravane.vue')||'feuille');
}
function montrerVue(quoi){
  const scene=$('#scene');
  if(!scene)return;
  scene.classList.remove('vue-liste','vue-feuille','vue-cote');
  scene.classList.add('vue-'+quoi);
  $$('#vues [data-vue]').forEach(b=>b.classList.toggle('actif',b.dataset.vue===quoi));
  try{localStorage.setItem('caravane.vue',quoi);}catch(e){}
  /* on repart du haut : arriver au milieu d'un formulaire désoriente */
  const z=quoi==='feuille'?$('#scene>main'):
    (quoi==='cote'?$('#volet'):$('#scene>aside'));
  if(z)z.scrollTop=0;
}

/* Les pastilles de teinte : choisir une teinte nommée efface la couleur libre,
   et réciproquement. L'atelier fournit ce qu'il faut refaire ensuite. */
function ecouterTeintes(apres){
  document.addEventListener('click',e=>{
    const b=e.target.closest('[data-act="teinte-nommee"],[data-act="teinte-oter"]');
    if(!b)return;
    if(b.dataset.act==='teinte-nommee'){
      ecrire(b.dataset.c,b.dataset.n);
      ecrire(b.dataset.l,undefined);
    }else ecrire(b.dataset.l,undefined);
    apres();
  });
}

/* ═══════════════ la saisie, en délégation ═══════════════
   Un seul écouteur pour tous les champs de tous les formulaires : ils portent
   leur chemin, le reste suit. L'atelier fournit ce qu'il faut refaire ensuite. */
function ecouterSaisie(apres){
  document.addEventListener('input',ev=>{
    const t=ev.target;
    if(t.dataset.ch===undefined)return;
    const ch=t.dataset.ch, k=t.dataset.t;
    if(/\.__/.test(ch))return;                    /* champs de travail, pas de données */
    if(k==='txt')ecrire(ch,t.tagName==='TEXTAREA'?texteSaisi(t.value):t.value);
    else if(k==='ouinon')ecrire(ch,t.value==='oui');
    else if(k==='num')ecrire(ch,t.value===''?undefined:Number(t.value));
    else if(k==='bool'){
      ecrire(ch,t.checked||undefined);
      t.closest('.chip').classList.toggle('actif',t.checked);
    }
    else if(k==='multi'){
      const cur=lire(ch)||[], i=cur.indexOf(t.value);
      if(t.checked&&i<0)cur.push(t.value);
      if(!t.checked&&i>=0)cur.splice(i,1);
      ecrire(ch,cur.length?cur:undefined);
      t.closest('.chip').classList.toggle('actif',t.checked);
    }
    apres(t,ch,k);
  });
}

/* ═══════════════ les étiquettes et leurs champs ═══════════════
   Les formulaires des ateliers écrivent

       <div class="champ"><label>Nom</label><input …></div>

   L'étiquette est **à côté** du champ, pas liée à lui : un lecteur d'écran
   annonce « zone de saisie » sans dire laquelle, et cliquer le mot ne met pas
   le curseur dedans. On les marie après coup plutôt que d'inventer un
   identifiant à la main dans les quelques centaines d'endroits qui en écrivent
   un — et comme les panneaux se réécrivent sans cesse, on refait le mariage à
   chaque fois que le DOM bouge. */
let nChamp=0;
function lierEtiquettes(racine){
  const r=racine||document;
  r.querySelectorAll('.champ label:not([for])').forEach(l=>{
    if(l.querySelector('input,select,textarea'))return;   /* déjà enveloppante */
    const p=l.closest('.champ');
    const c=p&&p.querySelector('input:not([type=hidden]),select,textarea');
    if(!c)return;
    if(!c.id)c.id='champ-'+(++nChamp);
    l.setAttribute('for',c.id);
  });
  /* Deux formes que le mariage par .champ ne couvre pas.
     Le menu « + Jalon… » : sa première option tient lieu d'étiquette, mais elle
     ne s'annonce pas comme telle. */
  r.querySelectorAll('select.ajout:not([aria-label])').forEach(s=>{
    const o=s.options[0];
    const t=o?o.textContent.replace(/^[+…\s]*/,'').replace(/…$/,'').trim():'';
    s.setAttribute('aria-label',t||'Ajouter');
  });
  /* Un nombre encadré de deux mots dans une rangée — « de 3 à 9 » : c'est le
     mot d'avant qui le nomme. */
  r.querySelectorAll('.rangee>input:not([aria-label]),.rangee>select:not([aria-label])')
   .forEach(c=>{
    if(c.type==='hidden')return;
    if(c.id&&document.querySelector('label[for="'+CSS.escape(c.id)+'"]'))return;
    if(c.closest('label'))return;
    const av=c.previousElementSibling;
    const mot=av&&av.tagName==='SPAN'?av.textContent.trim():'';
    if(mot)c.setAttribute('aria-label',mot);
  });
}
function suivreLesChamps(){
  lierEtiquettes();
  let prevu=false;
  new MutationObserver(()=>{
    if(prevu)return;
    prevu=true;
    requestAnimationFrame(()=>{prevu=false;lierEtiquettes();});
  }).observe(document.body,{childList:true,subtree:true});
}

/* ── se voir au clavier ──
   Le contour par défaut du navigateur est un liseré noir : sur un fond de
   vélin brûlé il est invisible, et l'on ne sait plus où l'on est. Celui-ci ne
   paraît qu'au clavier — :focus-visible — donc la souris n'y voit rien. */
:focus-visible{outline:2px solid var(--or);outline-offset:2px;border-radius:2px}
#bandeau a:focus-visible,#bandeau button:focus-visible{outline-offset:1px}
`;

let bandeauVue='codex', bandeauCherche='', bandeauPose=false;

const rondBandeau=()=>`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"`+
  ` fill="none" stroke="currentColor" stroke-width="2"/></svg>`;
function jetonBandeau(e){
  if(e.svg)return `<svg viewBox="0 0 24 24">${e.svg}</svg>`;
  if(e.glyphe)return svgGlypheDe(e.glyphe,'currentColor')||rondBandeau();
  return rondBandeau();
}

function installerBandeau(){
  if(bandeauPose||typeof document==='undefined')return;
  bandeauPose=true;
  const st=document.createElement('style');
  st.textContent=STYLE_BANDEAU;
  document.head.appendChild(st);

  const ici=pageIci();
  const poignee=document.createElement('button');
  poignee.id='bandeau-poignee';
  poignee.type='button';
  poignee.setAttribute('aria-expanded','false');
  poignee.title='Ce que vous avez écrit';
  poignee.setAttribute('aria-label','Ce que vous avez écrit');
  poignee.innerHTML='<span class="compte"></span>';

  const voile=document.createElement('div');
  voile.id='bandeau-voile';

  const b=document.createElement('aside');
  b.id='bandeau';
  b.setAttribute('aria-label','Ce que vous avez écrit');
  b.innerHTML=`
    <div class="tete"><h2>Ce que vous avez écrit</h2>
      <button class="fermer" type="button" id="bd-fermer">Fermer</button></div>
    <nav id="bd-outils">`+OUTILS_TOUS.map(o=>
      `<a href="${o.f}" style="--teinte:${o.t}"${o.f===ici?' class="ici" aria-current="page"':''}
        ><span class="pion"></span>${ech(o.nom)}</a>`).join('')+`</nav>
    <div class="corps">
      <div id="bd-vues">
        <button type="button" data-bvue="codex" class="actif">Le codex</button>
        <button type="button" data-bvue="charpente">La charpente</button>
      </div>
      <div id="bd-codex"></div>
      <div id="bd-charpente" hidden></div>
    </div>`;

  document.body.appendChild(poignee);
  document.body.appendChild(voile);
  document.body.appendChild(b);

  /* Fermé, le tiroir reste dans la page : sans inert, la tabulation traverse
     ses dix liens hors écran avant d'atteindre quoi que ce soit. Ouvert, le
     focus y entre — sinon il faudrait retraverser toute la page pour lire ce
     qu'on vient d'ouvrir — et à la fermeture il revient d'où il venait. */
  let dOu=null;
  const inerter=o=>{
    b.toggleAttribute('inert',!o);
    b.setAttribute('aria-hidden',String(!o));
  };
  const ouvrir=o=>{
    if(o&&!b.classList.contains('ouvert'))dOu=document.activeElement;
    b.classList.toggle('ouvert',o);
    voile.classList.toggle('ouvert',o);
    poignee.setAttribute('aria-expanded',String(o));
    inerter(o);
    if(o){
      rendreBandeau();
      const premier=$('#bd-cherche',b)||$('#bd-fermer',b);
      if(premier)premier.focus({preventScroll:true});
    }else{
      /* On rend le focus d'où il venait — mais une ouverture au clavier depuis
         une page qui n'avait rien de focalisé le laisserait sur le corps, et
         l'on repartirait du haut. La poignée est alors le bon endroit : c'est
         là qu'on vient de refermer. */
      const cible=(dOu&&dOu.isConnected&&dOu!==document.body)?dOu:poignee;
      dOu=null;
      if(cible&&cible.focus)cible.focus({preventScroll:true});
    }
  };
  inerter(false);
  poignee.onclick=()=>ouvrir(!b.classList.contains('ouvert'));
  voile.onclick=()=>ouvrir(false);
  $('#bd-fermer',b).onclick=()=>ouvrir(false);
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&b.classList.contains('ouvert')){ouvrir(false);}
  });
  b.addEventListener('click',e=>{
    const t=e.target.closest('[data-bvue]');
    if(!t)return;
    bandeauVue=t.dataset.bvue;
    rendreBandeau();
  });
  b.addEventListener('input',e=>{
    if(e.target.id!=='bd-cherche')return;
    bandeauCherche=e.target.value;
    const p=e.target.selectionStart;
    rendreCodexBandeau();
    const c=$('#bd-cherche',b);
    if(c){c.focus();c.setSelectionRange(p,p);}
  });

  /* Le compteur sur la poignée dit, sans l'ouvrir, combien de choses on a
     écrites. C'est ce qui donne envie d'aller voir. */
  const compter=()=>{
    chargerDepot();
    const n=depotCodex().reduce((s,c)=>s+c.entrees.length,0);
    $('.compte',poignee).textContent=n||'';
    if(b.classList.contains('ouvert'))rendreBandeau();
  };
  suivreDepot(compter);
  addEventListener('pageshow',compter);
  compter();
  suivreLesChamps();
}

function rendreBandeau(){
  chargerDepot();
  const codex=bandeauVue==='codex';
  $('#bd-codex').hidden=!codex;
  $('#bd-charpente').hidden=codex;
  document.querySelectorAll('#bd-vues button').forEach(x=>
    x.classList.toggle('actif',x.dataset.bvue===bandeauVue));
  if(codex)rendreCodexBandeau(); else rendreCharpenteBandeau();
}

function rendreCodexBandeau(){
  const boite=$('#bd-codex');
  if(!boite)return;
  const cats=depotCodex();
  const q=bandeauCherche.trim().toLowerCase();
  const garde=e=>!q||((e.nom+' '+e.cle+' '+e.detail).toLowerCase().indexOf(q)>=0);
  const total=cats.reduce((n,c)=>n+c.entrees.length,0);
  if(!total){
    boite.innerHTML=`<p class="bloc" id="bd-vide">Rien encore. Ce que vous créerez dans les
      ateliers viendra se ranger ici, par catégorie — et un bouton rouvrira chaque élément
      dans l'outil qui l'a fait.</p>`;
    return;
  }
  const pleines=cats.filter(c=>c.entrees.length);
  const vus=pleines.reduce((n,c)=>n+c.entrees.filter(garde).length,0);
  let h=`<input id="bd-cherche" placeholder="Chercher dans le codex…"
    value="${ech(bandeauCherche)}" autocomplete="off" spellcheck="false">`;
  if(q&&!vus)h+=`<p class="rien" id="bd-rien">Rien de ce nom-là dans le codex.</p>`;
  h+=pleines.map(c=>{
    const gardees=c.entrees.filter(garde);
    if(q&&!gardees.length)return '';
    const n=c.entrees.length;
    const ouvert=(q||n<=8)?' open':'';
    return `<details class="cat"${ouvert} data-cat="${ech(c.nom)}">
      <summary><span class="chevron">▶</span>${ech(c.titre)}
        <span class="compte">${n} ${ech(n>1?c.des:c.un)}</span></summary>
      <div class="entrees">`+
      (gardees.length?gardees.map(e=>`
        <div class="entree" style="--teinte:${ech(e.teinte)}">
          <span class="jeton">${jetonBandeau(e)}</span>
          <span class="txt"><b>${ech(e.nom||e.cle||'sans nom')}</b>
            <small>${ech(e.detail)}${e.detail&&e.manque?' · ':''}`+
            `${e.manque?`<span class="manque">${ech(e.manque)}</span>`:''}</small></span>
          <a class="ouvrir" href="${ech(e.lien)}">Ouvrir</a>
        </div>`).join('')
        :`<p class="rien">Rien de ce nom-là ici.</p>`)+
      `</div></details>`;
  }).join('');
  boite.innerHTML=h;
}

function rendreCharpenteBandeau(){
  const boite=$('#bd-charpente');
  if(!boite)return;
  const c=depotCharpente();
  if(!c.compte.missions&&!c.compte.dialogues){
    boite.innerHTML=`<p class="bloc">Rien à charpenter. Écrivez des <b>missions</b> et des
      <b>conversations</b> : dès qu'une conversation confie une mission, ou qu'une mission
      accomplie en ouvre une autre, l'enchaînement paraîtra ici.</p>`;
    return;
  }
  let h=`<div class="bloc"><div class="mesures">
    <span>Missions d'histoire</span><b>${c.compte.missions}</b>
    <span>Conversations</span><b>${c.compte.dialogues}</b>
    <span>Enchaînements</span><b>${c.compte.liens}</b>
    <span>Départs</span><b>${c.compte.racines}</b></div>
    <p style="margin-top:8px">Ce qui n'attend rien est en haut ; on descend vers ce que
      cela ouvre. Un élément déjà vu plus haut n'est pas redéveloppé.</p></div>`;
  if(c.soucis.length){
    const durs=c.soucis.filter(x=>x.dur), doux=c.soucis.filter(x=>!x.dur);
    h+=`<div class="trous"><h3>Les trous de la charpente</h3><ul>`+
      durs.map(x=>`<li class="dur">${x.txt}</li>`).join('')+
      doux.map(x=>`<li>${x.txt}</li>`).join('')+`</ul></div>`;
  }
  h+=c.arbres.map(a=>`<div class="tronc">${brancherBandeau(a,true)}</div>`).join('');
  boite.innerHTML=h;
}

function brancherBandeau(n,racine){
  const teinte=(n.qui&&n.qui.teinte)||(n.genre==='mission'?'#4A7BC8':'#6E9B6A');
  const dessin=n.qui?svgGlypheDe(n.qui.glyphe,'currentColor'):'';
  const genre=n.genre==='mission'?'mission':'conversation';
  let h='';
  if(!racine&&n.relation)h+=`<span class="lien-dit">↳ <b>${ech(n.relation)}</b></span>`;
  h+=`<div class="oeud${n.repris?' repris':''}${n.boucle?' boucle':''}"
        style="--teinte:${ech(teinte)}">
    <span class="jeton">${dessin||rondBandeau()}</span>
    <span class="txt"><b>${ech(n.nom)}</b>
      <span class="qui"><span class="genre">${genre}</span>`+
      (n.qui?` · <i>${ech(n.qui.nom)}</i>`+
        (n.qui.inconnu?' <b style="color:var(--minium)">(inconnu)</b>'
          :n.qui.lieu?' à '+ech(n.qui.lieu):'')
       :n.genre==='mission'?' · sans commanditaire':'')+
      `</span>`+
      (n.mentions.length&&!n.repris
        ?`<span class="mentions">${n.mentions.map(ech).join(' · ')}</span>`:'')+
    `</span>`+
    (n.repris?`<span class="renvoi">↩ plus haut</span>`
      :n.boucle?`<span class="renvoi" style="color:var(--minium)">↺ boucle</span>`
      :`<a class="ouvrir" href="${ech(n.lien)}">Ouvrir</a>`)+
  `</div>`;
  if(n.enfants&&n.enfants.length)
    h+=n.enfants.map((e,i)=>`<div class="branche${
      i===n.enfants.length-1&&!(e.enfants||[]).length?' terminale':''
    }">${brancherBandeau(e)}</div>`).join('');
  return h;
}

/* On l'installe dès que le corps existe : les ateliers appellent leur propre
   amorce, et aucun n'a à penser au bandeau. */
if(typeof document!=='undefined'){
  if(document.readyState==='loading')
    document.addEventListener('DOMContentLoaded',installerBandeau);
  else installerBandeau();
}

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════════
   L'ATELIER D'ICÔNES
   ───────────────────────────────────────────────────────────────────────────
   Les quarante-neuf dessins livrés avec le jeu sont tous faits de la même
   matière : quelques formes géométriques simples, pleines ou au trait, sur une
   grille de vingt-quatre. Cet atelier fabrique les suivantes de la même façon —
   on empile des formes, on les déplace, on les redimensionne.

   Ce n'est pas un éditeur vectoriel, et c'est délibéré : on dessine ici des
   pictogrammes de seize pixels de côté, pas des illustrations. Six formes
   suffisent, et elles se manipulent au doigt.

   Pour ce qui ne rentre pas dans ces six formes, « La source » accepte du SVG
   collé depuis n'importe quel éditeur.

   Ce qu'on écrit part dans le dépôt partagé : les icônes apparaissent aussitôt
   dans les cinq autres ateliers, à côté de celles du jeu.                    */
const REF=JSON.parse(document.getElementById('reference').textContent);
/* La réserve de pièces. Elle n'est recopiée que dans cet atelier — les sept
   autres n'en ont rien à faire, et elle pèse. Absente, la bibliothèque se tait
   simplement au lieu de casser la page. */
const BIBLI=(()=>{
  const b=document.getElementById('pieces');
  if(!b)return null;
  try{const d=JSON.parse(b.textContent);
    return (d&&Array.isArray(d.pieces)&&d.pieces.length)?d:null;}
  catch(e){return null;}
})();

/* ═══════════════ les six formes ═══════════════ */
const FORMES={
  disque:{nom:'Disque',neuf:()=>({f:'disque',x:12,y:12,r:6,plein:true,ep:2}),
    svg:o=>o.plein
      ?`<circle cx="${n(o.x)}" cy="${n(o.y)}" r="${n(o.r)}" fill="currentColor"/>`
      :`<circle cx="${n(o.x)}" cy="${n(o.y)}" r="${n(o.r)}" fill="none" `+
       `stroke="currentColor" stroke-width="${n(o.ep)}"/>`},
  rectangle:{nom:'Rectangle',neuf:()=>({f:'rectangle',x:6,y:8,l:12,h:8,arr:1,plein:true,ep:2}),
    svg:o=>`<rect x="${n(o.x)}" y="${n(o.y)}" width="${n(o.l)}" height="${n(o.h)}" `+
      `rx="${n(o.arr)}" ${o.plein?'fill="currentColor"'
        :`fill="none" stroke="currentColor" stroke-width="${n(o.ep)}"`}/>`},
  triangle:{nom:'Triangle',neuf:()=>({f:'triangle',x:12,y:12,l:12,h:11,plein:true,ep:2}),
    svg:o=>{const p=`${n(o.x)},${n(o.y-o.h/2)} ${n(o.x+o.l/2)},${n(o.y+o.h/2)} `+
      `${n(o.x-o.l/2)},${n(o.y+o.h/2)}`;
      return `<polygon points="${p}" ${o.plein?'fill="currentColor"'
        :`fill="none" stroke="currentColor" stroke-width="${n(o.ep)}" stroke-linejoin="round"`}/>`}},
  trait:{nom:'Trait',neuf:()=>({f:'trait',x:4,y:12,x2:20,y2:12,ep:2}),
    svg:o=>`<path d="M${n(o.x)} ${n(o.y)}L${n(o.x2)} ${n(o.y2)}" fill="none" `+
      `stroke="currentColor" stroke-width="${n(o.ep)}" stroke-linecap="round"/>`},
  etoile:{nom:'Étoile',neuf:()=>({f:'etoile',x:12,y:12,r:8,branches:5,creux:.45,plein:true,ep:2}),
    svg:o=>{
      const b=Math.max(3,Math.round(o.branches||5)),pts=[];
      for(let i=0;i<b*2;i++){
        const a=-Math.PI/2+i*Math.PI/b;
        const r=i%2?o.r*(o.creux===undefined?.45:o.creux):o.r;
        pts.push(n(o.x+Math.cos(a)*r)+','+n(o.y+Math.sin(a)*r));
      }
      return `<polygon points="${pts.join(' ')}" ${o.plein?'fill="currentColor"'
        :`fill="none" stroke="currentColor" stroke-width="${n(o.ep)}" stroke-linejoin="round"`}/>`}},
  /* ── une icône entière, reprise comme forme ──
     La roue dessinée une fois sert quatre fois à la carriole. On ne recopie pas
     ses formes : on garde un renvoi vers sa clé, si bien que corriger la roue
     corrige les quatre. Le renvoi ne vit que dans l'atelier — corpsSvg() le
     résout au moment de publier, et le jeu reçoit un dessin entier, sans rien
     savoir de la composition. */
  icone:{nom:'Icône',neuf:()=>({f:'icone',ref:'',x:12,y:12,t:1,rot:0}),
    svg:(o,vus)=>{
      const d=corpsDeRenvoi(o.ref,vus);
      if(!d)return '';
      const t=o.t===undefined?1:Math.max(.05,o.t);
      const r=Math.round(Number(o.rot)||0);
      /* de droite à gauche : on ramène son centre à l'origine, on la met à
         l'échelle, on la tourne, puis on la pose où on veut */
      return `<g transform="translate(${n(o.x)} ${n(o.y)})`+
        (r?` rotate(${r})`:'')+
        ` scale(${n(t)}) translate(-12 -12)">${d}</g>`;}},
  arc:{nom:'Arc',neuf:()=>({f:'arc',x:12,y:14,r:7,ouvert:180,ep:2}),
    svg:o=>{
      const a=Math.max(10,Math.min(350,o.ouvert||180))*Math.PI/180;
      const d1=-Math.PI/2-a/2,d2=-Math.PI/2+a/2;
      const x1=o.x+Math.cos(d1)*o.r,y1=o.y+Math.sin(d1)*o.r;
      const x2=o.x+Math.cos(d2)*o.r,y2=o.y+Math.sin(d2)*o.r;
      return `<path d="M${n(x1)} ${n(y1)}A${n(o.r)} ${n(o.r)} 0 ${a>Math.PI?1:0} 1 `+
        `${n(x2)} ${n(y2)}" fill="none" stroke="currentColor" `+
        `stroke-width="${n(o.ep)}" stroke-linecap="round"/>`}}
};
const n=v=>Math.round((Number(v)||0)*100)/100;
/* Les réglages que chaque forme propose, et rien d'autre : un trait n'a pas de
   rayon, un disque n'a pas de second point. */
/* La rotation est proposée partout où elle change quelque chose : un disque est
   rond, un trait se pose par ses deux bouts, et l'un comme l'autre s'en
   passent. */
const REGLAGES={
  disque:[['r','Rayon',1,12,.5],['ep','Épaisseur du trait',.4,4,.2]],
  rectangle:[['l','Largeur',1,24,.5],['h','Hauteur',1,24,.5],
             ['arr','Arrondi',0,6,.25],['rot','Rotation (degrés)',0,355,5],
             ['ep','Épaisseur du trait',.4,4,.2]],
  triangle:[['l','Base',1,24,.5],['h','Hauteur',1,24,.5],
            ['rot','Rotation (degrés)',0,355,5],['ep','Épaisseur du trait',.4,4,.2]],
  trait:[['ep','Épaisseur',.4,6,.2]],
  etoile:[['r','Rayon',1,12,.5],['branches','Branches',3,12,1],
          ['creux','Creux',.15,.9,.05],['rot','Rotation (degrés)',0,355,5],
          ['ep','Épaisseur du trait',.4,4,.2]],
  arc:[['r','Rayon',1,12,.5],['ouvert','Ouverture (degrés)',20,340,10],
       ['rot','Rotation (degrés)',0,355,5],['ep','Épaisseur',.4,4,.2]],
  icone:[['t','Échelle',.1,2,.05],['rot','Rotation (degrés)',0,355,5]]
};

/* ═══════════════ le modèle ═══════════════ */
let R={format:'caravane.icones.v1',icones:[]};
let sel=0, selForme=-1, onglet='planche', filtre='';
/* La taille de la planche. Quatre crans plutôt qu'un glissement libre : on veut
   la même largeur d'une séance à l'autre, pour juger un dessin sans que l'échelle
   ait bougé sous les yeux. */
const TAILLES_PLANCHE=[[280,'Petite'],[340,'Normale'],[460,'Grande'],[620,'Immense']];
let taillePlanche=1;
const IC=()=>R.icones[sel]||null;
racineEst(IC);
/* Ce que les autres reçoivent : le dessin déjà tracé. Ni les autres ateliers ni
   le jeu n'ont à connaître les formes — ils ne veulent que le SVG. */
function publier(){
  return {format:R.format,
    icones:R.icones.map(ic=>Object.assign({},ic,{svg:corpsSvg(ic)}))};
}
sectionEst('icones',publier);
sauvegardeEst('caravane.atelier-icones.v1',
  ()=>({sel:sel,forme:selForme,planche:taillePlanche}));
function relire(){
  const c=depotLire('icones');
  /* on reprend les formes, pas le SVG : il se retrace à chaque publication */
  if(c&&Array.isArray(c.icones)){
    R=c;
    R.icones.forEach(ic=>{delete ic.svg;});
  }
  const d=relireSauve();
  if(d){
    sel=Math.max(0,Math.min(R.icones.length-1,d.sel|0));
    if(d.planche!==undefined)
      taillePlanche=Math.max(0,Math.min(TAILLES_PLANCHE.length-1,d.planche|0));
  }
  /* La forme choisie se retrouve aussi : sans cela, rouvrir l'atelier rendait la
     planche muette — ni cadre, ni poignée, ni réglages — jusqu'à ce qu'on
     reclique dans la pile. */
  const formes=(IC()&&IC().formes)||[];
  selForme=formes.length
    ?Math.max(0,Math.min(formes.length-1,d&&d.forme!==undefined?d.forme|0:0))
    :-1;
  appliquerTaillePlanche();
  return !!c;
}
/* La planche vit dans le panneau de droite, large de 320 px : l'agrandir, c'est
   élargir le panneau avec elle, sinon elle bute. Le panneau du milieu cède la
   place — c'est lui qui a du jeu. */
function appliquerTaillePlanche(){
  const px=TAILLES_PLANCHE[taillePlanche][0];
  document.documentElement.style.setProperty('--planche',px+'px');
  const cote=$('#cote');
  if(cote)cote.style.width=Math.max(320,px+40)+'px';
}

/* ═══════════════ le dessin ═══════════════
   « vus » porte les clés déjà traversées en descendant dans les renvois. Sans
   elle, une roue qui se reprendrait elle-même — ou deux icônes qui se
   citeraient l'une l'autre — ferait tourner le dessin jusqu'à la pile pleine.
   On coupe au premier retour, et l'atelier le signale par ailleurs. */
function corpsSvg(ic,vus){
  if(!ic)return '';
  if(ic.source)return ic.source;          /* du SVG collé l'emporte */
  const dedans=vus||[];
  return (ic.formes||[]).map(o=>{
    const d=FORMES[o.f];
    if(!d)return '';
    return tourne(o,d.svg(o,ic.cle?dedans.concat([ic.cle]):dedans));
  }).join('\n  ');
}
/* Faire tourner une forme sur place.
   Un triangle ne pointe que vers le haut, un arc ne se bombe que vers le haut :
   sans rotation, la moitié des dessins était hors d'atteinte — une coque, un
   fanion, un toit renversé. On tourne autour du centre de la boîte, donc la
   forme pivote là où elle est, sans se déplacer.
   « icone » fait exception : elle porte déjà sa rotation dans sa propre
   transformation, et l'envelopper une seconde fois la tournerait deux fois. */
/* Autour de quoi une forme tourne. Son ancre, quand elle en a une qui est déjà
   son centre — un disque, un triangle, une étoile, un arc. Le rectangle se pose
   par son coin haut-gauche, et pivoter autour d'un coin ne ressemble à rien : il
   tourne autour de son milieu. Le trait, autour du milieu de ses deux bouts. */
function centreDe(o){
  if(o.f==='rectangle')return {x:o.x+(o.l||0)/2,y:o.y+(o.h||0)/2};
  if(o.f==='trait')return {x:(o.x+o.x2)/2,y:(o.y+o.y2)/2};
  return {x:o.x,y:o.y};
}
function tourne(o,svg){
  const r=Math.round(Number(o.rot)||0)%360;
  if(!r||!svg||o.f==='icone')return svg;
  const c=centreDe(o);
  return `<g transform="rotate(${r} ${n(c.x)} ${n(c.y)})">`+svg+`</g>`;
}
/* Ce que désigne un renvoi : une de vos icônes, ou un dessin livré avec le jeu.
   Les vôtres d'abord — c'est ce qu'on est en train d'écrire qui compte. */
/* Le temps d'un aperçu de bibliothèque, les renvois se résolvent dans la
   bibliothèque : une charrette de la réserve doit montrer ses roues avant d'être
   versée, alors qu'elles ne sont pas encore chez vous. Hors de cet aperçu, la
   réserve reste invisible au résolveur — sans quoi l'atelier dessinerait des
   renvois que le sélecteur ne propose pas et que le contrôle déclare absents. */
let RESOUT_DANS_BIBLI=false;
function iconeDe(cle){
  if(!cle)return null;
  const mienne=R.icones.find(x=>x.cle===cle);
  if(mienne)return {mienne:mienne};
  if(RESOUT_DANS_BIBLI){
    const p=pieceDe(cle);
    if(p)return {mienne:{cle:p.cle,formes:p.formes}};
  }
  const g=(typeof REF!=='undefined'&&REF.glyphes)||{};
  return g[cle]?{source:g[cle]}:null;
}
function apercuBibli(piece,taille){
  RESOUT_DANS_BIBLI=true;
  try{ return svgDe({cle:piece.cle,formes:piece.formes},'#C9A227',taille); }
  finally{ RESOUT_DANS_BIBLI=false; }
}
function corpsDeRenvoi(cle,vus){
  if(!cle)return '';
  const dedans=vus||[];
  if(dedans.indexOf(cle)>=0)return '';          /* on tourne en rond : on coupe */
  if(dedans.length>8)return '';                 /* garde-fou de profondeur */
  const t=iconeDe(cle);
  if(!t)return '';
  return t.source||corpsSvg(t.mienne,dedans);
}
/* Le renvoi de o mènerait-il à un cycle si on le posait dans l'icône « depuis » ?
   On refuse de proposer un choix qui se mordrait la queue, plutôt que de le
   laisser faire et de s'en plaindre après. */
function meneAuCycle(cleVisee,depuis){
  if(!cleVisee||!depuis)return false;
  if(cleVisee===depuis)return true;
  const vus=[];
  const descend=cle=>{
    if(cle===depuis)return true;
    if(vus.indexOf(cle)>=0)return false;
    vus.push(cle);
    const t=iconeDe(cle);
    if(!t||!t.mienne)return false;
    return (t.mienne.formes||[]).some(o=>o.f==='icone'&&o.ref&&descend(o.ref));
  };
  return descend(cleVisee);
}
function svgDe(ic,teinte,taille){
  return `<svg viewBox="0 0 24 24" ${taille?`width="${taille}" height="${taille}"`:''} `+
    `style="color:${teinte||ic&&ic.teinte||'#C9A227'};--velin:#E3D6B2">`+
    `${corpsSvg(ic)}</svg>`;
}

/* ═══════════════ la bibliothèque ═══════════════
   Une réserve de pièces déjà dessinées, en listes de formes — donc modifiables
   au curseur comme le reste, et non des images à prendre ou à laisser.

   Verser une pièce dans son propre jeu, c'est la recopier. Mais un assemblage
   renvoie à d'autres pièces : le verser sans elles donnerait une charrette sans
   roues. On descend donc dans ses renvois d'abord, et l'on réécrit les clés au
   passage — si vous avez déjà une « roue-cerclee » à vous, c'est la vôtre qui
   sert, et la bibliothèque ne l'écrase pas. */
let vueBibli=false, familleBibli='';
function pieceDe(cle){
  return BIBLI?BIBLI.pieces.find(x=>x.cle===cle)||null:null;
}
function verser(cle,fait){
  const vus=fait||{};
  if(vus[cle]!==undefined)return vus[cle];
  const src=pieceDe(cle);
  if(!src)return null;
  /* déjà chez vous sous ce nom : on s'en sert, on ne le double pas */
  const mienne=R.icones.find(x=>x.cle===cle);
  if(mienne){vus[cle]=cle;return cle;}
  vus[cle]=cle;                            /* posé d'avance : coupe les cycles */
  const formes=JSON.parse(JSON.stringify(src.formes||[]));
  formes.forEach(o=>{
    if(o.f!=='icone'||!o.ref)return;
    const k=verser(o.ref,vus);
    if(k)o.ref=k;
  });
  R.icones.push({cle:cle,nom:src.nom||cle,nature:'trouvaille',formes:formes});
  return cle;
}
function combienDependances(cle){
  const vus={};
  const descend=k=>{
    if(vus[k])return;vus[k]=1;
    const s=pieceDe(k);
    if(!s)return;
    (s.formes||[]).forEach(o=>{if(o.f==='icone'&&o.ref)descend(o.ref);});

  return Object.keys(vus).filter(k=>k!==cle&&!R.icones.some(x=>x.cle===k)).length;
}

/* ═══════════════ les contrôles ═══════════════ */
function controler(ic,idx){
  const out=[];
  const dur=t=>out.push({dur:true,txt:t});
  const doux=t=>out.push({dur:false,txt:t});
  if(!ic)return out;
  if(!ic.cle)dur('Il manque la <b>clé</b>.');
  else if(!/^[a-z0-9-]+$/.test(ic.cle))
    dur('La <b>clé</b> ne prend que des minuscules, des chiffres et des tirets.');
  else if(R.icones.some((x,i)=>i!==idx&&x.cle===ic.cle))
    dur(`La clé <b>${ech(ic.cle)}</b> sert déjà à une autre icône.`);
  else if(REF.glyphes&&REF.glyphes[ic.cle])
    dur(`La clé <b>${ech(ic.cle)}</b> est déjà celle d'un dessin du jeu : la vôtre `+
      `le remplacerait partout.`);
  if(!ic.nom)doux('Pas de <b>nom</b> : elle sera dure à retrouver dans les listes.');
  /* Les renvois : sans icône choisie on ne dessine rien, et une clé qui ne mène
     nulle part est le genre de panne qu'on ne voit pas — le dessin manque
     simplement, sans rien dire. */
  (ic.formes||[]).forEach((o,i)=>{
    if(o.f!=='icone')return;
    if(!o.ref)dur(`La forme ${i+1} reprend une icône mais <b>aucune n'est choisie</b> : `+
      `elle ne dessine rien.`);
    else if(!iconeDe(o.ref))
      dur(`La forme ${i+1} renvoie à <b>${ech(o.ref)}</b>, qui n'existe pas — `+
        `renommée ou supprimée. Rien ne se dessine à sa place.`);
    else if(meneAuCycle(o.ref,ic.cle))
      dur(`La forme ${i+1} renvoie à <b>${ech(o.ref)}</b>, qui revient à celle-ci : `+
        `le dessin tournerait en rond. Il est coupé là.`);
  });
  const corps=corpsSvg(ic);
  if(!corps.trim())dur('Elle est <b>vide</b> : rien ne s\'affichera.');
  if(ic.source){
    if(/<script|onload=|onerror=/i.test(ic.source))
      dur('Le SVG collé contient du <b>script</b>. Retirez-le : une icône ne doit rien exécuter.');
    if(/<svg/i.test(ic.source))
      doux('Le SVG collé contient une balise <b>&lt;svg&gt;</b>. Ne gardez que ce qu\'il y a '+
        'dedans — les &lt;path&gt;, &lt;circle&gt;, &lt;rect&gt;.');
    if(!/currentColor/.test(ic.source))
      doux('Aucun <b>currentColor</b> : la teinte choisie ailleurs n\'aura pas d\'effet.');
  }else{
    const f=ic.formes||[];
    if(!f.length)dur('Aucune <b>forme</b>.');
    /* ce qui sort du cadre ne se verra pas — rotation comprise, sans quoi un
       rectangle couché en travers serait rogné sans qu'on en dise rien */
    const dehors=f.filter(o=>{
      const b=boiteTournee(o);
      return b.x0<-.5||b.y0<-.5||b.x1>24.5||b.y1>24.5;
    }).length;
    if(dehors)doux(`${dehors} forme${dehors>1?'s dépassent':' dépasse'} du cadre de 24 : `+
      `ce qui sort ne se verra pas.`);
    if(f.length>10)doux('Plus de dix formes : à seize pixels, personne ne les distinguera.');
  }
  return out;
}
/* La boîte d'une forme, pour la sélection et les contrôles. */
function boite(o){
  if(o.f==='trait')return {x0:Math.min(o.x,o.x2)-o.ep/2,y0:Math.min(o.y,o.y2)-o.ep/2,
    x1:Math.max(o.x,o.x2)+o.ep/2,y1:Math.max(o.y,o.y2)+o.ep/2};
  if(o.f==='rectangle')return {x0:o.x,y0:o.y,x1:o.x+o.l,y1:o.y+o.h};
  if(o.f==='triangle')return {x0:o.x-o.l/2,y0:o.y-o.h/2,x1:o.x+o.l/2,y1:o.y+o.h/2};
  /* une icône reprise occupe sa boîte de 24, mise à l'échelle et centrée sur x,y */
  if(o.f==='icone'){const d=12*(o.t===undefined?1:Math.max(.05,o.t));
    return {x0:o.x-d,y0:o.y-d,x1:o.x+d,y1:o.y+d};}
  /* Un arc ne dessine qu'une portion de cercle : lui donner la boîte du cercle
     entier faisait un cadre deux fois trop haut, et l'avertissement « ça dépasse »
     se déclenchait pour du vide. On prend l'étendue réellement parcourue — les
     deux bouts, plus les points cardinaux que le balayage traverse. */
  if(o.f==='arc')return boiteArc(o,0);
  const r=o.r||6;
  return {x0:o.x-r,y0:o.y-r,x1:o.x+r,y1:o.y+r};
}
/* L'étendue d'un arc, rotation comprise. Un arc ne dessine qu'une portion de
   cercle : lui prêter la boîte du cercle entier faisait un cadre deux fois trop
   haut, et l'avertissement « ça dépasse » criait pour du vide. On prend les deux
   bouts, plus les points cardinaux que le balayage traverse — c'est exact, et
   comme l'arc tourne autour de son propre centre, il suffit de décaler les
   angles. */
function boiteArc(o,rot){
  const r=o.r||6, ouv=Math.max(10,Math.min(350,o.ouvert||180));
  const d=Math.round(Number(rot)||0);
  const a1=-90-ouv/2+d, a2=-90+ouv/2+d;
  const xs=[],ys=[];
  const pose=deg=>{const a=deg*Math.PI/180;
    xs.push(o.x+Math.cos(a)*r);ys.push(o.y+Math.sin(a)*r);};
  pose(a1);pose(a2);
  for(let c=-720;c<=720;c+=90)if(c>=a1&&c<=a2)pose(c);
  const e=(o.ep||0)/2;
  return {x0:Math.min(...xs)-e,y0:Math.min(...ys)-e,
          x1:Math.max(...xs)+e,y1:Math.max(...ys)+e};
}
/* La place que la forme occupe vraiment, rotation comprise. Elle ne sert qu'à
   prévenir de ce qui sort du cadre : le cadre de sélection et sa poignée, eux,
   restent sur la boîte droite, parce qu'on tire une poignée selon les axes de
   l'écran et non selon ceux d'une forme couchée. */
function boiteTournee(o){
  const a=(Math.round(Number(o.rot)||0)%360);
  if(!a)return boite(o);
  if(o.f==='arc')return boiteArc(o,a);
  const b=boite(o), c=centreDe(o), t=a*Math.PI/180;
  const co=Math.cos(t), si=Math.sin(t);
  const xs=[],ys=[];
  [[b.x0,b.y0],[b.x1,b.y0],[b.x1,b.y1],[b.x0,b.y1]].forEach(([x,y])=>{
    const dx=x-c.x, dy=y-c.y;
    xs.push(c.x+dx*co-dy*si);
    ys.push(c.y+dx*si+dy*co);
  });
  return {x0:Math.min(...xs),y0:Math.min(...ys),
          x1:Math.max(...xs),y1:Math.max(...ys)};
}

function voletPlanche(){

  for(let i=1;i<24;i++){

    g+=`<line${f} x1="${i}" y1="0" x2="${i}" y2="24"/>`+
       `<line${f} x1="0" y1="${i}" x2="24" y2="${i}"/>`;
  }
  let cadre='';
  const o=(ic.formes||[])[selForme];
  if(o&&!ic.source){
    const b=boite(o);
    cadre=`<rect class="cadre" x="${n(b.x0)}" y="${n(b.y0)}" `+
      `width="${n(b.x1-b.x0)}" height="${n(b.y1-b.y0)}"/>`+
      `<circle class="poignee" data-poignee="1" cx="${n(b.x1)}" cy="${n(b.y1)}" r=".8"/>`;
  }

    <div class="rangee" style="padding:0 4px 6px;gap:5px;flex-wrap:wrap">
      <span class="mot fixe">Planche</span>`+
      TAILLES_PLANCHE.map(([px,nom],i)=>
        `<button class="outil petit${i===taillePlanche?' fort':''}" data-act="planche-taille"
          data-i="${i}" title="${px} px">${ech(nom)}</button>`).join('')+
    `</div>
    <p class="aide" style="padding:0 4px">Faites glisser la forme choisie sur la planche,
      et tirez la <b>poignée dorée</b> pour la redimensionner. La grille marque les
      unités ; les traits plus clairs, les quarts.</p>
    ${jouable?`<p class="aide" style="padding:0 4px">Cliquez la planche puis les
      <b>flèches</b> pour déplacer d'un quart d'unité — <b>Maj</b> pour une unité
      entière. Pour un dessin symétrique : n'en faites qu'une moitié, <b>dupliquez</b>-la
      dans la pile, et retournez la copie au <b>miroir</b>.</p>`:''}`;
}
function voletTailles(){
  const ic=IC();
  if(!ic)return `<p class="vide">Rien à montrer.</p>`;
  const t=teinteDe(ic);
  const t2=[[16,'dans une liste'],[24,'dans le journal'],[32,'sur une fiche'],
    [48,'en tête d\'événement']];
  return `<p class="aide">Une icône se juge à la taille où on la verra. À seize pixels,
    un trait de moins d'un demi ne se voit plus.</p>
    <div class="tailles" style="margin-top:12px">`+
    t2.map(([s,q])=>`<figure><div>${svgDe(ic,t,s)}</div>`+
      `<figcaption>${s} px<br>${ech(q)}</figcaption></figure>`).join('')+
    `</div>
    <h4 class="section">Sur les deux fonds du jeu</h4>
    <div class="tailles">
      <figure><div style="background:#1C1A17">${svgDe(ic,t,40)}</div>
        <figcaption>l'écran sombre</figcaption></figure>
      <figure><div style="background:#E3D6B2">${svgDe(ic,t,40)}</div>
        <figcaption>le vélin</figcaption></figure>
    </div>
    <h4 class="section">Aux dix teintes nommées</h4>
    <div class="tailles">`+
    Object.entries(REF.natures||{}).map(([k,c])=>
      `<figure><div>${svgDe(ic,c,26)}</div><figcaption>${ech(k)}</figcaption></figure>`
    ).join('')+`</div>`;
}
function voletSource(){
  const ic=IC();
  if(!ic)return `<p class="vide">Rien à montrer.</p>`;
  const c=corpsSvg(ic);
  return `<p class="aide">Ce que l'atelier écrit. C'est exactement la forme des
    quarante-neuf dessins du jeu : le contenu d'une balise <b>svg</b> de 24 sur 24,
    en <b>currentColor</b>.</p>
    <textarea rows="14" readonly style="margin-top:10px">${ech(c)}</textarea>
    <div class="mesures" style="margin-top:10px">
      <span>Formes</span><b>${(ic.formes||[]).length}</b>
      <span>Poids</span><b>${c.length} caractères</b></div>
    <p class="aide" style="margin-top:9px">Les dessins du jeu font entre 90 et 600
      caractères. Au-delà, c'est probablement trop détaillé pour la taille où on
      le verra.</p>`;
}

/* ── la planche : glisser et redimensionner ── */
function brancherPlanche(){
  const toile=$('#toile');
  if(!toile)return;
  const svg=toile.querySelector('svg');
  let glisse=null;
  const point=ev=>{
    const r=toile.getBoundingClientRect();
    return {x:(ev.clientX-r.left)/r.width*24,y:(ev.clientY-r.top)/r.height*24};
  };
  toile.addEventListener('pointerdown',ev=>{
    const ic=IC(),o=(ic&&ic.formes||[])[selForme];
    if(!o||ic.source)return;
    ev.preventDefault();
    toile.setPointerCapture(ev.pointerId);
    const p=point(ev);
    const surPoignee=!!ev.target.closest('[data-poignee]');
    glisse={quoi:surPoignee?'taille':'place',p:p,depart:Object.assign({},o),bouge:false};
    /* on prend le clavier : les flèches déplaceront la forme sans re-cliquer */
    toile.focus({preventScroll:true});
  });
  toile.addEventListener('pointermove',ev=>{
    if(!glisse)return;
    const ic=IC(),o=ic.formes[selForme];
    const p=point(ev), dx=p.x-glisse.p.x, dy=p.y-glisse.p.y;
    const d=glisse.depart;
    if(Math.abs(dx)+Math.abs(dy)>.05)glisse.bouge=true;
    /* un quart d'unité : assez fin pour placer, assez gros pour rester net */
    const q=v=>Math.round(v*4)/4;
    if(glisse.quoi==='place'){
      o.x=q(d.x+dx);o.y=q(d.y+dy);
      if(o.f==='trait'){o.x2=q(d.x2+dx);o.y2=q(d.y2+dy);}
    }else{
      if(o.f==='rectangle'){o.l=Math.max(.5,q(d.l+dx));o.h=Math.max(.5,q(d.h+dy));}
      else if(o.f==='triangle'){o.l=Math.max(.5,q(d.l+dx*2));o.h=Math.max(.5,q(d.h+dy*2));}
      else if(o.f==='trait'){o.x2=q(d.x2+dx);o.y2=q(d.y2+dy);}
      /* une icône reprise se tire par son échelle : douze unités de côté valent
         l'échelle 1, donc un vingtième d'échelle par unité tirée */
      else if(o.f==='icone')
        o.t=Math.max(.1,Math.round(((d.t===undefined?1:d.t)+Math.max(dx,dy)/12)*20)/20);
      else o.r=Math.max(.5,q(d.r+Math.max(dx,dy)));
    }
    rendrePlancheSeule();
  });
  /* Un simple clic ne redessine rien : refaire la feuille remplacerait la planche
     et le clavier lui échapperait aussitôt — les flèches ne serviraient qu'une
     fois sur deux, sans qu'on comprenne pourquoi. Seul un glissé qui a bougé
     quelque chose vaut un tour complet, et la planche y reprend le focus. */
  const fin=()=>{
    if(!glisse)return;
    const bouge=glisse.bouge;
    glisse=null;
    if(bouge)majApresGeste();
  };
  toile.addEventListener('pointerup',fin);
  toile.addEventListener('pointercancel',fin);
  /* Les flèches, pour poser une forme au quart d'unité près sans viser à la
     souris. Maj passe à l'unité entière. On ne bouge que ce qui est choisi, et
     l'on rend la main au navigateur pour tout autre touche. */
  toile.addEventListener('keydown',ev=>{
    const ic=IC(),o=(ic&&ic.formes||[])[selForme];
    if(!o||ic.source)return;
    const pas=ev.shiftKey?1:.25;
    const d=({ArrowLeft:[-pas,0],ArrowRight:[pas,0],
              ArrowUp:[0,-pas],ArrowDown:[0,pas]})[ev.key];
    if(!d)return;
    ev.preventDefault();
    o.x=Math.round((o.x+d[0])*4)/4;
    o.y=Math.round((o.y+d[1])*4)/4;
    if(o.f==='trait'){
      o.x2=Math.round((o.x2+d[0])*4)/4;
      o.y2=Math.round((o.y2+d[1])*4)/4;
    }
    /* on garde le focus : on enchaîne les flèches sans re-cliquer */
    rendrePlancheSeule();
    majApresGeste();
  });
}
/* Un geste au clavier doit finir comme un glissé : la feuille remise à jour et
   le dessin rangé — sauver() pose la section du dépôt au passage. Mais pas la
   planche, qui a le focus : la refaire le perdrait, et l'on ne pourrait pas
   enchaîner deux flèches. */
let tGeste=null;
function majApresGeste(){
  clearTimeout(tGeste);
  tGeste=setTimeout(()=>{rendreFeuille();rendreListe();sauver();},180);
}
/* Pendant un glissé on ne redessine que la planche : refaire toute la feuille
   à chaque mouvement du doigt la rendrait poisseuse. */
function rendrePlancheSeule(){
  const toile=$('#toile');
  if(!toile)return;
  const ic=IC(),o=(ic.formes||[])[selForme];
  const svg=toile.querySelector('svg');
  const grille=svg.querySelector('.grille-fond').outerHTML;
  let cadre='';
  if(o){
    const b=boite(o);
    cadre=`<rect class="cadre" x="${n(b.x0)}" y="${n(b.y0)}" `+
      `width="${n(b.x1-b.x0)}" height="${n(b.y1-b.y0)}"/>`+
      `<circle class="poignee" data-poignee="1" cx="${n(b.x1)}" cy="${n(b.y1)}" r=".8"/>`;
  }
  svg.innerHTML=grille+corpsSvg(ic)+cadre;
}

/* ═══════════════ l'état du bas ═══════════════ */
function rendreEtat(){
  const durs=R.icones.reduce((s,x,i)=>s+controler(x,i).filter(y=>y.dur).length,0);
  const l=controler(IC(),sel);
  $('#etat').innerHTML=
    `<span>Vos icônes : <b>${R.icones.length}</b></span>`+
    `<span>Dessins du jeu : <b>${Object.keys(REF.glyphes||{}).length}</b></span>`+
    `<span${durs?' style="color:var(--minium)"':''}>À corriger : <b>${durs}</b></span>`+
    (l.length?`<span>${l[0].txt.replace(/<[^>]+>/g,'')}</span>`:'')+
    `<span style="margin-left:auto">Partagé avec les autres ateliers</span>`;
}
function tout(){rendreListe();rendreFeuille();rendreVolet();rendreEtat();sauver();}

/* ═══════════════ actions ═══════════════ */
function neuve(){
  return {cle:'',nom:'',nature:'trouvaille',
    formes:[Object.assign({},FORMES.disque.neuf())]};
}
function ajouter(ic){R.icones.push(ic||neuve());sel=R.icones.length-1;selForme=0;tout();}

document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='filtre'){filtre=t.value;rendreListe();return;}
  /* les curseurs de réglage agissent tout de suite, sans refaire la feuille */
  if(t.dataset.reg!==undefined){
    const o=(IC().formes||[])[selForme];
    if(!o)return;
    o[t.dataset.reg]=Number(t.value);
    const v=t.parentNode.querySelector('.mot');
    if(v)v.textContent=dec(Number(t.value));
    rendrePlancheSeule();sauver();rendreListe();
  }
});
/* Renommer une icône dont d'autres se servent. Sans cela, rebaptiser « roue »
   laissait quatre renvois pointant vers un nom qui n'existe plus, et la carriole
   se vidait sans un mot. On note la clé en entrant dans le champ, et chaque
   frappe fait suivre les renvois. */
let cleAvant=null;
document.addEventListener('focusin',ev=>{
  const d=ev.target&&ev.target.dataset;
  if(d&&d.ch==='cle')cleAvant=(IC()||{}).cle||'';
});
function suivreRenommage(avant,apres){
  if(!avant||avant===apres)return 0;
  let n=0;
  R.icones.forEach(x=>(x.formes||[]).forEach(o=>{
    if(o.f==='icone'&&o.ref===avant){o.ref=apres||'';n++;}
  }));
  return n;
}
ecouterSaisie((t,ch)=>{
  if(ch==='cle'){
    const apres=(IC()||{}).cle||'';
    suivreRenommage(cleAvant,apres);
    cleAvant=apres;
  }
  tout();
});
ecouterTeintes(()=>tout());
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act],[data-sel]');
  if(!b)return;
  if(b.dataset.sel!==undefined){sel=Number(b.dataset.sel);selForme=0;tout();return;}
  const a=b.dataset.act, ic=IC();
  const i=b.dataset.i!==undefined?Number(b.dataset.i):-1;
  if(a==='cle-auto'){
    const avant=(IC()||{}).cle||'';
    ecrire('cle',slug(lire('nom')));
    suivreRenommage(avant,(IC()||{}).cle||'');
    cleAvant=(IC()||{}).cle||'';
    tout();}
  else if(a==='ajouter'){
    ic.formes=ic.formes||[];
    ic.formes.push(FORMES[b.dataset.f].neuf());
    selForme=ic.formes.length-1;tout();}
  else if(a==='choisir'){selForme=i;tout();}
  else if(a==='oter-forme'){ic.formes.splice(i,1);
    selForme=Math.min(selForme,ic.formes.length-1);tout();}
  else if(a==='copier-forme'){ic.formes.splice(i+1,0,JSON.parse(JSON.stringify(ic.formes[i])));
    selForme=i+1;tout();}
  else if(a==='monter'){bouger(ic.formes,i,-1);selForme=i-1;tout();}
  else if(a==='descendre'){bouger(ic.formes,i,1);selForme=i+1;tout();}
  else if(a==='centrer'){const o=ic.formes[selForme];
    if(o){if(o.f==='rectangle'){o.x=12-o.l/2;o.y=12-o.h/2;}
      else if(o.f==='trait'){const dx=o.x2-o.x,dy=o.y2-o.y;
        o.x=12-dx/2;o.y=12-dy/2;o.x2=12+dx/2;o.y2=12+dy/2;}
      else {o.x=12;o.y=12;}}
    tout();}
  else if(a==='miroir'){const o=ic.formes[selForme];
    if(o){o.x=24-o.x;if(o.f==='trait')o.x2=24-o.x2;
      if(o.f==='rectangle')o.x-=o.l;}
    tout();}
  /* Le miroir de haut en bas manquait, et c'est celui qui sert aux dessins
     symétriques par le travers — une voile, un pont, un toit. */
  else if(a==='miroir-v'){const o=ic.formes[selForme];
    if(o){o.y=24-o.y;if(o.f==='trait')o.y2=24-o.y2;
      if(o.f==='rectangle')o.y-=o.h;}
    tout();}
  else if(a==='planche-taille'){
    taillePlanche=Math.max(0,Math.min(TAILLES_PLANCHE.length-1,i));
    appliquerTaillePlanche();tout();}
  /* la bibliothèque */
  else if(a==='bibli-fermer'){vueBibli=false;tout();}
  else if(a==='bibli-fam'){familleBibli=b.dataset.f||'';rendreFeuille();}
  /* Versée, la pièce est choisie et l'on retourne à la planche : c'est là qu'on
     veut être, pour la retoucher. La barre du bas dit le nouveau compte. */
  else if(a==='bibli-verser'){
    const k=verser(b.dataset.cle);
    if(k){
      sel=R.icones.findIndex(x=>x.cle===k);
      selForme=0;vueBibli=false;tout();
    }}
  /* Une famille entière : on reste dans la bibliothèque, pour en verser d'autres. */
  else if(a==='bibli-famille-tout'){
    BIBLI.pieces.filter(x=>x.famille===b.dataset.f).forEach(x=>verser(x.cle));
    tout();}
  else if(a==='coller'){ecrire('source',corpsSvg(ic));tout();}
  else if(a==='source-oter'){ecrire('source',undefined);tout();}
});
$$('#onglets button').forEach(b=>b.addEventListener('click',()=>{
  onglet=b.dataset.onglet;
  $$('#onglets button').forEach(x=>x.classList.toggle('actif',x===b));
  rendreVolet();
}));

/* ── la barre ── */
$('#b-nouveau').onclick=()=>ajouter();
$('#b-dupliquer').onclick=()=>{
  if(!IC())return;
  const c=JSON.parse(JSON.stringify(IC()));
  c.cle=(c.cle||'icone')+'-bis';c.nom=(c.nom||'')+' (copie)';
  ajouter(c);
};
$('#b-supprimer').onclick=()=>{
  if(!IC())return;
  const cle=IC().cle;
  /* Qui s'en sert ailleurs : supprimer une roue viderait les carrioles sans
     rien dire, et l'on chercherait longtemps pourquoi. */
  const dependent=cle?R.icones.filter((x,i)=>i!==sel&&
    (x.formes||[]).some(o=>o.f==='icone'&&o.ref===cle)):[];
  const noms=dependent.map(x=>x.nom||x.cle).join(', ');
  if(!confirm('Supprimer « '+(IC().nom||'sans nom')+' » ?'+
    (dependent.length?`\n\n${dependent.length} icône`+
      `${dependent.length>1?'s s\'en servent':' s\'en sert'} : ${noms}. `+
      `Le dessin y disparaîtra.`:'')))return;
  R.icones.splice(sel,1);sel=Math.max(0,sel-1);selForme=0;tout();
};
$('#b-bibli').onclick=()=>{
  vueBibli=!vueBibli;
  if(vueBibli)familleBibli='';
  tout();
};
/* Reprendre un dessin du jeu : c'est la façon la plus rapide d'en faire un
   qui lui ressemble — on part de sa source et on la modifie. */
$('#b-partir').onclick=()=>{
  const cles=Object.keys(REF.glyphes||{});
  if(!cles.length)return;
  const q=prompt('Quel dessin reprendre ?\n\n'+cles.join(', '),cles[0]);
  if(!q||!REF.glyphes[q])return;
  ajouter({cle:q+'-a-moi',nom:q+' (repris)',nature:'trouvaille',
    source:REF.glyphes[q]});
};
let attente=null;
const ouvrirFichier=accueillirFichiers(d=>{
  const l=Array.isArray(d)?d:(d.icones||null);
  if(!l){alert('Ce fichier n\'est pas un jeu d\'icônes.');return;}
  if(R.icones.length&&!confirm('Remplacer les '+R.icones.length+' icônes en cours ?'))return;
  R={format:d.format||'caravane.icones.v1',icones:l};
  sel=0;selForme=0;tout();
});
$('#b-ouvrir').onclick=()=>ouvrirFichier();
$('#b-exporter').onclick=()=>
  telecharger('icones-a-moi.json',nettoyer(JSON.parse(JSON.stringify(publier()))));

addEventListener('keydown',e=>{
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName))return;
  if(e.key==='n'&&!e.ctrlKey&&!e.metaKey){e.preventDefault();ajouter();}
  if(e.key==='ArrowDown'&&sel<R.icones.length-1){e.preventDefault();sel++;selForme=0;tout();}
  if(e.key==='ArrowUp'&&sel>0){e.preventDefault();sel--;selForme=0;tout();}
});

relire();
tout();
ouvrirDemande(R.icones,i=>{sel=i;selForme=0;tout();
  if(matchMedia('(max-width:860px)').matches)setTimeout(()=>montrerVue('feuille'),80);});
suivreDepot(()=>{});
habillerMobile(['Les icônes','L\'icône','La planche']);
</script>
