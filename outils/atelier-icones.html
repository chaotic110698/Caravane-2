<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atelier d'icônes — Caravane</title>
<style>
:root{
  --fond:#1C1A17; --fond-clair:#26231F; --bord:#3A352E;
  --encre:#E8E1D4; --encre-pale:#9C9484;
  --or:#C9A227; --minium:#E0755C; --vert:#6E9B6A; --azur:#4A7BC8;
  --r:3px;
}
*{margin:0;padding:0;box-sizing:border-box;font:inherit;color:inherit;background:none;border:none}
html,body{height:100%}
body{
  font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--fond);color:var(--encre);
  display:flex;flex-direction:column;overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
button{cursor:pointer;user-select:none}
input,select,textarea{background:var(--fond);border:1px solid var(--bord);border-radius:var(--r);
  padding:5px 7px;color:var(--encre);width:100%;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:1px solid var(--or);border-color:var(--or)}
select{cursor:pointer}
option{background:var(--fond-clair)}
textarea{resize:vertical;line-height:1.45;font-family:ui-monospace,monospace;font-size:12px}
input[type=checkbox]{width:auto;accent-color:var(--or)}
input[type=range]{padding:0;accent-color:var(--or)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#3A352E;border-radius:5px}

#barre{flex:none;display:flex;align-items:center;gap:6px;padding:7px 10px;
  background:var(--fond-clair);border-bottom:1px solid var(--bord);flex-wrap:wrap}
#barre h1{font-size:15px;font-weight:600;letter-spacing:.02em;margin-right:6px;white-space:nowrap}
#barre h1 b{color:var(--or)}
.outil{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--bord);
  border-radius:var(--r);background:var(--fond);font-size:13px;white-space:nowrap;
  text-decoration:none}
.outil:hover{border-color:var(--encre-pale)}
.outil.fort{background:var(--or);color:#1C1A17;border-color:var(--or);font-weight:600}
.outil.danger{color:var(--minium);border-color:#5A2A20}
.outil.petit{padding:3px 8px;font-size:12px}
.sep{width:1px;align-self:stretch;background:var(--bord);margin:0 3px}
.pousse{margin-left:auto}

#scene{flex:1;min-height:0;display:flex}
#coffret{flex:none;width:230px;background:var(--fond-clair);border-right:1px solid var(--bord);
  display:flex;flex-direction:column;min-height:0}
#coffret>input{margin:8px;width:auto;flex:none}
#liste{flex:1;overflow-y:auto;padding:0 8px 8px}
.groupe{font-size:11px;font-variant:small-caps;letter-spacing:.09em;color:var(--or);
  padding:9px 4px 4px}
.entree{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 8px;
  border:1px solid transparent;border-radius:var(--r);margin-bottom:3px;font-size:13px}
.entree:hover{background:#2E2A22}
.entree.actif{background:#2E2A22;border-color:var(--or)}
.entree .jeton{width:24px;height:24px;flex:none}
.entree .jeton svg{width:100%;height:100%;display:block}
.entree .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entree small{display:block;font-size:10.5px;color:var(--encre-pale)}

#feuille{flex:1;min-width:0;overflow-y:auto;padding:14px 16px 60px;display:flex;
  flex-direction:column;gap:13px}
#cote{flex:none;width:320px;background:var(--fond-clair);border-left:1px solid var(--bord);
  display:flex;flex-direction:column;min-height:0}
#onglets{flex:none;display:flex;border-bottom:1px solid var(--bord)}
#onglets button{flex:1;padding:8px 4px;font-size:12px;border-bottom:2px solid transparent;
  color:var(--encre-pale)}
#onglets button.actif{color:var(--or);border-bottom-color:var(--or)}
#volet{flex:1;overflow-y:auto;padding:12px}

.bloc{border:1px solid var(--bord);border-radius:var(--r);background:var(--fond-clair)}
.bloc>h2{font-size:12px;font-variant:small-caps;letter-spacing:.09em;color:var(--or);
  padding:7px 10px;border-bottom:1px solid var(--bord);display:flex;align-items:center;gap:8px}
.bloc>h2 .pousse{margin-left:auto}
.bloc>h2 button{font-size:11px;padding:2px 7px;border:1px solid var(--bord);border-radius:var(--r);
  color:var(--encre-pale)}
.bloc>.corps{padding:10px;display:flex;flex-direction:column;gap:9px}
.champ{display:grid;grid-template-columns:120px 1fr;gap:8px;align-items:center}
.champ>label{font-size:12.5px;color:var(--encre-pale);line-height:1.3}
.champ.large{grid-template-columns:1fr}
.aide{font-size:11.5px;color:var(--encre-pale);line-height:1.45;margin-top:3px}
.aide b{color:var(--encre)}
.rangee{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rangee>*{flex:1;min-width:0}
.rangee>.fixe{flex:none}
.mot{font-size:12px;color:var(--encre-pale);flex:none}
.vide{font-size:12.5px;color:var(--encre-pale);font-style:italic}

/* ── la planche à dessin ──
   Sa largeur est réglable : --planche porte la taille choisie, et le panneau de
   droite s'élargit avec elle. Sur un écran étroit, 84vw reprend la main pour que
   la planche ne sorte jamais de la page. */
#planche{display:flex;justify-content:center;padding:8px}
#toile{width:min(var(--planche,340px),84vw);aspect-ratio:1;background:
  repeating-conic-gradient(#211E1A 0% 25%,#1A1815 0% 50%) 50%/16px 16px;
  border:1px solid var(--bord);border-radius:var(--r);touch-action:none;
  position:relative}
#toile:focus-visible{outline:2px solid var(--or);outline-offset:2px}
#toile svg{width:100%;height:100%;display:block}
.grille-fond line{stroke:#ffffff12;stroke-width:.06}
.grille-fond line.fort{stroke:#ffffff20;stroke-width:.1}
.forme{cursor:move}
.forme.choisi{outline:none}
.cadre{fill:none;stroke:var(--or);stroke-width:.22;stroke-dasharray:.5 .35}
.poignee{fill:var(--or);stroke:#1C1A17;stroke-width:.12;cursor:nwse-resize}

.formes{display:flex;flex-wrap:wrap;gap:5px}
.formes button{flex:1;min-width:74px;padding:8px 6px;border:1px solid var(--bord);
  border-radius:var(--r);font-size:12.5px;background:var(--fond)}
.formes button:hover{border-color:var(--or);color:var(--or)}
.pile{display:flex;flex-direction:column;gap:6px}
.couche{display:flex;align-items:center;gap:7px;padding:6px 8px;border:1px solid var(--bord);
  border-radius:var(--r);background:var(--fond);font-size:12.5px}
.couche.choisi{border-color:var(--or);background:#2E2A22}
.couche .nom{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  cursor:pointer}
.couche button{font-size:11px;padding:2px 6px;border:1px solid var(--bord);
  border-radius:var(--r);color:var(--encre-pale)}
.couche button:hover{color:var(--encre);border-color:var(--encre-pale)}

.tailles{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.tailles figure{text-align:center}
.tailles figure div{background:var(--fond-clair);border:1px solid var(--bord);
  border-radius:var(--r);padding:5px}
.tailles svg{display:block}
.tailles figcaption{font-size:10.5px;color:var(--encre-pale);margin-top:4px}

.avert{font-size:12.5px;padding:7px 9px;border-left:2px solid var(--minium);background:#2A211E;
  margin-bottom:6px;border-radius:0 var(--r) var(--r) 0;line-height:1.45}
.avert.doux{border-color:var(--or);background:#2A2620}
.avert.bien{border-color:var(--vert);background:#212A20}
.avert b{color:var(--encre)}
h4.section{font-size:11.5px;font-variant:small-caps;letter-spacing:.09em;color:var(--or);
  margin:12px 0 6px}
h4.section:first-child{margin-top:0}
.mesures{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:12.5px}
.mesures b{text-align:right}

#etat{flex:none;display:flex;gap:14px;padding:5px 11px;background:var(--fond-clair);
  border-top:1px solid var(--bord);font-size:12px;color:var(--encre-pale);flex-wrap:wrap}
#etat b{color:var(--encre);font-weight:600}
#toile-depot{position:fixed;inset:0;background:#1C1A17E0;display:none;align-items:center;
  justify-content:center;font-size:17px;color:var(--or);z-index:9;pointer-events:none}
#toile-depot.on{display:flex}
@media (max-width:1100px){#cote{width:290px}#coffret{width:186px}}
</style>
</head>

<div id="barre">
  <h1>Atelier d'<b>icônes</b></h1>
  <button class="outil" id="b-nouveau">+ Icône</button>

  <span class="pousse"></span>
  <a class="outil" href="TUTORIEL-ICONES.md" target="_blank" rel="noopener">Mode d'emploi</a>

</div>

<div id="scene">
  <aside id="coffret">

    <div id="onglets">

      <button data-onglet="source">La source</button>
    </div>
    <div id="volet"></div>
  </aside>
</div>

<div id="etat"></div>

<script id="reference" type="application/json">
{"vocabulaire":{"format":"caravane.vocabulaire.v1","apropos":"Le catalogue de tout ce qu'un événement peut dire. Le générateur en tire ses formulaires, la documentation en tire son tutoriel, et les vérifications en tirent leurs règles. Ajouter une entrée ici suffit à la faire apparaître partout.","formes":{"direct":{"nom":"Issue certaine","explique":"Le choix a une seule fin, connue d'avance. On paie, on attend, on repart : pas de dé, pas de surprise.","quand":"La plupart des choix prudents, et tous les choix qui ne font que raconter.","champs":["effets","texte"]},"jet":{"nom":"Jet de dé","explique":"On lance un dé à cent faces, auquel s'ajoutent l'aptitude choisie, le karma et l'état du convoi. Selon le total, l'issue change. Tout se compte en centièmes : un seuil de 75 demande un total de 75.","quand":"Dès que le résultat doit dépendre de la chance et de la valeur de la troupe.","champs":["jet","reussi","rate"],"variante":{"nom":"Jet gradué","explique":"Au lieu de deux issues, on découpe le résultat en paliers : un coup de maître, un résultat honnête, un échec, un désastre. Le premier palier dont les bornes conviennent l'emporte, et le dernier sans bornes ramasse le reste.","champs":["jet.paliers"]}},"pari":{"nom":"Pari","explique":"On mise une somme. Si l'on gagne, on la double ; si l'on perd, elle disparaît. La difficulté se calcule toute seule à partir de la chance annoncée.","quand":"Les jeux de hasard, les défis, les paris de taverne.","champs":["pari","gagne","perd"]},"selon":{"nom":"Selon l'état du convoi","explique":"L'issue ne dépend pas du sort mais de ce que vous avez : assez d'or, assez de place, un chien, un garde. Deux fins, l'une pour oui, l'autre pour non.","quand":"Quand vouloir ne suffit pas — payer un droit qu'on n'a peut-être pas les moyens de payer.","champs":["selon","oui","non"]},"enigme":{"nom":"Énigme","explique":"Le récit pose la question, les choix sont les réponses — quatre par défaut, une seule marquée « bonne ». La bonne laisse le chemin tel quel ; une mauvaise l'allonge. On ne repose pas l'énigme tout de suite : cinq jours du calendrier par défaut, et résolue, elle ne revient plus.","quand":"Un carrefour sans panneau, un gardien qui ne laisse passer qu'à qui répond, un vieux qui s'amuse.","champs":["enigme","choix.bon"],"variante":{"nom":"En toutes lettres","explique":"Au lieu de boutons, un champ où le joueur écrit sa réponse. Le jeu normalise avant de comparer : minuscules, sans accents, sans ponctuation, sans article de tête — « L'Écho ! » vaut « echo ». Vous écrivez la liste des réponses acceptées ; l'énigme reste aussi dure, seule la faute de frappe cesse d'être une punition.","champs":["enigme.libre","enigme.juste","enigme.faux"]}}},"effets":{"or":{"nom":"Gagner ou perdre de l'or","explique":"Ajoute ou retire des pièces à la bourse. Un montant négatif retire ; la bourse ne descend jamais sous zéro.","parametres":{"de":{"nom":"Combien","type":"valeur","requis":true,"aide":"Négatif pour une perte. « -40 » retire 40 pièces ; « {selon: or, fois: -0.15} » en retire 15 %."}},"nomme":{"explique":"Le montant réellement bougé — utile quand la bourse était trop maigre.","exemple":"240"}},"reputation":{"nom":"Faire monter ou tomber la réputation","explique":"Ce que le monde marchand pense de vous. Elle ouvre des portes, fait baisser les prix, et permet de parlementer avec des gens peu recommandables. Elle reste entre 0 et 100.","parametres":{"de":{"nom":"Combien","type":"nombre","requis":true,"aide":"Négatif pour une perte. Comptez 2 à 6 pour un geste ordinaire, 9 ou plus pour une infamie."}}},"karma":{"nom":"Faire monter ou tomber le karma","explique":"La chance du convoi. Un karma haut ajoute un bonus à tous les jets de dé ; un karma bas les plombe. C'est la récompense discrète des bonnes actions. Entre 0 et 100.","parametres":{"de":{"nom":"Combien","type":"nombre","requis":true,"aide":"Négatif pour une perte. 3 à 5 pour un bon geste, 7 pour une mesquinerie."}}},"allonger":{"nom":"Rallonger le voyage","explique":"Ajoute des étapes au trajet en cours. Chaque étape coûte la solde des gardes, use les chariots et peut amener un autre événement. Quatre étapes au maximum par voyage, quoi qu'on empile.","parametres":{"de":{"nom":"Étapes en plus","type":"nombre","requis":true,"defaut":1,"aide":"1 pour une halte, 2 pour un détour sérieux."}},"nomme":{"explique":"Les étapes réellement ajoutées, une fois le plafond appliqué.","exemple":"2"}},"abimer":{"nom":"Abîmer les chariots","explique":"Use les essieux, les caisses et les bêtes. Un chariot pris pour cible souffre plus que les autres. Un essieu ou un cheval à zéro immobilise le chariot.","parametres":{"combien":{"nom":"Usure infligée","type":"valeur","requis":true,"aide":"3 pour une secousse, 8 à 15 pour un mauvais passage, 20 pour un accident."}}},"delester":{"nom":"Larguer de la cargaison","explique":"On jette une part du chargement — pour fuir plus vite, ou parce qu'on vous la prend. Les chariots les plus chargés perdent le plus.","parametres":{"part":{"nom":"Quelle fraction","type":"fraction","requis":true,"defaut":0.2,"aide":"0,25 largue un quart de la soute. Au-delà de 0,5 c'est une catastrophe."},"seulement":{"nom":"Seulement","type":"choix","valeurs":["tout","fragile","perissable"],"defaut":"tout","aide":"« fragile » ne casse que le verre et les enluminures."}},"nomme":{"explique":"La liste de ce qui a été perdu, prête à citer dans le texte.","exemple":"34 kg de blé et 12 kg de sel"}},"briserFragile":{"nom":"Casser ce qui est fragile","explique":"Une secousse, une tempête, un versement : seul ce qui se brise se brise. Le reste de la cargaison ne bouge pas.","parametres":{"part":{"nom":"Quelle fraction du fragile","type":"fraction","requis":true,"defaut":0.3}},"nomme":{"explique":"La liste de la casse.","exemple":"18 kg de verrerie"}},"reposer":{"nom":"Soigner la troupe","explique":"Rend de la santé au marchand et à ses gardes. Une bonne nuit, une source claire, des herbes trouvées au bord du chemin.","parametres":{"part":{"nom":"Quelle fraction rendue","type":"fraction","requis":true,"defaut":0.15,"aide":"0,07 pour une gorgée d'eau, 0,25 pour une vraie nuit."}}},"blesserTroupe":{"nom":"Blesser la troupe","explique":"Répartit des dégâts sur un ou plusieurs hommes. Les gardes encaissent plus souvent que le marchand. Un homme à zéro meurt ; si c'est le marchand, la partie s'arrête.","parametres":{"total":{"nom":"Dégâts à répartir","type":"valeur","requis":true,"aide":"14 à 30 pour une échauffourée, 40 et plus pour une vraie bataille."},"cibles":{"nom":"Combien d'hommes touchés","type":"nombre","defaut":1}},"nomme":{"explique":"Qui a souffert.","exemple":"{blesses.noms} donne « Corvin et Naya », {blesses.morts} donne les morts"}},"combat":{"nom":"Livrer bataille","explique":"La troupe se bat. L'issue dépend de la force des hommes, de leurs armes et de la menace du moment. On gagne du butin, ou on perd de la cargaison et des hommes.","parametres":{"bonus":{"nom":"Avantage","type":"nombre","defaut":1,"aide":"1 pour un combat franc, 0,85 si l'on est pris au dépourvu, 1,3 si l'on tend l'embuscade."}},"nomme":{"explique":"Le récit de la mêlée, déjà écrit. Citez-le tel quel.","exemple":"{melee} donne toute la phrase, {melee.butin} le seul montant"}},"charger":{"nom":"Charger de la marchandise","explique":"Met des kilos dans les chariots. S'il n'y a pas la place, on charge ce qu'on peut. Avec un prix au kilo, la marchandise s'achète ; sans prix, elle est offerte.","parametres":{"bien":{"nom":"Quelle marchandise","type":"bien","requis":true,"aide":"Une marchandise précise, ou « au hasard »."},"kg":{"nom":"Combien de kilos","type":"valeur","requis":true},"prixAuKilo":{"nom":"Prix au kilo","type":"valeur","aide":"Laissez vide pour un cadeau. « {selon: base, fois: 0.55} » pour une bonne affaire."}},"nomme":{"explique":"Ce qui a été chargé.","exemple":"{charge.kg} kg de {charge.bien}"}},"decharger":{"nom":"Céder de la marchandise","explique":"Retire des kilos de la soute. Avec un prix au kilo, elle se vend ; sans prix, elle est perdue ou donnée.","parametres":{"bien":{"nom":"Quelle marchandise","type":"bien","requis":true},"kg":{"nom":"Combien de kilos","type":"valeur","requis":true},"prixAuKilo":{"nom":"Prix au kilo","type":"valeur"}},"nomme":{"explique":"Ce qui est parti et ce que ça a rapporté.","exemple":"{cede.kg} kg pour {cede.gain} po"}},"armeTrouvee":{"nom":"Trouver une arme","explique":"Une arme ordinaire, tirée au hasard parmi les légères. Jamais une arme de légende — celles-là n'existent qu'en un exemplaire et ne se ramassent pas dans un fossé.","parametres":{},"nomme":{"explique":"Le nom de l'arme trouvée.","exemple":"une hache légère"}},"donnerArme":{"nom":"Donner une arme précise","explique":"Range une arme nommée dans la réserve. C'est par là que passent les armes de légende, quand le récit le justifie.","parametres":{"arme":{"nom":"Laquelle","type":"arme","requis":true}},"nomme":{"explique":"Le nom de l'arme.","exemple":"Excalibur"}},"chien":{"nom":"Adopter un chien","explique":"Un errant se laisse apprivoiser. Il flaire les mauvaises rencontres avant les hommes et se bat un peu aux côtés du marchand. Sans effet si le convoi en a déjà un.","parametres":{},"nomme":{"explique":"Le nom du chien.","exemple":"Ronce"}},"recruter":{"nom":"Recruter un garde","explique":"Un homme rejoint l'escorte, avec son métier et son arme. Il touchera une solde à chaque étape.","parametres":{"metier":{"nom":"Quel métier","type":"metier","defaut":"auHasard"},"arme":{"nom":"Avec quelle arme","type":"arme","aide":"Laissez vide pour une arme de son métier, tirée au hasard."}},"nomme":{"explique":"Le nom de la recrue.","exemple":"Maren"}},"rumeur":{"nom":"Lancer une rumeur de prix","explique":"On vous glisse qu'une marchandise vaut cher là où vous allez. Le prix y sera réellement plus haut à l'arrivée.","parametres":{"bien":{"nom":"Quelle marchandise","type":"bien","defaut":"auHasard"},"mult":{"nom":"Multiplicateur de prix","type":"nombre","defaut":1.45,"aide":"1,45 pour une rumeur vague, 1,9 pour un tuyau payé."}},"nomme":{"explique":"Le nom de la marchandise concernée.","exemple":"les épices"}},"escorte":{"nom":"Faire escorter le convoi","explique":"Des compagnons de route protègent la caravane pendant quelques étapes. Les mauvaises rencontres se font plus rares.","parametres":{"de":{"nom":"Combien d'étapes","type":"nombre","requis":true,"defaut":2}}},"laissezPasser":{"nom":"Délivrer un laissez-passer","explique":"Remet au marchand un papier qui ouvre les frontières le réclamant. Il s'inscrit au carnet, avec le jour et le lieu où il a été délivré, et ne se perd pas. Sans lieu précisé, il vaut partout ; avec un lieu, il n'ouvre que celui-là.","parametres":{"cle":{"nom":"Clé du laissez-passer","type":"texte","requis":true,"aide":"Le même mot que la frontière réclame, dans l'atelier de carte. Sans accents ni espaces."},"nom":{"nom":"Comment on l'appelle","type":"texte","aide":"Ce que le carnet affiche — « sauf-conduit du bailli »."},"lieu":{"nom":"Pour quel lieu","type":"lieu","aide":"Laissé vide, il ouvre partout où sa clé est réclamée."},"de":{"nom":"Qui l'a délivré","type":"texte","aide":"Pour le carnet, et pour s'en souvenir."},"vaut":{"nom":"Le retirer","type":"booleen","defaut":true,"aide":"Mettre « non » reprend le papier au lieu de le donner."}},"nomme":{"explique":"Retient le nom du laissez-passer, pour le citer dans le texte.","exemple":"On vous glisse {papier} dans la main sans un mot."}},"savoir":{"nom":"Dire un morceau de savoir","explique":"Quelqu'un vous livre un bout de ce qu'il sait — un chiffre du cap qui mène quelque part, ou le prix qu'on pratique ailleurs. Le bout se calcule à l'instant où la phrase se dit, depuis la carte réelle : déplacer un lieu change ce qu'on en dit sans qu'on y touche, et aucun nombre n'est à recopier. Le jeu ne retient rien, ne recoupe rien, ne dit jamais si c'est vrai — c'est au joueur de le noter dans ses pages. À ne pas confondre avec « Lancer une rumeur de prix », qui, elle, fait vraiment monter le prix : celle-ci ne fait que parler.","parametres":{"quoi":{"nom":"De quoi on parle","type":"choix","defaut":"cap","options":["cap","prix"],"aide":"« cap » donne un morceau du cap qui mène à un lieu caché ; « prix » donne le prix approximatif d'une marchandise dans une cité."},"lieu":{"nom":"Quel lieu","type":"lieu","requis":true,"aide":"Le lieu caché dont on donne le cap, ou la cité dont on donne le prix."},"depuis":{"nom":"Depuis quelle cité","type":"lieu","aide":"Le point de départ du cap. Laissé vide, c'est la cité où la conversation se tient."},"part":{"nom":"Quel morceau du cap","type":"choix","defaut":"debut","options":["debut","milieu","fin"],"aide":"Un cap se lit sur trois chiffres — 045, 130, 287. « début » donne le premier, « milieu » le deuxième, « fin » les deux derniers. Il faut donc au moins deux bouches, et l'on peut en mettre trois."},"bien":{"nom":"Quelle marchandise","type":"bien","aide":"Seulement pour un prix."},"faux":{"nom":"C'est un mensonge","type":"booleen","defaut":false,"aide":"Le morceau donné sera faux — de la même longueur, à la même place, et impossible à distinguer d'un vrai. Le joueur ne l'apprendra qu'en suivant le cap."}},"nomme":{"explique":"Retient le morceau dit, pour le glisser dans la phrase.","exemple":"Je crois bien que ça commence par {bout}. Ou alors je confonds."}}},"interrogations":{"or":{"nom":"L'or en bourse","unite":"pièces"},"etapes":{"nom":"Les étapes parcourues","unite":"étapes","explique":"Sert à mesurer l'avancement de la partie : tout devient plus cher et plus dangereux avec le temps."},"lieues":{"nom":"Les lieues au compteur","unite":"lieues"},"reputation":{"nom":"La réputation","unite":"0 à 100"},"karma":{"nom":"Le karma","unite":"0 à 100"},"gardes":{"nom":"Le nombre de gardes","unite":"hommes"},"troupe":{"nom":"Le marchand et ses gardes","unite":"hommes"},"place":{"nom":"La place libre dans les chariots","unite":"kg"},"charge":{"nom":"Les kilos chargés","unite":"kg"},"stock":{"nom":"Les kilos d'une marchandise","unite":"kg","demande":"bien"},"valeurSoute":{"nom":"La valeur marchande de la cargaison","unite":"pièces"},"etatConvoi":{"nom":"La santé du convoi","unite":"0 à 100","explique":"La moyenne des chariots et des hommes."},"chien":{"nom":"Un chien suit le convoi","unite":"oui ou non"},"vigilance":{"nom":"La vigilance de la troupe","unite":"0 à 100","explique":"Ce qui permet de voir venir une embuscade."},"agilite":{"nom":"L'agilité de la troupe","unite":"0 à 100","explique":"Ce qui permet de décrocher et de fuir."},"negoce":{"nom":"Le talent de négoce","unite":"0 à 100","explique":"Le meilleur de la caravane l'emporte."},"puissance":{"nom":"La force du marchand","unite":"0 à 3"},"armeFamille":{"nom":"Quelqu'un porte une arme de cette famille","unite":"oui ou non","demande":"famille"},"mise":{"nom":"La mise de jeu courante","unite":"pièces","explique":"Ce qu'on parie à ce stade de la partie. Croît avec les étapes."},"coutGarde":{"nom":"Le prix d'un garde","unite":"pièces"},"tribut":{"nom":"Ce qu'exigerait un pillard","unite":"pièces","explique":"Calculé sur l'or et la valeur de la cargaison."},"soin":{"nom":"Le coût des soins","unite":"pièces"}},"typesDeChamp":{"nombre":{"explique":"Un nombre simple."},"fraction":{"explique":"Une part, entre 0 et 1. 0,25 vaut un quart."},"valeur":{"explique":"Un nombre, une fourchette, une formule ou une référence — voir la documentation des valeurs."},"choix":{"explique":"Une valeur parmi une liste fermée."},"bien":{"explique":"Une marchandise de biens.json, ou « au hasard »."},"arme":{"explique":"Une arme de armes.json."},"metier":{"explique":"Un métier de garde, ou « au hasard »."},"texte":{"explique":"Du texte, qui accepte les trous entre accolades."},"booleen":{"explique":"Oui ou non."},"lieu":{"explique":"La clé d'un lieu du monde, telle que l'atelier de carte la donne. Laissé vide, l'effet vaut partout."},"liste":{"explique":"Plusieurs textes, un par ligne."}},"moments":{"route":{"nom":"En chemin","explique":"Pendant un trajet, entre deux lieux."},"arrivee":{"nom":"À l'arrivée","explique":"En entrant dans un lieu, avant le marché."},"sejour":{"nom":"Pendant le séjour","explique":"Pendant qu'on est en ville, entre deux actions."}}},"vocabulairePersonnages":{"format":"caravane.vocabulaire-personnages.v1","apropos":"Le catalogue de ce qu'un personnage peut être et de ce qui fait mériter son lore. L'atelier de personnages en tire ses formulaires, comme l'atelier d'événements tire les siens de vocabulaire-evenements.json. Les deux se complètent : les conditions d'une couche peuvent aussi bien interroger la relation (ci-dessous) que l'état du convoi (l'autre catalogue).","roles":{"echevin":{"nom":"Échevin","explique":"Il tient un registre, une charge, un sceau. Il donne des autorisations et des ennuis.","feminin":"Échevine"},"marchand":{"nom":"Marchand","explique":"Il achète, il vend, il sait qui a besoin de quoi. Le commanditaire le plus naturel.","feminin":"Marchande"},"forgeron":{"nom":"Forgeron","explique":"Il fait et répare les armes et les essieux. Il connaît le métal, donc les mines.","feminin":"Forgeronne"},"aubergiste":{"nom":"Aubergiste","explique":"Tout passe par sa salle. C'est par lui qu'on apprend les choses avant les autres."},"capitaine":{"nom":"Capitaine de garde","explique":"Il tient la porte et les hommes. Il décide qui entre et qui attend."},"clerc":{"nom":"Clerc","explique":"Il écrit, il archive, il se souvient. Le lore ancien passe par lui."},"contrebandier":{"nom":"Contrebandier","explique":"Il connaît les chemins que personne ne relève, et le prix du silence.","feminin":"Contrebandière"},"guide":{"nom":"Guide","explique":"Il a fait la route cent fois. Il sait où l'eau est bonne et où l'on ne campe pas."},"ermite":{"nom":"Ermite","explique":"Il vit à l'écart et sait ce que la ville a oublié. Rarement bavard d'emblée."},"artisan":{"nom":"Artisan","explique":"Verrier, tisserand, enlumineur : celui qui fait ce que la caravane transporte.","feminin":"Artisane"},"prieur":{"nom":"Prieur","explique":"Il tient un temple, une règle, une mémoire. Le lore religieux est chez lui.","feminin":"Prieure"},"noble":{"nom":"Noble","explique":"Il a des terres, une dette d'honneur et le bras long. On ne lui refuse pas facilement."},"mineur":{"nom":"Mineur","explique":"Il descend. Il sait ce qu'il y a en dessous, et ce qu'on n'en remonte pas.","feminin":"Mineuse"},"batelier":{"nom":"Batelier","explique":"Il tient un bac, une barque, un quai. Indispensable aux ports.","feminin":"Batelière"},"veneur":{"nom":"Veneur","explique":"Il chasse et suit les traces. Il voit passer ce que les routes ne montrent pas.","feminin":"Veneuse"}},"accords":{"f":{"nom":"Féminin","explique":"Les textes s'accordent au féminin : « elle est arrivée »."},"m":{"nom":"Masculin","explique":"Les textes s'accordent au masculin : « il est arrivé »."}},"interrogations":{"rencontres":{"nom":"Combien de fois on l'a croisé","unite":"rencontres","explique":"Monte d'un à chaque fois qu'on lui parle. La façon la plus simple de faire mériter une couche : on ne se confie pas à un inconnu."},"missionsPour":{"nom":"Missions accomplies pour lui","unite":"missions","explique":"Ce qu'on a fait pour lui, et non ce qu'on lui a dit. Le lore le plus profond devrait coûter ça."},"couchesConnues":{"nom":"Couches déjà découvertes","unite":"couches","explique":"Pour enchaîner : la troisième révélation n'a de sens qu'après les deux premières."}},"trous":{"nom":{"explique":"Son nom seul.","exemple":"Orlanne"},"titre":{"explique":"Son titre, s'il en a un.","exemple":"Dame"},"appellation":{"explique":"Titre et nom ensemble, avec l'élision qui convient.","exemple":"Dame Orlanne"},"role":{"explique":"Ce qu'il fait, en toutes lettres.","exemple":"échevine"},"lieu":{"explique":"Le lieu où on le trouve.","exemple":"Aurelium"},"contree":{"explique":"La contrée de ce lieu.","exemple":"les Terres humaines"},"il":{"explique":"Le pronom accordé.","exemple":"elle"},"le":{"explique":"L'article défini accordé.","exemple":"la"},"e":{"explique":"La marque d'accord à coller à un participe.","exemple":"arrivé{e} donne « arrivée »"}}},"vocabulaireObjets":{"format":"caravane.vocabulaire-objets.v1","apropos":"Le catalogue de la cinquième famille : l'objet unique, celui qui n'existe qu'en un exemplaire, qui porte du lore et qui se mérite. Les marchandises, les armes ordinaires, les chariots et les pièces gardent leurs propres fichiers — ce sont des choses qu'on achète, pas des choses qu'on trouve. Comme les autres catalogues, celui-ci est ouvert : décrivez un genre, un pouvoir ou une provenance qui manque, il est ajouté.","genres":{"relique":{"nom":"Relique","explique":"Un objet qu'on ne se procure pas : un fragment, une enseigne, un ossement monté sur socle. Sa valeur est ce qu'on raconte de lui."},"arme":{"nom":"Arme de légende","explique":"Elle se porte et elle frappe. C'est la seule famille qui touche au combat — les trois armes mythiques du jeu sont déjà de celles-là."},"document":{"nom":"Document","explique":"Un registre, une lettre, une carte, un sauf-conduit. Le meilleur porteur de lore : il dit quelque chose sur quelqu'un ou sur un lieu."},"bijou":{"nom":"Bijou","explique":"Léger, cher, et facile à faire changer de mains. Bon support pour ce qui se vole et se revend."},"outil":{"nom":"Outil","explique":"Une lunette, un astrolabe, un jeu de clés. Il fait quelque chose de concret pour la caravane."},"insigne":{"nom":"Insigne","explique":"Un sceau, un anneau, une plaque. Il ne vaut rien et il ouvre des portes : c'est ce qu'on montre."},"curiosite":{"nom":"Curiosité","explique":"Une chose dont personne ne sait plus l'usage. Elle n'a d'autre pouvoir que d'intriguer — et c'est parfois assez."}},"pouvoirs":{"aptitude":{"nom":"Améliorer une aptitude","explique":"Tant qu'on l'a dans les chariots, la troupe est meilleure à quelque chose. Le bonus s'ajoute à la moyenne de la troupe et se voit dans tous les jets qui s'en servent.","parametres":{"quoi":{"nom":"Quelle aptitude","type":"choix","requis":true,"valeurs":["vigilance","agilite","negoce","endurance"],"aide":"Vigilance pour voir venir, agilité pour décrocher, négoce pour les prix, endurance pour encaisser."},"de":{"nom":"De combien","type":"nombre","requis":true,"defaut":5,"aide":"3 est discret, 8 se sent, 15 change une partie. Les aptitudes vont de 0 à 100."}}},"chance":{"nom":"Porter chance","explique":"Un bonus permanent au karma, donc à tous les jets de dé. C'est le pouvoir le plus large et le plus difficile à équilibrer : n'allez pas loin.","parametres":{"de":{"nom":"De combien","type":"nombre","requis":true,"defaut":6,"aide":"Le karma va de 0 à 100 et donne +1 au dé tous les 17 points. 17 vaut donc un point de dé entier."}}},"arme":{"nom":"Être une arme","explique":"L'objet se porte et frappe. Il se range dans la réserve d'armes et s'équipe comme les autres — mais il n'existe qu'en un exemplaire, et il disparaît avec celui qui le portait.","parametres":{"famille":{"nom":"Quelle famille","type":"familleArme","requis":true},"frappe":{"nom":"Force de frappe","type":"nombre","requis":true,"defaut":0.9,"aide":"Les armes ordinaires vont de 0,26 à 0,95. Les trois armes mythiques du jeu sont à 0,82, 0,95 et 1,25."},"garde":{"nom":"Parade","type":"nombre","defaut":0.1,"aide":"Ce qui est encaissé au lieu d'être subi. 0 pour une hache, 0,22 pour une arme équilibrée."}}},"ouvreCouche":{"nom":"Révéler du lore","explique":"Le posséder ouvre une couche chez un personnage — le document qui dit ce qu'il n'aurait jamais raconté. C'est le pouvoir qui lie les objets aux gens.","parametres":{"personnage":{"nom":"Chez qui","type":"personnage","requis":true},"couche":{"nom":"Laquelle","type":"couche","requis":true,"aide":"Une couche de ce personnage. Chargez le répertoire de personnages pour les voir."}}},"laissezPasser":{"nom":"Ouvrir un passage","explique":"Le montrer suffit là où l'on serait refoulé : une frontière, un quartier fermé, une porte gardée.","parametres":{"lieu":{"nom":"Où","type":"lieu","requis":true,"aide":"Chargez un monde.json pour choisir. Laissez vide pour un passe-partout."}}},"prix":{"nom":"Peser sur les prix","explique":"On vous fait un meilleur prix, ou on vous en donne un meilleur. Le sceau d'une guilde, la recommandation d'un comptoir.","parametres":{"sens":{"nom":"Dans quel sens","type":"choix","requis":true,"valeurs":["achat","vente","les deux"],"defaut":"les deux"},"part":{"nom":"De combien","type":"fraction","requis":true,"defaut":0.08,"aide":"0,08 fait 8 % de mieux. Au-delà de 0,2 le commerce ne veut plus rien dire."}}},"reveler":{"nom":"Révéler un lieu","explique":"Tenir cet objet en soute ouvre une piste vers un lieu caché, sans qu'on ait à en donner le cap sur la boussole. S'il est marqué comme fragment, il ne révèle rien tout seul : il faut réunir tous les fragments du même lieu. C'est de quoi faire d'une carte déchirée en trois morceaux la clef d'un endroit, à disperser dans les missions, les dialogues et les fouilles.","parametres":{"lieu":{"nom":"Quel lieu","type":"lieu","requis":true,"aide":"Le lieu caché que l'objet révèle. Chargez un monde.json pour choisir."},"fragments":{"nom":"Combien de morceaux en tout","type":"nombre","defaut":1,"aide":"1 pour un objet qui révèle à lui seul. 3 pour une carte déchirée en trois : il faudra tenir les trois morceaux, chacun déclarant le même lieu et le même total."}}}},"provenances":{"mission":{"nom":"Au bout d'une mission","explique":"On l'obtient en accomplissant une mission écrite. C'est la façon la plus sûre de faire mériter un objet : il a fallu aller quelque part et le rapporter.","parametres":{"mission":{"nom":"Quelle mission","type":"mission","requis":true,"aide":"La clé de la mission. L'atelier de missions les proposera ; d'ici là, écrivez-la et notez-la."},"quand":{"nom":"À quel moment","type":"choix","valeurs":["à la fin","en cours de route"],"defaut":"à la fin"}}},"evenement":{"nom":"Dans un événement","explique":"On tombe dessus en chemin. Réservez-le aux objets qu'on peut trouver sans les chercher.","parametres":{"evenement":{"nom":"Quel événement","type":"texte","aide":"La clé de l'événement, si vous en avez déjà écrit un."}}},"personnage":{"nom":"Détenu par quelqu'un","explique":"Quelqu'un l'a et pourrait s'en séparer. Il faudra le convaincre, l'acheter, ou le lui prendre.","parametres":{"personnage":{"nom":"Qui","type":"personnage","requis":true}}},"lieu":{"nom":"Se trouve quelque part","explique":"Il est là, dans une échoppe ou dans des ruines. Avec un prix, il s'achète ; sans prix, il faut une raison d'y avoir accès.","parametres":{"lieu":{"nom":"Où","type":"lieu","requis":true},"prix":{"nom":"Prix demandé","type":"nombre","aide":"Laissez vide s'il ne se vend pas — il faudra alors une autre façon de l'obtenir."}}},"depart":{"nom":"Dans les bagages au départ","explique":"Le marchand l'a depuis toujours et ne sait peut-être pas ce que c'est. Excellent pour un objet dont le lore se découvre en cours de partie.","parametres":{}}},"interrogations":{"couchesConnues":{"nom":"Couches déjà découvertes","unite":"couches","explique":"Pour enchaîner les révélations sur l'objet lui-même."},"etapesPorte":{"nom":"Étapes depuis qu'on l'a","unite":"étapes","explique":"Le temps passé avec l'objet. Ce qu'on ne comprend qu'à force de l'avoir sous les yeux."},"montre":{"nom":"Fois qu'on l'a montré","unite":"fois","explique":"Combien de fois on l'a sorti devant quelqu'un. Les objets parlent quand on les fait parler."}},"trous":{"nom":{"explique":"Le nom de l'objet.","exemple":"Le registre des péages"},"il":{"explique":"Le pronom accordé.","exemple":"elle"},"le":{"explique":"L'article défini accordé.","exemple":"la"},"un":{"explique":"L'article indéfini accordé.","exemple":"une"},"e":{"explique":"La marque d'accord à coller à un participe.","exemple":"retrouvé{e}"},"ancien":{"explique":"Le nom de son ancien propriétaire, s'il en a un.","exemple":"Dame Orlanne"},"lieu":{"explique":"Le lieu d'où il vient.","exemple":"Aurelium"},"poids":{"explique":"Son poids en kilos.","exemple":"2"},"valeur":{"explique":"Ce qu'il vaut, s'il vaut quelque chose.","exemple":"6 200"}}},"vocabulaireMissions":{"format":"caravane.vocabulaire-missions.v1","apropos":"Le catalogue des missions écrites — celles qu'on compose à la main, une par une, par opposition aux offres que le moteur tire au sort à chaque marché. Une mission est une chaîne de jalons : reçue de quelqu'un, elle avance ailleurs et se conclut. Comme les autres catalogues, celui-ci est ouvert.","principe":"Le lien entre une mission et son commanditaire est stocké dans la mission, jamais dans le personnage. On écrit donc ses personnages tranquillement, sans leur attribuer quoi que ce soit, et on revient plus tard leur confier une mission sans jamais rouvrir personnages.json.","jalons":{"atteindre":{"nom":"Arriver quelque part","explique":"Le jalon tombe quand le convoi entre dans le lieu. C'est le jalon le plus simple, et souvent le premier : il faut bien aller là-bas.","parametres":{"lieu":{"nom":"Où","type":"lieu","requis":true}}},"livrer":{"nom":"Livrer de la marchandise","explique":"Il faut arriver quelque part avec les kilos demandés dans les chariots. La marchandise part au moment de la livraison — elle ne se revend pas au marché du coin.","parametres":{"bien":{"nom":"Quelle marchandise","type":"bien","requis":true},"kg":{"nom":"Combien de kilos","type":"nombre","requis":true,"defaut":20},"lieu":{"nom":"Où","type":"lieu","requis":true}}},"rencontrer":{"nom":"Parler à quelqu'un","explique":"Il faut trouver la personne là où elle se tient et lui parler. Le jalon compte une rencontre de plus à son compteur — celui qui fait mériter son lore.","parametres":{"personnage":{"nom":"Qui","type":"personnage","requis":true}}}},"recompenses":{"or":{"nom":"De l'or","explique":"La prime. Rien n'oblige une mission écrite à en donner, mais c'est ce que le joueur attend d'abord.","parametres":{"de":{"nom":"Combien","type":"nombre","requis":true,"defaut":300,"aide":"Les offres tirées au sort donnent 150 à 900 po selon l'avancement. Une mission écrite peut se permettre davantage : elle ne revient pas."}}},"reputation":{"nom":"De la réputation","explique":"Ce que le monde marchand pense de vous. Entre 0 et 100.","parametres":{"de":{"nom":"Combien","type":"nombre","requis":true,"defaut":8,"aide":"Négatif pour une perte. Les contrats ordinaires donnent 4 à 6."}}},"karma":{"nom":"Du karma","explique":"La chance du convoi, donc tous les jets de dé. La récompense discrète de ce qui n'était pas obligé.","parametres":{"de":{"nom":"Combien","type":"nombre","requis":true,"defaut":4}}},"objet":{"nom":"Un objet unique","explique":"L'objet passe dans les chariots. C'est la façon la plus sûre de faire mériter un objet — il a fallu aller quelque part et le rapporter. L'objet doit déclarer de son côté qu'il vient de cette mission.","parametres":{"objet":{"nom":"Lequel","type":"objet","requis":true,"aide":"Chargez votre objets.json pour choisir. L'atelier vérifie que l'objet pointe bien vers cette mission."}}},"ouvreCouche":{"nom":"Une couche de lore","explique":"Accomplir la mission ouvre une couche chez un personnage. C'est ce qui rend un service payant autrement qu'en pièces : on apprend quelque chose.","parametres":{"personnage":{"nom":"Chez qui","type":"personnage","requis":true},"couche":{"nom":"Laquelle","type":"couche","requis":true}}}},"trous":{"commanditaire":{"explique":"Le nom de celui qui donne la mission, titre compris.","exemple":"Dame Orlanne"},"il":{"explique":"Son pronom, accordé.","exemple":"elle"},"ici":{"explique":"Le lieu où la mission est proposée.","exemple":"Aurelium"},"la":{"explique":"Le lieu du dernier jalon — là où ça se termine.","exemple":"Bas-Ferrant"},"delai":{"explique":"Le nombre d'étapes accordé.","exemple":"14"},"prime":{"explique":"L'or promis, s'il y en a.","exemple":"400"},"objet":{"explique":"Le nom de l'objet promis, s'il y en a un.","exemple":"Le registre des péages"}}},"vocabulaireDialogues":{"format":"caravane.vocabulaire-dialogues.v1","apropos":"Le catalogue de ce qu'un dialogue peut dire, demander et faire. Un dialogue est une conversation écrite d'avance : le personnage parle, on lui répond, et selon la réponse la conversation continue ailleurs. Il réutilise en entier le vocabulaire des événements — les dix-huit effets, les interrogations, les quatre écritures d'un montant — et n'ajoute que ce qui n'a de sens qu'en conversation : la mémoire de ce qu'on s'est dit, et le fait de confier une mission.","principe":"Un dialogue appartient à un personnage et se joue quand on lui parle en ville. Il se compose de répliques nommées : chacune est ce que le personnage dit, suivi des réponses qu'on peut lui faire. Une réponse mène à une autre réplique, ou clôt la conversation. Rien n'est écrit en code : les conditions et les effets sont ceux du catalogue.","champs":{"cle":{"nom":"La clé","explique":"Le nom technique du dialogue, unique dans tout le fichier. Minuscules, chiffres et tirets.","requis":true,"exemple":"orlanne-le-registre"},"personnage":{"nom":"Qui parle","explique":"La clé du personnage à qui ce dialogue appartient. Il se joue quand on lui parle, là où il se tient.","requis":true,"exemple":"orlanne"},"titre":{"nom":"Le titre","explique":"Ce qu'on lit sur le bouton, dans l'onglet des gens. Une poignée de mots, du point de vue du joueur.","requis":true,"exemple":"Le registre raturé"},"si":{"nom":"Quand il se propose","explique":"Des conditions, toutes vraies pour que le dialogue apparaisse. Vide, il se propose toujours.","requis":false},"priorite":{"nom":"La priorité","explique":"Quand plusieurs dialogues d'un même personnage sont ouverts en même temps, le plus haut se propose en premier. Par défaut zéro.","requis":false,"defaut":0},"rejouable":{"nom":"On peut le rejouer","explique":"Par défaut un dialogue ne se joue qu'une fois : une conversation qu'on a eue, on l'a eue. Coché, il reste offert — c'est ce qu'il faut pour un marchand chez qui l'on repasse.","requis":false,"defaut":false},"entree":{"nom":"Par où l'on commence","explique":"Le nom de la première réplique. À défaut, la première de la liste.","requis":false,"defaut":"accueil"},"repliques":{"nom":"Les répliques","explique":"La conversation elle-même, une réplique par nom. Chacune porte ce que le personnage dit et les réponses qu'on peut lui faire.","requis":true}},"replique":{"dit":{"nom":"Ce qu'il dit","explique":"Le texte du personnage. Accepte les trous entre accolades. Pour plusieurs variantes dont le jeu tire une au hasard, écrivez un tableau de textes — dans l'atelier, une ligne vide entre chacune suffit.","requis":true,"exemple":["« Marchand. »","« Vous voilà. »"]},"oeil":{"nom":"La didascalie","explique":"Une ligne en petites capitales au-dessus du texte : où l'on est, ce qu'il fait pendant qu'il parle. Facultative.","requis":false,"exemple":"Sous l'auvent de la halle"},"effets":{"nom":"Ce qui arrive en y entrant","explique":"Des effets joués une fois, au moment où la réplique s'affiche. Sert à donner ce qu'on vient de promettre, plutôt que de l'accrocher à la réponse.","requis":false},"reponses":{"nom":"Ce qu'on peut répondre","explique":"Les boutons offerts au joueur, dans l'ordre. Une réplique sans réponse clôt la conversation.","requis":false}},"reponse":{"txt":{"nom":"La réponse","explique":"Ce que le joueur dit, écrit à la première personne. Court : c'est un bouton.","requis":true,"exemple":"Je veux bien m'en charger."},"si":{"nom":"Quand elle est possible","explique":"Des conditions. Non remplies, la réponse s'affiche grisée plutôt que de disparaître : voir qu'une porte existe et qu'elle est fermée vaut mieux que ne pas la voir.","requis":false},"sinon":{"nom":"Pourquoi elle est fermée","explique":"La raison montrée sous une réponse grisée. Sans elle, la réponse est simplement cachée.","requis":false,"exemple":"Il vous faudrait cinquante pièces."},"effets":{"nom":"Ce qu'elle fait","explique":"Les effets joués quand on la choisit, avant d'aller à la réplique suivante.","requis":false},"vers":{"nom":"La suite","explique":"Le nom de la réplique où l'on va. Absent, la conversation se termine.","requis":false},"fin":{"nom":"Elle clôt","explique":"Ferme la conversation explicitement, même si une suite est indiquée. Sert à en sortir d'un mot.","requis":false}},"interrogations":{"souvenir":{"nom":"Ce qu'on s'est dit","unite":"oui ou non","explique":"Un souvenir posé par un dialogue précédent. C'est ce qui fait qu'une conversation se rappelle la précédente.","demande":"nom"},"dialogueVu":{"nom":"Un dialogue déjà joué","unite":"fois","explique":"Combien de fois cette conversation a été menée jusqu'au bout. Zéro si jamais.","demande":"dialogue"},"rencontres":{"nom":"Les fois où on lui a parlé","unite":"fois","explique":"Le compteur de rencontres d'un personnage. Sans précision, celui à qui l'on parle.","demande":"personnage"},"missionEtat":{"nom":"Où en est une mission","unite":"offerte, cours, faite, ratee","explique":"L'état d'une mission écrite. « offerte » tant qu'elle n'a pas été acceptée, « aucune » si le fichier des missions ne la contient pas.","demande":"mission"},"objetPorte":{"nom":"Un objet unique en soute","unite":"oui ou non","explique":"Le convoi transporte-t-il cet objet unique en ce moment.","demande":"objet"},"coucheOuverte":{"nom":"Une couche de lore déliée","unite":"oui ou non","explique":"Cette couche du personnage a-t-elle déjà été méritée.","demande":"couche"}},"effets":{"souvenir":{"nom":"Retenir quelque chose","explique":"Pose un souvenir que les dialogues suivants pourront interroger. C'est la mémoire du monde : une promesse faite, un nom lâché, une porte qu'on a refusée.","parametres":{"nom":{"nom":"Sous quel nom","type":"texte","requis":true,"aide":"Minuscules et tirets, comme une clé.","exemple":"a-promis-le-registre"},"vaut":{"nom":"Vrai ou faux","type":"oui-non","requis":false,"defaut":true,"aide":"Faux efface le souvenir."}}},"mission":{"nom":"Confier une mission","explique":"Le personnage co <script id="commun">
/* ══ RECOPIÉ — NE PAS CORRIGER ICI ══ Ce bloc « commun » est réécrit par
   outils/construire.mjs. Corrigez la source, puis reconstruisez. ══ */
/* La machinerie partagée des ateliers de Caravane.

   Ce fichier n'est jamais chargé par une page : outils/construire.mjs le recopie
   à l'intérieur de chaque atelier, entre les balises <script id="commun">. Les
   ateliers doivent en effet s'ouvrir d'un simple double-clic, donc en file://,
   où aucune page ne peut aller chercher un fichier voisin.

   Il tient trois choses :
     — les petites fonctions dont tout le monde se sert ;
     — la lecture et l'écriture du modèle par chemin, sur quoi reposent tous les
       formulaires engendrés ;
     — la sauvegarde dans le navigateur, avec son échéance dure.

   Chaque atelier déclare d'où il lit avec racineEst(), et ce qu'il sauve avec
   sauvegardeEst().                                                          */

/* ═══════════════ le menu fretin ═══════════════ */
const $=(s,p=document)=>p.querySelector(s);
const $$=(s,p=document)=>Array.prototype.slice.call(p.querySelectorAll(s));
const ech=s=>String(s==null?'':s).replace(/[&<>"]/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const fmt=n=>Math.round(n).toLocaleString('fr-FR');
const dec=n=>(Math.round(n*1000)/1000).toString().replace('.',',');
const slug=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()
  .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,48);

/* ═══════════════ lecture et écriture par chemin ═══════════════
   Les formulaires sont engendrés : chaque champ porte le chemin de la donnée
   qu'il édite, « couches.2.texte » ou « choix.0.reussi.effets.1.part ». Écrire
   une valeur vide efface la clé, pour que le fichier exporté ne porte que ce
   qui a été rempli. */
let RACINE=()=>null;
function racineEst(f){RACINE=f;}
function lire(ch){
  return String(ch).split('.').reduce((o,k)=>(o==null?undefined:o[k]),RACINE());
}
function ecrire(ch,v){
  const p=String(ch).split('.'), der=p.pop();
  let o=RACINE();
  if(o==null)return;
  for(const k of p){
    if(o[k]==null)o[k]=/^\d+$/.test(k)?[]:{};
    o=o[k];
  }
  if(v===''||v===undefined||v===null)delete o[der];
  else o[der]=v;
}
function nettoyer(o){                      /* enlève les objets et listes vides */
  if(Array.isArray(o)){o.forEach(nettoyer);return o;}
  if(o&&typeof o==='object'){
    for(const k of Object.keys(o)){
      nettoyer(o[k]);
      const v=o[k];
      if(v===''||v===undefined||v===null||
         (Array.isArray(v)&&!v.length)||
         (v&&typeof v==='object'&&!Array.isArray(v)&&!Object.keys(v).length))delete o[k];
    }
  }
  return o;
}
function bouger(l,i,d){
  if(!l||i+d<0||i+d>=l.length)return;
  const x=l[i];l[i]=l[i+d];l[i+d]=x;
}

/* ═══════════════════════════════════════════════════════════════════════════
   LE DÉPÔT PARTAGÉ
   ───────────────────────────────────────────────────────────────────────────
   Les sept ateliers étant servis depuis la même adresse, ils partagent le même
   localStorage. On y tient **une seule réserve** : le monde, les personnages,
   les rôles, les objets, les missions, les événements, les dialogues, les
   icônes.

   La distinction qui fait tout marcher :
     — le **contenu** est commun. Un personnage écrit dans son atelier est
       aussitôt là dans celui des missions, sans rien exporter ni recharger ;
     — l'**état de travail** — quel élément est ouvert, le filtre, le convoi
       d'essai — reste privé à chaque atelier, dans sa propre clé.

   Les anciennes sauvegardes, une par atelier, sont reprises au premier
   chargement : on ne perd pas ce qui était déjà écrit.                       */

const DEPOT='caravane.depot.v1';
const SECTIONS=['monde','personnages','roles','objets','missions','evenements',
                'dialogues','icones'];
/* d'où venait chaque section avant le dépôt, et sous quelle forme */
const ANCIENNES={
  personnages:['caravane.atelier-personnages.v1','repertoire'],
  objets:['caravane.atelier-objets.v1','coffre'],
  missions:['caravane.atelier-missions.v1','carnet'],
  evenements:['caravane.atelier-evenements.v1','recueil'],
  monde:['caravane.atelier-carte.v1',null]
};
let D=null;

function chargerDepot(){
  if(D)return D;
  try{D=JSON.parse(localStorage.getItem(DEPOT)||'null');}catch(e){D=null;}
  if(!D||typeof D!=='object')D={v:1};
  /* reprise : ce qui dormait dans les clés d'avant rejoint la réserve */
  let repris=[];
  Object.keys(ANCIENNES).forEach(nom=>{
    if(D[nom])return;
    const [cle,champ]=ANCIENNES[nom];
    let vieux=null;
    try{vieux=JSON.parse(localStorage.getItem(cle)||'null');}catch(e){}
    if(!vieux)return;
    const v=champ?vieux[champ]:vieux;
    if(v&&typeof v==='object'){D[nom]=v;repris.push(nom);}
    /* le monde de l'atelier de carte y était aussi rangé sous « monde » */
    if(!champ&&vieux.monde&&typeof vieux.monde==='object'){D[nom]=vieux.monde;repris.push(nom);}
  });
  if(repris.length){ecrireDepot();console.info('Dépôt : repris '+repris.join(', '));}
  return D;
}
function ecrireDepot(){
  try{localStorage.setItem(DEPOT,JSON.stringify(D));}
  catch(e){/* quota, mode privé : on continue sans */}
}
/* Lire une section que l'on ne tient pas soi-même : c'est par là que l'atelier
   de missions voit les personnages. */
function depotLire(nom){
  chargerDepot();
  return D[nom]||null;
}
function depotEcrire(nom,valeur){
  chargerDepot();
  /* On relit le disque avant d'écrire, et l'on ne pose que sa propre section :
     un autre onglet a pu en poser une entre notre chargement et maintenant, et
     réécrire tout le dépôt depuis un cache périmé la perdrait. L'événement
     « storage » nous en avertit, mais il arrive après coup. */
  let frais=null;
  try{frais=JSON.parse(localStorage.getItem(DEPOT)||'null');}catch(e){}
  if(frais&&typeof frais==='object'){
    SECTIONS.forEach(s=>{
      if(s===nom)return;
      if(frais[s]!==undefined)D[s]=frais[s];
    });
    if(frais.maj)D.maj=Object.assign({},frais.maj,D.maj||{});
  }
  if(valeur===null||valeur===undefined)delete D[nom];
  else D[nom]=valeur;
  D.maj=D.maj||{};D.maj[nom]=Date.now();
  ecrireDepot();
}
/* Ce que le dépôt contient, en un coup d'œil — le codex du hub s'en sert. */
function depotResume(){
  chargerDepot();
  const n=(s,c)=>((D[s]&&D[s][c])||[]).length;
  return {
    monde:D.monde?((D.monde.lieux||[]).length):0,
    personnages:n('personnages','personnages'),
    objets:n('objets','objets'),
    missions:n('missions','missions'),
    evenements:n('evenements','evenements'),
    dialogues:n('dialogues','dialogues'),
    icones:n('icones','icones'),
    roles:n('roles','roles'),
    proprietes:n('proprietes','proprietes')
  };
}

/* ═══════════════ le codex ═══════════════
   Le hub ne connaît la forme d'aucun atelier : il demande ici une liste plate,
   toujours la même — une clé, un nom, une ligne de détail, un dessin, une
   teinte — et un lien qui rouvre l'élément dans l'outil qui l'a fait.
   Ajouter une catégorie, c'est ajouter une ligne à ce tableau. */
const CATEGORIES=[
  {nom:'monde',      titre:'Les lieux',       un:'lieu',       des:'lieux',
   atelier:'atelier-carte.html',        champ:'lieux'},
  {nom:'personnages',titre:'Les personnages', un:'personnage', des:'personnages',
   atelier:'atelier-personnages.html',  champ:'personnages'},
  /* Les rôles n'ont pas de fichier à eux : ils voyagent dans personnages.json,
     puisque c'est là qu'on s'en sert. Mais ils se listent et se rouvrent. */
  {nom:'roles',      titre:'Les rôles',       un:'rôle',       des:'rôles',
   atelier:'atelier-personnages.html',  champ:'roles',  lien:'role'},
  {nom:'objets',     titre:'Les objets',      un:'objet',      des:'objets',
   atelier:'atelier-objets.html',       champ:'objets'},
  {nom:'missions',   titre:'Les missions',    un:'mission',    des:'missions',
   atelier:'atelier-missions.html',     champ:'missions'},
  {nom:'evenements', titre:'Les événements',  un:'événement',  des:'événements',
   atelier:'atelier-evenements.html',   champ:'evenements'},
  {nom:'dialogues',  titre:'Les dialogues',   un:'dialogue',   des:'dialogues',
   atelier:'atelier-dialogues.html',    champ:'dialogues'},
  {nom:'icones',     titre:'Les icônes',      un:'icône',      des:'icônes',
   atelier:'atelier-icones.html',       champ:'icones'},
  /* on les pose sur la carte : c'est là qu'on les rouvre */
  {nom:'proprietes', titre:'Les propriétés',  un:'propriété',  des:'propriétés',
   atelier:'atelier-carte.html',        champ:'proprietes'}
];
/* Ce qu'on dit d'un élément en une ligne, sous son nom. Chaque catégorie a sa
   phrase, parce qu'un lieu ne se résume pas comme une mission. */
function detailCodex(section,x,depot){
  const nomDe=(s,c,cle)=>{
    const l=(depot[s]&&depot[s][c])||[];
    const t=l.find(y=>y&&y.cle===cle);
    return t?(t.nom||t.titre||cle):cle;
  };
  const bouts=[];
  if(section==='monde'){
    if(x.rang)bouts.push(x.rang);
    if(x.contree)bouts.push('en '+nomDe('monde','contrees',x.contree));
    if(x.carte)bouts.push('carte '+x.carte);
  }else if(section==='proprietes'){
    if(x.lieu)bouts.push('près de '+((((depot.monde||{}).lieux)||[])
      .find(l=>l&&l.cle===x.lieu)||{}).nom||x.lieu);
    bouts.push(x.prix?x.prix+' po':'donné');
    const b=Object.keys(x.batiments||{}).length;
    bouts.push(b?b+(b>1?' bâtiments possibles':' bâtiment possible'):'rien à bâtir');
  }else if(section==='roles'){
    if(x.feminin)bouts.push('au féminin : '+x.feminin);
    else bouts.push('le même au féminin');
    const n=((depot.personnages&&depot.personnages.personnages)||[])
      .filter(p=>p&&p.role===x.cle).length;
    bouts.push(n?n+(n>1?' personnages':' personnage'):'personne encore');
  }else if(section==='personnages'){
    if(x.titre)bouts.push(x.titre);
    if(x.role)bouts.push(nomRole(x.role,x.accord)||x.role);
    if(x.lieu)bouts.push('à '+nomDe('monde','lieux',x.lieu));
    const c=(x.couches||[]).length;
    if(c)bouts.push(c+(c>1?' couches':' couche'));
    if(!x.accord)bouts.push('accord à choisir');
  }else if(section==='objets'){
    if(x.genre)bouts.push(x.genre);
    const p=(x.pouvoirs||[]).length;
    if(p)bouts.push(p+(p>1?' pouvoirs':' pouvoir'));
    const pr=x.provenance&&x.provenance.genre;
    if(pr==='mission'&&x.provenance.mission)
      bouts.push('de « '+nomDe('missions','missions',x.provenance.mission)+' »');
    else if(pr)bouts.push(pr);
  }else if(section==='missions'){
    if(x.commanditaire)bouts.push('de '+nomDe('personnages','personnages',x.commanditaire));
    else bouts.push('sans commanditaire');
    const j=(x.jalons||[]).length;
    bouts.push(j?j+(j>1?' jalons':' jalon'):'aucun jalon');
    const d=x.offre&&x.offre.delai;
    if(d)bouts.push(d+' étapes');
  }else if(section==='evenements'){
    if(x.oeil)bouts.push(x.oeil);
    if(x.genre)bouts.push(x.genre);
    const c=(x.choix||[]).length;
    if(c)bouts.push(c+(c>1?' issues':' issue'));
  }else if(section==='dialogues'){
    const q=((depot.personnages&&depot.personnages.personnages)||[])
      .find(p=>p&&p.cle===x.personnage);
    bouts.push(q?'de '+(q.nom||x.personnage):(x.personnage?'de '+x.personnage
      :'sans personnage'));
    const n=Object.keys(x.repliques||{}).length;
    bouts.push(n?n+(n>1?' répliques':' réplique'):'aucune réplique');
    if(x.rejouable)bouts.push('rejouable');
  }else if(section==='icones'){
    if(x.source)bouts.push('SVG collé');
    else{
      const f=(x.formes||[]).length;
      bouts.push(f?f+(f>1?' formes':' forme'):'vide');
    }
    if(x.nature)bouts.push(x.nature);
  }
  return bouts.join(' · ');
}
/* Un élément est « en chantier » quand il lui manque de quoi exister : pas de
   clé, pas de nom. Le codex le montre sans le cacher — c'est normal en cours
   de travail — mais il le dit. */
function inacheveCodex(section,x){
  if(!x.cle)return 'sans clé';
  if(!(x.nom||x.titre))return 'sans nom';
  if(section==='missions'&&!(x.jalons||[]).length)return 'sans jalon';
  if(section==='personnages'&&!x.premiere)return 'sans description';
  if(section==='roles'&&!x.explique)return 'sans explication';
  if(section==='dialogues'&&!x.personnage)return 'sans personnage';
  return '';
}
function teinteContree(depot,cle){
  const c=((depot.monde&&depot.monde.contrees)||[]).find(x=>x&&x.cle===cle);
  return (c&&c.teinte)||'#9C9484';
}
function depotCodex(){
  chargerDepot();
  return CATEGORIES.map(c=>{
    const liste=(D[c.nom]&&D[c.nom][c.champ])||[];
    return {
      nom:c.nom,titre:c.titre,un:c.un,des:c.des,atelier:c.atelier,
      entrees:liste.map(x=>({
        cle:x.cle||'',
        nom:x.nom||x.titre||'',
        detail:detailCodex(c.nom,x,D),
        manque:inacheveCodex(c.nom,x),
        glyphe:c.nom==='icones'?x.cle
              :c.nom==='monde'?'borne'
              :c.nom==='roles'?'ermite'
              :c.nom==='proprietes'?'tente'
              :c.nom==='dialogues'?'bulle'
              :(x.ico&&x.ico.glyphe)||'',
        svg:c.nom==='icones'?(x.svg||''):'',
        /* l'icône porte sa teinte en propre, un lieu prend celle de sa
           contrée, et tout le reste la range dans son petit objet « ico » */
        teinte:c.nom==='icones'?teinteDe(x)
              :c.nom==='monde'?teinteContree(D,x.contree)
              :c.nom==='roles'?'#9C9484'
              :c.nom==='proprietes'?'#9A7343'
              :c.nom==='dialogues'?'#6E9B6A'
              :teinteDe(x.ico||{}),
        /* un rôle se rouvre par « #role= », pour ne pas se confondre avec le
           personnage qui porterait la même clé */
        lien:x.cle?c.atelier+'#'+(c.lien||'cle')+'='+encodeURIComponent(x.cle)
                  :c.atelier
      }))
    };
  });
}

/* ═══════════════════════════════════════════════════════════════════════════
   LA CHARPENTE
   ───────────────────────────────────────────────────────────────────────────
   Ce qui ouvre quoi. Les missions et les conversations forment déjà un réseau
   sans qu'on ait rien ajouté au format : une conversation confie une mission,
   une mission accomplie ouvre une autre conversation, un souvenir posé ici
   déverrouille une réponse là-bas. On le relit, on en tire les racines — ce
   qui n'attend rien — et l'on descend.

   Ce n'est pas un arbre au sens strict : deux chemins peuvent mener au même
   endroit, et rien n'empêche une boucle. On en fait un arbre lisible en ne
   développant chaque nœud qu'une fois ; ailleurs il paraît en renvoi. Les
   boucles sont dites plutôt que suivies.

   Les objets, les lieux et les couches de lore ne sont pas des nœuds : ils
   restent en mention sur la ligne. Un objet sert quand même de fil — porter
   celui qu'une mission donne ouvre une conversation, et l'arête existe, avec
   l'objet écrit dessus.                                                     */

/* Quelle mission finit par donner cet objet. */
function missionDeLObjet(depot,cle){
  const o=((depot.objets&&depot.objets.objets)||[]).find(x=>x&&x.cle===cle);
  if(o&&o.provenance&&o.provenance.genre==='mission'&&o.provenance.mission)
    return o.provenance.mission;
  const m=((depot.missions&&depot.missions.missions)||[]).find(x=>
    (((x.reussite||{}).recompenses)||[]).some(r=>r.donne==='objet'&&r.objet===cle));
  return m?m.cle:null;
}
/* Qui délie telle couche de tel personnage — une conversation, une mission,
   ou un objet qui vient d'une mission. Rendu sous forme de nœud d'origine. */
function ouvreurDeCouche(depot,qui,couche){
  const dlg=((depot.dialogues&&depot.dialogues.dialogues)||[]).find(d=>
    Object.values(d.repliques||{}).some(r=>
      [].concat(r.effets||[],...((r.reponses||[]).map(c=>c.effets||[])))
        .some(e=>e.faire==='ouvrirCouche'&&(e.personnage||d.personnage)===qui
                 &&String(e.couche)===String(couche))));
  if(dlg)return {genre:'dialogue',cle:dlg.cle};
  const m=((depot.missions&&depot.missions.missions)||[]).find(x=>
    (((x.reussite||{}).recompenses)||[]).some(r=>r.donne==='ouvreCouche'
      &&r.personnage===qui&&String(r.couche)===String(couche)));
  if(m)return {genre:'mission',cle:m.cle};
  const o=((depot.objets&&depot.objets.objets)||[]).find(x=>
    (x.pouvoirs||[]).some(p=>p.faire==='ouvreCouche'&&p.personnage===qui
      &&String(p.couche)===String(couche)));
  if(o){
    const mm=missionDeLObjet(depot,o.cle);
    if(mm)return {genre:'mission',cle:mm,par:o.nom||o.cle};
  }
  return null;
}
/* Tous les effets d'une conversation, répliques et réponses confondues. */
function effetsDuDialogue(d){
  const out=[];
  Object.values((d&&d.repliques)||{}).forEach(r=>{
    (r.effets||[]).forEach(e=>out.push(e));
    (r.reponses||[]).forEach(c=>(c.effets||[]).forEach(e=>out.push(e)));
  });
  return out;
}
/* Ce qu'un état de mission veut dire pour l'ordre des choses. « offerte » ne
   déverrouille rien : c'est la conversation qui vient AVANT la mission. */
const APRES_MISSION={faite:'une fois accomplie',ratee:'une fois échouée',
                     cours:'pendant qu\'elle court'};

function depotCharpente(){
  chargerDepot();
  const missions=((D.missions&&D.missions.missions)||[]).filter(m=>m&&m.cle);
  const dialogues=((D.dialogues&&D.dialogues.dialogues)||[]).filter(d=>d&&d.cle);
  const gens=((D.personnages&&D.personnages.personnages)||[]);
  const parGens={};gens.forEach(p=>{if(p.cle)parGens[p.cle]=p;});
  const nomObjet=c=>{
    const o=((D.objets&&D.objets.objets)||[]).find(x=>x&&x.cle===c);
    return (o&&o.nom)||c;
  };
  const nomLieu=c=>{
    const l=((D.monde&&D.monde.lieux)||[]).find(x=>x&&x.cle===c);
    return (l&&l.nom)||c;
  };

  const id=(g,c)=>g+':'+c;
  const noeuds={};                      /* id → le nœud */
  const sortantes={};                   /* id → [{vers, relation}] */
  const entrantes={};                   /* id → nombre d'arêtes reçues */
  const soucis=[];
  const dur=t=>soucis.push({dur:true,txt:t});
  const doux=t=>soucis.push({dur:false,txt:t});

  const poser=(genre,x)=>{
    const qui=genre==='dialogue'?x.personnage:x.commanditaire;
    const p=parGens[qui];
    noeuds[id(genre,x.cle)]={
      genre:genre,cle:x.cle,
      nom:(genre==='dialogue'?x.titre:x.titre)||x.cle,
      qui:p?{cle:p.cle,nom:appellationCourte(p),
             glyphe:(p.ico&&p.ico.glyphe)||'ermite',teinte:teinteDe(p.ico||{}),
             lieu:p.lieu?nomLieu(p.lieu):''}
           :(qui?{cle:qui,nom:qui,glyphe:'ermite',teinte:'#9C9484',lieu:'',
                  inconnu:true}:null),
      mentions:[],
      lien:(genre==='dialogue'?'atelier-dialogues.html':'atelier-missions.html')+
        '#cle='+encodeURIComponent(x.cle)
    };
    sortantes[id(genre,x.cle)]=[];
    entrantes[id(genre,x.cle)]=0;
  };
  missions.forEach(m=>poser('mission',m));
  dialogues.forEach(d=>poser('dialogue',d));

  const relier=(de,vers,relation)=>{
    if(!noeuds[de]||!noeuds[vers]||de===vers)return;
    if(sortantes[de].some(a=>a.vers===vers&&a.relation===relation))return;
    sortantes[de].push({vers:vers,relation:relation});
    entrantes[vers]++;
  };

  /* ── ce que les conversations font ── */
  dialogues.forEach(d=>{
    const moi=id('dialogue',d.cle);
    const n=noeuds[moi];
    /* elle confie une mission */
    effetsDuDialogue(d).forEach(e=>{
      if(e.faire==='mission'&&e.mission){
        if(!noeuds[id('mission',e.mission)])
          dur(`« ${d.titre||d.cle} » confie <b>${ech(e.mission)}</b>, qui n'est pas au carnet.`);
        else relier(moi,id('mission',e.mission),'confie');
      }
      if(e.faire==='ouvrirCouche')n.mentions.push('délie une couche de lore');
      if(e.faire==='souvenir'&&e.vaut!==false)n.mentions.push('retient « '+e.nom+' »');
    });
    /* ce qu'elle attend pour paraître */
    (d.si||[]).forEach(c=>{
      if(c.quoi==='missionEtat'&&c.mission){
        if(!noeuds[id('mission',c.mission)]){
          dur(`« ${d.titre||d.cle} » attend la mission <b>${ech(c.mission)}</b>, `+
            `qui n'est pas au carnet.`);
        }else if(APRES_MISSION[c.vaut]){
          relier(id('mission',c.mission),moi,APRES_MISSION[c.vaut]);
        }else{
          /* « offerte » : elle vient AVANT la mission, elle ne l'attend pas.
             On le dit sur la ligne plutôt que d'inventer une arête à l'envers. */
          const m=missions.find(x=>x.cle===c.mission);
          n.mentions.push('tant que « '+((m&&m.titre)||c.mission)+' » n\'est pas prise');
        }
      }
      if(c.quoi==='dialogueVu'&&c.dialogue)relier(id('dialogue',c.dialogue),moi,'après');
      if(c.quoi==='souvenir'&&c.nom){
        const src=dialogues.find(x=>x.cle!==d.cle&&effetsDuDialogue(x)
          .some(e=>e.faire==='souvenir'&&e.nom===c.nom&&e.vaut!==false));
        if(src)relier(id('dialogue',src.cle),moi,'se souvenant de « '+c.nom+' »');
        else doux(`« ${d.titre||d.cle} » attend le souvenir <b>${ech(c.nom)}</b>, `+
          `qu'aucune conversation ne pose.`);
      }
      if(c.quoi==='objetPorte'&&c.objet){
        const mm=missionDeLObjet(D,c.objet);
        if(mm&&noeuds[id('mission',mm)])
          relier(id('mission',mm),moi,'en portant « '+nomObjet(c.objet)+' »');
        else n.mentions.push('en portant « '+nomObjet(c.objet)+' »');
      }
      if(c.quoi==='coucheOuverte'&&c.couche){
        const o=ouvreurDeCouche(D,c.personnage||d.personnage,c.couche);
        if(o&&noeuds[id(o.genre,o.cle)])
          relier(id(o.genre,o.cle),moi,'une fois la langue déliée');
        else n.mentions.push('après en avoir appris plus');
      }
      if(c.quoi==='rencontres'&&c.personnage&&c.personnage!==d.personnage){
        const p=parGens[c.personnage];
        n.mentions.push('après avoir vu '+(p?appellationCourte(p):c.personnage));
      }
    });
    if(!d.personnage)dur(`« ${d.titre||d.cle} » n'est attachée à personne.`);
    else if(gens.length&&!parGens[d.personnage])
      dur(`« ${d.titre||d.cle} » parle à <b>${ech(d.personnage)}</b>, qui n'existe pas.`);
    else if(parGens[d.personnage]&&!parGens[d.personnage].lieu)
      doux(`${appellationCourte(parGens[d.personnage])} n'a pas de lieu : on ne `+
        `croisera jamais « ${d.titre||d.cle} ».`);
  });

  /* ── ce que les missions font ── */
  missions.forEach(m=>{
    const moi=id('mission',m.cle);
    const n=noeuds[moi];
    (m.jalons||[]).forEach(j=>{
      if(j.faire==='rencontrer'&&j.personnage){
        const p=parGens[j.personnage];
        n.mentions.push('rencontrer '+(p?appellationCourte(p):j.personnage));
      }
      if(j.faire==='atteindre'&&j.lieu)n.mentions.push('atteindre '+nomLieu(j.lieu));
      if(j.faire==='livrer'&&j.lieu)n.mentions.push('livrer à '+nomLieu(j.lieu));
    });
    (((m.reussite||{}).recompenses)||[]).forEach(r=>{
      if(r.donne==='objet'&&r.objet)n.mentions.push('donne « '+nomObjet(r.objet)+' »');
      if(r.donne==='ouvreCouche')n.mentions.push('délie une couche de lore');
    });
    ((m.offre||{}).si||[]).forEach(c=>{
      if(c.quoi==='missionEtat'&&c.mission&&noeuds[id('mission',c.mission)]
         &&APRES_MISSION[c.vaut])
        relier(id('mission',c.mission),moi,APRES_MISSION[c.vaut]);
    });
    /* qui la propose : un commanditaire l'offre en ville, une conversation la
       confie. Sans l'un ni l'autre, elle n'existe que dans le fichier. */
    const confiee=Object.keys(sortantes).some(k=>
      sortantes[k].some(a=>a.vers===moi&&a.relation==='confie'));
    if(!m.commanditaire&&!m.lieu&&!confiee)
      dur(`<b>${ech(m.titre||m.cle)}</b> n'a ni commanditaire, ni lieu, et aucune `+
        `conversation ne la confie : personne ne peut la donner.`);
    else if(m.commanditaire&&gens.length&&!parGens[m.commanditaire])
      dur(`<b>${ech(m.titre||m.cle)}</b> est donnée par <b>${ech(m.commanditaire)}</b>, `+
        `qui n'existe pas.`);
    if(!(m.jalons||[]).length)
      doux(`<b>${ech(m.titre||m.cle)}</b> n'a aucun jalon : rien à accomplir.`);
  });

  /* ── les racines, puis la descente ── */
  const cles=Object.keys(noeuds);
  const racines=cles.filter(k=>!entrantes[k]);
  const vus={};
  const enChemin={};
  const boucles=[];

  function descendre(k,relation){
    const n=noeuds[k];
    const base={genre:n.genre,cle:n.cle,nom:n.nom,qui:n.qui,lien:n.lien,
                mentions:n.mentions.slice(),relation:relation||''};
    if(enChemin[k]){
      boucles.push(n.nom);
      return Object.assign(base,{boucle:true,enfants:[]});
    }
    if(vus[k])return Object.assign(base,{repris:true,enfants:[]});
    vus[k]=true;enChemin[k]=true;
    base.enfants=sortantes[k].map(a=>descendre(a.vers,a.relation));
    delete enChemin[k];
    return base;
  }
  const arbres=racines.map(k=>descendre(k));
  /* Ce qui n'est atteint par rien et n'a aucune racine : une boucle fermée. On
     regarde « vu » au fur et à mesure — une liste figée d'avance rendrait un
     tronc solitaire pour chaque nœud de la boucle, dont un simple renvoi. */
  cles.forEach(k=>{
    if(vus[k])return;
    arbres.push(descendre(k,'boucle refermée'));
    doux(`<b>${ech(noeuds[k].nom)}</b> n'est atteignable par aucun chemin : `+
      `elle ne s'ouvre que si elle est déjà ouverte.`);
  });
  boucles.forEach(b=>doux(`La suite tourne en rond en repassant par `+
    `<b>${ech(b)}</b>. Le joueur n'en sortira pas.`));

  /* les solitaires : ni ouvertes par rien, ni n'ouvrant rien */
  const seuls=cles.filter(k=>!entrantes[k]&&!sortantes[k].length).length;

  return {arbres:arbres,soucis:soucis,
    compte:{missions:missions.length,dialogues:dialogues.length,
            racines:racines.length,seuls:seuls,
            liens:cles.reduce((s,k)=>s+sortantes[k].length,0)}};
}
/* Le nom qu'on écrit sur un nœud : le titre est déjà long. */
function appellationCourte(p){
  if(!p)return '';
  const t=(p.titre||'').trim(), n=p.nom||p.cle||'';
  return t?t+' '+n:n;
}

/* ═══════════════════════════════════════════════════════════════════════════
   LES DEUX SORTES DE SAUVEGARDE
   ───────────────────────────────────────────────────────────────────────────
   Elles ne servent pas à la même chose, et les confondre coûte du travail.

   1. La **sauvegarde d'atelier** — tout le dépôt dans un fichier, plus l'état
      de travail de chaque outil. C'est le fichier qui voyage : on le prend sur
      l'ordinateur, on le reprend sur le téléphone, et l'on continue où l'on
      s'était arrêté. Il ne se dépose pas dans le jeu.

   2. Les **fichiers du jeu** — une section à la fois, sous le nom exact que
      data/ attend. C'est ce qu'on livre au jeu, et rien d'autre.

   L'image de fond de la carte ne voyage dans ni l'une ni l'autre : elle est
   trop lourde pour un JSON, et elle vous appartient. On la redépose à la main
   sur l'autre appareil.                                                      */

const FICHIERS_JEU={
  monde:'monde.json',
  personnages:'personnages.json',
  objets:'objets.json',
  /* pas « missions.json » : ce nom-là est déjà pris dans data/ par ce qui
     habille les contrats tirés au sort, et l'écraser les ferait disparaître */
  missions:'missions-ecrites.json',
  evenements:'evenements.json',
  dialogues:'dialogues.json',
  icones:'icones.json',
  proprietes:'proprietes.json',
  calendrier:'calendrier.json'
};
/* Les petites clés d'état privé : quel élément est ouvert, le filtre, l'onglet.
   La carte n'y est pas — son état privé, c'est le monde entier, et le monde est
   déjà dans le dépôt. */
const CLES_TRAVAIL=['personnages','objets','missions','evenements','dialogues','icones']
  .map(n=>'caravane.atelier-'+n+'.v1');

function sauvegardeComplete(){
  chargerDepot();
  const travail={};
  CLES_TRAVAIL.forEach(k=>{
    try{const t=localStorage.getItem(k);if(t)travail[k]=JSON.parse(t);}catch(e){}
  });
  const sections={};
  SECTIONS.forEach(s=>{if(D[s])sections[s]=D[s];});
  return {
    format:'caravane.atelier.v1',
    faite:new Date().toISOString(),
    resume:depotResume(),
    sections:sections,
    travail:travail
  };
}
const nomDeSauvegarde=()=>
  'caravane-atelier-'+new Date().toISOString().slice(0,10)+'.json';

/* Ce qu'un fichier contient, avant d'y toucher : on montre toujours ce qu'on
   s'apprête à reprendre, pour qu'aucun remplacement ne soit une surprise. */
function lireSauvegarde(texte){
  let d;
  try{d=JSON.parse(texte);}catch(e){return {erreur:'Ce fichier n\'est pas du JSON.'};}
  if(!d||typeof d!=='object')return {erreur:'Ce fichier ne contient rien qu\'on sache lire.'};
  if(d.format!=='caravane.atelier.v1'){
    /* un fichier de jeu isolé, déposé ici par méprise : on sait quoi en dire */
    const seule=SECTIONS.find(s=>{
      const c=CATEGORIES.find(x=>x.nom===s);
      return c&&Array.isArray(d[c.champ]);
    });
    if(seule)return {erreur:'C\'est un fichier du jeu ('+FICHIERS_JEU[seule]+
      '), pas une sauvegarde d\'atelier. Ouvrez-le depuis l\'atelier concerné.'};
    return {erreur:'Ce n\'est pas une sauvegarde d\'atelier.'};
  }
  const dedans=CATEGORIES.map(c=>{
    const s=(d.sections||{})[c.nom];
    const n=((s&&s[c.champ])||[]).length;
    return n?{nom:c.nom,titre:c.titre,n:n,mot:n+' '+(n>1?c.des:c.un)}:null;
  }).filter(Boolean);
  return {sauvegarde:d,faite:d.faite||'',dedans:dedans};
}
/* Fusionner plutôt que remplacer : on travaille les missions dans le train et
   la carte à la maison, et l'on ne veut pas choisir. La clé fait foi — une
   entrée de même clé est remplacée, une clé nouvelle s'ajoute à la suite. */
function fondre(ancien,nouveau,champ){
  const a=(ancien&&ancien[champ])||[], b=(nouveau&&nouveau[champ])||[];
  const par={}; const ordre=[];
  a.concat(b).forEach(x=>{
    if(!x)return;
    const k=x.cle||('__'+ordre.length);
    if(!(k in par))ordre.push(k);
    par[k]=x;
  });
  return Object.assign({},ancien||{},nouveau||{},{[champ]:ordre.map(k=>par[k])});
}
const LISTES_MONDE=['cartes','contrees','lieux','voies'];
function fondreMonde(ancien,nouveau){
  if(!ancien)return nouveau;
  if(!nouveau)return ancien;
  let m=Object.assign({},ancien,nouveau);
  LISTES_MONDE.forEach(l=>{
    if(Array.isArray(ancien[l])||Array.isArray(nouveau[l]))
      m[l]=fondre(ancien,nouveau,l)[l];
  });
  return m;
}
function reprendreSauvegarde(d,mode){
  chargerDepot();
  const pris=[];
  CATEGORIES.forEach(c=>{
    const venu=(d.sections||{})[c.nom];
    if(!venu)return;
    if(mode==='fusionner'&&D[c.nom]){
      D[c.nom]=c.nom==='monde'?fondreMonde(D[c.nom],venu):fondre(D[c.nom],venu,c.champ);
    }else D[c.nom]=venu;
    D.maj=D.maj||{};D.maj[c.nom]=Date.now();
    pris.push(c.nom);
  });
  /* en remplacement, ce que la sauvegarde ignore disparaît : sans quoi
     « remplacer » ne remplacerait rien du tout */
  if(mode!=='fusionner')SECTIONS.forEach(s=>{
    if(!(d.sections||{})[s])delete D[s];
  });
  ecrireDepot();
  /* l'état de travail suit, pour rouvrir sur ce qu'on regardait */
  Object.keys(d.travail||{}).forEach(k=>{
    if(CLES_TRAVAIL.indexOf(k)<0)return;
    try{localStorage.setItem(k,JSON.stringify(d.travail[k]));}catch(e){}
  });
  /* l'atelier de carte relit le dépôt à défaut de sa propre clé : on efface la
     sienne pour qu'il reparte du monde qu'on vient de reprendre */
  if((d.sections||{}).monde&&mode!=='fusionner'){
    try{localStorage.removeItem('caravane.atelier-carte.v1');}catch(e){}
  }
  return pris;
}
/* Un fichier du jeu, tel que data/ l'attend. */
function contenuDuJeu(section,brut){
  const c=nettoyer(JSON.parse(JSON.stringify(brut)));
  /* Les personnages emportent les rôles dont ils se servent. Sans cela le jeu
     n'aurait aucun moyen d'écrire {role} : les rôles que vous ajoutez ne sont
     nulle part ailleurs, et un second fichier pour si peu serait une occasion
     de plus de l'oublier. */
  if(section==='personnages'){
    const r=rolesEmployes(c.personnages);
    if(Object.keys(r).length)c.roles=r;
  }
  return c;
}
function fichierDuJeu(section){
  chargerDepot();
  const c=CATEGORIES.find(x=>x.nom===section);
  if(!c||!D[section]||!FICHIERS_JEU[section])return null;
  return {nom:FICHIERS_JEU[section],
          contenu:contenuDuJeu(section,D[section]),
          combien:((D[section][c.champ])||[]).length};
}

/* ═══════════════ sauvegarde ═══════════════
   Une échéance dure : le report d'écriture ne peut pas glisser indéfiniment,
   et la page qui part écrit avant de partir. Sans les deux, une séance entière
   de travail peut ne jamais toucher le disque. */
/* Sans clé, personne ne sauvegarde : le hub prend la même machinerie mais ne
   tient aucun atelier, et n'a rien à écrire. */
let CLE_SAUVE=null, PAQUET=()=>({});
let SECTION=null, SECTION_LIRE=null;
let tSauve=null, echeance=0;
function sauvegardeEst(cle,paquet){CLE_SAUVE=cle;PAQUET=paquet;}
/* L'atelier déclare la section du dépôt qu'il tient. */
function sectionEst(nom,lire){SECTION=nom;SECTION_LIRE=lire;}
function ecrireSauve(){
  clearTimeout(tSauve);tSauve=null;echeance=0;
  if(SECTION&&SECTION_LIRE)depotEcrire(SECTION,SECTION_LIRE());
  if(!CLE_SAUVE)return;
  try{localStorage.setItem(CLE_SAUVE,JSON.stringify(PAQUET()));}
  catch(e){}
}
function sauver(){
  const t=Date.now();
  if(!echeance)echeance=t+2000;
  clearTimeout(tSauve);
  tSauve=setTimeout(ecrireSauve,Math.max(0,Math.min(400,echeance-t)));
}
function relireSauve(){
