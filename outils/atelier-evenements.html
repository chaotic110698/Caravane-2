<script id="commun">
/* La machinerie partagée des ateliers de Caravane.

   Ce fichier n'est jamais chargé par une page : outils/construire.mjs le recopie
   à l'intérieur de chaque atelier, entre les balises <script id="commun">. Les
   ateliers doivent en effet s'ouvrir d'un simple double-clic, donc en file://,
   où aucune page ne peut aller chercher un fichier voisin.

   Il tient trois choses :
     — les petites fonctions dont tout le monde se sert ;
     — la lecture et l'écriture du modèle par chemin, sur quoi reposent tous les
       formulaires engendrés ;
     — la sauvegarde dans le navigateur, avec son échéance dure.

   Chaque atelier déclare d'où il lit avec racineEst(), et ce qu'il sauve avec
   sauvegardeEst().                                                          */

/* ═══════════════ le menu fretin ═══════════════ */
const $=(s,p=document)=>p.querySelector(s);
const $$=(s,p=document)=>Array.prototype.slice.call(p.querySelectorAll(s));
const ech=s=>String(s==null?'':s).replace(/[&<>"]/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const fmt=n=>Math.round(n).toLocaleString('fr-FR');
const dec=n=>(Math.round(n*1000)/1000).toString().replace('.',',');
const slug=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()
  .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,48);

/* ═══════════════ lecture et écriture par chemin ═══════════════
   Les formulaires sont engendrés : chaque champ porte le chemin de la donnée
   qu'il édite, « couches.2.texte » ou « choix.0.reussi.effets.1.part ». Écrire
   une valeur vide efface la clé, pour que le fichier exporté ne porte que ce
   qui a été rempli. */
let RACINE=()=>null;
function racineEst(f){RACINE=f;}
function lire(ch){
  return String(ch).split('.').reduce((o,k)=>(o==null?undefined:o[k]),RACINE());
}
function ecrire(ch,v){
  const p=String(ch).split('.'), der=p.pop();
  let o=RACINE();
  if(o==null)return;
  for(const k of p){
    if(o[k]==null)o[k]=/^\d+$/.test(k)?[]:{};
    o=o[k];
  }
  if(v===''||v===undefined||v===null)delete o[der];
  else o[der]=v;
}
function nettoyer(o){                      /* enlève les objets et listes vides */
  if(Array.isArray(o)){o.forEach(nettoyer);return o;}
  if(o&&typeof o==='object'){
    for(const k of Object.keys(o)){
      nettoyer(o[k]);
      const v=o[k];
      if(v===''||v===undefined||v===null||
         (Array.isArray(v)&&!v.length)||
         (v&&typeof v==='object'&&!Array.isArray(v)&&!Object.keys(v).length))delete o[k];
    }
  }
  return o;
}
function bouger(l,i,d){
  if(!l||i+d<0||i+d>=l.length)return;
  const x=l[i];l[i]=l[i+d];l[i+d]=x;
}

/* ═══════════════════════════════════════════════════════════════════════════
   LE DÉPÔT PARTAGÉ
   ───────────────────────────────────────────────────────────────────────────
   Les sept ateliers étant servis depuis la même adresse, ils partagent le même
   localStorage. On y tient **une seule réserve** : le monde, les personnages,
   les rôles, les objets, les missions, les événements, les dialogues, les
   icônes.

   La distinction qui fait tout marcher :
     — le **contenu** est commun. Un personnage écrit dans son atelier est
       aussitôt là dans celui des missions, sans rien exporter ni recharger ;
     — l'**état de travail** — quel élément est ouvert, le filtre, le convoi
       d'essai — reste privé à chaque atelier, dans sa propre clé.

   Les anciennes sauvegardes, une par atelier, sont reprises au premier
   chargement : on ne perd pas ce qui était déjà écrit.                       */

const DEPOT='caravane.depot.v1';
const SECTIONS=['monde','personnages','roles','objets','missions','evenements',
                'dialogues','icones'];
/* d'où venait chaque section avant le dépôt, et sous quelle forme */
const ANCIENNES={
  personnages:['caravane.atelier-personnages.v1','repertoire'],
  objets:['caravane.atelier-objets.v1','coffre'],
  missions:['caravane.atelier-missions.v1','carnet'],
  evenements:['caravane.atelier-evenements.v1','recueil'],
  monde:['caravane.atelier-carte.v1',null]
};
let D=null;

function chargerDepot(){
  if(D)return D;
  try{D=JSON.parse(localStorage.getItem(DEPOT)||'null');}catch(e){D=null;}
  if(!D||typeof D!=='object')D={v:1};
  /* reprise : ce qui dormait dans les clés d'avant rejoint la réserve */
  let repris=[];
  Object.keys(ANCIENNES).forEach(nom=>{
    if(D[nom])return;
    const [cle,champ]=ANCIENNES[nom];
    let vieux=null;
    try{vieux=JSON.parse(localStorage.getItem(cle)||'null');}catch(e){}
    if(!vieux)return;
    const v=champ?vieux[champ]:vieux;
    if(v&&typeof v==='object'){D[nom]=v;repris.push(nom);}
    /* le monde de l'atelier de carte y était aussi rangé sous « monde » */
    if(!champ&&vieux.monde&&typeof vieux.monde==='object'){D[nom]=vieux.monde;repris.push(nom);}
  });
  if(repris.length){ecrireDepot();console.info('Dépôt : repris '+repris.join(', '));}
  return D;
}
function ecrireDepot(){
  try{localStorage.setItem(DEPOT,JSON.stringify(D));}
  catch(e){/* quota, mode privé : on continue sans */}
}
/* Lire une section que l'on ne tient pas soi-même : c'est par là que l'atelier
   de missions voit les personnages. */
function depotLire(nom){
  chargerDepot();
  return D[nom]||null;
}
function depotEcrire(nom,valeur){
  chargerDepot();
  /* On relit le disque avant d'écrire, et l'on ne pose que sa propre section :
     un autre onglet a pu en poser une entre notre chargement et maintenant, et
     réécrire tout le dépôt depuis un cache périmé la perdrait. L'événement
     « storage » nous en avertit, mais il arrive après coup. */
  let frais=null;
  try{frais=JSON.parse(localStorage.getItem(DEPOT)||'null');}catch(e){}
  if(frais&&typeof frais==='object'){
    SECTIONS.forEach(s=>{
      if(s===nom)return;
      if(frais[s]!==undefined)D[s]=frais[s];
    });
    if(frais.maj)D.maj=Object.assign({},frais.maj,D.maj||{});
  }
  if(valeur===null||valeur===undefined)delete D[nom];
  else D[nom]=valeur;
  D.maj=D.maj||{};D.maj[nom]=Date.now();
  ecrireDepot();
}
/* Ce que le dépôt contient, en un coup d'œil — le codex du hub s'en sert. */
function depotResume(){
  chargerDepot();
  const n=(s,c)=>((D[s]&&D[s][c])||[]).length;
  return {
    monde:D.monde?((D.monde.lieux||[]).length):0,
    personnages:n('personnages','personnages'),
    objets:n('objets','objets'),
    missions:n('missions','missions'),
    evenements:n('evenements','evenements'),
    dialogues:n('dialogues','dialogues'),
    icones:n('icones','icones'),
    roles:n('roles','roles'),
    proprietes:n('proprietes','proprietes')
  };
}

/* ═══════════════ le codex ═══════════════
   Le hub ne connaît la forme d'aucun atelier : il demande ici une liste plate,
   toujours la même — une clé, un nom, une ligne de détail, un dessin, une
   teinte — et un lien qui rouvre l'élément dans l'outil qui l'a fait.
   Ajouter une catégorie, c'est ajouter une ligne à ce tableau. */
const CATEGORIES=[
  {nom:'monde',      titre:'Les lieux',       un:'lieu',       des:'lieux',
   atelier:'atelier-carte.html',        champ:'lieux'},
  {nom:'personnages',titre:'Les personnages', un:'personnage', des:'personnages',
   atelier:'atelier-personnages.html',  champ:'personnages'},
  /* Les rôles n'ont pas de fichier à eux : ils voyagent dans personnages.json,
     puisque c'est là qu'on s'en sert. Mais ils se listent et se rouvrent. */
  {nom:'roles',      titre:'Les rôles',       un:'rôle',       des:'rôles',
   atelier:'atelier-personnages.html',  champ:'roles',  lien:'role'},
  {nom:'objets',     titre:'Les objets',      un:'objet',      des:'objets',
   atelier:'atelier-objets.html',       champ:'objets'},
  {nom:'missions',   titre:'Les missions',    un:'mission',    des:'missions',
   atelier:'atelier-missions.html',     champ:'missions'},
  {nom:'evenements', titre:'Les événements',  un:'événement',  des:'événements',
   atelier:'atelier-evenements.html',   champ:'evenements'},
  {nom:'dialogues',  titre:'Les dialogues',   un:'dialogue',   des:'dialogues',
   atelier:'atelier-dialogues.html',    champ:'dialogues'},
  {nom:'icones',     titre:'Les icônes',      un:'icône',      des:'icônes',
   atelier:'atelier-icones.html',       champ:'icones'},
  /* on les pose sur la carte : c'est là qu'on les rouvre */
  {nom:'proprietes', titre:'Les propriétés',  un:'propriété',  des:'propriétés',
   atelier:'atelier-carte.html',        champ:'proprietes'}
];
/* Ce qu'on dit d'un élément en une ligne, sous son nom. Chaque catégorie a sa
   phrase, parce qu'un lieu ne se résume pas comme une mission. */
function detailCodex(section,x,depot){
  const nomDe=(s,c,cle)=>{
    const l=(depot[s]&&depot[s][c])||[];
    const t=l.find(y=>y&&y.cle===cle);
    return t?(t.nom||t.titre||cle):cle;
  };
  const bouts=[];
  if(section==='monde'){
    if(x.rang)bouts.push(x.rang);
    if(x.contree)bouts.push('en '+nomDe('monde','contrees',x.contree));
    if(x.carte)bouts.push('carte '+x.carte);
  }else if(section==='proprietes'){
    if(x.lieu)bouts.push('près de '+((((depot.monde||{}).lieux)||[])
      .find(l=>l&&l.cle===x.lieu)||{}).nom||x.lieu);
    bouts.push(x.prix?x.prix+' po':'donné');
    const b=Object.keys(x.batiments||{}).length;
    bouts.push(b?b+(b>1?' bâtiments possibles':' bâtiment possible'):'rien à bâtir');
  }else if(section==='roles'){
    if(x.feminin)bouts.push('au féminin : '+x.feminin);
    else bouts.push('le même au féminin');
    const n=((depot.personnages&&depot.personnages.personnages)||[])
      .filter(p=>p&&p.role===x.cle).length;
    bouts.push(n?n+(n>1?' personnages':' personnage'):'personne encore');
  }else if(section==='personnages'){
    if(x.titre)bouts.push(x.titre);
    if(x.role)bouts.push(nomRole(x.role,x.accord)||x.role);
    if(x.lieu)bouts.push('à '+nomDe('monde','lieux',x.lieu));
    const c=(x.couches||[]).length;
    if(c)bouts.push(c+(c>1?' couches':' couche'));
    if(!x.accord)bouts.push('accord à choisir');
  }else if(section==='objets'){
    if(x.genre)bouts.push(x.genre);
    const p=(x.pouvoirs||[]).length;
    if(p)bouts.push(p+(p>1?' pouvoirs':' pouvoir'));
    const pr=x.provenance&&x.provenance.genre;
    if(pr==='mission'&&x.provenance.mission)
      bouts.push('de « '+nomDe('missions','missions',x.provenance.mission)+' »');
    else if(pr)bouts.push(pr);
  }else if(section==='missions'){
    if(x.commanditaire)bouts.push('de '+nomDe('personnages','personnages',x.commanditaire));
    else bouts.push('sans commanditaire');
    const j=(x.jalons||[]).length;
    bouts.push(j?j+(j>1?' jalons':' jalon'):'aucun jalon');
    const d=x.offre&&x.offre.delai;
    if(d)bouts.push(d+' étapes');
  }else if(section==='evenements'){
    if(x.oeil)bouts.push(x.oeil);
    if(x.genre)bouts.push(x.genre);
    const c=(x.choix||[]).length;
    if(c)bouts.push(c+(c>1?' issues':' issue'));
  }else if(section==='dialogues'){
    const q=((depot.personnages&&depot.personnages.personnages)||[])
      .find(p=>p&&p.cle===x.personnage);
    bouts.push(q?'de '+(q.nom||x.personnage):(x.personnage?'de '+x.personnage
      :'sans personnage'));
    const n=Object.keys(x.repliques||{}).length;
    bouts.push(n?n+(n>1?' répliques':' réplique'):'aucune réplique');
    if(x.rejouable)bouts.push('rejouable');
  }else if(section==='icones'){
    if(x.source)bouts.push('SVG collé');
    else{
      const f=(x.formes||[]).length;
      bouts.push(f?f+(f>1?' formes':' forme'):'vide');
    }
    if(x.nature)bouts.push(x.nature);
  }
  return bouts.join(' · ');
}
/* Un élément est « en chantier » quand il lui manque de quoi exister : pas de
   clé, pas de nom. Le codex le montre sans le cacher — c'est normal en cours
   de travail — mais il le dit. */
function inacheveCodex(section,x){
  if(!x.cle)return 'sans clé';
  if(!(x.nom||x.titre))return 'sans nom';
  if(section==='missions'&&!(x.jalons||[]).length)return 'sans jalon';
  if(section==='personnages'&&!x.premiere)return 'sans description';
  if(section==='roles'&&!x.explique)return 'sans explication';
  if(section==='dialogues'&&!x.personnage)return 'sans personnage';
  return '';
}
function teinteContree(depot,cle){
  const c=((depot.monde&&depot.monde.contrees)||[]).find(x=>x&&x.cle===cle);
  return (c&&c.teinte)||'#9C9484';
}
function depotCodex(){
  chargerDepot();
  return CATEGORIES.map(c=>{
    const liste=(D[c.nom]&&D[c.nom][c.champ])||[];
    return {
      nom:c.nom,titre:c.titre,un:c.un,des:c.des,atelier:c.atelier,
      entrees:liste.map(x=>({
        cle:x.cle||'',
        nom:x.nom||x.titre||'',
        detail:detailCodex(c.nom,x,D),
        manque:inacheveCodex(c.nom,x),
        glyphe:c.nom==='icones'?x.cle
              :c.nom==='monde'?'borne'
              :c.nom==='roles'?'ermite'
              :c.nom==='proprietes'?'tente'
              :c.nom==='dialogues'?'bulle'
              :(x.ico&&x.ico.glyphe)||'',
        svg:c.nom==='icones'?(x.svg||''):'',
        /* l'icône porte sa teinte en propre, un lieu prend celle de sa
           contrée, et tout le reste la range dans son petit objet « ico » */
        teinte:c.nom==='icones'?teinteDe(x)
              :c.nom==='monde'?teinteContree(D,x.contree)
              :c.nom==='roles'?'#9C9484'
              :c.nom==='proprietes'?'#9A7343'
              :c.nom==='dialogues'?'#6E9B6A'
              :teinteDe(x.ico||{}),
        /* un rôle se rouvre par « #role= », pour ne pas se confondre avec le
           personnage qui porterait la même clé */
        lien:x.cle?c.atelier+'#'+(c.lien||'cle')+'='+encodeURIComponent(x.cle)
                  :c.atelier
      }))
    };
  });
}

/* ═══════════════════════════════════════════════════════════════════════════
   LA CHARPENTE
   ───────────────────────────────────────────────────────────────────────────
   Ce qui ouvre quoi. Les missions et les conversations forment déjà un réseau
   sans qu'on ait rien ajouté au format : une conversation confie une mission,
   une mission accomplie ouvre une autre conversation, un souvenir posé ici
   déverrouille une réponse là-bas. On le relit, on en tire les racines — ce
   qui n'attend rien — et l'on descend.

   Ce n'est pas un arbre au sens strict : deux chemins peuvent mener au même
   endroit, et rien n'empêche une boucle. On en fait un arbre lisible en ne
   développant chaque nœud qu'une fois ; ailleurs il paraît en renvoi. Les
   boucles sont dites plutôt que suivies.

   Les objets, les lieux et les couches de lore ne sont pas des nœuds : ils
   restent en mention sur la ligne. Un objet sert quand même de fil — porter
   celui qu'une mission donne ouvre une conversation, et l'arête existe, avec
   l'objet écrit dessus.                                                     */

/* Quelle mission finit par donner cet objet. */
function missionDeLObjet(depot,cle){
  const o=((depot.objets&&depot.objets.objets)||[]).find(x=>x&&x.cle===cle);
  if(o&&o.provenance&&o.provenance.genre==='mission'&&o.provenance.mission)
    return o.provenance.mission;
  const m=((depot.missions&&depot.missions.missions)||[]).find(x=>
    (((x.reussite||{}).recompenses)||[]).some(r=>r.donne==='objet'&&r.objet===cle));
  return m?m.cle:null;
}
/* Qui délie telle couche de tel personnage — une conversation, une mission,
   ou un objet qui vient d'une mission. Rendu sous forme de nœud d'origine. */
function ouvreurDeCouche(depot,qui,couche){
  const dlg=((depot.dialogues&&depot.dialogues.dialogues)||[]).find(d=>
    Object.values(d.repliques||{}).some(r=>
      [].concat(r.effets||[],...((r.reponses||[]).map(c=>c.effets||[])))
        .some(e=>e.faire==='ouvrirCouche'&&(e.personnage||d.personnage)===qui
                 &&String(e.couche)===String(couche))));
  if(dlg)return {genre:'dialogue',cle:dlg.cle};
  const m=((depot.missions&&depot.missions.missions)||[]).find(x=>
    (((x.reussite||{}).recompenses)||[]).some(r=>r.donne==='ouvreCouche'
      &&r.personnage===qui&&String(r.couche)===String(couche)));
  if(m)return {genre:'mission',cle:m.cle};
  const o=((depot.objets&&depot.objets.objets)||[]).find(x=>
    (x.pouvoirs||[]).some(p=>p.faire==='ouvreCouche'&&p.personnage===qui
      &&String(p.couche)===String(couche)));
  if(o){
    const mm=missionDeLObjet(depot,o.cle);
    if(mm)return {genre:'mission',cle:mm,par:o.nom||o.cle};
  }
  return null;
}
/* Tous les effets d'une conversation, répliques et réponses confondues. */
function effetsDuDialogue(d){
  const out=[];
  Object.values((d&&d.repliques)||{}).forEach(r=>{
    (r.effets||[]).forEach(e=>out.push(e));
    (r.reponses||[]).forEach(c=>(c.effets||[]).forEach(e=>out.push(e)));
  });
  return out;
}
/* Ce qu'un état de mission veut dire pour l'ordre des choses. « offerte » ne
   déverrouille rien : c'est la conversation qui vient AVANT la mission. */
const APRES_MISSION={faite:'une fois accomplie',ratee:'une fois échouée',
                     cours:'pendant qu\'elle court'};

function depotCharpente(){
  chargerDepot();
  const missions=((D.missions&&D.missions.missions)||[]).filter(m=>m&&m.cle);
  const dialogues=((D.dialogues&&D.dialogues.dialogues)||[]).filter(d=>d&&d.cle);
  const gens=((D.personnages&&D.personnages.personnages)||[]);
  const parGens={};gens.forEach(p=>{if(p.cle)parGens[p.cle]=p;});
  const nomObjet=c=>{
    const o=((D.objets&&D.objets.objets)||[]).find(x=>x&&x.cle===c);
    return (o&&o.nom)||c;
  };
  const nomLieu=c=>{
    const l=((D.monde&&D.monde.lieux)||[]).find(x=>x&&x.cle===c);
    return (l&&l.nom)||c;
  };

  const id=(g,c)=>g+':'+c;
  const noeuds={};                      /* id → le nœud */
  const sortantes={};                   /* id → [{vers, relation}] */
  const entrantes={};                   /* id → nombre d'arêtes reçues */
  const soucis=[];
  const dur=t=>soucis.push({dur:true,txt:t});
  const doux=t=>soucis.push({dur:false,txt:t});

  const poser=(genre,x)=>{
    const qui=genre==='dialogue'?x.personnage:x.commanditaire;
    const p=parGens[qui];
    noeuds[id(genre,x.cle)]={
      genre:genre,cle:x.cle,
      nom:(genre==='dialogue'?x.titre:x.titre)||x.cle,
      qui:p?{cle:p.cle,nom:appellationCourte(p),
             glyphe:(p.ico&&p.ico.glyphe)||'ermite',teinte:teinteDe(p.ico||{}),
             lieu:p.lieu?nomLieu(p.lieu):''}
           :(qui?{cle:qui,nom:qui,glyphe:'ermite',teinte:'#9C9484',lieu:'',
                  inconnu:true}:null),
      mentions:[],
      lien:(genre==='dialogue'?'atelier-dialogues.html':'atelier-missions.html')+
        '#cle='+encodeURIComponent(x.cle)
    };
    sortantes[id(genre,x.cle)]=[];
    entrantes[id(genre,x.cle)]=0;
  };
  missions.forEach(m=>poser('mission',m));
  dialogues.forEach(d=>poser('dialogue',d));

  const relier=(de,vers,relation)=>{
    if(!noeuds[de]||!noeuds[vers]||de===vers)return;
    if(sortantes[de].some(a=>a.vers===vers&&a.relation===relation))return;
    sortantes[de].push({vers:vers,relation:relation});
    entrantes[vers]++;
  };

  /* ── ce que les conversations font ── */
  dialogues.forEach(d=>{
    const moi=id('dialogue',d.cle);
    const n=noeuds[moi];
    /* elle confie une mission */
    effetsDuDialogue(d).forEach(e=>{
      if(e.faire==='mission'&&e.mission){
        if(!noeuds[id('mission',e.mission)])
          dur(`« ${d.titre||d.cle} » confie <b>${ech(e.mission)}</b>, qui n'est pas au carnet.`);
        else relier(moi,id('mission',e.mission),'confie');
      }
      if(e.faire==='ouvrirCouche')n.mentions.push('délie une couche de lore');
      if(e.faire==='souvenir'&&e.vaut!==false)n.mentions.push('retient « '+e.nom+' »');
    });
    /* ce qu'elle attend pour paraître */
    (d.si||[]).forEach(c=>{
      if(c.quoi==='missionEtat'&&c.mission){
        if(!noeuds[id('mission',c.mission)]){
          dur(`« ${d.titre||d.cle} » attend la mission <b>${ech(c.mission)}</b>, `+
            `qui n'est pas au carnet.`);
        }else if(APRES_MISSION[c.vaut]){
          relier(id('mission',c.mission),moi,APRES_MISSION[c.vaut]);
        }else{
          /* « offerte » : elle vient AVANT la mission, elle ne l'attend pas.
             On le dit sur la ligne plutôt que d'inventer une arête à l'envers. */
          const m=missions.find(x=>x.cle===c.mission);
          n.mentions.push('tant que « '+((m&&m.titre)||c.mission)+' » n\'est pas prise');
        }
      }
      if(c.quoi==='dialogueVu'&&c.dialogue)relier(id('dialogue',c.dialogue),moi,'après');
      if(c.quoi==='souvenir'&&c.nom){
        const src=dialogues.find(x=>x.cle!==d.cle&&effetsDuDialogue(x)
          .some(e=>e.faire==='souvenir'&&e.nom===c.nom&&e.vaut!==false));
        if(src)relier(id('dialogue',src.cle),moi,'se souvenant de « '+c.nom+' »');
        else doux(`« ${d.titre||d.cle} » attend le souvenir <b>${ech(c.nom)}</b>, `+
          `qu'aucune conversation ne pose.`);
      }
      if(c.quoi==='objetPorte'&&c.objet){
        const mm=missionDeLObjet(D,c.objet);
        if(mm&&noeuds[id('mission',mm)])
          relier(id('mission',mm),moi,'en portant « '+nomObjet(c.objet)+' »');
        else n.mentions.push('en portant « '+nomObjet(c.objet)+' »');
      }
      if(c.quoi==='coucheOuverte'&&c.couche){
        const o=ouvreurDeCouche(D,c.personnage||d.personnage,c.couche);
        if(o&&noeuds[id(o.genre,o.cle)])
          relier(id(o.genre,o.cle),moi,'une fois la langue déliée');
        else n.mentions.push('après en avoir appris plus');
      }
      if(c.quoi==='rencontres'&&c.personnage&&c.personnage!==d.personnage){
        const p=parGens[c.personnage];
        n.mentions.push('après avoir vu '+(p?appellationCourte(p):c.personnage));
      }
    });
    if(!d.personnage)dur(`« ${d.titre||d.cle} » n'est attachée à personne.`);
    else if(gens.length&&!parGens[d.personnage])
      dur(`« ${d.titre||d.cle} » parle à <b>${ech(d.personnage)}</b>, qui n'existe pas.`);
    else if(parGens[d.personnage]&&!parGens[d.personnage].lieu)
      doux(`${appellationCourte(parGens[d.personnage])} n'a pas de lieu : on ne `+
        `croisera jamais « ${d.titre||d.cle} ».`);
  });

  /* ── ce que les missions font ── */
  missions.forEach(m=>{
    const moi=id('mission',m.cle);
    const n=noeuds[moi];
    (m.jalons||[]).forEach(j=>{
      if(j.faire==='rencontrer'&&j.personnage){
        const p=parGens[j.personnage];
        n.mentions.push('rencontrer '+(p?appellationCourte(p):j.personnage));
      }
      if(j.faire==='atteindre'&&j.lieu)n.mentions.push('atteindre '+nomLieu(j.lieu));
      if(j.faire==='livrer'&&j.lieu)n.mentions.push('livrer à '+nomLieu(j.lieu));
    });
    (((m.reussite||{}).recompenses)||[]).forEach(r=>{
      if(r.donne==='objet'&&r.objet)n.mentions.push('donne « '+nomObjet(r.objet)+' »');
      if(r.donne==='ouvreCouche')n.mentions.push('délie une couche de lore');
    });
    ((m.offre||{}).si||[]).forEach(c=>{
      if(c.quoi==='missionEtat'&&c.mission&&noeuds[id('mission',c.mission)]
         &&APRES_MISSION[c.vaut])
        relier(id('mission',c.mission),moi,APRES_MISSION[c.vaut]);
    });
    /* qui la propose : un commanditaire l'offre en ville, une conversation la
       confie. Sans l'un ni l'autre, elle n'existe que dans le fichier. */
    const confiee=Object.keys(sortantes).some(k=>
      sortantes[k].some(a=>a.vers===moi&&a.relation==='confie'));
    if(!m.commanditaire&&!m.lieu&&!confiee)
      dur(`<b>${ech(m.titre||m.cle)}</b> n'a ni commanditaire, ni lieu, et aucune `+
        `conversation ne la confie : personne ne peut la donner.`);
    else if(m.commanditaire&&gens.length&&!parGens[m.commanditaire])
      dur(`<b>${ech(m.titre||m.cle)}</b> est donnée par <b>${ech(m.commanditaire)}</b>, `+
        `qui n'existe pas.`);
    if(!(m.jalons||[]).length)
      doux(`<b>${ech(m.titre||m.cle)}</b> n'a aucun jalon : rien à accomplir.`);
  });

  /* ── les racines, puis la descente ── */
  const cles=Object.keys(noeuds);
  const racines=cles.filter(k=>!entrantes[k]);
  const vus={};
  const enChemin={};
  const boucles=[];

  function descendre(k,relation){
    const n=noeuds[k];
    const base={genre:n.genre,cle:n.cle,nom:n.nom,qui:n.qui,lien:n.lien,
                mentions:n.mentions.slice(),relation:relation||''};
    if(enChemin[k]){
      boucles.push(n.nom);
      return Object.assign(base,{boucle:true,enfants:[]});
    }
    if(vus[k])return Object.assign(base,{repris:true,enfants:[]});
    vus[k]=true;enChemin[k]=true;
    base.enfants=sortantes[k].map(a=>descendre(a.vers,a.relation));
    delete enChemin[k];
    return base;
  }
  const arbres=racines.map(k=>descendre(k));
  /* Ce qui n'est atteint par rien et n'a aucune racine : une boucle fermée. On
     regarde « vu » au fur et à mesure — une liste figée d'avance rendrait un
     tronc solitaire pour chaque nœud de la boucle, dont un simple renvoi. */
  cles.forEach(k=>{
    if(vus[k])return;
    arbres.push(descendre(k,'boucle refermée'));
    doux(`<b>${ech(noeuds[k].nom)}</b> n'est atteignable par aucun chemin : `+
      `elle ne s'ouvre que si elle est déjà ouverte.`);
  });
  boucles.forEach(b=>doux(`La suite tourne en rond en repassant par `+
    `<b>${ech(b)}</b>. Le joueur n'en sortira pas.`));

  /* les solitaires : ni ouvertes par rien, ni n'ouvrant rien */
  const seuls=cles.filter(k=>!entrantes[k]&&!sortantes[k].length).length;

  return {arbres:arbres,soucis:soucis,
    compte:{missions:missions.length,dialogues:dialogues.length,
            racines:racines.length,seuls:seuls,
            liens:cles.reduce((s,k)=>s+sortantes[k].length,0)}};
}
/* Le nom qu'on écrit sur un nœud : le titre est déjà long. */
function appellationCourte(p){
  if(!p)return '';
  const t=(p.titre||'').trim(), n=p.nom||p.cle||'';
  return t?t+' '+n:n;
}

/* ═══════════════════════════════════════════════════════════════════════════
   LES DEUX SORTES DE SAUVEGARDE
   ───────────────────────────────────────────────────────────────────────────
   Elles ne servent pas à la même chose, et les confondre coûte du travail.

   1. La **sauvegarde d'atelier** — tout le dépôt dans un fichier, plus l'état
      de travail de chaque outil. C'est le fichier qui voyage : on le prend sur
      l'ordinateur, on le reprend sur le téléphone, et l'on continue où l'on
      s'était arrêté. Il ne se dépose pas dans le jeu.

   2. Les **fichiers du jeu** — une section à la fois, sous le nom exact que
      data/ attend. C'est ce qu'on livre au jeu, et rien d'autre.

   L'image de fond de la carte ne voyage dans ni l'une ni l'autre : elle est
   trop lourde pour un JSON, et elle vous appartient. On la redépose à la main
   sur l'autre appareil.                                                      */

const FICHIERS_JEU={
  monde:'monde.json',
  personnages:'personnages.json',
  objets:'objets.json',
  /* pas « missions.json » : ce nom-là est déjà pris dans data/ par ce qui
     habille les contrats tirés au sort, et l'écraser les ferait disparaître */
  missions:'missions-ecrites.json',
  evenements:'evenements.json',
  dialogues:'dialogues.json',
  icones:'icones.json',
  proprietes:'proprietes.json',
  calendrier:'calendrier.json'
};
/* Les petites clés d'état privé : quel élément est ouvert, le filtre, l'onglet.
   La carte n'y est pas — son état privé, c'est le monde entier, et le monde est
   déjà dans le dépôt. */
const CLES_TRAVAIL=['personnages','objets','missions','evenements','dialogues','icones']
  .map(n=>'caravane.atelier-'+n+'.v1');

function sauvegardeComplete(){
  chargerDepot();
  const travail={};
  CLES_TRAVAIL.forEach(k=>{
    try{const t=localStorage.getItem(k);if(t)travail[k]=JSON.parse(t);}catch(e){}
  });
  const sections={};
  SECTIONS.forEach(s=>{if(D[s])sections[s]=D[s];});
  return {
    format:'caravane.atelier.v1',
    faite:new Date().toISOString(),
    resume:depotResume(),
    sections:sections,
    travail:travail
  };
}
const nomDeSauvegarde=()=>
  'caravane-atelier-'+new Date().toISOString().slice(0,10)+'.json';

/* Ce qu'un fichier contient, avant d'y toucher : on montre toujours ce qu'on
   s'apprête à reprendre, pour qu'aucun remplacement ne soit une surprise. */
function lireSauvegarde(texte){
  let d;
  try{d=JSON.parse(texte);}catch(e){return {erreur:'Ce fichier n\'est pas du JSON.'};}
  if(!d||typeof d!=='object')return {erreur:'Ce fichier ne contient rien qu\'on sache lire.'};
  if(d.format!=='caravane.atelier.v1'){
    /* un fichier de jeu isolé, déposé ici par méprise : on sait quoi en dire */
    const seule=SECTIONS.find(s=>{
      const c=CATEGORIES.find(x=>x.nom===s);
      return c&&Array.isArray(d[c.champ]);
    });
    if(seule)return {erreur:'C\'est un fichier du jeu ('+FICHIERS_JEU[seule]+
      '), pas une sauvegarde d\'atelier. Ouvrez-le depuis l\'atelier concerné.'};
    return {erreur:'Ce n\'est pas une sauvegarde d\'atelier.'};
  }
  const dedans=CATEGORIES.map(c=>{
    const s=(d.sections||{})[c.nom];
    const n=((s&&s[c.champ])||[]).length;
    return n?{nom:c.nom,titre:c.titre,n:n,mot:n+' '+(n>1?c.des:c.un)}:null;
  }).filter(Boolean);
  return {sauvegarde:d,faite:d.faite||'',dedans:dedans};
}
/* Fusionner plutôt que remplacer : on travaille les missions dans le train et
   la carte à la maison, et l'on ne veut pas choisir. La clé fait foi — une
   entrée de même clé est remplacée, une clé nouvelle s'ajoute à la suite. */
function fondre(ancien,nouveau,champ){
  const a=(ancien&&ancien[champ])||[], b=(nouveau&&nouveau[champ])||[];
  const par={}; const ordre=[];
  a.concat(b).forEach(x=>{
    if(!x)return;
    const k=x.cle||('__'+ordre.length);
    if(!(k in par))ordre.push(k);
    par[k]=x;
  });
  return Object.assign({},ancien||{},nouveau||{},{[champ]:ordre.map(k=>par[k])});
}
const LISTES_MONDE=['cartes','contrees','lieux','voies'];
function fondreMonde(ancien,nouveau){
  if(!ancien)return nouveau;
  if(!nouveau)return ancien;
  let m=Object.assign({},ancien,nouveau);
  LISTES_MONDE.forEach(l=>{
    if(Array.isArray(ancien[l])||Array.isArray(nouveau[l]))
      m[l]=fondre(ancien,nouveau,l)[l];
  });
  return m;
}
function reprendreSauvegarde(d,mode){
  chargerDepot();
  const pris=[];
  CATEGORIES.forEach(c=>{
    const venu=(d.sections||{})[c.nom];
    if(!venu)return;
    if(mode==='fusionner'&&D[c.nom]){
      D[c.nom]=c.nom==='monde'?fondreMonde(D[c.nom],venu):fondre(D[c.nom],venu,c.champ);
    }else D[c.nom]=venu;
    D.maj=D.maj||{};D.maj[c.nom]=Date.now();
    pris.push(c.nom);
  });
  /* en remplacement, ce que la sauvegarde ignore disparaît : sans quoi
     « remplacer » ne remplacerait rien du tout */
  if(mode!=='fusionner')SECTIONS.forEach(s=>{
    if(!(d.sections||{})[s])delete D[s];
  });
  ecrireDepot();
  /* l'état de travail suit, pour rouvrir sur ce qu'on regardait */
  Object.keys(d.travail||{}).forEach(k=>{
    if(CLES_TRAVAIL.indexOf(k)<0)return;
    try{localStorage.setItem(k,JSON.stringify(d.travail[k]));}catch(e){}
  });
  /* l'atelier de carte relit le dépôt à défaut de sa propre clé : on efface la
     sienne pour qu'il reparte du monde qu'on vient de reprendre */
  if((d.sections||{}).monde&&mode!=='fusionner'){
    try{localStorage.removeItem('caravane.atelier-carte.v1');}catch(e){}
  }
  return pris;
}
/* Un fichier du jeu, tel que data/ l'attend. */
function contenuDuJeu(section,brut){
  const c=nettoyer(JSON.parse(JSON.stringify(brut)));
  /* Les personnages emportent les rôles dont ils se servent. Sans cela le jeu
     n'aurait aucun moyen d'écrire {role} : les rôles que vous ajoutez ne sont
     nulle part ailleurs, et un second fichier pour si peu serait une occasion
     de plus de l'oublier. */
  if(section==='personnages'){
    const r=rolesEmployes(c.personnages);
    if(Object.keys(r).length)c.roles=r;
  }
  return c;
}
function fichierDuJeu(section){
  chargerDepot();
  const c=CATEGORIES.find(x=>x.nom===section);
  if(!c||!D[section]||!FICHIERS_JEU[section])return null;
  return {nom:FICHIERS_JEU[section],
          contenu:contenuDuJeu(section,D[section]),
          combien:((D[section][c.champ])||[]).length};
}

/* ═══════════════ sauvegarde ═══════════════
   Une échéance dure : le report d'écriture ne peut pas glisser indéfiniment,
   et la page qui part écrit avant de partir. Sans les deux, une séance entière
   de travail peut ne jamais toucher le disque. */
/* Sans clé, personne ne sauvegarde : le hub prend la même machinerie mais ne
   tient aucun atelier, et n'a rien à écrire. */
let CLE_SAUVE=null, PAQUET=()=>({});
let SECTION=null, SECTION_LIRE=null;
let tSauve=null, echeance=0;
function sauvegardeEst(cle,paquet){CLE_SAUVE=cle;PAQUET=paquet;}
/* L'atelier déclare la section du dépôt qu'il tient. */
function sectionEst(nom,lire){SECTION=nom;SECTION_LIRE=lire;}
function ecrireSauve(){
  clearTimeout(tSauve);tSauve=null;echeance=0;
  if(SECTION&&SECTION_LIRE)depotEcrire(SECTION,SECTION_LIRE());
  if(!CLE_SAUVE)return;
  try{localStorage.setItem(CLE_SAUVE,JSON.stringify(PAQUET()));}
  catch(e){}
}
function sauver(){
  const t=Date.now();
  if(!echeance)echeance=t+2000;
  clearTimeout(tSauve);
  tSauve=setTimeout(ecrireSauve,Math.max(0,Math.min(400,echeance-t)));
}
function relireSauve(){
  try{return JSON.parse(localStorage.getItem(CLE_SAUVE)||'null');}catch(e){return null;}
}
addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')ecrireSauve();});
addEventListener('pagehide',ecrireSauve);
/* Un autre onglet a écrit : on relit, pour que la liste des personnages soit à
   jour dans l'atelier de missions sans avoir à recharger la page. */
function suivreDepot(quand){
  addEventListener('storage',e=>{
    if(e.key!==DEPOT)return;
    D=null;chargerDepot();
    if(quand)quand();
  });
}

/* ═══════════════ le monde ═══════════════
   Il vit dans le dépôt : l'atelier de carte l'y écrit, les cinq autres l'y
   lisent sans que personne ait à charger un fichier. */
function MONDE_(){return depotLire('monde');}
let MONDE=null;
function mondeEst(d){MONDE=d;if(d)depotEcrire('monde',d);}
function mondeDuDepot(){MONDE=depotLire('monde');return MONDE;}
function listeMonde(quoi){
  if(!MONDE)return null;
  if(quoi==='lieux')return (MONDE.lieux||[]).map(l=>[l.cle,l.nom]);
  if(quoi==='contrees')return (MONDE.contrees||[]).map(c=>[c.cle,c.nom]);
  if(quoi==='rangs')return Object.entries(MONDE.rangs||{}).map(([k,v])=>[k,v.nom||k]);
  if(quoi==='traits')return Object.entries(MONDE.traits||{}).map(([k,v])=>[k,v.nom||k]);
  if(quoi==='terrains')return Object.entries(MONDE.terrains||{}).map(([k,v])=>[k,v.nom||k]);
  if(quoi==='profils')return (MONDE.profils||[]).map(p=>[p.cle,p.nom||p.cle]);
  if(quoi==='cartes')return (MONDE.cartes||[{cle:(MONDE.carte&&MONDE.carte.fichier)||'monde',
    nom:'La carte du monde'}]).map(c=>[c.cle,c.nom||c.cle]);
  return null;
}
const REPLI={
  rangs:[['capitale','Capitale'],['ville','Ville'],['village','Village'],
         ['hameau','Hameau'],['poste','Poste frontière']],
  traits:[['port','Port'],['souterrain','Ville souterraine']],
  terrains:[['plaine','Plaine'],['forestier','Forestier'],['montagneux','Montagneux'],
            ['marecageux','Marécageux']],
  profils:[['securise','Sécurisé'],['normal','Normal'],['dangereux','Dangereux']],
  lieux:[],contrees:[],cartes:[]
};
const listeOu=q=>listeMonde(q)||REPLI[q]||[];

  (d.lieux!==undefined&&d.contrees!==undefined));

/* ═══════════════ les icônes ═══════════════
   Deux réservoirs, comme partout : les quarante-neuf dessins d'origine, livrés
   avec le jeu, et ceux que l'atelier d'icônes ajoute. Les seconds sont rangés
   dans le dépôt et apparaissent partout sans que rien d'autre change.

   La teinte se choisit librement. Les dix teintes nommées restent proposées
   comme raccourcis — elles disent quelque chose (danger, halte, trouvaille) —
   mais une couleur écrite à la main l'emporte. */
function glyphesTous(){
  const propres=depotLire('icones');
  const dessines={};
  ((propres&&propres.icones)||[]).forEach(i=>{if(i.cle&&i.svg)dessines[i.cle]=i.svg;});
  return Object.assign({},(typeof REF!=='undefined'&&REF.glyphes)||{},dessines);
}
function nomsGlyphes(){
  const propres=depotLire('icones');
  const noms={};
  ((propres&&propres.icones)||[]).forEach(i=>{if(i.cle)noms[i.cle]=i.nom||i.cle;});
  return noms;
}
const estGlypheDessine=k=>Object.prototype.hasOwnProperty.call(nomsGlyphes(),k);

/* ═══════════════ les rôles ═══════════════
   Même principe que les dessins : quinze rôles arrivent avec le jeu, et l'on en
   ajoute autant qu'on veut. Les vôtres vivent dans le dépôt, se choisissent
   comme les autres, et voyagent avec la sauvegarde.

   Un rôle porte son **féminin** quand le mot change — échevin, échevine. Le
   texte s'écrit une fois, avec {role}, et s'accorde sur le personnage. Beaucoup
   de rôles n'en ont pas besoin : guide, ermite, aubergiste sont les mêmes des
   deux côtés, et le champ reste vide. */
function rolesTous(){
  const miens=depotLire('roles');
  const propres={};
  ((miens&&miens.roles)||[]).forEach(r=>{
    if(!r||!r.cle)return;
    propres[r.cle]={nom:r.nom||r.cle,feminin:r.feminin||'',explique:r.explique||'',
                    mien:true};
  });
  const livres=(typeof REF!=='undefined'&&REF.vocabulairePersonnages
    &&REF.vocabulairePersonnages.roles)||{};
  return Object.assign({},livres,propres);
}
const estRoleMien=k=>{
  const r=rolesTous()[k];
  return !!(r&&r.mien);
};
/* Le rôle en toutes lettres, accordé. C'est ce que {role} donne dans un texte. */
function nomRole(cle,accord){
  const r=rolesTous()[cle];
  if(!r)return '';
  return (accord==='f'&&r.feminin)?r.feminin:r.nom;
}
/* Ce qui part avec les personnages : seulement les rôles dont ils se servent,
   pour que le jeu sache écrire {role} sans qu'on lui porte un second fichier. */
function rolesEmployes(personnages){
  const tous=rolesTous(), pris={};
  (personnages||[]).forEach(p=>{
    const r=p&&p.role&&tous[p.role];
    if(!r)return;
    pris[p.role]={nom:r.nom};
    if(r.feminin)pris[p.role].feminin=r.feminin;
  });
  return pris;
}
function teinteDe(ico){
  if(ico&&ico.teinte)return ico.teinte;
  const t=(typeof REF!=='undefined'&&REF.natures)||{};
  return t[(ico||{}).nature]||'#9C9484';
}
function svgGlypheDe(cle,teinte){
  const g=glyphesTous()[cle];
  if(!g)return '';
  return `<svg viewBox="0 0 24 24" style="color:${teinte||'#9C9484'};--velin:#E3D6B2">`+
    `${g}</svg>`;
}
/* Le champ de teinte : les dix nommées, plus une couleur libre. */
function champTeinte(chNature,chTeinte){
  const nature=lire(chNature)||'';
  const libre=lire(chTeinte)||'';
  const t=(typeof REF!=='undefined'&&REF.natures)||{};
  const pastilles=Object.keys(t).map(k=>
    `<button type="button" class="teinte${!libre&&k===nature?' actif':''}"
      data-act="teinte-nommee" data-n="${ech(k)}" data-c="${ech(chNature)}"
      data-l="${ech(chTeinte)}" title="${ech(k)}"
      style="background:${t[k]}"></button>`).join('');
  const courante=libre||t[nature]||'#9C9484';
  return `<div class="teintes">${pastilles}
    <label class="teinte-libre${libre?' actif':''}" title="Une couleur à vous">
      <input type="color" value="${ech(courante)}" data-ch="${ech(chTeinte)}" data-t="txt">
    </label>
    ${libre?`<button type="button" class="outil petit" data-act="teinte-oter"
      data-l="${ech(chTeinte)}">Revenir à la teinte nommée</button>`:''}
  </div>`;
}
const CSS_TEINTES=`
.teintes{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.teintes .teinte{width:26px;height:26px;border-radius:50%;border:2px solid transparent;

/* Sous le doigt, une pastille de vingt-six pixels se vise mal : elles

@media (pointer:coarse){

/* ═══════════════ les liens profonds ═══════════════
   Le codex du hub ouvre un élément directement dans son atelier :
   atelier-personnages.html#cle=orlanne */
function cleDemandee(){
  const m=/[#&]cle=([^&]+)/.exec(location.hash||'');
  return m?decodeURIComponent(m[1]):null;
}
function ouvrirDemande(liste,poser){
  const c=cleDemandee();
  if(!c)return false;
  const i=(liste||[]).findIndex(x=>x&&x.cle===c);
  if(i<0)return false;
  poser(i);
  return true;
}

/* ═══════════════ les champs engendrés ═══════════════ */
function champ(label,corps,aide,large){
  return `<div class="champ${large?' large':''}"><label>${ech(label)}</label><div>${corps}`+
    (aide?`<div class="aide">${aide}</div>`:'')+`</div></div>`;
}
function texte(ch,ph,lignes){
  const v=lire(ch);
  if(lignes)return `<textarea rows="${lignes}" data-ch="${ech(ch)}" data-t="txt" `+
    `placeholder="${ech(ph||'')}">${ech(Array.isArray(v)?v.join('\n\n'):v||'')}</textarea>`;
  return `<input data-ch="${ech(ch)}" data-t="txt" placeholder="${ech(ph||'')}" `+
    `value="${ech(v||'')}" autocomplete="off" spellcheck="false">`;
}
function nombre(ch,ph,pas){
  const v=lire(ch);
  return `<input type="number" step="${pas||'any'}" data-ch="${ech(ch)}" data-t="num" `+
    `placeholder="${ech(ph||'')}" value="${v===undefined||v===null?'':v}">`;
}
function choixListe(ch,options,vide){
  const v=lire(ch);
  return `<select data-ch="${ech(ch)}" data-t="txt">`+
    (vide?`<option value="">${ech(vide)}</option>`:'')+
    options.map(o=>{const[k,n]=Array.isArray(o)?o:[o,o];
      return `<option value="${ech(k)}"${k===v?' selected':''}>${ech(n)}</option>`;}).join('')+
    `</select>`;
}
/* Un « oui ou non » se choisit dans une liste mais se range en booléen. Le
   marqueur est explicite : le deviner d'après le nom du champ a fini par
   mordre — l'état d'une mission s'écrit lui aussi dans « vaut », et ce n'est
   pas un oui. */
function choixOuiNon(ch){
  const v=lire(ch);
  return `<select data-ch="${ech(ch)}" data-t="ouinon">`+
    `<option value="oui"${v===true?' selected':''}>oui</option>`+
    `<option value="non"${v!==true?' selected':''}>non</option></select>`;
}
function coche(ch,label){
  const v=lire(ch);
  return `<label class="chip${v?' actif':''}"><input type="checkbox" data-ch="${ech(ch)}" `+
    `data-t="bool"${v?' checked':''}>${ech(label)}</label>`;
}
function multi(ch,options,rien){
  const v=lire(ch)||[];
  if(!options.length)return `<p class="vide">${rien}</p>`;
  return `<div class="chips">`+options.map(o=>{
    const[k,n]=Array.isArray(o)?o:[o,o];
    return `<label class="chip${v.indexOf(k)>=0?' actif':''}"><input type="checkbox" `+
      `data-ch="${ech(ch)}" data-t="multi" value="${ech(k)}"${v.indexOf(k)>=0?' checked':''}>`+
      `${ech(n)}</label>`;}).join('')+`</div>`;
}
/* Les textes à trous : {ceci} entre accolades, remplacé par ce qu'on a sous la main. */
function trous(txt){
  const out=[], l=Array.isArray(txt)?txt:[txt];
  l.forEach(t=>{const re=/\{([a-zA-Z0-9_.]+)\}/g;let m;
    while((m=re.exec(String(t||''))))out.push(m[1]);});
  return out;
}
function boucher(txt,sac){
  const t=Array.isArray(txt)?pick(txt):txt;
  return String(t==null?'':t).replace(/\{([a-zA-Z0-9_.]+)\}/g,
    (m,k)=>sac[k]!==undefined?sac[k]:m);
}
/* Une valeur de texte : plusieurs paragraphes séparés par une ligne vide font
   plusieurs variantes, dont le jeu tire une au hasard. */
function texteSaisi(v){
  if(v.indexOf('\n\n')<0)return v;
  const l=v.split(/\n{2,}/).map(s=>s.trim()).filter(Boolean);
  return l.length>1?l:(l[0]||'');
}

/* ═══════════════ ouvrir et exporter ═══════════════ */
function telecharger(nom,donnees){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(donnees,null,2)],
    {type:'application/json'}));
  a.download=nom;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
/* Le dépôt de fichier, commun aux trois ateliers : on lit, on rend l'objet. */
function accueillirFichiers(surJson){
  let survol=0;
  const voile=$('#toile-depot');
  const lire1=f=>{const r=new FileReader();
    r.onload=()=>{let d;
      try{d=JSON.parse(r.result);}
      catch(e){alert('Ce fichier n\'est pas du JSON lisible.');return;}
      surJson(d);};
    r.readAsText(f);};
  addEventListener('dragenter',e=>{e.preventDefault();survol++;
    if(voile)voile.classList.add('on');});
  addEventListener('dragover',e=>e.preventDefault());
  addEventListener('dragleave',()=>{if(--survol<=0&&voile)voile.classList.remove('on');});
  addEventListener('drop',e=>{e.preventDefault();survol=0;
    if(voile)voile.classList.remove('on');
    if(e.dataTransfer.files[0])lire1(e.dataTransfer.files[0]);});
  const champFichier=$('#fichier');
  if(champFichier)champFichier.onchange=e=>{
    if(e.target.files[0])lire1(e.target.files[0]);
    e.target.value='';
  };
  return ()=>{if(champFichier)champFichier.click();};
}

/* ═══════════════ la disposition sur téléphone ═══════════════
   Sur un écran de 390 pixels, les trois colonnes empilées ne laissent que
   180 pixels au formulaire : on ne peut rien y écrire. Ici, on donne l'écran
   entier à **une** zone à la fois, et une barre en bas sert à passer de l'une à
   l'autre. Les boutons de la barre du haut se rangent dans un tiroir.

   Les quatre ateliers partagent la même ossature — #scene > aside, main, aside —
   donc ce code les sert tous les quatre sans qu'aucun n'ait à s'en occuper.

   Rien de tout cela ne s'active au-dessus de 860 pixels : sur un ordinateur,
   les trois colonnes restent côte à côte comme avant.                        */
const CSS_MOBILE=`
/* En grand écran, rien de tout cet habillage ne se voit : le tiroir est vide,
   la barre du bas n'a pas lieu d'être, et les trois zones tiennent ensemble. */
#tiroir,#voile-tiroir,#vues,#b-tiroir{display:none}

  #tiroir{position:fixed;left:0;right:0;top:0;z-index:20;

  #tiroir.ouvert{display:grid}
  #tiroir .outil{justify-content:center;padding:11px 10px;font-size:13.5px}
  #tiroir .sep,#tiroir .pousse{display:none}
  #tiroir .plein{grid-column:1/-1}
  #voile-tiroir{position:fixed;inset:0;background:#0009;z-index:19;display:none}
  #voile-tiroir.ouvert{display:block}
  #b-tiroir{flex:none;display:inline-flex;align-items:center;gap:7px;
    padding:8px 12px;border:1px solid var(--bord);border-radius:var(--r);
    background:var(--fond);font-size:13px}
  #b-tiroir b{color:var(--or)}

  /* — une seule zone à l'écran — */
  #scene{flex-direction:column;position:relative}
  #scene>aside,#scene>main{display:none;width:auto;max-height:none;flex:1;
    min-height:0;border:none}
  #scene.vue-liste>aside:first-of-type{display:flex}
  #scene.vue-feuille>main{display:flex}

  /* — la barre du bas — */

  #vues button{flex:1;padding:11px 4px 12px;font-size:11.5px;color:var(--encre-pale);

  #vues button.actif{color:var(--or);border-top-color:var(--or)}

  /* — l'état, sur une ligne qu'on peut faire défiler — */
  #etat{flex-wrap:nowrap;overflow-x:auto;gap:12px;font-size:11.5px;padding:5px 10px}

  .chip{padding:7px 12px;font-size:13px}

  .bloc>h2 button{padding:5px 10px;font-size:12px}

/* Les trois zones, dans l'ordre où la barre du bas les propose. Chaque atelier
   nomme la sienne : « le recueil », « le répertoire », « le coffre »… */
const PETIT='(max-width:860px)';
function installerMobile(noms){
  const scene=$('#scene');
  if(!scene)return;
  const barre=$('#barre');
  /* on range les boutons de la barre dans un tiroir, sans toucher au HTML */
  if(barre&&!$('#tiroir')){
    const tiroir=document.createElement('div');
    tiroir.id='tiroir';
    const voile=document.createElement('div');
    voile.id='voile-tiroir';
    /* Un retour au hub, en tête du tiroir : sur un téléphone, le bouton « page
       précédente » du navigateur n'est pas toujours à portée de pouce. */
    const retour=document.createElement('a');
    retour.className='outil plein';
    retour.href='index.html';
    retour.innerHTML='◂ Tous les ateliers';
    tiroir.appendChild(retour);
    const b=document.createElement('button');
    b.id='b-tiroir';b.innerHTML='<b>☰</b> Outils';
    barre.appendChild(b);
    /* Les boutons vivent dans la barre en grand écran, et dans le tiroir en
       petit. On les **déplace** au franchissement plutôt que de les cacher :
       cachés, la barre serait vide d'un côté ou le tiroir de l'autre. C'est
       aussi ce qui rend la même page utilisable au doigt et à la souris. */
    const outils=Array.prototype.slice.call(barre.children)
      .filter(el=>el.tagName!=='H1'&&el!==b);
    const q=matchMedia(PETIT);
    const ranger=()=>{
      const ou=q.matches?tiroir:barre;
      outils.forEach(el=>{if(el.parentNode!==ou)ou.appendChild(el);});
      /* le bouton du tiroir reste le dernier de la barre */
      if(!q.matches)barre.appendChild(b);
    };
    if(q.addEventListener)q.addEventListener('change',ranger);
    else q.addListener(ranger);
    ranger();
    document.body.appendChild(voile);
    document.body.appendChild(tiroir);
    const fermer=()=>{tiroir.classList.remove('ouvert');voile.classList.remove('ouvert');};
    b.onclick=()=>{const o=tiroir.classList.toggle('ouvert');
      voile.classList.toggle('ouvert',o);};
    voile.onclick=fermer;
    /* refermer dès qu'on a choisi quelque chose, sauf pour un menu déroulant */
    tiroir.addEventListener('click',e=>{
      if(e.target.closest('.outil'))setTimeout(fermer,60);});
  }
  /* la barre du bas */
  if(!$('#vues')){
    const zones=[['liste',noms&&noms[0]||'La liste','☰'],
                 ['feuille',noms&&noms[1]||'La fiche','✎'],
                 ['cote',noms&&noms[2]||'L\'aperçu','◫']];
    const v=document.createElement('div');
    v.id='vues';
    v.innerHTML=zones.map(([k,n,p])=>
      `<button data-vue="${k}"><span class="pastille">${p}</span>${ech(n)}</button>`).join('');
    const etat=$('#etat');
    if(etat)etat.parentNode.insertBefore(v,etat);
    else document.body.appendChild(v);
    v.addEventListener('click',e=>{
      const b=e.target.closest('[data-vue]');
      if(b)montrerVue(b.dataset.vue);
    });
  }
  montrerVue(localStorage.getItem('caravane.vue')||'feuille');
}
function montrerVue(quoi){
  const scene=$('#scene');
  if(!scene)return;
  scene.classList.remove('vue-liste','vue-feuille','vue-cote');
  scene.classList.add('vue-'+quoi);
  $$('#vues [data-vue]').forEach(b=>b.classList.toggle('actif',b.dataset.vue===quoi));
  try{localStorage.setItem('caravane.vue',quoi);}catch(e){}
  /* on repart du haut : arriver au milieu d'un formulaire désoriente */
  const z=quoi==='feuille'?$('#scene>main'):
    (quoi==='cote'?$('#volet'):$('#scene>aside'));
  if(z)z.scrollTop=0;
}
/* Choisir un élément dans la liste passe naturellement à la fiche. */
function suivreChoix(){
  const scene=$('#scene');
  if(!scene)return;
  scene.addEventListener('click',e=>{
    if(!matchMedia('(max-width:860px)').matches)return;
    const b=e.target.closest('[data-sel]');
    if(b&&b.closest('aside'))setTimeout(()=>montrerVue('feuille'),40);
  });
}
/* À appeler une fois, à la fin de chaque atelier. */

/* Les pastilles de teinte : choisir une teinte nommée efface la couleur libre,
   et réciproquement. L'atelier fournit ce qu'il faut refaire ensuite. */
function ecouterTeintes(apres){
  document.addEventListener('click',e=>{
    const b=e.target.closest('[data-act="teinte-nommee"],[data-act="teinte-oter"]');
    if(!b)return;
    if(b.dataset.act==='teinte-nommee'){
      ecrire(b.dataset.c,b.dataset.n);
      ecrire(b.dataset.l,undefined);
    }else ecrire(b.dataset.l,undefined);
    apres();
  });
}

/* ═══════════════ la saisie, en délégation ═══════════════
   Un seul écouteur pour tous les champs de tous les formulaires : ils portent
   leur chemin, le reste suit. L'atelier fournit ce qu'il faut refaire ensuite. */
function ecouterSaisie(apres){
  document.addEventListener('input',ev=>{
    const t=ev.target;
    if(t.dataset.ch===undefined)return;
    const ch=t.dataset.ch, k=t.dataset.t;
    if(/\.__/.test(ch))return;                    /* champs de travail, pas de données */
    if(k==='txt')ecrire(ch,t.tagName==='TEXTAREA'?texteSaisi(t.value):t.value);
    else if(k==='ouinon')ecrire(ch,t.value==='oui');
    else if(k==='num')ecrire(ch,t.value===''?undefined:Number(t.value));
    else if(k==='bool'){
      ecrire(ch,t.checked||undefined);
      t.closest('.chip').classList.toggle('actif',t.checked);
    }
    else if(k==='multi'){
      const cur=lire(ch)||[], i=cur.indexOf(t.value);
      if(t.checked&&i<0)cur.push(t.value);
      if(!t.checked&&i>=0)cur.splice(i,1);
      ecrire(ch,cur.length?cur:undefined);
      t.closest('.chip').classList.toggle('actif',t.checked);
    }
    apres(t,ch,k);
  });
}

/* ═══════════════ les étiquettes et leurs champs ═══════════════
   Les formulaires des ateliers écrivent

       <div class="champ"><label>Nom</label><input …></div>

   L'étiquette est **à côté** du champ, pas liée à lui : un lecteur d'écran
   annonce « zone de saisie » sans dire laquelle, et cliquer le mot ne met pas
   le curseur dedans. On les marie après coup plutôt que d'inventer un
   identifiant à la main dans les quelques centaines d'endroits qui en écrivent
   un — et comme les panneaux se réécrivent sans cesse, on refait le mariage à
   chaque fois que le DOM bouge. */
let nChamp=0;
function lierEtiquettes(racine){
  const r=racine||document;
  r.querySelectorAll('.champ label:not([for])').forEach(l=>{
    if(l.querySelector('input,select,textarea'))return;   /* déjà enveloppante */
    const p=l.closest('.champ');
    const c=p&&p.querySelector('input:not([type=hidden]),select,textarea');
    if(!c)return;
    if(!c.id)c.id='champ-'+(++nChamp);
    l.setAttribute('for',c.id);
  });
  /* Deux formes que le mariage par .champ ne couvre pas.
     Le menu « + Jalon… » : sa première option tient lieu d'étiquette, mais elle
     ne s'annonce pas comme telle. */
  r.querySelectorAll('select.ajout:not([aria-label])').forEach(s=>{
    const o=s.options[0];
    const t=o?o.textContent.replace(/^[+…\s]*/,'').replace(/…$/,'').trim():'';
    s.setAttribute('aria-label',t||'Ajouter');
  });
  /* Un nombre encadré de deux mots dans une rangée — « de 3 à 9 » : c'est le
     mot d'avant qui le nomme. */
  r.querySelectorAll('.rangee>input:not([aria-label]),.rangee>select:not([aria-label])')
   .forEach(c=>{
    if(c.type==='hidden')return;
    if(c.id&&document.querySelector('label[for="'+CSS.escape(c.id)+'"]'))return;
    if(c.closest('label'))return;
    const av=c.previousElementSibling;
    const mot=av&&av.tagName==='SPAN'?av.textContent.trim():'';
    if(mot)c.setAttribute('aria-label',mot);
  });
}
function suivreLesChamps(){
  lierEtiquettes();
  let prevu=false;
  new MutationObserver(()=>{
    if(prevu)return;
    prevu=true;
    requestAnimationFrame(()=>{prevu=false;lierEtiquettes();});
  }).observe(document.body,{childList:true,subtree:true});
}
