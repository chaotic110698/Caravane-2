/* ── se voir au clavier ──
   Le contour par défaut du navigateur est un liseré noir : sur un fond de
   vélin brûlé il est invisible, et l'on ne sait plus où l'on est. Celui-ci ne
   paraît qu'au clavier — :focus-visible — donc la souris n'y voit rien. */
:focus-visible{outline:2px solid var(--or);outline-offset:2px;border-radius:2px}
#bandeau a:focus-visible,#bandeau button:focus-visible{outline-offset:1px}
`;

let bandeauVue='codex', bandeauCherche='', bandeauPose=false;

const rondBandeau=()=>`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"`+
  ` fill="none" stroke="currentColor" stroke-width="2"/></svg>`;
function jetonBandeau(e){
  if(e.svg)return `<svg viewBox="0 0 24 24">${e.svg}</svg>`;
  if(e.glyphe)return svgGlypheDe(e.glyphe,'currentColor')||rondBandeau();
  return rondBandeau();
}

function installerBandeau(){
  if(bandeauPose||typeof document==='undefined')return;
  bandeauPose=true;
  const st=document.createElement('style');
  st.textContent=STYLE_BANDEAU;
  document.head.appendChild(st);

  const ici=pageIci();
  const poignee=document.createElement('button');
  poignee.id='bandeau-poignee';
  poignee.type='button';
  poignee.setAttribute('aria-expanded','false');
  poignee.title='Ce que vous avez écrit';
  poignee.setAttribute('aria-label','Ce que vous avez écrit');
  poignee.innerHTML='<span class="compte"></span>';

  const voile=document.createElement('div');
  voile.id='bandeau-voile';

  const b=document.createElement('aside');
  b.id='bandeau';
  b.setAttribute('aria-label','Ce que vous avez écrit');
  b.innerHTML=`
    <div class="tete"><h2>Ce que vous avez écrit</h2>
      <button class="fermer" type="button" id="bd-fermer">Fermer</button></div>
    <nav id="bd-outils">`+OUTILS_TOUS.map(o=>
      `<a href="${o.f}" style="--teinte:${o.t}"${o.f===ici?' class="ici" aria-current="page"':''}
        ><span class="pion"></span>${ech(o.nom)}</a>`).join('')+`</nav>
    <div class="corps">
      <div id="bd-vues">
        <button type="button" data-bvue="codex" class="actif">Le codex</button>
        <button type="button" data-bvue="charpente">La charpente</button>
      </div>
      <div id="bd-codex"></div>
      <div id="bd-charpente" hidden></div>
    </div>`;

  document.body.appendChild(poignee);
  document.body.appendChild(voile);
  document.body.appendChild(b);

  /* Fermé, le tiroir reste dans la page : sans inert, la tabulation traverse
     ses dix liens hors écran avant d'atteindre quoi que ce soit. Ouvert, le
     focus y entre — sinon il faudrait retraverser toute la page pour lire ce
     qu'on vient d'ouvrir — et à la fermeture il revient d'où il venait. */
  let dOu=null;
  const inerter=o=>{
    b.toggleAttribute('inert',!o);
    b.setAttribute('aria-hidden',String(!o));
  };
  const ouvrir=o=>{
    if(o&&!b.classList.contains('ouvert'))dOu=document.activeElement;
    b.classList.toggle('ouvert',o);
    voile.classList.toggle('ouvert',o);
    poignee.setAttribute('aria-expanded',String(o));
    inerter(o);
    if(o){
      rendreBandeau();
      const premier=$('#bd-cherche',b)||$('#bd-fermer',b);
      if(premier)premier.focus({preventScroll:true});
    }else{
      /* On rend le focus d'où il venait — mais une ouverture au clavier depuis
         une page qui n'avait rien de focalisé le laisserait sur le corps, et
         l'on repartirait du haut. La poignée est alors le bon endroit : c'est
         là qu'on vient de refermer. */
      const cible=(dOu&&dOu.isConnected&&dOu!==document.body)?dOu:poignee;
      dOu=null;
      if(cible&&cible.focus)cible.focus({preventScroll:true});
    }
  };
  inerter(false);
  poignee.onclick=()=>ouvrir(!b.classList.contains('ouvert'));
  voile.onclick=()=>ouvrir(false);
  $('#bd-fermer',b).onclick=()=>ouvrir(false);
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&b.classList.contains('ouvert')){ouvrir(false);}
  });
  b.addEventListener('click',e=>{
    const t=e.target.closest('[data-bvue]');
    if(!t)return;
    bandeauVue=t.dataset.bvue;
    rendreBandeau();
  });
  b.addEventListener('input',e=>{
    if(e.target.id!=='bd-cherche')return;
    bandeauCherche=e.target.value;
    const p=e.target.selectionStart;
    rendreCodexBandeau();
    const c=$('#bd-cherche',b);
    if(c){c.focus();c.setSelectionRange(p,p);}
  });

  /* Le compteur sur la poignée dit, sans l'ouvrir, combien de choses on a
     écrites. C'est ce qui donne envie d'aller voir. */
  const compter=()=>{
    chargerDepot();
    const n=depotCodex().reduce((s,c)=>s+c.entrees.length,0);
    $('.compte',poignee).textContent=n||'';
    if(b.classList.contains('ouvert'))rendreBandeau();
  };
  suivreDepot(compter);
  addEventListener('pageshow',compter);
  compter();
  suivreLesChamps();
}

function rendreBandeau(){
  chargerDepot();
  const codex=bandeauVue==='codex';
  $('#bd-codex').hidden=!codex;
  $('#bd-charpente').hidden=codex;
  document.querySelectorAll('#bd-vues button').forEach(x=>
    x.classList.toggle('actif',x.dataset.bvue===bandeauVue));
  if(codex)rendreCodexBandeau(); else rendreCharpenteBandeau();
}

function rendreCodexBandeau(){
  const boite=$('#bd-codex');
  if(!boite)return;
  const cats=depotCodex();
  const q=bandeauCherche.trim().toLowerCase();
  const garde=e=>!q||((e.nom+' '+e.cle+' '+e.detail).toLowerCase().indexOf(q)>=0);
  const total=cats.reduce((n,c)=>n+c.entrees.length,0);
  if(!total){
    boite.innerHTML=`<p class="bloc" id="bd-vide">Rien encore. Ce que vous créerez dans les
      ateliers viendra se ranger ici, par catégorie — et un bouton rouvrira chaque élément
      dans l'outil qui l'a fait.</p>`;
    return;
  }
  const pleines=cats.filter(c=>c.entrees.length);
  const vus=pleines.reduce((n,c)=>n+c.entrees.filter(garde).length,0);
  let h=`<input id="bd-cherche" placeholder="Chercher dans le codex…"
    value="${ech(bandeauCherche)}" autocomplete="off" spellcheck="false">`;
  if(q&&!vus)h+=`<p class="rien" id="bd-rien">Rien de ce nom-là dans le codex.</p>`;
  h+=pleines.map(c=>{
    const gardees=c.entrees.filter(garde);
    if(q&&!gardees.length)return '';
    const n=c.entrees.length;
    const ouvert=(q||n<=8)?' open':'';
    return `<details class="cat"${ouvert} data-cat="${ech(c.nom)}">
      <summary><span class="chevron">▶</span>${ech(c.titre)}
        <span class="compte">${n} ${ech(n>1?c.des:c.un)}</span></summary>
      <div class="entrees">`+
      (gardees.length?gardees.map(e=>`
        <div class="entree" style="--teinte:${ech(e.teinte)}">
          <span class="jeton">${jetonBandeau(e)}</span>
          <span class="txt"><b>${ech(e.nom||e.cle||'sans nom')}</b>
            <small>${ech(e.detail)}${e.detail&&e.manque?' · ':''}`+
            `${e.manque?`<span class="manque">${ech(e.manque)}</span>`:''}</small></span>
          <a class="ouvrir" href="${ech(e.lien)}">Ouvrir</a>
        </div>`).join('')
        :`<p class="rien">Rien de ce nom-là ici.</p>`)+
      `</div></details>`;
  }).join('');
  boite.innerHTML=h;
}

function rendreCharpenteBandeau(){
  const boite=$('#bd-charpente');
  if(!boite)return;
  const c=depotCharpente();
  if(!c.compte.missions&&!c.compte.dialogues){
    boite.innerHTML=`<p class="bloc">Rien à charpenter. Écrivez des <b>missions</b> et des
      <b>conversations</b> : dès qu'une conversation confie une mission, ou qu'une mission
      accomplie en ouvre une autre, l'enchaînement paraîtra ici.</p>`;
    return;
  }
  let h=`<div class="bloc"><div class="mesures">
    <span>Missions d'histoire</span><b>${c.compte.missions}</b>
    <span>Conversations</span><b>${c.compte.dialogues}</b>
    <span>Enchaînements</span><b>${c.compte.liens}</b>
    <span>Départs</span><b>${c.compte.racines}</b></div>
    <p style="margin-top:8px">Ce qui n'attend rien est en haut ; on descend vers ce que
      cela ouvre. Un élément déjà vu plus haut n'est pas redéveloppé.</p></div>`;
  if(c.soucis.length){
    const durs=c.soucis.filter(x=>x.dur), doux=c.soucis.filter(x=>!x.dur);
    h+=`<div class="trous"><h3>Les trous de la charpente</h3><ul>`+
      durs.map(x=>`<li class="dur">${x.txt}</li>`).join('')+
      doux.map(x=>`<li>${x.txt}</li>`).join('')+`</ul></div>`;
  }
  h+=c.arbres.map(a=>`<div class="tronc">${brancherBandeau(a,true)}</div>`).join('');
  boite.innerHTML=h;
}

function brancherBandeau(n,racine){
  const teinte=(n.qui&&n.qui.teinte)||(n.genre==='mission'?'#4A7BC8':'#6E9B6A');
  const dessin=n.qui?svgGlypheDe(n.qui.glyphe,'currentColor'):'';
  const genre=n.genre==='mission'?'mission':'conversation';
  let h='';
  if(!racine&&n.relation)h+=`<span class="lien-dit">↳ <b>${ech(n.relation)}</b></span>`;
  h+=`<div class="oeud${n.repris?' repris':''}${n.boucle?' boucle':''}"
        style="--teinte:${ech(teinte)}">
    <span class="jeton">${dessin||rondBandeau()}</span>
    <span class="txt"><b>${ech(n.nom)}</b>
      <span class="qui"><span class="genre">${genre}</span>`+
      (n.qui?` · <i>${ech(n.qui.nom)}</i>`+
        (n.qui.inconnu?' <b style="color:var(--minium)">(inconnu)</b>'
          :n.qui.lieu?' à '+ech(n.qui.lieu):'')
       :n.genre==='mission'?' · sans commanditaire':'')+
      `</span>`+
      (n.mentions.length&&!n.repris
        ?`<span class="mentions">${n.mentions.map(ech).join(' · ')}</span>`:'')+
    `</span>`+
    (n.repris?`<span class="renvoi">↩ plus haut</span>`
      :n.boucle?`<span class="renvoi" style="color:var(--minium)">↺ boucle</span>`
      :`<a class="ouvrir" href="${ech(n.lien)}">Ouvrir</a>`)+
  `</div>`;
  if(n.enfants&&n.enfants.length)
    h+=n.enfants.map((e,i)=>`<div class="branche${
      i===n.enfants.length-1&&!(e.enfants||[]).length?' terminale':''
    }">${brancherBandeau(e)}</div>`).join('');
  return h;
}

/* On l'installe dès que le corps existe : les ateliers appellent leur propre
   amorce, et aucun n'a à penser au bandeau. */
if(typeof document!=='undefined'){
  if(document.readyState==='loading')
    document.addEventListener('DOMContentLoaded',installerBandeau);
  else installerBandeau();
}

</script>

<script>
'use strict';
/* ═══════════════ le catalogue, injecté par outils/construire.mjs ═══════════════
   Tout ce que cet outil sait dire vient de data/vocabulaire-evenements.json : les
   effets, leurs réglages, leurs explications, les interrogations, les formes de
   choix. Rien n'est écrit en dur ici. Ajouter une entrée au catalogue et relancer
   « node outils/construire.mjs » suffit à la faire apparaître dans les formulaires,
   dans les contrôles et dans le mode d'emploi. */
const REF=JSON.parse(document.getElementById('reference').textContent);
const V=REF.vocabulaire;

/* ═══════════════ le modèle ═══════════════ */
let R={format:'caravane.evenements.v1',evenements:[]};
let sel=0, onglet='apercu', filtre='';
let ESSAI={etapes:6,or:900,lieues:120,reputation:52,karma:50,gardes:2,place:400,
  charge:620,valeurSoute:1400,etatConvoi:78,vigilance:58,agilite:62,negoce:60,
  puissance:1,chien:false};

const EV=()=>R.evenements[sel]||null;
racineEst(EV);
/* Le contenu va au dépôt partagé, l'état de travail reste privé ici. */
sectionEst('evenements',()=>R);
sauvegardeEst('caravane.atelier-evenements.v1',
  ()=>({recueil:R,essai:ESSAI,sel:sel,monde:MONDE}));
function relire(){
  /* le contenu : celui du dépôt, qu'un autre atelier a peut-être enrichi */
  const c=depotLire('evenements');
  if(c&&Array.isArray(c.evenements))R=c;
  mondeDuDepot();
  /* l'état de travail : le nôtre seulement */
  const d=relireSauve();
  if(!d)return !!c;
  if(d.essai)Object.assign(ESSAI,d.essai);
  sel=Math.max(0,Math.min(R.evenements.length-1,d.sel|0));
  return true;
}

/* ═══════════════ l'état d'essai ═══════════════
   Les mêmes formules que le moteur, pour que les montants annoncés ici soient
   ceux que le joueur verra. */
function inter(nom,extra){
  const S=ESSAI;
  switch(nom){
    case 'or':return S.or;
    case 'etapes':return S.etapes;
    case 'lieues':return S.lieues;
    case 'reputation':return S.reputation;
    case 'karma':return S.karma;
    case 'gardes':return S.gardes;
    case 'troupe':return S.gardes+1;
    case 'place':return S.place;
    case 'charge':return S.charge;
    case 'stock':return Math.round(S.charge/4);        /* estimation : un bien sur quatre */
    case 'valeurSoute':return S.valeurSoute;
    case 'etatConvoi':return S.etatConvoi;
    case 'chien':return !!S.chien;
    case 'vigilance':return S.vigilance;
    case 'agilite':return S.agilite;
    case 'negoce':return S.negoce;
    case 'puissance':return S.puissance;
    case 'armeFamille':return S.gardes>0;
    case 'mise':return Math.round(clamp(18+S.etapes*4,18,9e9));
    case 'coutGarde':return Math.round(70+S.etapes*7);
    case 'tribut':return Math.round(clamp((S.or+S.valeurSoute)*(.16+S.etapes*.005),15,9e9));
    case 'soin':return Math.round((100-S.etatConvoi)*2.2);
    default:return 0;
  }
}
const bonusKarma=()=>clamp(Math.round((ESSAI.karma-50)/17),-3,3);
const bonusConvoi=()=>clamp(Math.round((ESSAI.etatConvoi-66)/15),-2,2);

/* ═══════════════ les valeurs ═══════════════ */
function formeValeur(v){
  if(v===undefined||v===null)return 'vide';
  if(typeof v==='number')return 'nombre';
  if(Array.isArray(v))return 'fourchette';
  if(typeof v==='object'&&v.selon!==undefined)return 'reference';
  return 'formule';
}
function evaluer(v,moyenne){
  if(v===undefined||v===null)return 0;
  if(typeof v==='number')return v;
  if(Array.isArray(v))return moyenne?(v[0]+v[1])/2:rnd(v[0],v[1]);
  let n=0;
  if(v.selon!==undefined)n=Number(inter(v.selon))||0;
  if(v.base!==undefined)n+=v.base;
  if(v.parEtape!==undefined)n+=v.parEtape*ESSAI.etapes;
  if(v.parGarde!==undefined)n+=v.parGarde*ESSAI.gardes;
  if(v.parLieue!==undefined)n+=v.parLieue*ESSAI.lieues;
  if(v.divise!==undefined&&v.divise)n=n/v.divise;
  if(v.fois!==undefined)n*=Array.isArray(v.fois)
    ?(moyenne?(v.fois[0]+v.fois[1])/2:rnd(v.fois[0],v.fois[1])):v.fois;
  return n;
}
const REFERENCES=['mise','coutGarde','tribut','or','valeurSoute','charge','soin'];

/* ═══════════════ jouer un événement ═══════════════
   Sert deux fois : l'aperçu, qui en joue un exemplaire, et le tirage à blanc,
   qui en joue deux cents pour montrer la dispersion. */
function jeter(carac,seuil){
  const de=ri(1,20),mods=[];
  const c=Math.round(evaluer(carac));
  if(c)mods.push(['aptitude',c]);
  const k=bonusKarma();if(k)mods.push(['karma',k]);
  const b=bonusConvoi();if(b)mods.push(['convoi',b]);
  const total=de+mods.reduce((s,m)=>s+m[1],0);
  return {de:de,mods:mods,total:total,seuil:seuil,
    reussi:de===20?true:(de===1?false:total>=seuil),
    critique:de===20,desastre:de===1};
}
function conditionsVraies(liste){
  if(!liste||!liste.length)return true;
  return liste.every(c=>{
    const v=inter(c.quoi,c);
    if(c.vaut!==undefined)return !!v===!!c.vaut;
    if(c.min!==undefined&&v<evaluer(c.min,true))return false;
    if(c.max!==undefined&&v>evaluer(c.max,true))return false;
    return true;
  });
}
function nomBien(k){return REF.biens[k]||k;}
function appliquer(effets,sac,bilan){
  (effets||[]).forEach(e=>{
    const d=V.effets[e.faire];
    let retenu='—';
    switch(e.faire){
      case 'or':{const n=Math.round(evaluer(e.de));bilan.or+=n;retenu=fmt(Math.abs(n));break;}
      case 'reputation':bilan.reputation+=Number(e.de)||0;break;
      case 'karma':bilan.karma+=Number(e.de)||0;break;
      case 'allonger':{const n=Math.min(Number(e.de)||0,Math.max(0,4-bilan.etapes));
        bilan.etapes+=n;retenu=fmt(n);break;}
      case 'abimer':bilan.usure+=evaluer(e.combien);break;
      case 'delester':case 'briserFragile':{
        const p=evaluer(e.part);bilan.largue+=p;
        const kg=Math.round(ESSAI.charge*p);
        bilan.orPerdu+=Math.round(ESSAI.valeurSoute*p);
        retenu=fmt(Math.round(kg*.6))+' kg de '+nomBien(pick(Object.keys(REF.biens))).toLowerCase()+
          ' et '+fmt(Math.round(kg*.4))+' kg de '+nomBien(pick(Object.keys(REF.biens))).toLowerCase();
        break;}
      case 'reposer':bilan.soin+=evaluer(e.part);break;
      case 'blesserTroupe':{const t=evaluer(e.total);bilan.degats+=t;
        retenu=pick(REF.nomsGardes||['Corvin']);break;}
      case 'combat':{const j=jeter(Math.round(4*Math.log(Math.max(1.6*(1+ESSAI.gardes),.25))),
          clamp(14+Math.round(4*Math.log(Math.max(.5+ESSAI.etapes*.28,.25))),3,30));
        bilan.combats++;
        if(j.reussi){const butin=Math.round((25+ESSAI.etapes*9)*rnd(.7,1.4));
          bilan.or+=butin;bilan.combatsGagnes++;
          retenu='La ligne tient ; les pillards décrochent en laissant '+fmt(butin)+' po derrière eux.';
        }else{bilan.largue+=rnd(.25,.45);bilan.degats+=ri(42,74);
          retenu='La ligne cède : les chariots sont éventrés et la troupe saigne.';}
        break;}
      case 'charger':{const kg=Math.round(evaluer(e.kg));
        const paye=e.prixAuKilo!==undefined?Math.round(kg*evaluer(e.prixAuKilo)):0;
        bilan.or-=paye;bilan.kg+=kg;
        retenu=fmt(kg)+' kg de '+nomBien(e.bien==='auHasard'?pick(Object.keys(REF.biens)):e.bien).toLowerCase();
        break;}
      case 'decharger':{const kg=Math.round(evaluer(e.kg));
        const gain=e.prixAuKilo!==undefined?Math.round(kg*evaluer(e.prixAuKilo)):0;
        bilan.or+=gain;bilan.kg-=kg;
        retenu=fmt(kg)+' kg pour '+fmt(gain)+' po';break;}
      case 'armeTrouvee':retenu=(REF.armes[pick(Object.keys(REF.armes))]||'une arme').toLowerCase();break;
      case 'donnerArme':retenu=REF.armes[e.arme]||e.arme||'—';break;
      case 'chien':retenu=pick(REF.nomsChiens||['Ronce']);break;
      case 'recruter':retenu=pick(REF.nomsGardes||['Maren']);bilan.gardes++;break;
      case 'rumeur':retenu=nomBien(e.bien==='auHasard'||!e.bien?pick(Object.keys(REF.biens)):e.bien).toLowerCase();break;
      case 'escorte':bilan.escorte+=Number(e.de)||0;break;
      default:retenu=d?d.nom:e.faire;
    }
    if(e.nomme){
      sac[e.nomme]=retenu;
      /* les résultats à facettes, pour que {melee.butin} ne reste pas en plan */
      sac[e.nomme+'.noms']=retenu;sac[e.nomme+'.morts']='personne';
      sac[e.nomme+'.butin']=retenu;sac[e.nomme+'.gagne']='oui';
      sac[e.nomme+'.kg']=retenu;sac[e.nomme+'.bien']=retenu;
      sac[e.nomme+'.paye']=retenu;sac[e.nomme+'.gain']=retenu;
    }
  });
}
function bilanVierge(){
  return {or:0,reputation:0,karma:0,etapes:0,usure:0,largue:0,soin:0,degats:0,
    kg:0,gardes:0,escorte:0,orPerdu:0,combats:0,combatsGagnes:0};
}
function contexte(){
  const l=listeOu('lieux');
  const ville=l.length?pick(l)[1]:'Aurelium', dest=l.length?pick(l)[1]:'Le Marteau-Bas';
  const c=listeOu('contrees');
  const s={ville:ville,destination:dest,contree:c.length?pick(c)[1]:'les Terres humaines',
    chien:ESSAI.chien?pick(REF.nomsChiens||['Ronce']):'le chien',
    garde:pick(REF.nomsGardes||['Corvin']),
    bien:nomBien(pick(Object.keys(REF.biens))).toLowerCase()};
  Object.keys(V.interrogations).forEach(k=>{
    const v=inter(k);
    s[k]=typeof v==='boolean'?(v?'oui':'non'):fmt(v);
  });
  return s;
}
/* La note sous un bouton annonce ce que le choix coûtera — avant de le prendre.
   Elle peut donc citer un résultat qui n'a pas encore eu lieu : on l'évalue à
   vide, en moyenne, pour montrer une prévision stable plutôt qu'un tirage. */
function toutesLesListes(c){
  const l=[c.effets];
  ['reussi','rate','gagne','perd','oui','non'].forEach(k=>{if(c[k])l.push(c[k].effets);});
  if(c.jet&&c.jet.paliers)c.jet.paliers.forEach(p=>l.push(p.effets));
  return l;
}
function nomsChoix(c){
  const out=[];
  toutesLesListes(c).forEach(l=>(l||[]).forEach(e=>{if(e.nomme)out.push(e.nomme);}));
  return out;
}
function prevoir(c){
  const out={};
  toutesLesListes(c).forEach(l=>(l||[]).forEach(e=>{
    if(!e.nomme||out[e.nomme]!==undefined)return;
    switch(e.faire){
      case 'or':out[e.nomme]=fmt(Math.abs(evaluer(e.de,true)));break;
      case 'allonger':out[e.nomme]=fmt(evaluer(e.de,true));break;
      case 'delester':case 'briserFragile':
        out[e.nomme]=Math.round(evaluer(e.part,true)*100)+' %';break;
      case 'charger':case 'decharger':out[e.nomme]=fmt(evaluer(e.kg,true))+' kg';break;
      case 'blesserTroupe':out[e.nomme]='la troupe';break;
      default:out[e.nomme]=(V.effets[e.faire]||{nom:e.faire}).nom.toLowerCase();
    }
  }));
  return out;
}
/* La forme d'un choix : une seule des quatre, on la reconnaît à ses champs. */
function forme(c){
  if(c.jet)return 'jet';
  if(c.pari)return 'pari';
  if(c.selon)return 'selon';
  return 'direct';
}
function resoudre(c){
  const sac=contexte(), bilan=bilanVierge();
  let issue=null, de=null, verdict='', classe='';
  const f=forme(c);
  if(f==='direct'){issue=c;}
  else if(f==='jet'){
    const j=c.jet;
    if(j.paliers&&j.paliers.length){
      de=jeter(j.carac,0);
      issue=j.paliers.find(p=>(p.min===undefined||de.total>=evaluer(p.min,true))&&
        (p.max===undefined||de.total<=evaluer(p.max,true)))||j.paliers[j.paliers.length-1];
      verdict=issue.verdict||'';classe=issue.classe||'';
    }else{
      de=jeter(j.carac,evaluer(j.seuil,true));
      issue=de.reussi?c.reussi:c.rate;
      verdict=de.critique?'Coup du sort !':(de.desastre?'Catastrophe':(de.reussi?'Réussite':'Échec'));
      classe=(de.critique||de.desastre)?'crit':(de.reussi?'reussi':'rate');
    }
    de.titre=j.titre||'';
  }else if(f==='pari'){
    const p=c.pari, mise=Math.round(evaluer(p.mise,true));
    const carac=Math.round(evaluer(p.carac));
    const seuil=clamp(Math.round(21-20*clamp(p.chance===undefined?.5:p.chance,.05,.95))+carac+2,2,26);
    de=jeter(p.carac,seuil);de.titre='Pari';
    verdict=de.reussi?'Gagné':'Perdu';classe=de.reussi?'reussi':'rate';
    issue=de.reussi?c.gagne:c.perd;
    bilan.or+=de.reussi?mise:-mise;
    sac.mise=fmt(mise);
  }else{
    const oui=conditionsVraies(c.selon);
    issue=oui?c.oui:c.non;
    verdict=oui?'Oui':'Non';
  }
  issue=issue||{};
  /* pour une issue certaine, l'issue est le choix lui-même : ses effets sont déjà là */
  appliquer(issue.effets,sac,bilan);
  return {texte:boucher(issue.texte,sac),de:de,verdict:verdict,classe:classe,
    bilan:bilan,sac:sac,issue:issue};
}

/* ═══════════════ engendrer les formulaires ═══════════════ */
/* Le champ « valeur » : quatre écritures possibles, aucune à taper. */
function valeur(ch,libre){
  const v=lire(ch), f=formeValeur(v);
  const opts=[['vide','— rien —'],['nombre','Un nombre'],['fourchette','Une fourchette'],
    ['formule','Une formule'],['reference','Une référence']].filter(o=>libre||o[0]!=='vide');
  let corps='';
  if(f==='nombre')corps=nombre(ch);
  else if(f==='fourchette')corps=`<div class="rangee"><span class="mot fixe">de</span>`+
    nombre(ch+'.0')+`<span class="mot fixe">à</span>`+nombre(ch+'.1')+`</div>`;
  else if(f==='formule')corps=`<div class="grille4">`+
    `<div><label>au départ</label>${nombre(ch+'.base')}</div>`+
    `<div><label>par étape</label>${nombre(ch+'.parEtape')}</div>`+
    `<div><label>par garde</label>${nombre(ch+'.parGarde')}</div>`+
    `<div><label>multiplié par</label>${nombre(ch+'.fois')}</div></div>`;
  else if(f==='reference')corps=`<div class="rangee">`+
    choixListe(ch+'.selon',REFERENCES.map(k=>[k,V.interrogations[k]?V.interrogations[k].nom:k]))+
    `<span class="mot fixe">×</span>`+nombre(ch+'.fois')+`</div>`;
  const val=f==='vide'?'':`<div class="apercu-val">≈ ${fmt(evaluer(v,true))} `+
    `<span style="opacity:.6">avec le convoi d'essai</span></div>`;
  return `<div class="valeur"><select data-ch="${ech(ch)}" data-t="forme">`+
    opts.map(o=>`<option value="${o[0]}"${o[0]===f?' selected':''}>${ech(o[1])}</option>`).join('')+
    `</select>${corps}${val}</div>`;
}
function neuveValeur(f){
  if(f==='nombre')return 0;
  if(f==='fourchette')return [0,1];
  if(f==='formule')return {base:0};
  if(f==='reference')return {selon:'mise'};
  return undefined;
}
/* Un réglage d'effet, engendré depuis sa description dans le catalogue. */
function reglage(ch,d){
  let corps;
  if(d.type==='valeur')corps=valeur(ch,!d.requis);
  else if(d.type==='fraction'||d.type==='nombre')corps=nombre(ch,d.defaut!==undefined?String(d.defaut):'',
    d.type==='fraction'?'0.01':'any');
  else if(d.type==='choix')corps=choixListe(ch,d.valeurs.map(x=>[x,x]),d.requis?'':'— au choix —');
  else if(d.type==='bien')corps=choixListe(ch,[['auHasard','Au hasard']].concat(
    Object.entries(REF.biens)),d.requis?'':'— rien —');
  else if(d.type==='arme')corps=choixListe(ch,Object.entries(REF.armes),d.requis?'':'— au hasard —');
  else if(d.type==='metier')corps=choixListe(ch,[['auHasard','Au hasard']].concat(
    Object.entries(REF.metiers)),'');
  else if(d.type==='booleen')corps=coche(ch,'oui');
  else corps=texte(ch);
  return champ(d.nom,corps,(d.aide||'')+(d.requis?' <b>Obligatoire.</b>':''));
}
function blocEffets(ch){
  const l=lire(ch)||[];
  return `<div class="pile">`+l.map((e,i)=>{
    const d=V.effets[e.faire]||{nom:e.faire,explique:'Effet inconnu du catalogue.',parametres:{}};
    return `<div class="effet"><header><b>${ech(d.nom)}</b>`+
      `<button data-act="effet-haut" data-ch="${ech(ch)}" data-i="${i}" title="Monter">↑</button>`+
      `<button data-act="effet-bas" data-ch="${ech(ch)}" data-i="${i}" title="Descendre">↓</button>`+
      `<button data-act="effet-oter" data-ch="${ech(ch)}" data-i="${i}" title="Retirer">✕</button>`+
      `</header><div class="corps"><p class="explique">${ech(d.explique)}</p>`+
      Object.entries(d.parametres||{}).map(([p,dd])=>reglage(ch+'.'+i+'.'+p,dd)).join('')+
      (d.nomme?champ('Retenir sous le nom',texte(ch+'.'+i+'.nomme','perdu'),
        ech(d.nomme.explique)+(d.nomme.exemple?` <em>Ex. : ${ech(d.nomme.exemple)}</em>`:'')):'')+
      `</div></div>`;}).join('')+
    `<select class="ajout" data-act="effet-ajout" data-ch="${ech(ch)}">`+
    `<option value="">+ Ajouter un effet…</option>`+
    Object.entries(V.effets).map(([k,d])=>`<option value="${ech(k)}">${ech(d.nom)}</option>`).join('')+
    `</select></div>`;
}
function blocConditions(ch,avecSinon,titre){
  const l=lire(ch)||[];
  const inters=Object.entries(V.interrogations).map(([k,d])=>[k,d.nom]);
  return `<div class="pile">`+(l.length?'':`<p class="vide">Aucune — ${ech(titre)}</p>`)+
    l.map((c,i)=>{
      const d=V.interrogations[c.quoi]||{};
      const oui=d.unite==='oui ou non';
      return `<div class="effet"><header><b>${ech(d.nom||c.quoi||'?')}</b>`+
        `<button data-act="cond-oter" data-ch="${ech(ch)}" data-i="${i}">✕</button></header>`+
        `<div class="corps">`+
        champ('Ce qu\'on regarde',choixListe(ch+'.'+i+'.quoi',inters))+
        (d.demande==='bien'?champ('Quelle marchandise',
          choixListe(ch+'.'+i+'.bien',Object.entries(REF.biens))):'')+
        (d.demande==='famille'?champ('Quelle famille',
          choixListe(ch+'.'+i+'.famille',Object.entries(REF.familles))):'')+
        (oui?champ('Doit valoir',choixOuiNon(ch+'.'+i+'.vaut'))
            :champ('Au moins',valeur(ch+'.'+i+'.min',true))+
             champ('Au plus',valeur(ch+'.'+i+'.max',true)))+
        (avecSinon?champ('Raison affichée',texte(ch+'.'+i+'.sinon','Il vous manque 40 po'),
          'Le joueur voit ce texte sur le bouton grisé. <b>Sans lui, il ne comprend pas.</b>'):'')+
        `</div></div>`;}).join('')+
    `<button class="ajout" data-act="cond-ajout" data-ch="${ech(ch)}">+ Ajouter une condition</button>`+
    `</div>`;
}
function blocIssue(ch,titre,teinte){
  return `<div class="issue ${teinte||''}"><h4>${ech(titre)}</h4>`+
    champ('Ce qui se passe',blocEffets(ch+'.effets'),'',true)+
    champ('Ce qu\'on lit',texte(ch+'.texte','',3),
      'Les accolades citent un résultat retenu : <b>{perdu}</b>. Une ligne vide entre deux '+
      'paragraphes fait deux variantes, tirées au hasard.',true)+
    `</div>`;
}

/* ═══════════════ la feuille ═══════════════ */
function rendreFeuille(){
  const f=$('#feuille'), garde=f.scrollTop;
  const e=EV();
  if(!e){f.innerHTML=`<p class="vide" style="padding:30px;text-align:center">`+
    `Aucun événement. <b>+ Événement</b> pour commencer, ou <b>Exemples</b> pour partir `+
    `de quatre événements du jeu déjà convertis.</p>`;return;}

  let h='';
  /* ── identité ── */
  h+=`<div class="bloc"><h2>L'événement</h2><div class="corps">`+
    champ('Titre',texte('titre','Le quai des brumes'))+
    champ('Clé',`<div class="rangee">${texte('cle','quai-des-brumes')}`+
      `<button class="outil fixe" data-act="cle-auto">Depuis le titre</button></div>`,
      'L\'identifiant du fichier. Minuscules et tirets, unique dans le recueil.')+
    champ('Ligne au-dessus',texte('oeil','Sur la route'),
      'La petite ligne en petites capitales : <b>Sur la route</b>, <b>Rencontre</b>, <b>Halte</b>.')+
    champ('Importance',choixListe('genre',[['majeur','Majeur — une vraie décision'],
      ['mineur','Mineur — une saynète']]))+
    champ('Fréquence',`<div class="rangee"><span class="mot fixe">de base</span>`+
      nombre('poids.base','1')+`<span class="mot fixe">et par étape</span>`+
      nombre('poids.parEtape','0')+`</div>`,
      `Relative aux autres. <b>${ech(dec(poidsIci()))}</b> à l'étape ${ESSAI.etapes} : `+
      `${ech(motPoids())}.`)+
    `</div></div>`;

  /* ── quand et où ── */
  h+=`<div class="bloc"><h2>Quand et où</h2><div class="corps">`+
    champ('Le moment',choixListe('quand',Object.entries(V.moments).map(([k,m])=>
      [k,m.nom+' — '+m.explique.replace(/\.$/,'')]),''),'À défaut : en chemin.')+
    champ('Sur la carte',multi('ou.cartes',listeOu('cartes'),
      'Chargez un <b>monde.json</b> pour choisir une carte.'),'',true)+
    champ('Dans ces lieux',multi('ou.lieux',listeOu('lieux'),
      'Chargez un <b>monde.json</b> pour choisir des lieux précis.'),'',true)+
    champ('Dans ces contrées',multi('ou.contrees',listeOu('contrees'),
      'Chargez un <b>monde.json</b> pour choisir des contrées.'),'',true)+
    champ('Ces tailles de lieu',multi('ou.rangs',listeOu('rangs'),''),'',true)+
    champ('Ces natures de lieu',multi('ou.traits',listeOu('traits'),''),'',true)+
    champ('Ces terrains',multi('ou.terrains',listeOu('terrains'),''),'',true)+
    champ('Ces itinéraires',multi('ou.profils',listeOu('profils'),''),
      'Rien de coché = partout. Chaque case cochée <b>restreint</b>.',true)+
    champ('Conditions',blocConditions('si',false,'il peut sortir dès le départ'),
      'Toutes doivent être vraies pour que l\'événement puisse tomber.',true)+
    `</div></div>`;

  /* ── pictogramme ── */
  const gl=lire('ico.glyphe'), teinte=teinteDe(lire('ico')||{});
  h+=`<div class="bloc"><h2>Le pictogramme</h2><div class="corps">`+
    champ('Teinte',champTeinte('ico.nature','ico.teinte'),
      'Les dix teintes nommées disent quelque chose — danger, halte, trouvaille. '+
      'La pastille en pointillés ouvre une couleur à vous, qui l\'emporte.',true)+
    champ('Dessin',`<div class="glyphes">`+Object.keys(glyphesTous()).map(k=>
      `<button data-act="glyphe" data-g="${ech(k)}" class="${k===gl?'actif':''}" title="${ech(k)}">`+
      svgGlyphe(k,teinte)+`</button>`).join('')+`</div>`,'',true)+
    `</div></div>`;

  /* ── récit ── */
  h+=`<div class="bloc"><h2>Le récit</h2><div class="corps">`+
    champ('La situation',texte('recit','',4),
      'Ce que le joueur lit avant de choisir. Les accolades citent le contexte : '+
      '<b>{destination}</b>, <b>{gardes}</b>, <b>{garde}</b>. Séparez par une ligne vide '+
      'pour proposer plusieurs variantes.',true)+
    `</div></div>`;

  /* ── choix ── */
  const choix=e.choix||[];
  h+=`<div class="bloc"><h2>Les issues<span class="pousse"></span>`+

    `<div class="corps">`+
    (choix.length<2?`<p class="avert">Il faut <b>au moins deux</b> choix : un événement à une `+
      `seule issue n'est pas une décision.</p>`:'')+
    choix.map((c,i)=>rendreChoix(c,i,choix.length)).join('')+

  f.innerHTML=h;

}
function rendreChoix(c,i,n){

  let h=`<div class="choix-bloc"><h3><b>Choix ${i+1}</b>`+
    `<span class="titre">${ech(c.txt||'sans libellé')}</span>`+
    (i>0?`<button data-act="choix-haut" data-i="${i}">↑</button>`:'')+
    (i<n-1?`<button data-act="choix-bas" data-i="${i}">↓</button>`:'')+
    `<button data-act="choix-oter" data-i="${i}">✕</button></h3><div class="corps" `+
    `style="padding:10px;display:flex;flex-direction:column;gap:9px">`;
  h+=champ('Libellé du bouton',texte(p+'.txt','Payer le tribut'))+
    champ('Note en dessous',texte(p+'.note','environ {tribut} po'),
      'La conséquence annoncée, en italique sous le libellé.')+
    champ('Mot sur le dé',texte(p+'.de','aplomb'),
      'Le nom de l\'aptitude affiché à côté du libellé. Laissez vide s\'il n\'y a pas de jet.')+

        choixListe(p+'.jet.carac.selon',Object.entries(V.interrogations)
          .filter(([k,d])=>d.unite!=='oui ou non').map(([k,d])=>[k,d.nom]),'— rien, dé sec —')+
        `<span class="mot fixe">÷</span>`+nombre(p+'.jet.carac.divise','20')+`</div>`,
        'Le bonus au dé. <b>Agilité ÷ 20</b> donne +3 à une troupe agile à 62.')+
      champ('Découpage',choixListe(p+'.jet.__gradue',[['simple','Réussi ou raté'],
        ['gradue','Par paliers — autant de degrés qu\'on veut']]),

        blocIssue(p+'.rate','Si c\'est raté','mauvais');
    }else{
      const pal=(c.jet.paliers||[]);
      h+=`<div class="pile">`+pal.map((x,j)=>
        `<div class="issue"><h4>Palier ${j+1}${x.verdict?' — '+ech(x.verdict):''}`+
        `<button style="float:right;font-size:11px;color:var(--encre-pale)" `+
        `data-act="palier-oter" data-ch="${p}.jet.paliers" data-i="${j}">✕</button></h4>`+
        champ('Total du dé au moins',valeur(p+'.jet.paliers.'+j+'.min',true))+
        champ('Total du dé au plus',valeur(p+'.jet.paliers.'+j+'.max',true))+
        champ('Mot sur le dé',texte(p+'.jet.paliers.'+j+'.verdict','Magot !'))+
        champ('Couleur',choixListe(p+'.jet.paliers.'+j+'.classe',
          [['crit','Or — exceptionnel'],['reussi','Vert — réussite'],['rate','Rouge — échec']],'— neutre —'))+
        champ('Ce qui se passe',blocEffets(p+'.jet.paliers.'+j+'.effets'),'',true)+
        champ('Ce qu\'on lit',texte(p+'.jet.paliers.'+j+'.texte','',3),'',true)+

          ?`<p class="avert doux">Le <b>dernier palier</b> doit être sans bornes : c'est lui qui `+
           `ramasse tout ce que les autres n'ont pas pris.</p>`:'')+
        `</div>`;
    }
  }else if(f==='pari'){
    h+=champ('La mise',valeur(p+'.pari.mise'))+
      champ('Chance de gagner',nombre(p+'.pari.chance','0.48','0.01'),
        `Entre 0 et 1. <b>0,48</b> = presque équitable. Le seuil du dé s'en déduit : `+
        `${seuilPari(c)}.`)+
      champ('Bonus d\'adresse',valeur(p+'.pari.carac',true),
        'Laissez vide pour un pur hasard.')+
      champ('Mot sur le dé',texte(p+'.pari.nom','hasard'))+
      blocIssue(p+'.gagne','Si on gagne','bon')+
      blocIssue(p+'.perd','Si on perd','mauvais');
  }else{
    h+=champ('La condition',blocConditions(p+'.selon',false,'à remplir'),
      'Si elle est remplie, c\'est <b>oui</b> ; sinon c\'est <b>non</b>. Les deux arrivent '+
      'vraiment : le joueur qui n\'a pas les moyens subit la seconde branche.',true)+
      blocIssue(p+'.oui','Si la condition est remplie','bon')+
      blocIssue(p+'.non','Sinon','mauvais');
  }
  return h+`</div></div>`;
}
function poidsIci(){
  const p=lire('poids');
  if(p===undefined)return 1;
  if(typeof p==='number')return p;
  return (p.base===undefined?1:p.base)+(p.parEtape||0)*ESSAI.etapes;
}
function motPoids(){
  const v=poidsIci();
  if(v>=3)return 'très fréquent';
  if(v>=1.6)return 'fréquent';
  if(v>=.7)return 'ordinaire';
  return 'rare';
}
function chanceJet(c){
  if(!c.jet||c.jet.paliers)return '';
  const s=evaluer(c.jet.seuil,true), b=Math.round(evaluer(c.jet.carac))+bonusKarma()+bonusConvoi();
  const n=clamp(21-(s-b),1,20);
  return `Avec le convoi d'essai : <b>${Math.round(n/20*100)} %</b> de réussite.`;
}
function seuilPari(c){
  const p=c.pari||{},carac=Math.round(evaluer(p.carac));
  const s=clamp(Math.round(21-20*clamp(p.chance===undefined?.5:p.chance,.05,.95))+carac+2,2,26);
  return `<b>${s}</b> à battre`;
}
function svgGlyphe(k,teinte){return svgGlypheDe(k,teinte);}

/* ═══════════════ la liste ═══════════════ */
function rendreListe(){
  const q=filtre.trim().toLowerCase();
  $('#liste').innerHTML=R.evenements.map((e,i)=>({e:e,i:i}))
    .filter(o=>!q||((o.e.titre||'')+' '+(o.e.cle||'')).toLowerCase().indexOf(q)>=0)
    .map(o=>{
      const pb=controler(o.e,o.i).filter(x=>x.dur).length;
      const t=teinteDe((o.e.ico)||{});
      return `<button class="entree${o.i===sel?' actif':''}${pb?' faux':''}" data-sel="${o.i}">`+
        `<b><span class="puce" style="background:${t}"></span>${ech(o.e.titre||'sans titre')}</b>`+
        `<span>${ech(o.e.oeil||'—')} · ${o.e.genre==='mineur'?'mineur':'majeur'}`+
        `${pb?' · '+pb+' à corriger':''}</span></button>`;}).join('')||
    `<p class="vide" style="padding:8px">Rien ici.</p>`;
}

/* ═══════════════ les contrôles ═══════════════ */
function nommes(effets){
  return (effets||[]).filter(e=>e.nomme).map(e=>e.nomme);
}
const CONTEXTE=['ville','destination','contree','chien','garde','bien']
  .concat(Object.keys(V.interrogations));
function verifierTexte(txt,dispo,ou,out){
  trous(txt).forEach(t=>{
    const racine=t.split('.')[0];
    if(dispo.indexOf(racine)<0&&CONTEXTE.indexOf(racine)<0)
      out.push({dur:true,txt:`<b>{${ech(t)}}</b> dans ${ech(ou)} ne correspond à rien. `+
        `Le joueur lira les accolades telles quelles.`});
  });
}
function controler(e,idx){
  const out=[];
  const dur=t=>out.push({dur:true,txt:t});
  const doux=t=>out.push({dur:false,txt:t});
  if(!e)return out;
  if(!e.cle)dur('Il manque la <b>clé</b>.');
  else if(!/^[a-z0-9-]+$/.test(e.cle))dur('La <b>clé</b> ne prend que des minuscules, des chiffres et des tirets.');
  else if(R.evenements.some((o,i)=>i!==idx&&o.cle===e.cle))
    dur(`La clé <b>${ech(e.cle)}</b> sert déjà à un autre événement.`);
  if(!e.titre)dur('Il manque le <b>titre</b>.');
  if(!e.oeil)doux('Pas de <b>ligne au-dessus</b> du titre — le jeu affichera « Sur la route ».');
  if(!e.recit)dur('Il manque le <b>récit</b>.');
  if(!e.ico||!e.ico.glyphe)doux('Pas de <b>pictogramme</b> : l\'événement s\'affichera sans image.');
  else if(!glyphesTous()[e.ico.glyphe])dur(`Le dessin <b>${ech(e.ico.glyphe)}</b> n'existe pas.`);
  if(e.ico&&e.ico.nature&&!REF.natures[e.ico.nature])
    dur(`La teinte <b>${ech(e.ico.nature)}</b> n'existe pas.`);

  verifierTexte(e.recit,[],'le récit',out);

  const ch=e.choix||[];
  if(ch.length<2)dur('Il faut <b>au moins deux choix</b>.');
  if(ch.length>4)dur('Quatre choix au maximum : au-delà, la feuille déborde de l\'écran.');

  ch.forEach((c,i)=>{
    const nom=`le choix ${i+1}`;
    if(!c.txt)dur(`Il manque le <b>libellé</b> du choix ${i+1}.`);
    const f=forme(c);
    const combien=['jet','pari','selon'].filter(k=>c[k]).length;
    if(combien>1)dur(`Le choix ${i+1} mélange <b>deux façons de se résoudre</b>. Une seule.`);
    /* la note annonce : elle peut citer n'importe quel résultat du choix */
    verifierTexte(c.note,nomsChoix(c),`la note du choix ${i+1}`,out);
    (c.bloque||[]).forEach(b=>{if(!b.sinon)
      doux(`Une condition de blocage du choix ${i+1} n'a pas de <b>raison affichée</b> : `+
        `le joueur verra un bouton gris sans savoir pourquoi.`);});

    const issue=(o,quoi)=>{
      if(!o){dur(`Le choix ${i+1} n'a pas d'issue « ${quoi} ».`);return;}
      if(!o.texte)dur(`L'issue « ${quoi} » du choix ${i+1} n'a <b>rien à lire</b>.`);
      const dispo=nommes(o.effets).concat(f==='direct'?nommes(c.effets):[]);
      verifierTexte(o.texte,dispo,`l'issue « ${quoi} » de ${nom}`,out);
      (o.effets||[]).forEach(x=>controlerEffet(x,i+1,out));
    };
    if(f==='direct'){
      if(!c.texte)dur(`Le choix ${i+1} n'a <b>rien à lire</b> après coup.`);
      verifierTexte(c.texte,nommes(c.effets),nom,out);
      (c.effets||[]).forEach(x=>controlerEffet(x,i+1,out));
    }else if(f==='jet'){
      if(c.jet.paliers){
        const p=c.jet.paliers;
        if(!p.length)dur(`Le jet du choix ${i+1} n'a <b>aucun palier</b>.`);
        const der=p[p.length-1];
        if(der&&(der.min!==undefined||der.max!==undefined))
          dur(`Le dernier palier du choix ${i+1} a des bornes : un total qui ne rentre nulle `+
            `part <b>ne donnerait rien</b>. Le dernier doit être le repli.`);
        p.forEach((x,j)=>{
          if(!x.texte)dur(`Le palier ${j+1} du choix ${i+1} n'a rien à lire.`);
          verifierTexte(x.texte,nommes(x.effets),`le palier ${j+1} de ${nom}`,out);
          (x.effets||[]).forEach(y=>controlerEffet(y,i+1,out));
          /* Le premier palier qui convient l'emporte : deux paliers qui se chevauchent
             en partie forment une échelle normale. Seul est fautif celui qu'un palier
             antérieur recouvre entièrement — il ne sortira jamais. */
          if(j>0){
            const a1=x.min===undefined?-99:evaluer(x.min,true);
            const a2=x.max===undefined?99:evaluer(x.max,true);
            const mort=p.slice(0,j).some(z=>
              (z.min===undefined?-99:evaluer(z.min,true))<=a1&&
              (z.max===undefined?99:evaluer(z.max,true))>=a2);
            if(mort)doux(`Le palier ${j+1} du choix ${i+1} est <b>recouvert</b> par un palier `+
              `au-dessus : il ne sortira jamais.`);
          }
        });
      }else{
        if(c.jet.seuil===undefined)dur(`Le jet du choix ${i+1} n'a pas de <b>seuil</b>.`);
        issue(c.reussi,'réussi');issue(c.rate,'raté');
      }
      if(!c.de)doux(`Le choix ${i+1} lance un dé mais n'affiche <b>aucun mot</b> dessus.`);
    }else if(f==='pari'){
      if(c.pari.mise===undefined)dur(`Le pari du choix ${i+1} n'a pas de <b>mise</b>.`);
      if(c.pari.chance===undefined)doux(`Le pari du choix ${i+1} n'annonce pas sa <b>chance</b> : `+
        `elle vaudra une sur deux.`);
      const bloque=(c.bloque||[]).some(b=>b.quoi==='or');
      if(!bloque)doux(`Le pari du choix ${i+1} ne vérifie pas que la <b>bourse suit</b>. `+
        `Ajoutez une condition de blocage sur l'or.`);
      issue(c.gagne,'gagné');issue(c.perd,'perdu');
    }else{
      if(!c.selon||!c.selon.length)dur(`Le choix ${i+1} dit dépendre de l'état du convoi mais `+
        `<b>ne regarde rien</b>.`);
      issue(c.oui,'oui');issue(c.non,'non');
    }
  });
  return out;
}
function controlerEffet(e,n,out){
  const d=V.effets[e.faire];
  if(!d){out.push({dur:true,txt:`Le choix ${n} emploie un effet inconnu : <b>${ech(e.faire)}</b>.`});return;}
  Object.entries(d.parametres||{}).forEach(([p,dd])=>{
    if(dd.requis&&(e[p]===undefined||e[p]===''))
      out.push({dur:true,txt:`« ${ech(d.nom)} » du choix ${n} : <b>${ech(dd.nom)}</b> est obligatoire.`});
  });
  if(e.bien&&e.bien!=='auHasard'&&!REF.biens[e.bien])
    out.push({dur:true,txt:`La marchandise <b>${ech(e.bien)}</b> n'existe pas.`});
  if(e.arme&&!REF.armes[e.arme])
    out.push({dur:true,txt:`L'arme <b>${ech(e.arme)}</b> n'existe pas.`});
  if(e.metier&&e.metier!=='auHasard'&&!REF.metiers[e.metier])
    out.push({dur:true,txt:`Le métier <b>${ech(e.metier)}</b> n'existe pas.`});
}
function controlerLocalisation(e,out){
  if(!MONDE)return;
  const ok=(q,l)=>{const dispo=listeOu(q).map(x=>x[0]);
    (l||[]).forEach(k=>{if(dispo.indexOf(k)<0)
      out.push({dur:true,txt:`<b>${ech(k)}</b> n'existe pas dans le monde chargé.`});});};
  const o=e.ou||{};
  ok('lieux',o.lieux);ok('contrees',o.contrees);ok('rangs',o.rangs);
  ok('traits',o.traits);ok('terrains',o.terrains);ok('profils',o.profils);
}

function voletApercu(){

    `<p class="recit">${ech(boucher(e.recit,sac))||'<em>…</em>'}</p>`;
  if(joue){
    const j=joue.de;
    if(j)h+=`<div class="de-bloc r-${joue.classe||''}"><div class="de">`+
      `<svg viewBox="0 0 100 100"><polygon points="50,5 91,28.5 91,71.5 50,95 9,71.5 9,28.5" `+
      `fill="#F0E7CE" stroke="#2B2116" stroke-width="3.5"/>`+
      `<polygon points="50,25 73,64 27,64" fill="none" stroke="#C6B58C" stroke-width="2.5"/></svg>`+

      `<span class="verdict">${ech(joue.verdict)}</span>`+

      ` = <b>${j.total}</b>`+(j.seuil?` contre <b>${j.seuil}</b>`:'')+`</div></div>`;
    else if(joue.verdict)h+=`<div class="de-bloc"><div class="de-detail">`+
      `<span class="verdict">${ech(joue.verdict)}</span>La condition a tranché.</div></div>`;
    h+=`<div class="sortie">${ech(joue.texte)||'<em>rien à lire</em>'}</div>`+
      `<button class="rejouer" data-act="rejouer">Revenir aux choix</button>`;
  }else{
    const ch=(e.choix||[]).filter(c=>conditionsVraies(c.si));
    h+=ch.map((c,i)=>{
      const bl=!conditionsVraies(c.bloque);
      const raison=bl?((c.bloque||[]).find(b=>!conditionsVraies([b]))||{}).sinon:'';
      const note=Object.assign({},sac,prevoir(c));
      return `<button class="bouton${c.ton==='mauvais'?' mauvais':''}" data-act="jouer" `+
        `data-i="${(e.choix||[]).indexOf(c)}"${bl?' disabled':''}>`+
        `<strong>${ech(c.txt||'—')}`+(c.de?`<span class="marque">◈ ${ech(c.de)}</span>`:'')+`</strong>`+
        (c.note||raison?`<span>${ech(bl&&raison?raison:boucher(c.note,note))}</span>`:'')+
        `</button>`;}).join('');
    if(!ch.length)h+=`<p class="vide">Aucun choix visible avec ce convoi d'essai.</p>`;
  }
  h+=`</div>`;

  if(caches)h+=`<p class="aide" style="margin-top:9px">${caches} choix masqué${caches>1?'s':''} `+

function voletControles(){
  const e=EV();
  if(!e)return `<p class="vide">Rien à contrôler.</p>`;
  const l=controler(e,sel);
  controlerLocalisation(e,l);
  const durs=l.filter(x=>x.dur), doux=l.filter(x=>!x.dur);
  let h=`<h4 class="section">Cet événement</h4>`;
  h+=durs.length
    ?`<div class="avert"><b>${durs.length}</b> chose${durs.length>1?'s':''} à corriger avant `+
     `qu'il soit jouable.</div>`+durs.map(x=>`<div class="avert">${x.txt}</div>`).join('')
    :`<div class="avert bien">Rien ne bloque : il est <b>jouable</b>.</div>`;
  /* les remarques en or ne bloquent rien, mais valent d'être lues */
  if(doux.length)h+=`<h4 class="section">À voir, sans urgence</h4>`+
    doux.map(x=>`<div class="avert doux">${x.txt}</div>`).join('');

  /* le recueil entier */
  const mauvais=R.evenements.map((x,i)=>({x:x,i:i,n:controler(x,i).filter(y=>y.dur).length}))
    .filter(o=>o.n);
  h+=`<h4 class="section">Le recueil</h4>`;
  h+=`<div class="mesures"><span>Événements</span><b>${R.evenements.length}</b>`+
    `<span>À corriger</span><b class="${mauvais.length?'':''}">${mauvais.length}</b></div>`;
  if(mauvais.length)h+=`<div class="avert" style="margin-top:7px">`+
    mauvais.map(o=>`<a href="#" data-sel="${o.i}" style="color:var(--or)">${ech(o.x.titre||o.x.cle||'?')}</a>`)
      .join(' · ')+`</div>`;

  /* la couverture */
  h+=`<h4 class="section">La couverture</h4>`;
  if(!MONDE)h+=`<p class="vide">Chargez un <b>monde.json</b> pour savoir quels lieux ont des `+
    `événements et lesquels n'en ont aucun.</p>`;
  else{
    const lieux=MONDE.lieux||[];
    const compte={};
    let universels=0;
    R.evenements.forEach(x=>{
      const o=x.ou||{};
      const cible=(o.lieux||[]).length||(o.contrees||[]).length||(o.rangs||[]).length||
        (o.traits||[]).length||(o.terrains||[]).length;
      if(!cible){universels++;return;}
      lieux.forEach(L=>{
        if(o.lieux&&o.lieux.length&&o.lieux.indexOf(L.cle)<0)return;
        if(o.contrees&&o.contrees.length&&o.contrees.indexOf(L.contree)<0)return;
        if(o.rangs&&o.rangs.length&&o.rangs.indexOf(L.rang)<0)return;
        if(o.traits&&o.traits.length&&!(L.traits||[]).some(t=>o.traits.indexOf(t)>=0))return;
        compte[L.cle]=(compte[L.cle]||0)+1;
      });
    });
    const nus=lieux.filter(L=>!compte[L.cle]);
    h+=`<div class="mesures"><span>Partout</span><b>${universels}</b>`+
      `<span>Lieux servis</span><b>${lieux.length-nus.length} / ${lieux.length}</b></div>`;
    if(nus.length)h+=`<div class="avert doux" style="margin-top:7px">Aucun événement propre à : `+
      nus.slice(0,14).map(L=>ech(L.nom)).join(', ')+(nus.length>14?`, et ${nus.length-14} autres`:'')+
      `.</div>`;
    const forts=Object.entries(compte).sort((a,b)=>b[1]-a[1]).slice(0,6);
    if(forts.length)h+=`<table class="tableau" style="margin-top:8px"><tr><th>Lieu</th>`+
      `<th class="n">événements</th></tr>`+forts.map(([k,n])=>{
        const L=lieux.find(x=>x.cle===k)||{};
        return `<tr><td>${ech(L.nom||k)}</td><td class="n">${n}</td></tr>`;}).join('')+`</table>`;
  }
  return h;
}
function voletTirage(){
  const e=EV();
  if(!e||!(e.choix||[]).length)return `<p class="vide">Rien à tirer.</p>`;
  const N=200;
  let h=`<p class="aide">Chaque choix joué <b>${N} fois</b> contre le convoi d'essai. `+
    `C'est là qu'on voit qu'une option est trop punitive — avant le joueur.</p>`;
  (e.choix||[]).forEach((c,i)=>{
    const f=forme(c);
    const issues={}, ors=[], etp=[], larg=[], usu=[], deg=[];
    for(let n=0;n<N;n++){
      const r=resoudre(c);
      const k=r.verdict||'—';
      issues[k]=(issues[k]||0)+1;
      ors.push(r.bilan.or-r.bilan.orPerdu);etp.push(r.bilan.etapes);larg.push(r.bilan.largue);
      usu.push(r.bilan.usure);deg.push(r.bilan.degats);
    }
    const med=a=>{const b=a.slice().sort((x,y)=>x-y);return b[Math.floor(b.length/2)];};
    const mini=a=>a.reduce((s,x)=>Math.min(s,x),1e9), maxi=a=>a.reduce((s,x)=>Math.max(s,x),-1e9);
    h+=`<h4 class="section">Choix ${i+1} — ${ech(c.txt||'—')}</h4>`;
    if(f!=='direct'){
      const total=Object.values(issues).reduce((s,x)=>s+x,0);
      h+=Object.entries(issues).sort((a,b)=>b[1]-a[1]).map(([k,n])=>{
        const p=Math.round(n/total*100);
        const t=/rat|perd|échec|Non|Catastroph/i.test(k)?'var(--minium)'
          :(/Coup|Gagn|Réuss|Oui|Magot/i.test(k)?'var(--vert)':'var(--encre-pale)');
        return `<div class="mesures"><span>${ech(k)}</span><b>${p} %</b></div>`+
          `<div class="barre-part"><i style="width:${p}%;background:${t}"></i></div>`;}).join('');
    }else h+=`<p class="aide">Issue certaine.</p>`;
    h+=`<div class="mesures">`+
      `<span>Or, en médiane</span><b>${(med(ors)>0?'+':'')}${fmt(med(ors))} po</b>`+
      `<span>Or, du pire au meilleur</span><b>${fmt(mini(ors))} → ${fmt(maxi(ors))}</b>`+
      (maxi(etp)?`<span>Étapes ajoutées</span><b>${dec(med(etp))}</b>`:'')+
      (maxi(larg)?`<span>Cargaison larguée</span><b>${Math.round(med(larg)*100)} %</b>`:'')+
      (maxi(usu)?`<span>Usure des chariots</span><b>${dec(med(usu))}</b>`:'')+
      (maxi(deg)?`<span>Dégâts sur la troupe</span><b>${fmt(med(deg))} pv</b>`:'')+
      `</div>`;
  });
  return h;
}

/* ═══════════════ actions ═══════════════ */
function neuf(){
  return {cle:'',titre:'',oeil:'Sur la route',genre:'majeur',
    ico:{glyphe:'poteau',nature:'rencontre'},recit:'',
    choix:[{txt:'',texte:''},{txt:'',texte:''}]};
}
function ajouter(e){
  R.evenements.push(e||neuf());
  sel=R.evenements.length-1;joue=null;tout();
}
function changerForme(c,f){
  delete c.jet;delete c.pari;delete c.selon;
  delete c.reussi;delete c.rate;delete c.gagne;delete c.perd;delete c.oui;delete c.non;
  if(f==='direct'){c.effets=c.effets||[];c.texte=c.texte||'';}
  else{delete c.effets;delete c.texte;}
  if(f==='jet'){c.jet={carac:{selon:'agilite',divise:20},seuil:15,titre:''};
    c.reussi={effets:[],texte:''};c.rate={effets:[],texte:''};}
  if(f==='pari'){c.pari={mise:{selon:'mise'},chance:.48,carac:0,nom:'hasard'};
    c.gagne={texte:''};c.perd={texte:''};}
  if(f==='selon'){c.selon=[{quoi:'or',min:{selon:'mise'}}];
    c.oui={effets:[],texte:''};c.non={effets:[],texte:''};}
}
/* le convoi d'essai et le filtre ne sont pas des données de l'événement */
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.dataset.essai!==undefined){
    ESSAI[t.dataset.essai]=t.type==='checkbox'?t.checked:(Number(t.value)||0);
    joue=null;rendreFeuille();rendreVolet();sauver();return;
  }
  if(t.id==='filtre'){filtre=t.value;rendreListe();}
});
ecouterSaisie((t,ch,k)=>{
  /* la case « bouton rouge » écrit un mot, pas un booléen */
  if(k==='bool'&&/ton_mauvais$/.test(ch)){
    ecrire(ch,undefined);
    ecrire(ch.replace('.ton_mauvais','.ton'),t.checked?'mauvais':undefined);
  }
  if(/\.txt$/.test(ch)){
    const b=t.closest('.choix-bloc');
    if(b)$('.titre',b).textContent=t.value||'sans libellé';
  }
  joue=null;maj();
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset.t==='forme'){
    ecrire(t.dataset.ch,neuveValeur(t.value));joue=null;tout();return;
  }
  if(t.dataset.act==='effet-ajout'){
    if(!t.value)return;
    const l=lire(t.dataset.ch)||[];
    const d=V.effets[t.value], e={faire:t.value};
    Object.entries(d.parametres||{}).forEach(([p,dd])=>{
      if(dd.defaut!==undefined)e[p]=dd.defaut;
      else if(dd.requis)e[p]=dd.type==='valeur'||dd.type==='nombre'||dd.type==='fraction'?0:'';
    });
    l.push(e);ecrire(t.dataset.ch,l);joue=null;tout();return;
  }
  if(/__forme$/.test(t.dataset.ch||'')){
    const i=Number(t.dataset.ch.split('.')[1]);
    changerForme(EV().choix[i],t.value);joue=null;tout();return;
  }
  if(/__gradue$/.test(t.dataset.ch||'')){
    const i=Number(t.dataset.ch.split('.')[1]), j=EV().choix[i].jet, c=EV().choix[i];
    if(t.value==='gradue'){
      j.paliers=[{min:18,verdict:'Coup de maître',classe:'crit',effets:[],texte:''},
                 {verdict:'Sans plus',classe:'rate',effets:[],texte:''}];
      delete j.seuil;delete c.reussi;delete c.rate;
    }else{
      delete j.paliers;j.seuil=15;
      c.reussi={effets:[],texte:''};c.rate={effets:[],texte:''};
    }
    joue=null;tout();return;
  }
});
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act],[data-sel]');
  if(!b)return;
  if(b.dataset.sel!==undefined){ev.preventDefault();sel=Number(b.dataset.sel);joue=null;tout();return;}
  const a=b.dataset.act, e=EV();
  if(a==='cle-auto'){ecrire('cle',slug(lire('titre')));tout();}
  else if(a==='glyphe'){ecrire('ico.glyphe',b.dataset.g);tout();}
  else if(a==='choix-ajout'){e.choix=e.choix||[];if(e.choix.length<4)e.choix.push({txt:'',texte:''});tout();}
  else if(a==='choix-oter'){e.choix.splice(Number(b.dataset.i),1);tout();}
  else if(a==='choix-haut'){bouger(e.choix,Number(b.dataset.i),-1);tout();}
  else if(a==='choix-bas'){bouger(e.choix,Number(b.dataset.i),1);tout();}
  else if(a==='effet-oter'){const l=lire(b.dataset.ch);l.splice(Number(b.dataset.i),1);tout();}
  else if(a==='effet-haut'){bouger(lire(b.dataset.ch),Number(b.dataset.i),-1);tout();}
  else if(a==='effet-bas'){bouger(lire(b.dataset.ch),Number(b.dataset.i),1);tout();}
  else if(a==='cond-ajout'){const l=lire(b.dataset.ch)||[];l.push({quoi:'or',min:0});
    ecrire(b.dataset.ch,l);tout();}
  else if(a==='cond-oter'){const l=lire(b.dataset.ch);l.splice(Number(b.dataset.i),1);tout();}
  else if(a==='palier-ajout'){
    /* Les paliers descendent du meilleur au pire : le neuf se range juste sous le
       dernier borné, avant le repli, avec une borne déjà cohérente. */
    const l=lire(b.dataset.ch)||[];
    const bornes=l.filter(x=>x.min!==undefined).map(x=>evaluer(x.min,true));
    const min=bornes.length?Math.round(Math.min.apply(null,bornes)-5):12;
    l.splice(Math.max(0,l.length-1),0,{min:min,verdict:'',classe:'reussi',effets:[],texte:''});
    ecrire(b.dataset.ch,l);tout();}
  else if(a==='palier-oter'){const l=lire(b.dataset.ch);l.splice(Number(b.dataset.i),1);tout();}
  else if(a==='jouer'){joue=resoudre(e.choix[Number(b.dataset.i)]);rendreVolet();}
  else if(a==='rejouer'){joue=null;rendreVolet();}
  else if(a==='essai-defaut'){ESSAI={etapes:6,or:900,lieues:120,reputation:52,karma:50,gardes:2,
    place:400,charge:620,valeurSoute:1400,etatConvoi:78,vigilance:58,agilite:62,negoce:60,
    puissance:1,chien:false};joue=null;tout();}
});
$$('#onglets button').forEach(b=>b.addEventListener('click',()=>{
  onglet=b.dataset.onglet;
  $$('#onglets button').forEach(x=>x.classList.toggle('actif',x===b));
  rendreVolet();
}));

/* ── barre ── */
$('#b-nouveau').onclick=()=>ajouter();
$('#b-dupliquer').onclick=()=>{
  if(!EV())return;
  const c=JSON.parse(JSON.stringify(EV()));
  c.cle=(c.cle||'evenement')+'-bis';c.titre=(c.titre||'')+' (copie)';
  ajouter(c);
};
$('#b-supprimer').onclick=()=>{
  if(!EV())return;
  if(!confirm('Supprimer « '+(EV().titre||'sans titre')+' » ?'))return;
  R.evenements.splice(sel,1);sel=Math.max(0,sel-1);joue=null;tout();
};
$('#b-exemples').onclick=()=>{
  const dejas=R.evenements.map(e=>e.cle);
  let n=0;
  (REF.exemples||[]).forEach(x=>{
    if(dejas.indexOf(x.cle)>=0)return;
    R.evenements.push(JSON.parse(JSON.stringify(x)));n++;
  });
  sel=R.evenements.length-1;joue=null;tout();
  if(!n)alert('Les exemples sont déjà dans le recueil.');
};
let attente=null;
const ouvrirFichier=accueillirFichiers(d=>avaler(d,attente));
$('#b-ouvrir').onclick=()=>{attente='recueil';ouvrirFichier();};
$('#b-monde').onclick=()=>{attente='monde';ouvrirFichier();};
function avaler(d,quoi){
  attente=null;
  if(quoi==='monde'||(quoi!=='recueil'&&estMonde(d))){
    mondeEst(d);joue=null;tout();return;
  }
  const l=Array.isArray(d)?d:(d.evenements||null);
  if(!l){alert('Ni un recueil d\'événements, ni un monde.');return;}
  if(R.evenements.length&&!confirm('Remplacer le recueil courant ('+R.evenements.length+
    ' événements) ?'))return;
  R={format:d.format||'caravane.evenements.v1',evenements:l};
  sel=0;joue=null;tout();
}
$('#b-exporter').onclick=()=>
  telecharger('evenements.json',nettoyer(JSON.parse(JSON.stringify(R))));

/* ── raccourcis ── */
addEventListener('keydown',e=>{
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName))return;
  if(e.key==='n'&&!e.ctrlKey&&!e.metaKey){e.preventDefault();ajouter();}
  if(e.key==='ArrowDown'&&sel<R.evenements.length-1){e.preventDefault();sel++;joue=null;tout();}
  if(e.key==='ArrowUp'&&sel>0){e.preventDefault();sel--;joue=null;tout();}
});

/* ── départ ── */
if(!relire())R.evenements=[];
tout();
/* le codex du hub ouvre un élément par son lien : #cle=… */
ouvrirDemande(R.evenements,i=>{sel=i;tout();});
/* une teinte se choisit d'un clic, ici comme dans les autres ateliers */
ecouterTeintes(()=>tout());
/* un autre atelier a écrit dans le dépôt : on se remet à jour */
suivreDepot(()=>{relire();tout();});
habillerMobile(['Le recueil','L\'événement','Aperçu']);
</script>
</body>
