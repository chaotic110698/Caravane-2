<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atelier de missions — Caravane</title>
<style>
:root{
  --fond:#1C1A17; --fond-clair:#26231F; --bord:#3A352E;
  --encre:#E8E1D4; --encre-pale:#9C9484;
  --or:#C9A227; --minium:#C24A32; --vert:#6E9B6A; --azur:#4A7BC8;
  --r:3px;
}
*{margin:0;padding:0;box-sizing:border-box;font:inherit;color:inherit;background:none;border:none}
html,body{height:100%}
body{
  font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--fond);color:var(--encre);
  display:flex;flex-direction:column;overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
button{cursor:pointer;user-select:none}
input,select,textarea{background:var(--fond);border:1px solid var(--bord);border-radius:var(--r);
  padding:5px 7px;color:var(--encre);width:100%;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:1px solid var(--or);border-color:var(--or)}
select{cursor:pointer}
option,optgroup{background:var(--fond-clair)}
textarea{resize:vertical;line-height:1.5}
input[type=checkbox]{width:auto;accent-color:var(--or)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#3A352E;border-radius:5px}

#barre{flex:none;display:flex;align-items:center;gap:6px;padding:7px 10px;
  background:var(--fond-clair);border-bottom:1px solid var(--bord);flex-wrap:wrap}
#barre h1{font-size:15px;font-weight:600;letter-spacing:.02em;margin-right:6px;white-space:nowrap}
#barre h1 b{color:var(--or)}
.outil{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--bord);
  border-radius:var(--r);background:var(--fond);font-size:13px;white-space:nowrap;
  text-decoration:none}
.outil:hover{border-color:var(--encre-pale)}
.outil.fort{background:var(--or);color:#1C1A17;border-color:var(--or);font-weight:600}
.outil.danger{color:var(--minium);border-color:#5A2A20}
.outil.petit{padding:3px 8px;font-size:12px}
.sep{width:1px;align-self:stretch;background:var(--bord);margin:0 3px}
.pousse{margin-left:auto}

#scene{flex:1;min-height:0;display:flex}
#carnet{flex:none;width:236px;background:var(--fond-clair);border-right:1px solid var(--bord);
  display:flex;flex-direction:column;min-height:0}
#carnet>input{margin:8px;width:auto;flex:none}
#liste{flex:1;overflow-y:auto;padding:0 8px 8px}
.groupe{font-size:11px;font-variant:small-caps;letter-spacing:.09em;color:var(--or);
  padding:9px 4px 4px}
.entree{display:flex;align-items:center;gap:7px;width:100%;text-align:left;padding:6px 8px;
  border:1px solid transparent;border-radius:var(--r);margin-bottom:3px;font-size:13px}
.entree:hover{background:#2E2A22}
.entree.actif{background:#2E2A22;border-color:var(--or)}
.entree .jeton{width:22px;height:22px;flex:none}
.entree .jeton svg{width:100%;height:100%;display:block}
.entree .txt{flex:1;min-width:0;line-height:1.25}
.entree b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entree span{font-size:11px;color:var(--encre-pale)}
.entree.faux b{color:var(--minium)}

#feuille{flex:1;min-width:0;overflow-y:auto;padding:14px 16px 60px;display:flex;
  flex-direction:column;gap:13px}
#cote{flex:none;width:352px;background:var(--fond-clair);border-left:1px solid var(--bord);
  display:flex;flex-direction:column;min-height:0}
#onglets{flex:none;display:flex;border-bottom:1px solid var(--bord)}
#onglets button{flex:1;padding:8px 3px;font-size:11.5px;border-bottom:2px solid transparent;
  color:var(--encre-pale)}
#onglets button.actif{color:var(--or);border-bottom-color:var(--or)}
#volet{flex:1;overflow-y:auto;padding:12px}

.bloc{border:1px solid var(--bord);border-radius:var(--r);background:var(--fond-clair)}
.bloc>h2{font-size:12px;font-variant:small-caps;letter-spacing:.09em;color:var(--or);
  padding:7px 10px;border-bottom:1px solid var(--bord);display:flex;align-items:center;gap:8px}
.bloc>h2 .pousse{margin-left:auto}
.bloc>h2 button{font-size:11px;padding:2px 7px;border:1px solid var(--bord);border-radius:var(--r);
  color:var(--encre-pale)}
.bloc>h2 button:hover{color:var(--encre);border-color:var(--encre-pale)}
.bloc>.corps{padding:10px;display:flex;flex-direction:column;gap:9px}
.champ{display:grid;grid-template-columns:140px 1fr;gap:8px;align-items:start}
.champ>label{font-size:12.5px;color:var(--encre-pale);padding-top:6px;line-height:1.3}
.champ.large{grid-template-columns:1fr}
.champ.large>label{padding-top:0}
.aide{font-size:11.5px;color:var(--encre-pale);line-height:1.45;margin-top:3px}
.aide b{color:var(--encre)}
.rangee{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rangee>*{flex:1;min-width:0}
.rangee>.fixe{flex:none}
.mot{font-size:12px;color:var(--encre-pale);flex:none}
.vide{font-size:12.5px;color:var(--encre-pale);font-style:italic}

.piece{border:1px solid var(--bord);border-left:3px solid var(--azur);border-radius:var(--r);
  background:var(--fond)}
.piece>header{display:flex;align-items:center;gap:7px;padding:6px 9px;font-size:12.5px;
  border-bottom:1px solid var(--bord)}
.piece>header b{flex:1;min-width:0;color:var(--encre)}
.piece>header .rang{color:var(--or);font-variant:small-caps;letter-spacing:.07em;flex:none}
.piece>header button{font-size:11px;padding:1px 6px;border:1px solid var(--bord);
  border-radius:var(--r);color:var(--encre-pale)}
.piece>header button:hover{color:var(--encre);border-color:var(--encre-pale)}
.piece>.corps{padding:9px;display:flex;flex-direction:column;gap:8px}
.piece .explique{font-size:11.5px;color:var(--encre-pale);line-height:1.45}
.cond{border:1px solid var(--bord);border-radius:var(--r);padding:7px;display:flex;
  flex-direction:column;gap:6px}
.pile{display:flex;flex-direction:column;gap:7px}
.ajout{font-size:12px;padding:5px 9px;border:1px dashed var(--bord);border-radius:var(--r);
  color:var(--encre-pale);align-self:flex-start}
.ajout:hover{border-color:var(--or);color:var(--or)}

/* ── le commanditaire, en évidence ── */
.qui{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--bord);
  border-radius:var(--r);background:var(--fond)}
.qui .jeton{width:32px;height:32px;flex:none}
.qui .jeton svg{width:100%;height:100%;display:block}
.qui .txt{flex:1;min-width:0}
.qui b{display:block;font-size:14px}
.qui span{font-size:11.5px;color:var(--encre-pale)}
.qui.rien{border-style:dashed;color:var(--encre-pale)}

.glyphes{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:4px;
  max-height:150px;overflow-y:auto;padding:4px;border:1px solid var(--bord);border-radius:var(--r)}
.glyphes button{aspect-ratio:1;border:1px solid transparent;border-radius:var(--r);padding:4px}
.glyphes button:hover{border-color:var(--encre-pale)}
.glyphes button.actif{border-color:var(--or);background:#2E2A22}
.glyphes svg{width:100%;height:100%;display:block}

/* ── l'offre, dans les couleurs du jeu ── */
.offre{--velin:#E3D6B2;--velin-clair:#F0E7CE;--filet:#2B2116;
  --gencre:#2B2116;--gencre-pale:#6C5C46;--gminium:#A32C1C;--gor:#96751F;--gvert:#4C6A44;
  --display:'Iowan Old Style','Hoefler Text','Palatino Linotype',Palatino,Georgia,serif;
  background:var(--velin-clair);color:var(--gencre);border:1px solid var(--filet);
  border-radius:var(--r);padding:13px;font-family:var(--display)}
.offre .tete{display:flex;align-items:center;gap:11px;margin-bottom:9px}
.offre .ico{width:44px;height:44px;flex:none}
.offre .ico svg{width:100%;height:100%;display:block}
.offre .oeil{font-size:12px;font-variant:small-caps;letter-spacing:.13em;color:var(--gencre-pale)}
.offre h3{font-size:20px;font-weight:600;line-height:1.15}
.offre .recit{font-size:14.5px;line-height:1.5;margin-bottom:11px}
.offre .recit::first-letter{color:var(--gminium);font-size:1.05em}
.offre .lignes{display:grid;grid-template-columns:auto 1fr;gap:3px 9px;font-size:12.5px;
  font-family:system-ui,sans-serif;padding:8px 0;border-top:1px solid #2B211630;
  border-bottom:1px solid #2B211630}
.offre .lignes dt{color:var(--gencre-pale)}
.offre .lignes dd{font-weight:600}
.offre .prix{margin-top:9px;font-size:13px;font-family:system-ui,sans-serif}
.offre .prix b{color:var(--gor)}
.offre .fin{margin-top:10px;font-size:14px;line-height:1.5;padding:9px 10px;
  background:var(--velin);border-left:3px solid var(--gvert);border-radius:0 var(--r) var(--r) 0}
.offre .fin.mauvais{border-left-color:var(--gminium)}

/* ── le fil des jalons ── */
.fil{display:flex;flex-direction:column;gap:0}
.fil .etape{display:flex;gap:10px}
.fil .rail{flex:none;width:16px;display:flex;flex-direction:column;align-items:center}
.fil .pion{width:11px;height:11px;border-radius:50%;background:var(--or);flex:none;margin-top:4px}
.fil .pion.dep{background:var(--azur)}
.fil .pion.fin{background:var(--vert)}
.fil .trait{flex:1;width:2px;background:var(--bord);min-height:14px}
.fil .corps2{flex:1;min-width:0;padding-bottom:11px}
.fil b{font-size:13px}
.fil span{display:block;font-size:11.5px;color:var(--encre-pale)}
.fil .cout{font-size:11.5px;color:var(--or);font-variant-numeric:tabular-nums}

.avert{font-size:12.5px;padding:7px 9px;border-left:2px solid var(--minium);background:#2A211E;
  margin-bottom:6px;border-radius:0 var(--r) var(--r) 0;line-height:1.45}
.avert.doux{border-color:var(--or);background:#2A2620}
.avert.bien{border-color:var(--vert);background:#212A20}
.avert b{color:var(--encre)}
h4.section{font-size:11.5px;font-variant:small-caps;letter-spacing:.09em;color:var(--or);
  margin:12px 0 6px}
h4.section:first-child{margin-top:0}
.mesures{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:12.5px;
  font-variant-numeric:tabular-nums}
.mesures b{text-align:right}
.tableau{width:100%;font-size:12px;border-collapse:collapse}
.tableau td,.tableau th{padding:3px 5px;border-bottom:1px solid var(--bord);text-align:left}
.tableau th{color:var(--encre-pale);font-weight:400;font-size:11px}
.tableau td.n{text-align:right;font-variant-numeric:tabular-nums}

/* ── le volet des personnages ── */
.gens{display:flex;flex-direction:column;gap:7px}
.gens .carte{border:1px solid var(--bord);border-radius:var(--r);padding:8px 9px;
  background:var(--fond)}
.gens .carte.sien{border-color:var(--or);background:#2E2A22}
.gens .haut{display:flex;align-items:center;gap:8px}
.gens .jeton{width:26px;height:26px;flex:none}
.gens .jeton svg{width:100%;height:100%;display:block}
.gens .txt{flex:1;min-width:0}
.gens b{display:block;font-size:13px}
.gens .sous{font-size:11px;color:var(--encre-pale)}
.gens .extrait{font-size:11.5px;color:var(--encre-pale);line-height:1.45;margin-top:5px;
  font-style:italic}
.gens .rangee{margin-top:7px}
.gens .aucune{color:var(--or)}

#etat{flex:none;display:flex;gap:14px;padding:5px 11px;background:var(--fond-clair);
  border-top:1px solid var(--bord);font-size:12px;color:var(--encre-pale);
  font-variant-numeric:tabular-nums;flex-wrap:wrap}
#etat b{color:var(--encre);font-weight:600}
#etat .rouge{color:var(--minium)}
#toile-depot{position:fixed;inset:0;background:#1C1A17E0;display:none;align-items:center;
  justify-content:center;font-size:17px;color:var(--or);z-index:9;pointer-events:none}
#toile-depot.on{display:flex}
@media (max-width:1150px){#cote{width:310px}#carnet{width:190px}}
@media (max-width:880px){
  #scene{flex-direction:column}
  #carnet{width:auto;max-height:150px;border-right:none;border-bottom:1px solid var(--bord)}
  #cote{width:auto;max-height:46%;border-left:none;border-top:1px solid var(--bord)}
}
</style>
</head>
<body>

<div id="barre">
  <h1>Atelier de <b>missions</b></h1>
  <button class="outil" id="b-nouveau">+ Mission</button>
  <button class="outil" id="b-dupliquer">Dupliquer</button>
  <button class="outil danger" id="b-supprimer">Supprimer</button>
  <span class="sep"></span>
  <button class="outil" id="b-ouvrir">Ouvrir un carnet…</button>
  <button class="outil" id="b-monde">monde.json…</button>
  <button class="outil" id="b-gens">personnages.json…</button>
  <button class="outil" id="b-objets">objets.json…</button>
  <button class="outil" id="b-exemple">Exemple</button>
  <span class="pousse"></span>
  <a class="outil" href="TUTORIEL-MISSIONS.md" target="_blank" rel="noopener">Mode d'emploi</a>
  <button class="outil fort" id="b-exporter">Exporter</button>
</div>

<div id="scene">
  <aside id="carnet">
    <input id="filtre" placeholder="Filtrer…" autocomplete="off" spellcheck="false">
    <div id="liste"></div>
  </aside>
  <main id="feuille"></main>
  <aside id="cote">
    <div id="onglets">
      <button data-onglet="offre" class="actif">L'offre</button>
      <button data-onglet="fil">Le fil</button>
      <button data-onglet="gens">Personnages</button>
      <button data-onglet="controles">Contrôles</button>
      <button data-onglet="convoi">Convoi</button>
    </div>
    <div id="volet"></div>
  </aside>
</div>

<div id="etat"></div>
<div id="toile-depot">Déposez un <b>carnet</b>, un <b>monde</b>, un <b>répertoire</b> ou un <b>coffre</b></div>
<input type="file" id="fichier" accept=".json,application/json" hidden>

<script id="reference" type="application/json">
{"vocabulaire":{"format":"caravane.vocabulaire.v1","apropos":"Le catalogue de tout ce qu'un événement peut dire. Le générateur en tire ses formulaires, la documentation en tire son tutoriel, et les vérifications en tirent leurs règles. Ajouter une entrée ici suffit à la faire apparaître partout.","formes":{"direct":{"nom":"Issue certaine","explique":"Le choix a une seule fin, connue d'avance. On paie, on attend, on repart : pas de dé, pas de surprise.","quand":"La plupart des choix prudents, et tous les choix qui ne font que raconter.","champs":["effets","texte"]},"jet":{"nom":"Jet de dé","explique":"On lance un dé à vingt faces, auquel s'ajoutent le karma et l'état du convoi. Selon le total, l'issue change.","quand":"Dès que le résultat doit dépendre de la chance et de la valeur de la troupe.","champs":["jet","reussi","rate"],"variante":{"nom":"Jet gradué","explique":"Au lieu de deux issues, on découpe le résultat en paliers : un coup de maître, un résultat honnête, un échec, un désastre. Le premier palier dont les bornes conviennent l'emporte, et le dernier sans bornes ramasse le reste.","champs":["jet.paliers"]}},"pari":{"nom":"Pari","explique":"On mise une somme. Si l'on gagne, on la double ; si l'on perd, elle disparaît. La difficulté se calcule toute seule à partir de la chance annoncée.","quand":"Les jeux de hasard, les défis, les paris de taverne.","champs":["pari","gagne","perd"]},"selon":{"nom":"Selon l'état du convoi","explique":"L'issue ne dépend pas du sort mais de ce que vous avez : assez d'or, assez de place, un chien, un garde. Deux fins, l'une pour oui, l'autre pour non.","quand":"Quand vouloir ne suffit pas — payer un droit qu'on n'a peut-être pas les moyens de payer.","champs":["selon","oui","non"]}},"effets":{"or":{"nom":"Gagner ou perdre de l'or","explique":"Ajoute ou retire des pièces à la bourse. Un montant négatif retire ; la bourse ne descend jamais sous zéro.","parametres":{"de":{"nom":"Combien","type":"valeur","requis":true,"aide":"Négatif pour une perte. « -40 » retire 40 pièces ; « {selon: or, fois: -0.15} » en retire 15 %."}},"nomme":{"explique":"Le montant réellement bougé — utile quand la bourse était trop maigre.","exemple":"240"}},"reputation":{"nom":"Faire monter ou tomber la réputation","explique":"Ce que le monde marchand pense de vous. Elle ouvre des portes, fait baisser les prix, et permet de parlementer avec des gens peu recommandables. Elle reste entre 0 et 100.","parametres":{"de":{"nom":"Combien","type":"nombre","requis":true,"aide":"Négatif pour une perte. Comptez 2 à 6 pour un geste ordinaire, 9 ou plus pour une infamie."}}},"karma":{"nom":"Faire monter ou tomber le karma","explique":"La chance du convoi. Un karma haut ajoute un bonus à tous les jets de dé ; un karma bas les plombe. C'est la récompense discrète des bonnes actions. Entre 0 et 100.","parametres":{"de":{"nom":"Combien","type":"nombre","requis":true,"aide":"Négatif pour une perte. 3 à 5 pour un bon geste, 7 pour une mesquinerie."}}},"allonger":{"nom":"Rallonger le voyage","explique":"Ajoute des étapes au trajet en cours. Chaque étape coûte la solde des gardes, use les chariots et peut amener un autre événement. Quatre étapes au maximum par voyage, quoi qu'on empile.","parametres":{"de":{"nom":"Étapes en plus","type":"nombre","requis":true,"defaut":1,"aide":"1 pour une halte, 2 pour un détour sérieux."}},"nomme":{"explique":"Les étapes réellement ajoutées, une fois le plafond appliqué.","exemple":"2"}},"abimer":{"nom":"Abîmer les chariots","explique":"Use les essieux, les caisses et les bêtes. Un chariot pris pour cible souffre plus que les autres. Un essieu ou un cheval à zéro immobilise le chariot.","parametres":{"combien":{"nom":"Usure infligée","type":"valeur","requis":true,"aide":"3 pour une secousse, 8 à 15 pour un mauvais passage, 20 pour un accident."}}},"delester":{"nom":"Larguer de la cargaison","explique":"On jette une part du chargement — pour fuir plus vite, ou parce qu'on vous la prend. Les chariots les plus chargés perdent le plus.","parametres":{"part":{"nom":"Quelle fraction","type":"fraction","requis":true,"defaut":0.2,"aide":"0,25 largue un quart de la soute. Au-delà de 0,5 c'est une catastrophe."},"seulement":{"nom":"Seulement","type":"choix","valeurs":["tout","fragile","perissable"],"defaut":"tout","aide":"« fragile » ne casse que le verre et les enluminures."}},"nomme":{"explique":"La liste de ce qui a été perdu, prête à citer dans le texte.","exemple":"34 kg de blé et 12 kg de sel"}},"briserFragile":{"nom":"Casser ce qui est fragile","explique":"Une secousse, une tempête, un versement : seul ce qui se brise se brise. Le reste de la cargaison ne bouge pas.","parametres":{"part":{"nom":"Quelle fraction du fragile","type":"fraction","requis":true,"defaut":0.3}},"nomme":{"explique":"La liste de la casse.","exemple":"18 kg de verrerie"}},"reposer":{"nom":"Soigner la troupe","explique":"Rend de la santé au marchand et à ses gardes. Une bonne nuit, une source claire, des herbes trouvées au bord du chemin.","parametres":{"part":{"nom":"Quelle fraction rendue","type":"fraction","requis":true,"defaut":0.15,"aide":"0,07 pour une gorgée d'eau, 0,25 pour une vraie nuit."}}},"blesserTroupe":{"nom":"Blesser la troupe","explique":"Répartit des dégâts sur un ou plusieurs hommes. Les gardes encaissent plus souvent que le marchand. Un homme à zéro meurt ; si c'est le marchand, la partie s'arrête.","parametres":{"total":{"nom":"Dégâts à répartir","type":"valeur","requis":true,"aide":"14 à 30 pour une échauffourée, 40 et plus pour une vraie bataille."},"cibles":{"nom":"Combien d'hommes touchés","type":"nombre","defaut":1}},"nomme":{"explique":"Qui a souffert.","exemple":"{blesses.noms} donne « Corvin et Naya », {blesses.morts} donne les morts"}},"combat":{"nom":"Livrer bataille","explique":"La troupe se bat. L'issue dépend de la force des hommes, de leurs armes et de la menace du moment. On gagne du butin, ou on perd de la cargaison et des hommes.","parametres":{"bonus":{"nom":"Avantage","type":"nombre","defaut":1,"aide":"1 pour un combat franc, 0,85 si l'on est pris au dépourvu, 1,3 si l'on tend l'embuscade."}},"nomme":{"explique":"Le récit de la mêlée, déjà écrit. Citez-le tel quel.","exemple":"{melee} donne toute la phrase, {melee.butin} le seul montant"}},"charger":{"nom":"Charger de la marchandise","explique":"Met des kilos dans les chariots. S'il n'y a pas la place, on charge ce qu'on peut. Avec un prix au kilo, la marchandise s'achète ; sans prix, elle est offerte.","parametres":{"bien":{"nom":"Quelle marchandise","type":"bien","requis":true,"aide":"Une marchandise précise, ou « au hasard »."},"kg":{"nom":"Combien de kilos","type":"valeur","requis":true},"prixAuKilo":{"nom":"Prix au kilo","type":"valeur","aide":"Laissez vide pour un cadeau. « {selon: base, fois: 0.55} » pour une bonne affaire."}},"nomme":{"explique":"Ce qui a été chargé.","exemple":"{charge.kg} kg de {charge.bien}"}},"decharger":{"nom":"Céder de la marchandise","explique":"Retire des kilos de la soute. Avec un prix au kilo, elle se vend ; sans prix, elle est perdue ou donnée.","parametres":{"bien":{"nom":"Quelle marchandise","type":"bien","requis":true},"kg":{"nom":"Combien de kilos","type":"valeur","requis":true},"prixAuKilo":{"nom":"Prix au kilo","type":"valeur"}},"nomme":{"explique":"Ce qui est parti et ce que ça a rapporté.","exemple":"{cede.kg} kg pour {cede.gain} po"}},"armeTrouvee":{"nom":"Trouver une arme","explique":"Une arme ordinaire, tirée au hasard parmi les légères. Jamais une arme de légende — celles-là n'existent qu'en un exemplaire et ne se ramassent pas dans un fossé.","parametres":{},"nomme":{"explique":"Le nom de l'arme trouvée.","exemple":"une hache légère"}},"donnerArme":{"nom":"Donner une arme précise","explique":"Range une arme nommée dans la réserve. C'est par là que passent les armes de légende, quand le récit le justifie.","parametres":{"arme":{"nom":"Laquelle","type":"arme","requis":true}},"nomme":{"explique":"Le nom de l'arme.","exemple":"Excalibur"}},"chien":{"nom":"Adopter un chien","explique":"Un errant se laisse apprivoiser. Il flaire les mauvaises rencontres avant les hommes et se bat un peu aux côtés du marchand. Sans effet si le convoi en a déjà un.","parametres":{},"nomme":{"explique":"Le nom du chien.","exemple":"Ronce"}},"recruter":{"nom":"Recruter un garde","explique":"Un homme rejoint l'escorte, avec son métier et son arme. Il touchera une solde à chaque étape.","parametres":{"metier":{"nom":"Quel métier","type":"metier","defaut":"auHasard"},"arme":{"nom":"Avec quelle arme","type":"arme","aide":"Laissez vide pour une arme de son métier, tirée au hasard."}},"nomme":{"explique":"Le nom de la recrue.","exemple":"Maren"}},"rumeur":{"nom":"Lancer une rumeur de prix","explique":"On vous glisse qu'une marchandise vaut cher là où vous allez. Le prix y sera réellement plus haut à l'arrivée.","parametres":{"bien":{"nom":"Quelle marchandise","type":"bien","defaut":"auHasard"},"mult":{"nom":"Multiplicateur de prix","type":"nombre","defaut":1.45,"aide":"1,45 pour une rumeur vague, 1,9 pour un tuyau payé."}},"nomme":{"explique":"Le nom de la marchandise concernée.","exemple":"les épices"}},"escorte":{"nom":"Faire escorter le convoi","explique":"Des compagnons de route protègent la caravane pendant quelques étapes. Les mauvaises rencontres se font plus rares.","parametres":{"de":{"nom":"Combien d'étapes","type":"nombre","requis":true,"defaut":2}}}},"interrogations":{"or":{"nom":"L'or en bourse","unite":"pièces"},"etapes":{"nom":"Les étapes parcourues","unite":"étapes","explique":"Sert à mesurer l'avancement de la partie : tout devient plus cher et plus dangereux avec le temps."},"lieues":{"nom":"Les lieues au compteur","unite":"lieues"},"reputation":{"nom":"La réputation","unite":"0 à 100"},"karma":{"nom":"Le karma","unite":"0 à 100"},"gardes":{"nom":"Le nombre de gardes","unite":"hommes"},"troupe":{"nom":"Le marchand et ses gardes","unite":"hommes"},"place":{"nom":"La place libre dans les chariots","unite":"kg"},"charge":{"nom":"Les kilos chargés","unite":"kg"},"stock":{"nom":"Les kilos d'une marchandise","unite":"kg","demande":"bien"},"valeurSoute":{"nom":"La valeur marchande de la cargaison","unite":"pièces"},"etatConvoi":{"nom":"La santé du convoi","unite":"0 à 100","explique":"La moyenne des chariots et des hommes."},"chien":{"nom":"Un chien suit le convoi","unite":"oui ou non"},"vigilance":{"nom":"La vigilance de la troupe","unite":"0 à 100","explique":"Ce qui permet de voir venir une embuscade."},"agilite":{"nom":"L'agilité de la troupe","unite":"0 à 100","explique":"Ce qui permet de décrocher et de fuir."},"negoce":{"nom":"Le talent de négoce","unite":"0 à 100","explique":"Le meilleur de la caravane l'emporte."},"puissance":{"nom":"La force du marchand","unite":"0 à 3"},"armeFamille":{"nom":"Quelqu'un porte une arme de cette famille","unite":"oui ou non","demande":"famille"},"mise":{"nom":"La mise de jeu courante","unite":"pièces","explique":"Ce qu'on parie à ce stade de la partie. Croît avec les étapes."},"coutGarde":{"nom":"Le prix d'un garde","unite":"pièces"},"tribut":{"nom":"Ce qu'exigerait un pillard","unite":"pièces","explique":"Calculé sur l'or et la valeur de la cargaison."},"soin":{"nom":"Le coût des soins","unite":"pièces"}},"typesDeChamp":{"nombre":{"explique":"Un nombre simple."},"fraction":{"explique":"Une part, entre 0 et 1. 0,25 vaut un quart."},"valeur":{"explique":"Un nombre, une fourchette, une formule ou une référence — voir la documentation des valeurs."},"choix":{"explique":"Une valeur parmi une liste fermée."},"bien":{"explique":"Une marchandise de biens.json, ou « au hasard »."},"arme":{"explique":"Une arme de armes.json."},"metier":{"explique":"Un métier de garde, ou « au hasard »."},"texte":{"explique":"Du texte, qui accepte les trous entre accolades."},"booleen":{"explique":"Oui ou non."}},"moments":{"route":{"nom":"En chemin","explique":"Pendant un trajet, entre deux lieux."},"arrivee":{"nom":"À l'arrivée","explique":"En entrant dans un lieu, avant le marché."},"sejour":{"nom":"Pendant le séjour","explique":"Pendant qu'on est en ville, entre deux actions."}}},"vocabulairePersonnages":{"format":"caravane.vocabulaire-personnages.v1","apropos":"Le catalogue de ce qu'un personnage peut être et de ce qui fait mériter son lore. L'atelier de personnages en tire ses formulaires, comme l'atelier d'événements tire les siens de vocabulaire-evenements.json. Les deux se complètent : les conditions d'une couche peuvent aussi bien interroger la relation (ci-dessous) que l'état du convoi (l'autre catalogue).","roles":{"echevin":{"nom":"Échevin","explique":"Il tient un registre, une charge, un sceau. Il donne des autorisations et des ennuis.","feminin":"Échevine"},"marchand":{"nom":"Marchand","explique":"Il achète, il vend, il sait qui a besoin de quoi. Le commanditaire le plus naturel.","feminin":"Marchande"},"forgeron":{"nom":"Forgeron","explique":"Il fait et répare les armes et les essieux. Il connaît le métal, donc les mines.","feminin":"Forgeronne"},"aubergiste":{"nom":"Aubergiste","explique":"Tout passe par sa salle. C'est par lui qu'on apprend les choses avant les autres."},"capitaine":{"nom":"Capitaine de garde","explique":"Il tient la porte et les hommes. Il décide qui entre et qui attend."},"clerc":{"nom":"Clerc","explique":"Il écrit, il archive, il se souvient. Le lore ancien passe par lui."},"contrebandier":{"nom":"Contrebandier","explique":"Il connaît les chemins que personne ne relève, et le prix du silence.","feminin":"Contrebandière"},"guide":{"nom":"Guide","explique":"Il a fait la route cent fois. Il sait où l'eau est bonne et où l'on ne campe pas."},"ermite":{"nom":"Ermite","explique":"Il vit à l'écart et sait ce que la ville a oublié. Rarement bavard d'emblée."},"artisan":{"nom":"Artisan","explique":"Verrier, tisserand, enlumineur : celui qui fait ce que la caravane transporte.","feminin":"Artisane"},"prieur":{"nom":"Prieur","explique":"Il tient un temple, une règle, une mémoire. Le lore religieux est chez lui.","feminin":"Prieure"},"noble":{"nom":"Noble","explique":"Il a des terres, une dette d'honneur et le bras long. On ne lui refuse pas facilement."},"mineur":{"nom":"Mineur","explique":"Il descend. Il sait ce qu'il y a en dessous, et ce qu'on n'en remonte pas.","feminin":"Mineuse"},"batelier":{"nom":"Batelier","explique":"Il tient un bac, une barque, un quai. Indispensable aux ports.","feminin":"Batelière"},"veneur":{"nom":"Veneur","explique":"Il chasse et suit les traces. Il voit passer ce que les routes ne montrent pas.","feminin":"Veneuse"}},"accords":{"f":{"nom":"Féminin","explique":"Les textes s'accordent au féminin : « elle est arrivée »."},"m":{"nom":"Masculin","explique":"Les textes s'accordent au masculin : « il est arrivé »."}},"interrogations":{"rencontres":{"nom":"Combien de fois on l'a croisé","unite":"rencontres","explique":"Monte d'un à chaque fois qu'on lui parle. La façon la plus simple de faire mériter une couche : on ne se confie pas à un inconnu."},"missionsPour":{"nom":"Missions accomplies pour lui","unite":"missions","explique":"Ce qu'on a fait pour lui, et non ce qu'on lui a dit. Le lore le plus profond devrait coûter ça."},"couchesConnues":{"nom":"Couches déjà découvertes","unite":"couches","explique":"Pour enchaîner : la troisième révélation n'a de sens qu'après les deux premières."}},"trous":{"nom":{"explique":"Son nom seul.","exemple":"Orlanne"},"titre":{"explique":"Son titre, s'il en a un.","exemple":"Dame"},"appellation":{"explique":"Titre et nom ensemble, avec l'élision qui convient.","exemple":"Dame Orlanne"},"role":{"explique":"Ce qu'il fait, en toutes lettres.","exemple":"échevine"},"lieu":{"explique":"Le lieu où on le trouve.","exemple":"Aurelium"},"contree":{"explique":"La contrée de ce lieu.","exemple":"les Terres humaines"},"il":{"explique":"Le pronom accordé.","exemple":"elle"},"le":{"explique":"L'article défini accordé.","exemple":"la"},"e":{"explique":"La marque d'accord à coller à un participe.","exemple":"arrivé{e} donne « arrivée »"}}},"vocabulaireObjets":{"format":"caravane.vocabulaire-objets.v1","apropos":"Le catalogue de la cinquième famille : l'objet unique, celui qui n'existe qu'en un exemplaire, qui porte du lore et qui se mérite. Les marchandises, les armes ordinaires, les chariots et les pièces gardent leurs propres fichiers — ce sont des choses qu'on achète, pas des choses qu'on trouve. Comme les autres catalogues, celui-ci est ouvert : décrivez un genre, un pouvoir ou une provenance qui manque, il est ajouté.","genres":{"relique":{"nom":"Relique","explique":"Un objet qu'on ne se procure pas : un fragment, une enseigne, un ossement monté sur socle. Sa valeur est ce qu'on raconte de lui."},"arme":{"nom":"Arme de légende","explique":"Elle se porte et elle frappe. C'est la seule famille qui touche au combat — les trois armes mythiques du jeu sont déjà de celles-là."},"document":{"nom":"Document","explique":"Un registre, une lettre, une carte, un sauf-conduit. Le meilleur porteur de lore : il dit quelque chose sur quelqu'un ou sur un lieu."},"bijou":{"nom":"Bijou","explique":"Léger, cher, et facile à faire changer de mains. Bon support pour ce qui se vole et se revend."},"outil":{"nom":"Outil","explique":"Une lunette, un astrolabe, un jeu de clés. Il fait quelque chose de concret pour la caravane."},"insigne":{"nom":"Insigne","explique":"Un sceau, un anneau, une plaque. Il ne vaut rien et il ouvre des portes : c'est ce qu'on montre."},"curiosite":{"nom":"Curiosité","explique":"Une chose dont personne ne sait plus l'usage. Elle n'a d'autre pouvoir que d'intriguer — et c'est parfois assez."}},"pouvoirs":{"aptitude":{"nom":"Améliorer une aptitude","explique":"Tant qu'on l'a dans les chariots, la troupe est meilleure à quelque chose. Le bonus s'ajoute à la moyenne de la troupe et se voit dans tous les jets qui s'en servent.","parametres":{"quoi":{"nom":"Quelle aptitude","type":"choix","requis":true,"valeurs":["vigilance","agilite","negoce","endurance"],"aide":"Vigilance pour voir venir, agilité pour décrocher, négoce pour les prix, endurance pour encaisser."},"de":{"nom":"De combien","type":"nombre","requis":true,"defaut":5,"aide":"3 est discret, 8 se sent, 15 change une partie. Les aptitudes vont de 0 à 100."}}},"chance":{"nom":"Porter chance","explique":"Un bonus permanent au karma, donc à tous les jets de dé. C'est le pouvoir le plus large et le plus difficile à équilibrer : n'allez pas loin.","parametres":{"de":{"nom":"De combien","type":"nombre","requis":true,"defaut":6,"aide":"Le karma va de 0 à 100 et donne +1 au dé tous les 17 points. 17 vaut donc un point de dé entier."}}},"arme":{"nom":"Être une arme","explique":"L'objet se porte et frappe. Il se range dans la réserve d'armes et s'équipe comme les autres — mais il n'existe qu'en un exemplaire, et il disparaît avec celui qui le portait.","parametres":{"famille":{"nom":"Quelle famille","type":"familleArme","requis":true},"frappe":{"nom":"Force de frappe","type":"nombre","requis":true,"defaut":0.9,"aide":"Les armes ordinaires vont de 0,26 à 0,95. Les trois armes mythiques du jeu sont à 0,82, 0,95 et 1,25."},"garde":{"nom":"Parade","type":"nombre","defaut":0.1,"aide":"Ce qui est encaissé au lieu d'être subi. 0 pour une hache, 0,22 pour une arme équilibrée."}}},"ouvreCouche":{"nom":"Révéler du lore","explique":"Le posséder ouvre une couche chez un personnage — le document qui dit ce qu'il n'aurait jamais raconté. C'est le pouvoir qui lie les objets aux gens.","parametres":{"personnage":{"nom":"Chez qui","type":"personnage","requis":true},"couche":{"nom":"Laquelle","type":"couche","requis":true,"aide":"Une couche de ce personnage. Chargez le répertoire de personnages pour les voir."}}},"laissezPasser":{"nom":"Ouvrir un passage","explique":"Le montrer suffit là où l'on serait refoulé : une frontière, un quartier fermé, une porte gardée.","parametres":{"lieu":{"nom":"Où","type":"lieu","requis":true,"aide":"Chargez un monde.json pour choisir. Laissez vide pour un passe-partout."}}},"prix":{"nom":"Peser sur les prix","explique":"On vous fait un meilleur prix, ou on vous en donne un meilleur. Le sceau d'une guilde, la recommandation d'un comptoir.","parametres":{"sens":{"nom":"Dans quel sens","type":"choix","requis":true,"valeurs":["achat","vente","les deux"],"defaut":"les deux"},"part":{"nom":"De combien","type":"fraction","requis":true,"defaut":0.08,"aide":"0,08 fait 8 % de mieux. Au-delà de 0,2 le commerce ne veut plus rien dire."}}}},"provenances":{"mission":{"nom":"Au bout d'une mission","explique":"On l'obtient en accomplissant une mission écrite. C'est la façon la plus sûre de faire mériter un objet : il a fallu aller quelque part et le rapporter.","parametres":{"mission":{"nom":"Quelle mission","type":"mission","requis":true,"aide":"La clé de la mission. L'atelier de missions les proposera ; d'ici là, écrivez-la et notez-la."},"quand":{"nom":"À quel moment","type":"choix","valeurs":["à la fin","en cours de route"],"defaut":"à la fin"}}},"evenement":{"nom":"Dans un événement","explique":"On tombe dessus en chemin. Réservez-le aux objets qu'on peut trouver sans les chercher.","parametres":{"evenement":{"nom":"Quel événement","type":"texte","aide":"La clé de l'événement, si vous en avez déjà écrit un."}}},"personnage":{"nom":"Détenu par quelqu'un","explique":"Quelqu'un l'a et pourrait s'en séparer. Il faudra le convaincre, l'acheter, ou le lui prendre.","parametres":{"personnage":{"nom":"Qui","type":"personnage","requis":true}}},"lieu":{"nom":"Se trouve quelque part","explique":"Il est là, dans une échoppe ou dans des ruines. Avec un prix, il s'achète ; sans prix, il faut une raison d'y avoir accès.","parametres":{"lieu":{"nom":"Où","type":"lieu","requis":true},"prix":{"nom":"Prix demandé","type":"nombre","aide":"Laissez vide s'il ne se vend pas — il faudra alors une autre façon de l'obtenir."}}},"depart":{"nom":"Dans les bagages au départ","explique":"Le marchand l'a depuis toujours et ne sait peut-être pas ce que c'est. Excellent pour un objet dont le lore se découvre en cours de partie.","parametres":{}}},"interrogations":{"couchesConnues":{"nom":"Couches déjà découvertes","unite":"couches","explique":"Pour enchaîner les révélations sur l'objet lui-même."},"etapesPorte":{"nom":"Étapes depuis qu'on l'a","unite":"étapes","explique":"Le temps passé avec l'objet. Ce qu'on ne comprend qu'à force de l'avoir sous les yeux."},"montre":{"nom":"Fois qu'on l'a montré","unite":"fois","explique":"Combien de fois on l'a sorti devant quelqu'un. Les objets parlent quand on les fait parler."}},"trous":{"nom":{"explique":"Le nom de l'objet.","exemple":"Le registre des péages"},"il":{"explique":"Le pronom accordé.","exemple":"elle"},"le":{"explique":"L'article défini accordé.","exemple":"la"},"un":{"explique":"L'article indéfini accordé.","exemple":"une"},"e":{"explique":"La marque d'accord à coller à un participe.","exemple":"retrouvé{e}"},"ancien":{"explique":"Le nom de son ancien propriétaire, s'il en a un.","exemple":"Dame Orlanne"},"lieu":{"explique":"Le lieu d'où il vient.","exemple":"Aurelium"},"poids":{"explique":"Son poids en kilos.","exemple":"2"},"valeur":{"explique":"Ce qu'il vaut, s'il vaut quelque chose.","exemple":"6 200"}}},"vocabulaireMissions":{"format":"caravane.vocabulaire-missions.v1","apropos":"Le catalogue des missions écrites — celles qu'on compose à la main, une par une, par opposition aux offres que le moteur tire au sort à chaque marché. Une mission est une chaîne de jalons : reçue de quelqu'un, elle avance ailleurs et se conclut. Comme les autres catalogues, celui-ci est ouvert.","principe":"Le lien entre une mission et son commanditaire est stocké dans la mission, jamais dans le personnage. On écrit donc ses personnages tranquillement, sans leur attribuer quoi que ce soit, et on revient plus tard leur confier une mission sans jamais rouvrir personnages.json.","jalons":{"atteindre":{"nom":"Arriver quelque part","explique":"Le jalon tombe quand le convoi entre dans le lieu. C'est le jalon le plus simple, et souvent le premier : il faut bien aller là-bas.","parametres":{"lieu":{"nom":"Où","type":"lieu","requis":true}}},"livrer":{"nom":"Livrer de la marchandise","explique":"Il faut arriver quelque part avec les kilos demandés dans les chariots. La marchandise part au moment de la livraison — elle ne se revend pas au marché du coin.","parametres":{"bien":{"nom":"Quelle marchandise","type":"bien","requis":true},"kg":{"nom":"Combien de kilos","type":"nombre","requis":true,"defaut":20},"lieu":{"nom":"Où","type":"lieu","requis":true}}},"rencontrer":{"nom":"Parler à quelqu'un","explique":"Il faut trouver la personne là où elle se tient et lui parler. Le jalon compte une rencontre de plus à son compteur — celui qui fait mériter son lore.","parametres":{"personnage":{"nom":"Qui","type":"personnage","requis":true}}}},"recompenses":{"or":{"nom":"De l'or","explique":"La prime. Rien n'oblige une mission écrite à en donner, mais c'est ce que le joueur attend d'abord.","parametres":{"de":{"nom":"Combien","type":"nombre","requis":true,"defaut":300,"aide":"Les offres tirées au sort donnent 150 à 900 po selon l'avancement. Une mission écrite peut se permettre davantage : elle ne revient pas."}}},"reputation":{"nom":"De la réputation","explique":"Ce que le monde marchand pense de vous. Entre 0 et 100.","parametres":{"de":{"nom":"Combien","type":"nombre","requis":true,"defaut":8,"aide":"Négatif pour une perte. Les contrats ordinaires donnent 4 à 6."}}},"karma":{"nom":"Du karma","explique":"La chance du convoi, donc tous les jets de dé. La récompense discrète de ce qui n'était pas obligé.","parametres":{"de":{"nom":"Combien","type":"nombre","requis":true,"defaut":4}}},"objet":{"nom":"Un objet unique","explique":"L'objet passe dans les chariots. C'est la façon la plus sûre de faire mériter un objet — il a fallu aller quelque part et le rapporter. L'objet doit déclarer de son côté qu'il vient de cette mission.","parametres":{"objet":{"nom":"Lequel","type":"objet","requis":true,"aide":"Chargez votre objets.json pour choisir. L'atelier vérifie que l'objet pointe bien vers cette mission."}}},"ouvreCouche":{"nom":"Une couche de lore","explique":"Accomplir la mission ouvre une couche chez un personnage. C'est ce qui rend un service payant autrement qu'en pièces : on apprend quelque chose.","parametres":{"personnage":{"nom":"Chez qui","type":"personnage","requis":true},"couche":{"nom":"Laquelle","type":"couche","requis":true}}}},"trous":{"commanditaire":{"explique":"Le nom de celui qui donne la mission, titre compris.","exemple":"Dame Orlanne"},"il":{"explique":"Son pronom, accordé.","exemple":"elle"},"ici":{"explique":"Le lieu où la mission est proposée.","exemple":"Aurelium"},"la":{"explique":"Le lieu du dernier jalon — là où ça se termine.","exemple":"Bas-Ferrant"},"delai":{"explique":"Le nombre d'étapes accordé.","exemple":"14"},"prime":{"explique":"L'or promis, s'il y en a.","exemple":"400"},"objet":{"explique":"Le nom de l'objet promis, s'il y en a un.","exemple":"Le registre des péages"}}},"vocabulaireDialogues":{"format":"caravane.vocabulaire-dialogues.v1","apropos":"Le catalogue de ce qu'un dialogue peut dire, demander et faire. Un dialogue est une conversation écrite d'avance : le personnage parle, on lui répond, et selon la réponse la conversation continue ailleurs. Il réutilise en entier le vocabulaire des événements — les dix-huit effets, les interrogations, les quatre écritures d'un montant — et n'ajoute que ce qui n'a de sens qu'en conversation : la mémoire de ce qu'on s'est dit, et le fait de confier une mission.","principe":"Un dialogue appartient à un personnage et se joue quand on lui parle en ville. Il se compose de répliques nommées : chacune est ce que le personnage dit, suivi des réponses qu'on peut lui faire. Une réponse mène à une autre réplique, ou clôt la conversation. Rien n'est écrit en code : les conditions et les effets sont ceux du catalogue.","champs":{"cle":{"nom":"La clé","explique":"Le nom technique du dialogue, unique dans tout le fichier. Minuscules, chiffres et tirets.","requis":true,"exemple":"orlanne-le-registre"},"personnage":{"nom":"Qui parle","explique":"La clé du personnage à qui ce dialogue appartient. Il se joue quand on lui parle, là où il se tient.","requis":true,"exemple":"orlanne"},"titre":{"nom":"Le titre","explique":"Ce qu'on lit sur le bouton, dans l'onglet des gens. Une poignée de mots, du point de vue du joueur.","requis":true,"exemple":"Le registre raturé"},"si":{"nom":"Quand il se propose","explique":"Des conditions, toutes vraies pour que le dialogue apparaisse. Vide, il se propose toujours.","requis":false},"priorite":{"nom":"La priorité","explique":"Quand plusieurs dialogues d'un même personnage sont ouverts en même temps, le plus haut se propose en premier. Par défaut zéro.","requis":false,"defaut":0},"rejouable":{"nom":"On peut le rejouer","explique":"Par défaut un dialogue ne se joue qu'une fois : une conversation qu'on a eue, on l'a eue. Coché, il reste offert — c'est ce qu'il faut pour un marchand chez qui l'on repasse.","requis":false,"defaut":false},"entree":{"nom":"Par où l'on commence","explique":"Le nom de la première réplique. À défaut, la première de la liste.","requis":false,"defaut":"accueil"},"repliques":{"nom":"Les répliques","explique":"La conversation elle-même, une réplique par nom. Chacune porte ce que le personnage dit et les réponses qu'on peut lui faire.","requis":true}},"replique":{"dit":{"nom":"Ce qu'il dit","explique":"Le texte du personnage. Accepte les trous entre accolades. Pour plusieurs variantes dont le jeu tire une au hasard, écrivez un tableau de textes — dans l'atelier, une ligne vide entre chacune suffit.","requis":true,"exemple":["« Marchand. »","« Vous voilà. »"]},"oeil":{"nom":"La didascalie","explique":"Une ligne en petites capitales au-dessus du texte : où l'on est, ce qu'il fait pendant qu'il parle. Facultative.","requis":false,"exemple":"Sous l'auvent de la halle"},"effets":{"nom":"Ce qui arrive en y entrant","explique":"Des effets joués une fois, au moment où la réplique s'affiche. Sert à donner ce qu'on vient de promettre, plutôt que de l'accrocher à la réponse.","requis":false},"reponses":{"nom":"Ce qu'on peut répondre","explique":"Les boutons offerts au joueur, dans l'ordre. Une réplique sans réponse clôt la conversation.","requis":false}},"reponse":{"txt":{"nom":"La réponse","explique":"Ce que le joueur dit, écrit à la première personne. Court : c'est un bouton.","requis":true,"exemple":"Je veux bien m'en charger."},"si":{"nom":"Quand elle est possible","explique":"Des conditions. Non remplies, la réponse s'affiche grisée plutôt que de disparaître : voir qu'une porte existe et qu'elle est fermée vaut mieux que ne pas la voir.","requis":false},"sinon":{"nom":"Pourquoi elle est fermée","explique":"La raison montrée sous une réponse grisée. Sans elle, la réponse est simplement cachée.","requis":false,"exemple":"Il vous faudrait cinquante pièces."},"effets":{"nom":"Ce qu'elle fait","explique":"Les effets joués quand on la choisit, avant d'aller à la réplique suivante.","requis":false},"vers":{"nom":"La suite","explique":"Le nom de la réplique où l'on va. Absent, la conversation se termine.","requis":false},"fin":{"nom":"Elle clôt","explique":"Ferme la conversation explicitement, même si une suite est indiquée. Sert à en sortir d'un mot.","requis":false}},"interrogations":{"souvenir":{"nom":"Ce qu'on s'est dit","unite":"oui ou non","explique":"Un souvenir posé par un dialogue précédent. C'est ce qui fait qu'une conversation se rappelle la précédente.","demande":"nom"},"dialogueVu":{"nom":"Un dialogue déjà joué","unite":"fois","explique":"Combien de fois cette conversation a été menée jusqu'au bout. Zéro si jamais.","demande":"dialogue"},"rencontres":{"nom":"Les fois où on lui a parlé","unite":"fois","explique":"Le compteur de rencontres d'un personnage. Sans précision, celui à qui l'on parle.","demande":"personnage"},"missionEtat":{"nom":"Où en est <script id="commun">
/* La machinerie partagée des ateliers de Caravane.

   Ce fichier n'est jamais chargé par une page : outils/construire.mjs le recopie
   à l'intérieur de chaque atelier, entre les balises <script id="commun">. Les
   ateliers doivent en effet s'ouvrir d'un simple double-clic, donc en file://,
   où aucune page ne peut aller chercher un fichier voisin.

   Il tient trois choses :
     — les petites fonctions dont tout le monde se sert ;
     — la lecture et l'écriture du modèle par chemin, sur quoi reposent tous les
       formulaires engendrés ;
     — la sauvegarde dans le navigateur, avec son échéance dure.

   Chaque atelier déclare d'où il lit avec racineEst(), et ce qu'il sauve avec
   sauvegardeEst().                                                          */

/* ═══════════════ le menu fretin ═══════════════ */
const $=(s,p=document)=>p.querySelector(s);
const $$=(s,p=document)=>Array.prototype.slice.call(p.querySelectorAll(s));
const ech=s=>String(s==null?'':s).replace(/[&<>"]/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const fmt=n=>Math.round(n).toLocaleString('fr-FR');
const dec=n=>(Math.round(n*1000)/1000).toString().replace('.',',');
const slug=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()
  .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,48);

/* ═══════════════ lecture et écriture par chemin ═══════════════
   Les formulaires sont engendrés : chaque champ porte le chemin de la donnée
   qu'il édite, « couches.2.texte » ou « choix.0.reussi.effets.1.part ». Écrire
   une valeur vide efface la clé, pour que le fichier exporté ne porte que ce
   qui a été rempli. */
let RACINE=()=>null;
function racineEst(f){RACINE=f;}
function lire(ch){
  return String(ch).split('.').reduce((o,k)=>(o==null?undefined:o[k]),RACINE());
}
function ecrire(ch,v){
  const p=String(ch).split('.'), der=p.pop();
  let o=RACINE();
  if(o==null)return;
  for(const k of p){
    if(o[k]==null)o[k]=/^\d+$/.test(k)?[]:{};
    o=o[k];
  }
  if(v===''||v===undefined||v===null)delete o[der];
  else o[der]=v;
}
function nettoyer(o){                      /* enlève les objets et listes vides */
  if(Array.isArray(o)){o.forEach(nettoyer);return o;}
  if(o&&typeof o==='object'){
    for(const k of Object.keys(o)){
      nettoyer(o[k]);
      const v=o[k];
      if(v===''||v===undefined||v===null||
         (Array.isArray(v)&&!v.length)||
         (v&&typeof v==='object'&&!Array.isArray(v)&&!Object.keys(v).length))delete o[k];
    }
  }
  return o;
}
function bouger(l,i,d){
  if(!l||i+d<0||i+d>=l.length)return;
  const x=l[i];l[i]=l[i+d];l[i+d]=x;
}

/* ═══════════════════════════════════════════════════════════════════════════
   LE DÉPÔT PARTAGÉ
   ───────────────────────────────────────────────────────────────────────────
   Les sept ateliers étant servis depuis la même adresse, ils partagent le même
   localStorage. On y tient **une seule réserve** : le monde, les personnages,
   les rôles, les objets, les missions, les événements, les dialogues, les
   icônes.

   La distinction qui fait tout marcher :
     — le **contenu** est commun. Un personnage écrit dans son atelier est
       aussitôt là dans celui des missions, sans rien exporter ni recharger ;
     — l'**état de travail** — quel élément est ouvert, le filtre, le convoi
       d'essai — reste privé à chaque atelier, dans sa propre clé.

   Les anciennes sauvegardes, une par atelier, sont reprises au premier
   chargement : on ne perd pas ce qui était déjà écrit.                       */

const DEPOT='caravane.depot.v1';
const SECTIONS=['monde','personnages','roles','objets','missions','evenements',
                'dialogues','icones'];
/* d'où venait chaque section avant le dépôt, et sous quelle forme */
const ANCIENNES={
  personnages:['caravane.atelier-personnages.v1','repertoire'],
  objets:['caravane.atelier-objets.v1','coffre'],
  missions:['caravane.atelier-missions.v1','carnet'],
  evenements:['caravane.atelier-evenements.v1','recueil'],
  monde:['caravane.atelier-carte.v1',null]
};
let D=null;

function chargerDepot(){
  if(D)return D;
  try{D=JSON.parse(localStorage.getItem(DEPOT)||'null');}catch(e){D=null;}
  if(!D||typeof D!=='object')D={v:1};
  /* reprise : ce qui dormait dans les clés d'avant rejoint la réserve */
  let repris=[];
  Object.keys(ANCIENNES).forEach(nom=>{
    if(D[nom])return;
    const [cle,champ]=ANCIENNES[nom];
    let vieux=null;
    try{vieux=JSON.parse(localStorage.getItem(cle)||'null');}catch(e){}
    if(!vieux)return;
    const v=champ?vieux[champ]:vieux;
    if(v&&typeof v==='object'){D[nom]=v;repris.push(nom);}
    /* le monde de l'atelier de carte y était aussi rangé sous « monde » */
    if(!champ&&vieux.monde&&typeof vieux.monde==='object'){D[nom]=vieux.monde;repris.push(nom);}
  });
  if(repris.length){ecrireDepot();console.info('Dépôt : repris '+repris.join(', '));}
  return D;
}
function ecrireDepot(){
  try{localStorage.setItem(DEPOT,JSON.stringify(D));}
  catch(e){/* quota, mode privé : on continue sans */}
}
/* Lire une section que l'on ne tient pas soi-même : c'est par là que l'atelier
   de missions voit les personnages. */
function depotLire(nom){
  chargerDepot();
  return D[nom]||null;
}
function depotEcrire(nom,valeur){
  chargerDepot();
  /* On relit le disque avant d'écrire, et l'on ne pose que sa propre section :
     un autre onglet a pu en poser une entre notre chargement et maintenant, et
     réécrire tout le dépôt depuis un cache périmé la perdrait. L'événement
     « storage » nous en avertit, mais il arrive après coup. */
  let frais=null;
  try{frais=JSON.parse(localStorage.getItem(DEPOT)||'null');}catch(e){}
  if(frais&&typeof frais==='object'){
    SECTIONS.forEach(s=>{
      if(s===nom)return;
      if(frais[s]!==undefined)D[s]=frais[s];
    });
    if(frais.maj)D.maj=Object.assign({},frais.maj,D.maj||{});
  }
  if(valeur===null||valeur===undefined)delete D[nom];
  else D[nom]=valeur;
  D.maj=D.maj||{};D.maj[nom]=Date.now();
  ecrireDepot();
}
/* Ce que le dépôt contient, en un coup d'œil — le codex du hub s'en sert. */
function depotResume(){
  chargerDepot();
  const n=(s,c)=>((D[s]&&D[s][c])||[]).length;
  return {
    monde:D.monde?((D.monde.lieux||[]).length):0,
    personnages:n('personnages','personnages'),
    objets:n('objets','objets'),
    missions:n('missions','missions'),
    evenements:n('evenements','evenements'),
    dialogues:n('dialogues','dialogues'),
    icones:n('icones','icones'),
    roles:n('roles','roles')
  };
}

/* ═══════════════ le codex ═══════════════
   Le hub ne connaît la forme d'aucun atelier : il demande ici une liste plate,
   toujours la même — une clé, un nom, une ligne de détail, un dessin, une
   teinte — et un lien qui rouvre l'élément dans l'outil qui l'a fait.
   Ajouter une catégorie, c'est ajouter une ligne à ce tableau. */
const CATEGORIES=[
  {nom:'monde',      titre:'Les lieux',       un:'lieu',       des:'lieux',
   atelier:'atelier-carte.html',        champ:'lieux'},
  {nom:'personnages',titre:'Les personnages', un:'personnage', des:'personnages',
   atelier:'atelier-personnages.html',  champ:'personnages'},
  /* Les rôles n'ont pas de fichier à eux : ils voyagent dans personnages.json,
     puisque c'est là qu'on s'en sert. Mais ils se listent et se rouvrent. */
  {nom:'roles',      titre:'Les rôles',       un:'rôle',       des:'rôles',
   atelier:'atelier-personnages.html',  champ:'roles',  lien:'role'},
  {nom:'objets',     titre:'Les objets',      un:'objet',      des:'objets',
   atelier:'atelier-objets.html',       champ:'objets'},
  {nom:'missions',   titre:'Les missions',    un:'mission',    des:'missions',
   atelier:'atelier-missions.html',     champ:'missions'},
  {nom:'evenements', titre:'Les événements',  un:'événement',  des:'événements',
   atelier:'atelier-evenements.html',   champ:'evenements'},
  {nom:'dialogues',  titre:'Les dialogues',   un:'dialogue',   des:'dialogues',
   atelier:'atelier-dialogues.html',    champ:'dialogues'},
  {nom:'icones',     titre:'Les icônes',      un:'icône',      des:'icônes',
   atelier:'atelier-icones.html',       champ:'icones'}
];
/* Ce qu'on dit d'un élément en une ligne, sous son nom. Chaque catégorie a sa
   phrase, parce qu'un lieu ne se résume pas comme une mission. */
function detailCodex(section,x,depot){
  const nomDe=(s,c,cle)=>{
    const l=(depot[s]&&depot[s][c])||[];
    const t=l.find(y=>y&&y.cle===cle);
    return t?(t.nom||t.titre||cle):cle;
  };
  const bouts=[];
  if(section==='monde'){
    if(x.rang)bouts.push(x.rang);
    if(x.contree)bouts.push('en '+nomDe('monde','contrees',x.contree));
    if(x.carte)bouts.push('carte '+x.carte);
  }else if(section==='roles'){
    if(x.feminin)bouts.push('au féminin : '+x.feminin);
    else bouts.push('le même au féminin');
    const n=((depot.personnages&&depot.personnages.personnages)||[])
      .filter(p=>p&&p.role===x.cle).length;
    bouts.push(n?n+(n>1?' personnages':' personnage'):'personne encore');
  }else if(section==='personnages'){
    if(x.titre)bouts.push(x.titre);
    if(x.role)bouts.push(nomRole(x.role,x.accord)||x.role);
    if(x.lieu)bouts.push('à '+nomDe('monde','lieux',x.lieu));
    const c=(x.couches||[]).length;
    if(c)bouts.push(c+(c>1?' couches':' couche'));
    if(!x.accord)bouts.push('accord à choisir');
  }else if(section==='objets'){
    if(x.genre)bouts.push(x.genre);
    const p=(x.pouvoirs||[]).length;
    if(p)bouts.push(p+(p>1?' pouvoirs':' pouvoir'));
    const pr=x.provenance&&x.provenance.genre;
    if(pr==='mission'&&x.provenance.mission)
      bouts.push('de « '+nomDe('missions','missions',x.provenance.mission)+' »');
    else if(pr)bouts.push(pr);
  }else if(section==='missions'){
    if(x.commanditaire)bouts.push('de '+nomDe('personnages','personnages',x.commanditaire));
    else bouts.push('sans commanditaire');
    const j=(x.jalons||[]).length;
    bouts.push(j?j+(j>1?' jalons':' jalon'):'aucun jalon');
    const d=x.offre&&x.offre.delai;
    if(d)bouts.push(d+' étapes');
  }else if(section==='evenements'){
    if(x.oeil)bouts.push(x.oeil);
    if(x.genre)bouts.push(x.genre);
    const c=(x.choix||[]).length;
    if(c)bouts.push(c+(c>1?' issues':' issue'));
  }else if(section==='dialogues'){
    const q=((depot.personnages&&depot.personnages.personnages)||[])
      .find(p=>p&&p.cle===x.personnage);
    bouts.push(q?'de '+(q.nom||x.personnage):(x.personnage?'de '+x.personnage
      :'sans personnage'));
    const n=Object.keys(x.repliques||{}).length;
    bouts.push(n?n+(n>1?' répliques':' réplique'):'aucune réplique');
    if(x.rejouable)bouts.push('rejouable');
  }else if(section==='icones'){
    if(x.source)bouts.push('SVG collé');
    else{
      const f=(x.formes||[]).length;
      bouts.push(f?f+(f>1?' formes':' forme'):'vide');
    }
    if(x.nature)bouts.push(x.nature);
  }
  return bouts.join(' · ');
}
/* Un élément est « en chantier » quand il lui manque de quoi exister : pas de
   clé, pas de nom. Le codex le montre sans le cacher — c'est normal en cours
   de travail — mais il le dit. */
function inacheveCodex(section,x){
  if(!x.cle)return 'sans clé';
  if(!(x.nom||x.titre))return 'sans nom';
  if(section==='missions'&&!(x.jalons||[]).length)return 'sans jalon';
  if(section==='personnages'&&!x.premiere)return 'sans description';
  if(section==='roles'&&!x.explique)return 'sans explication';
  if(section==='dialogues'&&!x.personnage)return 'sans personnage';
  return '';
}
function teinteContree(depot,cle){
  const c=((depot.monde&&depot.monde.contrees)||[]).find(x=>x&&x.cle===cle);
  return (c&&c.teinte)||'#9C9484';
}
function depotCodex(){
  chargerDepot();
  return CATEGORIES.map(c=>{
    const liste=(D[c.nom]&&D[c.nom][c.champ])||[];
    return {
      nom:c.nom,titre:c.titre,un:c.un,des:c.des,atelier:c.atelier,
      entrees:liste.map(x=>({
        cle:x.cle||'',
        nom:x.nom||x.titre||'',
        detail:detailCodex(c.nom,x,D),
        manque:inacheveCodex(c.nom,x),
        glyphe:c.nom==='icones'?x.cle
              :c.nom==='monde'?'borne'
              :c.nom==='roles'?'ermite'
              :c.nom==='dialogues'?'bulle'
              :(x.ico&&x.ico.glyphe)||'',
        svg:c.nom==='icones'?(x.svg||''):'',
        /* l'icône porte sa teinte en propre, un lieu prend celle de sa
           contrée, et tout le reste la range dans son petit objet « ico » */
        teinte:c.nom==='icones'?teinteDe(x)
              :c.nom==='monde'?teinteContree(D,x.contree)
              :c.nom==='roles'?'#9C9484'
              :c.nom==='dialogues'?'#6E9B6A'
              :teinteDe(x.ico||{}),
        /* un rôle se rouvre par « #role= », pour ne pas se confondre avec le
           personnage qui porterait la même clé */
        lien:x.cle?c.atelier+'#'+(c.lien||'cle')+'='+encodeURIComponent(x.cle)
                  :c.atelier
      }))
    };
  });
}

/* ═══════════════════════════════════════════════════════════════════════════
   LES DEUX SORTES DE SAUVEGARDE
   ───────────────────────────────────────────────────────────────────────────
   Elles ne servent pas à la même chose, et les confondre coûte du travail.

   1. La **sauvegarde d'atelier** — tout le dépôt dans un fichier, plus l'état
      de travail de chaque outil. C'est le fichier qui voyage : on le prend sur
      l'ordinateur, on le reprend sur le téléphone, et l'on continue où l'on
      s'était arrêté. Il ne se dépose pas dans le jeu.

   2. Les **fichiers du jeu** — une section à la fois, sous le nom exact que
      data/ attend. C'est ce qu'on livre au jeu, et rien d'autre.

   L'image de fond de la carte ne voyage dans ni l'une ni l'autre : elle est
   trop lourde pour un JSON, et elle vous appartient. On la redépose à la main
   sur l'autre appareil.                                                      */

const FICHIERS_JEU={
  monde:'monde.json',
  personnages:'personnages.json',
  objets:'objets.json',
  /* pas « missions.json » : ce nom-là est déjà pris dans data/ par ce qui
     habille les contrats tirés au sort, et l'écraser les ferait disparaître */
  missions:'missions-ecrites.json',
  evenements:'evenements.json',
  dialogues:'dialogues.json',
  icones:'icones.json'
};
/* Les petites clés d'état privé : quel élément est ouvert, le filtre, l'onglet.
   La carte n'y est pas — son état privé, c'est le monde entier, et le monde est
   déjà dans le dépôt. */
const CLES_TRAVAIL=['personnages','objets','missions','evenements','dialogues','icones']
  .map(n=>'caravane.atelier-'+n+'.v1');

function sauvegardeComplete(){
  chargerDepot();
  const travail={};
  CLES_TRAVAIL.forEach(k=>{
    try{const t=localStorage.getItem(k);if(t)travail[k]=JSON.parse(t);}catch(e){}
  });
  const sections={};
  SECTIONS.forEach(s=>{if(D[s])sections[s]=D[s];});
  return {
    format:'caravane.atelier.v1',
    faite:new Date().toISOString(),
    resume:depotResume(),
    sections:sections,
    travail:travail
  };
}
const nomDeSauvegarde=()=>
  'caravane-atelier-'+new Date().toISOString().slice(0,10)+'.json';

/* Ce qu'un fichier contient, avant d'y toucher : on montre toujours ce qu'on
   s'apprête à reprendre, pour qu'aucun remplacement ne soit une surprise. */
function lireSauvegarde(texte){
  let d;
  try{d=JSON.parse(texte);}catch(e){return {erreur:'Ce fichier n\'est pas du JSON.'};}
  if(!d||typeof d!=='object')return {erreur:'Ce fichier ne contient rien qu\'on sache lire.'};
  if(d.format!=='caravane.atelier.v1'){
    /* un fichier de jeu isolé, déposé ici par méprise : on sait quoi en dire */
    const seule=SECTIONS.find(s=>{
      const c=CATEGORIES.find(x=>x.nom===s);
      return c&&Array.isArray(d[c.champ]);
    });
    if(seule)return {erreur:'C\'est un fichier du jeu ('+FICHIERS_JEU[seule]+
      '), pas une sauvegarde d\'atelier. Ouvrez-le depuis l\'atelier concerné.'};
    return {erreur:'Ce n\'est pas une sauvegarde d\'atelier.'};
  }
  const dedans=CATEGORIES.map(c=>{
    const s=(d.sections||{})[c.nom];
    const n=((s&&s[c.champ])||[]).length;
    return n?{nom:c.nom,titre:c.titre,n:n,mot:n+' '+(n>1?c.des:c.un)}:null;
  }).filter(Boolean);
  return {sauvegarde:d,faite:d.faite||'',dedans:dedans};
}
/* Fusionner plutôt que remplacer : on travaille les missions dans le train et
   la carte à la maison, et l'on ne veut pas choisir. La clé fait foi — une
   entrée de même clé est remplacée, une clé nouvelle s'ajoute à la suite. */
function fondre(ancien,nouveau,champ){
  const a=(ancien&&ancien[champ])||[], b=(nouveau&&nouveau[champ])||[];
  const par={}; const ordre=[];
  a.concat(b).forEach(x=>{
    if(!x)return;
    const k=x.cle||('__'+ordre.length);
    if(!(k in par))ordre.push(k);
    par[k]=x;
  });
  return Object.assign({},ancien||{},nouveau||{},{[champ]:ordre.map(k=>par[k])});
}
const LISTES_MONDE=['cartes','contrees','lieux','voies'];
function fondreMonde(ancien,nouveau){
  if(!ancien)return nouveau;
  if(!nouveau)return ancien;
  let m=Object.assign({},ancien,nouveau);
  LISTES_MONDE.forEach(l=>{
    if(Array.isArray(ancien[l])||Array.isArray(nouveau[l]))
      m[l]=fondre(ancien,nouveau,l)[l];
  });
  return m;
}
function reprendreSauvegarde(d,mode){
  chargerDepot();
  const pris=[];
  CATEGORIES.forEach(c=>{
    const venu=(d.sections||{})[c.nom];
    if(!venu)return;
    if(mode==='fusionner'&&D[c.nom]){
      D[c.nom]=c.nom==='monde'?fondreMonde(D[c.nom],venu):fondre(D[c.nom],venu,c.champ);
    }else D[c.nom]=venu;
    D.maj=D.maj||{};D.maj[c.nom]=Date.now();
    pris.push(c.nom);
  });
  /* en remplacement, ce que la sauvegarde ignore disparaît : sans quoi
     « remplacer » ne remplacerait rien du tout */
  if(mode!=='fusionner')SECTIONS.forEach(s=>{
    if(!(d.sections||{})[s])delete D[s];
  });
  ecrireDepot();
  /* l'état de travail suit, pour rouvrir sur ce qu'on regardait */
  Object.keys(d.travail||{}).forEach(k=>{
    if(CLES_TRAVAIL.indexOf(k)<0)return;
    try{localStorage.setItem(k,JSON.stringify(d.travail[k]));}catch(e){}
  });
  /* l'atelier de carte relit le dépôt à défaut de sa propre clé : on efface la
     sienne pour qu'il reparte du monde qu'on vient de reprendre */
  if((d.sections||{}).monde&&mode!=='fusionner'){
    try{localStorage.removeItem('caravane.atelier-carte.v1');}catch(e){}
  }
  return pris;
}
/* Un fichier du jeu, tel que data/ l'attend. */
function contenuDuJeu(section,brut){
  const c=nettoyer(JSON.parse(JSON.stringify(brut)));
  /* Les personnages emportent les rôles dont ils se servent. Sans cela le jeu
     n'aurait aucun moyen d'écrire {role} : les rôles que vous ajoutez ne sont
     nulle part ailleurs, et un second fichier pour si peu serait une occasion
     de plus de l'oublier. */
  if(section==='personnages'){
    const r=rolesEmployes(c.personnages);
    if(Object.keys(r).length)c.roles=r;
  }
  return c;
}
function fichierDuJeu(section){
  chargerDepot();
  const c=CATEGORIES.find(x=>x.nom===section);
  if(!c||!D[section]||!FICHIERS_JEU[section])return null;
  return {nom:FICHIERS_JEU[section],
          contenu:contenuDuJeu(section,D[section]),
          combien:((D[section][c.champ])||[]).length};
}

/* ═══════════════ sauvegarde ═══════════════
   Une échéance dure : le report d'écriture ne peut pas glisser indéfiniment,
   et la page qui part écrit avant de partir. Sans les deux, une séance entière
   de travail peut ne jamais toucher le disque. */
/* Sans clé, personne ne sauvegarde : le hub prend la même machinerie mais ne
   tient aucun atelier, et n'a rien à écrire. */
let CLE_SAUVE=null, PAQUET=()=>({});
let SECTION=null, SECTION_LIRE=null;
let tSauve=null, echeance=0;
function sauvegardeEst(cle,paquet){CLE_SAUVE=cle;PAQUET=paquet;}
/* L'atelier déclare la section du dépôt qu'il tient. */
function sectionEst(nom,lire){SECTION=nom;SECTION_LIRE=lire;}
function ecrireSauve(){
  clearTimeout(tSauve);tSauve=null;echeance=0;
  if(SECTION&&SECTION_LIRE)depotEcrire(SECTION,SECTION_LIRE());
  if(!CLE_SAUVE)return;
  try{localStorage.setItem(CLE_SAUVE,JSON.stringify(PAQUET()));}
  catch(e){}
}
function sauver(){
  const t=Date.now();
  if(!echeance)echeance=t+2000;
  clearTimeout(tSauve);
  tSauve=setTimeout(ecrireSauve,Math.max(0,Math.min(400,echeance-t)));
}
function relireSauve(){
  try{return JSON.parse(localStorage.getItem(CLE_SAUVE)||'null');}catch(e){return null;}
}
addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')ecrireSauve();});
addEventListener('pagehide',ecrireSauve);
/* Un autre onglet a écrit : on relit, pour que la liste des personnages soit à
   jour dans l'atelier de missions sans avoir à recharger la page. */
function suivreDepot(quand){
  addEventListener('storage',e=>{
    if(e.key!==DEPOT)return;
    D=null;chargerDepot();
    if(quand)quand();
  });
}

/* ═══════════════ le monde ═══════════════
   Il vit dans le dépôt : l'atelier de carte l'y écrit, les cinq autres l'y
   lisent sans que personne ait à charger un fichier. */
function MONDE_(){return depotLire('monde');}
let MONDE=null;
function mondeEst(d){MONDE=d;if(d)depotEcrire('monde',d);}
function mondeDuDepot(){MONDE=depotLire('monde');return MONDE;}
function listeMonde(quoi){
  if(!MONDE)return null;
  if(quoi==='lieux')return (MONDE.lieux||[]).map(l=>[l.cle,l.nom]);
  if(quoi==='contrees')return (MONDE.contrees||[]).map(c=>[c.cle,c.nom]);
  if(quoi==='rangs')return Object.entries(MONDE.rangs||{}).map(([k,v])=>[k,v.nom||k]);
  if(quoi==='traits')return Object.entries(MONDE.traits||{}).map(([k,v])=>[k,v.nom||k]);
  if(quoi==='terrains')return Object.entries(MONDE.terrains||{}).map(([k,v])=>[k,v.nom||k]);
  if(quoi==='profils')return (MONDE.profils||[]).map(p=>[p.cle,p.nom||p.cle]);
  if(quoi==='cartes')return (MONDE.cartes||[{cle:(MONDE.carte&&MONDE.carte.fichier)||'monde',
    nom:'La carte du monde'}]).map(c=>[c.cle,c.nom||c.cle]);
  return null;
}
const REPLI={

/* ═══════════════ les icônes ═══════════════
   Deux réservoirs, comme partout : les quarante-neuf dessins d'origine, livrés
   avec le jeu, et ceux que l'atelier d'icônes ajoute. Les seconds sont rangés
   dans le dépôt et apparaissent partout sans que rien d'autre change.

   La teinte se choisit librement. Les dix teintes nommées restent proposées
   comme raccourcis — elles disent quelque chose (danger, halte, trouvaille) —
   mais une couleur écrite à la main l'emporte. */
function glyphesTous(){
  const propres=depotLire('icones');
  const dessines={};
  ((propres&&propres.icones)||[]).forEach(i=>{if(i.cle&&i.svg)dessines[i.cle]=i.svg;});
  return Object.assign({},(typeof REF!=='undefined'&&REF.glyphes)||{},dessines);
}
function nomsGlyphes(){
  const propres=depotLire('icones');
  const noms={};
  ((propres&&propres.icones)||[]).forEach(i=>{if(i.cle)noms[i.cle]=i.nom||i.cle;});
  return noms;
}
const estGlypheDessine=k=>Object.prototype.hasOwnProperty.call(nomsGlyphes(),k);

/* ═══════════════ les rôles ═══════════════
   Même principe que les dessins : quinze rôles arrivent avec le jeu, et l'on en
   ajoute autant qu'on veut. Les vôtres vivent dans le dépôt, se choisissent
   comme les autres, et voyagent avec la sauvegarde.

   Un rôle porte son **féminin** quand le mot change — échevin, échevine. Le
   texte s'écrit une fois, avec {role}, et s'accorde sur le personnage. Beaucoup
   de rôles n'en ont pas besoin : guide, ermite, aubergiste sont les mêmes des
   deux côtés, et le champ reste vide. */
function rolesTous(){
  const miens=depotLire('roles');
  const propres={};
  ((miens&&miens.roles)||[]).forEach(r=>{
    if(!r||!r.cle)return;
    propres[r.cle]={nom:r.nom||r.cle,feminin:r.feminin||'',explique:r.explique||'',
                    mien:true};
  });
  const livres=(typeof REF!=='undefined'&&REF.vocabulairePersonnages
    &&REF.vocabulairePersonnages.roles)||{};
  return Object.assign({},livres,propres);
}
const estRoleMien=k=>{
  const r=rolesTous()[k];
  return !!(r&&r.mien);
};
/* Le rôle en toutes lettres, accordé. C'est ce que {role} donne dans un texte. */
function nomRole(cle,accord){
  const r=rolesTous()[cle];
  if(!r)return '';
  return (accord==='f'&&r.feminin)?r.feminin:r.nom;
}
/* Ce qui part avec les personnages : seulement les rôles dont ils se servent,
   pour que le jeu sache écrire {role} sans qu'on lui porte un second fichier. */
function rolesEmployes(personnages){
  const tous=rolesTous(), pris={};
  (personnages||[]).forEach(p=>{
    const r=p&&p.role&&tous[p.role];
    if(!r)return;
    pris[p.role]={nom:r.nom};
    if(r.feminin)pris[p.role].feminin=r.feminin;
  });
  return pris;
}
function teinteDe(ico){
  if(ico&&ico.teinte)return ico.teinte;
  const t=(typeof REF!=='undefined'&&REF.natures)||{};
  return t[(ico||{}).nature]||'#9C9484';
}
function svgGlypheDe(cle,teinte){
  const g=glyphesTous()[cle];
  if(!g)return '';
  return `<svg viewBox="0 0 24 24" style="color:${teinte||'#9C9484'};--velin:#E3D6B2">`+
    `${g}</svg>`;
}
/* Le champ de teinte : les dix nommées, plus une couleur libre. */
function champTeinte(chNature,chTeinte){
  const nature=lire(chNature)||'';
  const libre=lire(chTeinte)||'';
  const t=(typeof REF!=='undefined'&&REF.natures)||{};
  const pastilles=Object.keys(t).map(k=>
    `<button type="button" class="teinte${!libre&&k===nature?' actif':''}"
      data-act="teinte-nommee" data-n="${ech(k)}" data-c="${ech(chNature)}"
      data-l="${ech(chTeinte)}" title="${ech(k)}"
      style="background:${t[k]}"></button>`).join('');
  const courante=libre||t[nature]||'#9C9484';
  return `<div class="teintes">${pastilles}
    <label class="teinte-libre${libre?' actif':''}" title="Une couleur à vous">
      <input type="color" value="${ech(courante)}" data-ch="${ech(chTeinte)}" data-t="txt">
    </label>
    ${libre?`<button type="button" class="outil petit" data-act="teinte-oter"
      data-l="${ech(chTeinte)}">Revenir à la teinte nommée</button>`:''}
  </div>`;
}

/* ═══════════════ les liens profonds ═══════════════
   Le codex du hub ouvre un élément directement dans son atelier :
   atelier-personnages.html#cle=orlanne */
function cleDemandee(){
  const m=/[#&]cle=([^&]+)/.exec(location.hash||'');
  return m?decodeURIComponent(m[1]):null;
}
function ouvrirDemande(liste,poser){
  const c=cleDemandee();
  if(!c)return false;
  const i=(liste||[]).findIndex(x=>x&&x.cle===c);
  if(i<0)return false;
  poser(i);
  return true;
}

/* ═══════════════ les champs engendrés ═══════════════ */
function champ(label,corps,aide,large){
  return `<div class="champ${large?' large':''}"><label>${ech(label)}</label><div>${corps}`+
    (aide?`<div class="aide">${aide}</div>`:'')+`</div></div>`;
}
function texte(ch,ph,lignes){
  const v=lire(ch);
  if(lignes)return `<textarea rows="${lignes}" data-ch="${ech(ch)}" data-t="txt" `+
    `placeholder="${ech(ph||'')}">${ech(Array.isArray(v)?v.join('\n\n'):v||'')}</textarea>`;
  return `<input data-ch="${ech(ch)}" data-t="txt" placeholder="${ech(ph||'')}" `+
    `value="${ech(v||'')}" autocomplete="off" spellcheck="false">`;
}
function nombre(ch,ph,pas){
  const v=lire(ch);
  return `<input type="number" step="${pas||'any'}" data-ch="${ech(ch)}" data-t="num" `+
    `placeholder="${ech(ph||'')}" value="${v===undefined||v===null?'':v}">`;
}
function choixListe(ch,options,vide){
  const v=lire(ch);
  return `<select data-ch="${ech(ch)}" data-t="txt">`+
    (vide?`<option value="">${ech(vide)}</option>`:'')+
    options.map(o=>{const[k,n]=Array.isArray(o)?o:[o,o];
      return `<option value="${ech(k)}"${k===v?' selected':''}>${ech(n)}</option>`;}).join('')+
    `</select>`;
}
/* Un « oui ou non » se choisit dans une liste mais se range en booléen. Le
   marqueur est explicite : le deviner d'après le nom du champ a fini par
   mordre — l'état d'une mission s'écrit lui aussi dans « vaut », et ce n'est
   pas un oui. */
function choixOuiNon(ch){
  const v=lire(ch);
  return `<select data-ch="${ech(ch)}" data-t="ouinon">`+
    `<option value="oui"${v===true?' selected':''}>oui</option>`+
    `<option value="non"${v!==true?' selected':''}>non</option></select>`;
}
function coche(ch,label){
  const v=lire(ch);
  return `<label class="chip${v?' actif':''}"><input type="checkbox" data-ch="${ech(ch)}" `+
    `data-t="bool"${v?' checked':''}>${ech(label)}</label>`;
}
function multi(ch,options,rien){
  const v=lire(ch)||[];
  if(!options.length)return `<p class="vide">${rien}</p>`;
  return `<div class="chips">`+options.map(o=>{
    const[k,n]=Array.isArray(o)?o:[o,o];
    return `<label class="chip${v.indexOf(k)>=0?' actif':''}"><input type="checkbox" `+
      `data-ch="${ech(ch)}" data-t="multi" value="${ech(k)}"${v.indexOf(k)>=0?' checked':''}>`+
      `${ech(n)}</label>`;}).join('')+`</div>`;
}
/* Les textes à trous : {ceci} entre accolades, remplacé par ce qu'on a sous la main. */
function trous(txt){
  const out=[], l=Array.isArray(txt)?txt:[txt];
  l.forEach(t=>{const re=/\{([a-zA-Z0-9_.]+)\}/g;let m;
    while((m=re.exec(String(t||''))))out.push(m[1]);});
  return out;
}
function boucher(txt,sac){
  const t=Array.isArray(txt)?pick(txt):txt;
  return String(t==null?'':t).replace(/\{([a-zA-Z0-9_.]+)\}/g,
    (m,k)=>sac[k]!==undefined?sac[k]:m);
}
/* Une valeur de texte : plusieurs paragraphes séparés par une ligne vide font
   plusieurs variantes, dont le jeu tire une au hasard. */
function texteSaisi(v){
  if(v.indexOf('\n\n')<0)return v;
  const l=v.split(/\n{2,}/).map(s=>s.trim()).filter(Boolean);
  return l.length>1?l:(l[0]||'');
}

/* ═══════════════ ouvrir et exporter ═══════════════ */
function telecharger(nom,donnees){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(donnees,null,2)],
    {type:'application/json'}));
  a.download=nom;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
/* Le dépôt de fichier, commun aux trois ateliers : on lit, on rend l'objet. */
function accueillirFichiers(surJson){
  let survol=0;
  const voile=$('#toile-depot');
  const lire1=f=>{const r=new FileReader();
    r.onload=()=>{let d;
      try{d=JSON.parse(r.result);}
      catch(e){alert('Ce fichier n\'est pas du JSON lisible.');return;}
      surJson(d);};
    r.readAsText(f);};
  addEventListener('dragenter',e=>{e.preventDefault();survol++;
    if(voile)voile.classList.add('on');});
  addEventListener('dragover',e=>e.preventDefault());
  addEventListener('dragleave',()=>{if(--survol<=0&&voile)voile.classList.remove('on');});
  addEventListener('drop',e=>{e.preventDefault();survol=0;
    if(voile)voile.classList.remove('on');
    if(e.dataTransfer.files[0])lire1(e.dataTransfer.files[0]);});
  const champFichier=$('#fichier');
  if(champFichier)champFichier.onchange=e=>{
    if(e.target.files[0])lire1(e.target.files[0]);
    e.target.value='';
  };
  return ()=>{if(champFichier)champFichier.click();};
}

/* ═══════════════ la disposition sur téléphone ═══════════════
   Sur un écran de 390 pixels, les trois colonnes empilées ne laissent que
   180 pixels au formulaire : on ne peut rien y écrire. Ici, on donne l'écran
   entier à **une** zone à la fois, et une barre en bas sert à passer de l'une à
   l'autre. Les boutons de la barre du haut se rangent dans un tiroir.

   Les quatre ateliers partagent la même ossature — #scene > aside, main, aside —
   donc ce code les sert tous les quatre sans qu'aucun n'ait à s'en occuper.

   Rien de tout cela ne s'active au-dessus de 860 pixels : sur un ordinateur,
   les trois colonnes restent côte à côte comme avant.                        */
const CSS_MOBILE=`

  #tiroir.ouvert{display:grid}
  #tiroir .outil{justify-content:center;padding:11px 10px;font-size:13.5px}
  #tiroir .sep,#tiroir .pousse{display:none}
  #tiroir .plein{grid-column:1/-1}
  #voile-tiroir{position:fixed;inset:0;background:#0009;z-index:19;display:none}
  #voile-tiroir.ouvert{display:block}
  #b-tiroir{flex:none;display:inline-flex;align-items:center;gap:7px;
    padding:8px 12px;border:1px solid var(--bord);border-radius:var(--r);
    background:var(--fond);font-size:13px}
  #b-tiroir b{color:var(--or)}

  /* — une seule zone à l'écran — */
  #scene{flex-direction:column;position:relative}
  #scene>aside,#scene>main{display:none;width:auto;max-height:none;flex:1;
    min-height:0;border:none}
