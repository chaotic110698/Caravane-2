  #scene.vue-feuille>main{display:flex}
  #scene.vue-cote>aside:last-of-type{display:flex}
  #scene>main{padding:12px 12px 24px}

  /* — la barre du bas — */
  #vues{flex:none;display:flex;background:var(--fond-clair);
    border-top:1px solid var(--bord);padding-bottom:env(safe-area-inset-bottom,0)}
  #vues button{flex:1;padding:11px 4px 12px;font-size:11.5px;color:var(--encre-pale);
    border-top:2px solid transparent;display:flex;flex-direction:column;
    align-items:center;gap:3px;line-height:1.15}
  #vues button.actif{color:var(--or);border-top-color:var(--or)}
  #vues .pastille{font-size:16px;line-height:1}

  /* — l'état, sur une ligne qu'on peut faire défiler — */
  #etat{flex-wrap:nowrap;overflow-x:auto;gap:12px;font-size:11.5px;padding:5px 10px}
  #etat>span{white-space:nowrap;flex:none}
  #etat>span:last-child{display:none}

  /* — les champs, au doigt — */
  .champ{grid-template-columns:1fr;gap:4px}
  .champ>label{padding-top:0;font-size:12px}
  input,select,textarea{padding:9px 10px;font-size:15px}   /* 15px : pas de zoom iOS */
  .chip{padding:7px 12px;font-size:13px}
  .ajout{padding:9px 12px;width:100%;text-align:center}
  .glyphes{grid-template-columns:repeat(auto-fill,minmax(46px,1fr));max-height:210px}
  #onglets button{padding:10px 2px;font-size:11px}
  #volet{padding:12px 12px 24px}
  .bloc>h2 button{padding:5px 10px;font-size:12px}
  .piece>header button,.couche>header button,.effet>header button{padding:5px 9px;font-size:12px}
}`;
/* Les trois zones, dans l'ordre où la barre du bas les propose. Chaque atelier
   nomme la sienne : « le recueil », « le répertoire », « le coffre »… */
const PETIT='(max-width:860px)';
function installerMobile(noms){
  const scene=$('#scene');
  if(!scene)return;
  const barre=$('#barre');
  /* on range les boutons de la barre dans un tiroir, sans toucher au HTML */
  if(barre&&!$('#tiroir')){
    const tiroir=document.createElement('div');
    tiroir.id='tiroir';
    const voile=document.createElement('div');
    voile.id='voile-tiroir';
    /* Un retour au hub, en tête du tiroir : sur un téléphone, le bouton « page
       précédente » du navigateur n'est pas toujours à portée de pouce. */
    const retour=document.createElement('a');
    retour.className='outil plein';
    retour.href='index.html';
    retour.innerHTML='◂ Tous les ateliers';
    tiroir.appendChild(retour);
    const b=document.createElement('button');
    b.id='b-tiroir';b.innerHTML='<b>☰</b> Outils';
    barre.appendChild(b);
    /* Les boutons vivent dans la barre en grand écran, et dans le tiroir en
       petit. On les **déplace** au franchissement plutôt que de les cacher :
       cachés, la barre serait vide d'un côté ou le tiroir de l'autre. C'est
       aussi ce qui rend la même page utilisable au doigt et à la souris. */
    const outils=Array.prototype.slice.call(barre.children)
      .filter(el=>el.tagName!=='H1'&&el!==b);
    const q=matchMedia(PETIT);
    const ranger=()=>{
      const ou=q.matches?tiroir:barre;
      outils.forEach(el=>{if(el.parentNode!==ou)ou.appendChild(el);});
      /* le bouton du tiroir reste le dernier de la barre */
      if(!q.matches)barre.appendChild(b);
    };
    if(q.addEventListener)q.addEventListener('change',ranger);
    else q.addListener(ranger);
    ranger();
    document.body.appendChild(voile);
    document.body.appendChild(tiroir);
    const fermer=()=>{tiroir.classList.remove('ouvert');voile.classList.remove('ouvert');};
    b.onclick=()=>{const o=tiroir.classList.toggle('ouvert');
      voile.classList.toggle('ouvert',o);};
    voile.onclick=fermer;
    /* refermer dès qu'on a choisi quelque chose, sauf pour un menu déroulant */
    tiroir.addEventListener('click',e=>{
      if(e.target.closest('.outil'))setTimeout(fermer,60);});
  }
  /* la barre du bas */
  if(!$('#vues')){
    const zones=[['liste',noms&&noms[0]||'La liste','☰'],
                 ['feuille',noms&&noms[1]||'La fiche','✎'],
                 ['cote',noms&&noms[2]||'L\'aperçu','◫']];
    const v=document.createElement('div');
    v.id='vues';
    v.innerHTML=zones.map(([k,n,p])=>
      `<button data-vue="${k}"><span class="pastille">${p}</span>${ech(n)}</button>`).join('');
    const etat=$('#etat');
    if(etat)etat.parentNode.insertBefore(v,etat);
    else document.body.appendChild(v);
    v.addEventListener('click',e=>{
      const b=e.target.closest('[data-vue]');
      if(b)montrerVue(b.dataset.vue);
    });
  }
  montrerVue(localStorage.getItem('caravane.vue')||'feuille');
}
function montrerVue(quoi){
  const scene=$('#scene');
  if(!scene)return;
  scene.classList.remove('vue-liste','vue-feuille','vue-cote');
  scene.classList.add('vue-'+quoi);
  $$('#vues [data-vue]').forEach(b=>b.classList.toggle('actif',b.dataset.vue===quoi));
  try{localStorage.setItem('caravane.vue',quoi);}catch(e){}
  /* on repart du haut : arriver au milieu d'un formulaire désoriente */
  const z=quoi==='feuille'?$('#scene>main'):
    (quoi==='cote'?$('#volet'):$('#scene>aside'));
  if(z)z.scrollTop=0;
}
/* Choisir un élément dans la liste passe naturellement à la fiche. */
function suivreChoix(){
  const scene=$('#scene');
  if(!scene)return;
  scene.addEventListener('click',e=>{
    if(!matchMedia('(max-width:860px)').matches)return;
    const b=e.target.closest('[data-sel]');
    if(b&&b.closest('aside'))setTimeout(()=>montrerVue('feuille'),40);
  });
}
/* À appeler une fois, à la fin de chaque atelier. */
function habillerMobile(noms){
  const st=document.createElement('style');
  st.textContent=CSS_MOBILE+CSS_TEINTES;
  document.head.appendChild(st);
  installerMobile(noms);
  suivreChoix();
}
/* Les pastilles de teinte : choisir une teinte nommée efface la couleur libre,
   et réciproquement. L'atelier fournit ce qu'il faut refaire ensuite. */
function ecouterTeintes(apres){
  document.addEventListener('click',e=>{
    const b=e.target.closest('[data-act="teinte-nommee"],[data-act="teinte-oter"]');
    if(!b)return;
    if(b.dataset.act==='teinte-nommee'){
      ecrire(b.dataset.c,b.dataset.n);
      ecrire(b.dataset.l,undefined);
    }else ecrire(b.dataset.l,undefined);
    apres();
  });
}

/* ═══════════════ la saisie, en délégation ═══════════════
   Un seul écouteur pour tous les champs de tous les formulaires : ils portent
   leur chemin, le reste suit. L'atelier fournit ce qu'il faut refaire ensuite. */
function ecouterSaisie(apres){
  document.addEventListener('input',ev=>{
    const t=ev.target;
    if(t.dataset.ch===undefined)return;
    const ch=t.dataset.ch, k=t.dataset.t;
    if(/\.__/.test(ch))return;                    /* champs de travail, pas de données */
    if(k==='txt')ecrire(ch,t.tagName==='TEXTAREA'?texteSaisi(t.value):t.value);
    else if(k==='ouinon')ecrire(ch,t.value==='oui');
    else if(k==='num')ecrire(ch,t.value===''?undefined:Number(t.value));
    else if(k==='bool'){
      ecrire(ch,t.checked||undefined);
      t.closest('.chip').classList.toggle('actif',t.checked);
    }
    else if(k==='multi'){
      const cur=lire(ch)||[], i=cur.indexOf(t.value);
      if(t.checked&&i<0)cur.push(t.value);
      if(!t.checked&&i>=0)cur.splice(i,1);
      ecrire(ch,cur.length?cur:undefined);
      t.closest('.chip').classList.toggle('actif',t.checked);
    }
    apres(t,ch,k);
  });
}

</script>

<script>
'use strict';
/* ═══════════════ les catalogues, injectés par outils/construire.mjs ═══════════════
   Les genres de jalon, les récompenses et leurs réglages viennent de
   data/vocabulaire-missions.json ; les conditions d'apparition interrogent l'état
   du convoi, qui vient de data/vocabulaire-evenements.json.

   Le principe qui gouverne tout l'atelier : le lien entre une mission et son
   commanditaire est stocké DANS LA MISSION. On écrit ses personnages tranquillement,
   sans rien leur attribuer, et on revient plus tard leur confier une mission —
   personnages.json n'est jamais rouvert ni modifié. */
const REF=JSON.parse(document.getElementById('reference').textContent);
const M=REF.vocabulaireMissions;
const V=REF.vocabulaire;

/* ═══════════════ le modèle ═══════════════ */
let R={format:'caravane.missions.v1',missions:[]};
let GENS=null, OBJETS=null;
let sel=0, onglet='offre', filtre='', zone='';
let ESSAI={etapes:6,or:900,reputation:52,karma:50,gardes:2,lieues:120,place:400,
  charge:620,valeurSoute:1400,etatConvoi:78,vigilance:58,agilite:62,negoce:60,
  puissance:1,troupe:3,chien:false,stock:150};

const MI=()=>R.missions[sel]||null;
racineEst(MI);
/* Le contenu va au dépôt partagé, l'état de travail reste privé ici. */
sectionEst('missions',()=>R);
sauvegardeEst('caravane.atelier-missions.v1',
  ()=>({carnet:R,essai:ESSAI,sel:sel,monde:MONDE,gens:GENS,objets:OBJETS,zone:zone}));
function relire(){
  /* le contenu : celui du dépôt, qu'un autre atelier a peut-être enrichi */
  const c=depotLire('missions');
  if(c&&Array.isArray(c.missions))R=c;
  mondeDuDepot();
  GENS=depotLire('personnages');
  OBJETS=depotLire('objets');
  /* l'état de travail : le nôtre seulement */
  const d=relireSauve();
  if(!d)return !!c;
  if(d.essai)Object.assign(ESSAI,d.essai);
  if(d.zone)zone=d.zone;
  sel=Math.max(0,Math.min(R.missions.length-1,d.sel|0));
  return true;
}

/* ═══════════════ les répertoires chargés ═══════════════ */
const tousGens=()=>GENS?(GENS.personnages||[]):[];
const gensPar=k=>tousGens().find(p=>p.cle===k)||null;
const listeGens=()=>tousGens().map(p=>[p.cle,appellation(p)]);
const tousObjets=()=>OBJETS?(OBJETS.objets||[]):[];
const objetPar=k=>tousObjets().find(o=>o.cle===k)||null;
const listeObjets=()=>tousObjets().map(o=>[o.cle,o.nom]);
function appellation(p){
  if(!p)return '';
  const t=(p.titre||'').trim(), n=p.nom||'';
  if(!t)return n;
  if(/ de$/.test(t))return /^[aeiouyàâäéèêëîïôöûüh]/i.test(n)?t.slice(0,-3)+' d\''+n:t+' '+n;
  return t+' '+n;
}
const nomLieu=k=>k?((listeOu('lieux').find(x=>x[0]===k)||[])[1]||k):'';
const nomContree=k=>k?((listeOu('contrees').find(x=>x[0]===k)||[])[1]||k):'';
function contreeDe(cleLieu){
  if(!MONDE)return '';
  const l=(MONDE.lieux||[]).find(x=>x.cle===cleLieu);
  return l?l.contree||'':'';
}
/* Les missions qu'un personnage donne — déduites du carnet, jamais stockées
   chez lui. C'est ce qui permet de l'écrire sans mission et de revenir après. */
const missionsDe=cle=>R.missions.filter(m=>m.commanditaire===cle);

/* ═══════════════ les distances, quand le monde est chargé ═══════════════
   Un plus court chemin sur le réseau de voies, en étapes du profil normal.
   C'est ce qui permet de dire qu'un délai de dix étapes est impossible pour
   un trajet qui en demande quatorze. */
function reseau(){
  const g={};
  if(!MONDE)return g;
  (MONDE.voies||[]).forEach(v=>{
    const c=(v.calcul||[]).find(x=>x.cle==='normal')||(v.calcul||[])[0];
    const e=c&&c.etapes?c.etapes:null;
    if(!e)return;
    (g[v.de]=g[v.de]||[]).push([v.vers,e]);
    (g[v.vers]=g[v.vers]||[]).push([v.de,e]);
  });
  return g;
}
function etapesEntre(a,b){
  if(!a||!b)return null;
  if(a===b)return 0;
  const g=reseau();
  if(!Object.keys(g).length)return null;
  const d={},vus={};
  d[a]=0;
  for(;;){
    let x=null;
    Object.keys(d).forEach(k=>{if(!vus[k]&&(x===null||d[k]<d[x]))x=k;});
    if(x===null)break;
    if(x===b)return d[b];
    vus[x]=1;
    (g[x]||[]).forEach(([y,w])=>{
      if(d[y]===undefined||d[x]+w<d[y])d[y]=d[x]+w;});
  }
  return d[b]===undefined?null:d[b];
}
/* Le fil complet : d'où l'on part, chaque jalon, et ce que ça coûte en étapes. */
function filDe(m){
  const out=[];
  let ou=m.lieu||(gensPar(m.commanditaire)||{}).lieu||'';
  out.push({genre:'depart',lieu:ou,texte:'On reçoit la mission'+(ou?' à '+nomLieu(ou):'')});
  (m.jalons||[]).forEach((j,i)=>{
    const dest=j.lieu||(j.faire==='rencontrer'?(gensPar(j.personnage)||{}).lieu:null)||null;
    const cout=dest?etapesEntre(ou,dest):null;
    out.push({genre:'jalon',jalon:j,i:i,lieu:dest,cout:cout});
    if(dest)ou=dest;
  });
  return out;
}
const etapesTotales=m=>filDe(m).reduce((s,x)=>s+(x.cout||0),0);

/* ═══════════════ les textes ═══════════════ */
function sacTexte(m){
  const q=gensPar(m.commanditaire);
  const f=q&&q.accord==='f';
  const fil=filDe(m);
  const der=fil.filter(x=>x.lieu).slice(-1)[0];
  const orR=(m.reussite&&(m.reussite.recompenses||[]).find(r=>r.donne==='or'))||null;
  const obR=(m.reussite&&(m.reussite.recompenses||[]).find(r=>r.donne==='objet'))||null;
  return {commanditaire:appellation(q)||'le commanditaire',
    il:f?'elle':'il',
    ici:nomLieu(m.lieu||(q||{}).lieu)||'ici',
    la:der?nomLieu(der.lieu):'là-bas',
    delai:fmt((m.offre&&m.offre.delai)||0),
    prime:orR?fmt(orR.de||0):'rien',
    objet:obR?((objetPar(obR.objet)||{}).nom||obR.objet||''):''};
}

/* ═══════════════ ce que la mission demande ═══════════════ */
function inter(nom){
  if(nom==='troupe')return (ESSAI.gardes||0)+1;
  return ESSAI[nom]!==undefined?ESSAI[nom]:0;
}
function conditionsVraies(liste){
  if(!liste||!liste.length)return true;
  return liste.every(c=>{
    const v=inter(c.quoi);
    if(c.vaut!==undefined)return !!v===!!c.vaut;
    if(c.min!==undefined&&v<c.min)return false;
    if(c.max!==undefined&&v>c.max)return false;
    return true;
  });
}
function ditCondition(c){
  const d=(V.interrogations||{})[c.quoi]||{nom:c.quoi};
  const b=[];
  if(c.min!==undefined)b.push('au moins '+fmt(c.min));
  if(c.max!==undefined)b.push('au plus '+fmt(c.max));
  return d.nom.toLowerCase()+' : '+(b.join(', ')||'—');
}
function ditJalon(j){
  const d=M.jalons[j.faire];
  if(!d)return 'un jalon inconnu';
  switch(j.faire){
    case 'atteindre':return 'Arriver à '+(nomLieu(j.lieu)||'—');
    case 'livrer':return `Livrer ${fmt(j.kg||0)} kg de `+
      `${(REF.biens[j.bien]||j.bien||'—').toLowerCase()} à ${nomLieu(j.lieu)||'—'}`;
    case 'rencontrer':return 'Parler à '+(appellation(gensPar(j.personnage))||j.personnage||'—');
    default:return d.nom;
  }
}
function ditRecompense(r){
  const d=M.recompenses[r.donne];
  if(!d)return 'une récompense inconnue';
  switch(r.donne){
    case 'or':return fmt(r.de||0)+' po';
    case 'reputation':return (r.de>0?'+':'')+fmt(r.de||0)+' de réputation';
    case 'karma':return (r.de>0?'+':'')+fmt(r.de||0)+' de karma';
    case 'objet':return (objetPar(r.objet)||{}).nom||r.objet||'un objet';
    case 'ouvreCouche':return `« ${nomCouche(r.personnage,r.couche)} », chez `+
      `${appellation(gensPar(r.personnage))||r.personnage||'quelqu\'un'}`;
    default:return d.nom;
  }
}
function couchesDe(cle){
  const g=gensPar(cle);
  return g?(g.couches||[]).map((c,i)=>[c.cle||String(i),c.titre||('Couche '+(i+1))]):[];
}
function nomCouche(q,c){
  const l=couchesDe(q).find(x=>x[0]===c);
  return l?l[1]:(c||'—');
}

/* ═══════════════ la feuille ═══════════════ */
function rendreFeuille(){
  const f=$('#feuille'), garde=f.scrollTop, m=MI();
  if(!m){
    f.innerHTML=`<p class="vide" style="padding:30px;text-align:center">`+
      `Aucune mission. <b>+ Mission</b> pour commencer, ou <b>Exemple</b> pour voir une `+
      `mission complète.</p>`;
    return;
  }
  let h='';
  h+=`<div class="bloc"><h2>La mission</h2><div class="corps">`+
    champ('Titre',texte('titre','Le registre raturé'))+
    champ('Clé',`<div class="rangee">${texte('cle','le-registre-rature')}`+
      `<button class="outil fixe" data-act="cle-auto">Depuis le titre</button></div>`,
      'L\'identifiant du fichier. C\'est cette clé qu\'un objet cite pour dire qu\'il vient '+
      'de cette mission.')+
    champ('Ligne au-dessus',texte('oeil','Un service'),
      'La petite ligne en petites capitales, au-dessus du titre.')+
    `</div></div>`;

  /* ── le commanditaire : le lien vit ici, dans la mission ── */
  const q=gensPar(m.commanditaire);
  h+=`<div class="bloc"><h2>Qui la donne<span class="pousse"></span>`+
    (m.commanditaire?`<button data-act="qui-oter">Détacher</button>`:'')+
    `</h2><div class="corps">`;
  if(!GENS)h+=`<p class="vide">Chargez votre <b>personnages.json</b> pour choisir un `+
    `commanditaire. Le lien est enregistré <b>ici, dans la mission</b> — votre répertoire `+
    `de personnages n'est jamais modifié.</p>`;
  else if(q)h+=`<div class="qui"><span class="jeton">`+
    `${svgGlyphe((q.ico||{}).glyphe,teinteDe(q.ico||{}))}</span>`+
    `<span class="txt"><b>${ech(appellation(q))}</b>`+
    `<span>${ech(nomLieu(q.lieu)||'sans lieu')} · `+
    `${missionsDe(q.cle).length} mission${missionsDe(q.cle).length>1?'s':''} dans ce carnet`+
    `</span></span></div>`+
    champ('Changer',choixListe('commanditaire',listeGens(),'— personne —'),
      'Ou passez par l\'onglet <b>Personnages</b>, qui montre qui se trouve dans la zone.')+
    champ('Où on la reçoit',choixListe('lieu',listeOu('lieux'),
      '— là où il se tient : '+(nomLieu(q.lieu)||'nulle part')+' —'),
      'À défaut, c\'est le lieu du commanditaire.');
  else h+=`<div class="qui rien">Personne pour l'instant. Choisissez dans l'onglet `+
    `<b>Personnages</b>, ou ici.</div>`+
    champ('Le commanditaire',choixListe('commanditaire',listeGens(),'— personne —'));
  h+=`</div></div>`;

  /* ── l'offre ── */
  h+=`<div class="bloc"><h2>Comment elle est proposée</h2><div class="corps">`+
    champ('Ce qu\'on lit',texte('offre.recit','',4),
      'Le texte de l\'offre. Les accolades citent le contexte : <b>{commanditaire}</b>, '+
      '<b>{ici}</b>, <b>{la}</b>, <b>{delai}</b>, <b>{prime}</b>, <b>{objet}</b>.',true)+
    champ('Délai',`<div class="rangee">${nombre('offre.delai','14')}`+
      `<span class="mot fixe">étapes</span></div>`,
      coutDit(m))+
    champ('N\'est proposée que si',blocConditions('offre.si'),
      'Toutes doivent être vraies. C\'est ce qui empêche une mission de fin de partie de '+
      'tomber à la première étape.',true)+
    `</div></div>`;

  /* ── pictogramme ── */
  const gl=lire('ico.glyphe'), teinte=teinteDe(lire('ico')||{});
  h+=`<div class="bloc"><h2>Le pictogramme</h2><div class="corps">`+
    champ('Teinte',champTeinte('ico.nature','ico.teinte'),
      'Les dix teintes nommées disent quelque chose — danger, halte, trouvaille. '+
      'La pastille en pointillés ouvre une couleur à vous, qui l\'emporte.',true)+
    champ('Dessin',`<div class="glyphes">`+Object.keys(glyphesTous()).map(k=>
      `<button data-act="glyphe" data-g="${ech(k)}" class="${k===gl?'actif':''}" `+
      `title="${ech(k)}">${svgGlyphe(k,teinte)}</button>`).join('')+
      `</div>`,'',true)+
    `</div></div>`;

  /* ── les jalons ── */
  const jal=m.jalons||[];
  h+=`<div class="bloc"><h2>Ce qu'il faut faire<span class="pousse"></span></h2>`+
    `<div class="corps">`+
    (jal.length?'':`<p class="vide">Aucun jalon : la mission serait accomplie avant d'avoir `+
      `commencé.</p>`)+
    `<div class="pile">`+jal.map((j,i)=>{
      const d=M.jalons[j.faire]||{nom:j.faire,explique:'Jalon inconnu du catalogue.',
        parametres:{}};
      return `<div class="piece"><header><span class="rang">Jalon ${i+1}</span>`+
        `<b>${ech(d.nom)}</b>`+
        (i>0?`<button data-act="jalon-haut" data-i="${i}">↑</button>`:'')+
        (i<jal.length-1?`<button data-act="jalon-bas" data-i="${i}">↓</button>`:'')+
        `<button data-act="jalon-oter" data-i="${i}">✕</button></header>`+
        `<div class="corps"><p class="explique">${ech(d.explique)}</p>`+
        Object.entries(d.parametres||{}).map(([k,dd])=>
          reglage('jalons.'+i+'.'+k,dd,j)).join('')+
        champ('Ce qu\'on lit en l\'accomplissant',texte('jalons.'+i+'.texte','',2),'',true)+
        `</div></div>`;}).join('')+
      `<select class="ajout" data-act="jalon-ajout">`+
      `<option value="">+ Ajouter un jalon…</option>`+
      Object.entries(M.jalons).map(([k,d])=>
        `<option value="${ech(k)}">${ech(d.nom)}</option>`).join('')+
      `</select></div></div></div>`;

  /* ── issues ── */
  h+=`<div class="bloc"><h2>Si elle est accomplie</h2><div class="corps">`+
    champ('Ce qu\'on lit',texte('reussite.texte','',3),'',true)+
    champ('Ce qu\'on gagne',blocRecompenses('reussite.recompenses'),'',true)+
    `</div></div>`;
  h+=`<div class="bloc"><h2>Si le délai passe</h2><div class="corps">`+
    champ('Ce qu\'on lit',texte('echec.texte','',3),
      'Facultatif. Sans texte, le jeu se contente de signaler l\'échéance passée.',true)+
    champ('Ce qu\'on perd',blocRecompenses('echec.recompenses'),
      'Des montants <b>négatifs</b>. Les contrats ordinaires coûtent 7 de réputation.',true)+
    `</div></div>`;

  f.innerHTML=h;
  f.scrollTop=garde;
}
function coutDit(m){
  const t=etapesTotales(m);
  const d=(m.offre&&m.offre.delai)||0;
  if(!MONDE)return 'Chargez un <b>monde.json</b> et l\'atelier calculera le trajet réel.';
  if(!t)return 'Le trajet ne coûte encore rien : aucun jalon situé.';
  if(d&&d<t)return `Le trajet demande <b>${t} étapes</b> et vous n'en accordez que `+
    `<b>${d}</b> : <b>impossible à tenir</b>.`;
  return `Le trajet demande <b>${t} étapes</b>`+
    (d?` — il reste <b>${d-t}</b> étape${d-t>1?'s':''} de marge.`:'.');
}
function blocRecompenses(ch){
  const l=lire(ch)||[];
  return `<div class="pile">`+l.map((r,i)=>{
    const d=M.recompenses[r.donne]||{nom:r.donne,explique:'Récompense inconnue du catalogue.',
      parametres:{}};
    return `<div class="piece" style="border-left-color:var(--vert)"><header>`+
      `<b>${ech(d.nom)}</b>`+
      `<button data-act="rec-oter" data-ch="${ech(ch)}" data-i="${i}">✕</button></header>`+
      `<div class="corps"><p class="explique">${ech(d.explique)}</p>`+
      Object.entries(d.parametres||{}).map(([k,dd])=>
        reglage(ch+'.'+i+'.'+k,dd,r)).join('')+
      `</div></div>`;}).join('')+
    `<select class="ajout" data-act="rec-ajout" data-ch="${ech(ch)}">`+
    `<option value="">+ Ajouter…</option>`+
    Object.entries(M.recompenses).map(([k,d])=>
      `<option value="${ech(k)}">${ech(d.nom)}</option>`).join('')+
    `</select></div>`;
}
function blocConditions(ch){
  const l=lire(ch)||[];
  const opts=Object.entries(V.interrogations||{})
    .filter(([k,d])=>(d.unite||'')!=='oui ou non')
    .map(([k,d])=>`<option value="${ech(k)}">${ech(d.nom)}</option>`).join('');
  return `<div class="pile">`+(l.length?'':`<p class="vide">Aucune — elle peut être `+
    `proposée dès le départ.</p>`)+
    l.map((c,i)=>`<div class="cond">`+
      `<div class="rangee"><select data-ch="${ech(ch+'.'+i+'.quoi')}" data-t="txt">`+
      opts.replace(`value="${ech(c.quoi)}"`,`value="${ech(c.quoi)}" selected`)+
      `</select><button class="fixe outil" data-act="cond-oter" data-ch="${ech(ch)}" `+
      `data-i="${i}">✕</button></div>`+
      `<div class="rangee"><span class="mot fixe">au moins</span>`+
      nombre(ch+'.'+i+'.min')+`<span class="mot fixe">au plus</span>`+
      nombre(ch+'.'+i+'.max')+`</div></div>`).join('')+
    `<button class="ajout" data-act="cond-ajout" data-ch="${ech(ch)}">`+
    `+ Ajouter une condition</button></div>`;
}
function reglage(ch,d,contexte){
  let corps;
  if(d.type==='choix')corps=choixListe(ch,d.valeurs.map(x=>[x,x]),d.requis?'':'— au choix —');
  else if(d.type==='bien')corps=choixListe(ch,Object.entries(REF.biens),d.requis?'— quoi ? —':'');
  else if(d.type==='lieu')corps=listeOu('lieux').length
    ?choixListe(ch,listeOu('lieux'),d.requis?'— où ? —':'')
    :`<p class="vide">Chargez un <b>monde.json</b> pour choisir un lieu.</p>`;
  else if(d.type==='personnage')corps=listeGens().length
    ?choixListe(ch,listeGens(),'— qui ? —')
    :`<p class="vide">Chargez un <b>personnages.json</b> pour choisir quelqu'un.</p>`;
  else if(d.type==='objet')corps=listeObjets().length
    ?choixListe(ch,listeObjets(),'— lequel ? —')
    :`<p class="vide">Chargez un <b>objets.json</b> pour choisir un objet.</p>`;
  else if(d.type==='couche'){
    const qui=contexte?contexte.personnage:null;
    const l=qui?couchesDe(qui):[];
    corps=l.length?choixListe(ch,l,'— laquelle ? —')
      :`<p class="vide">Choisissez d'abord quelqu'un qui a des couches.</p>`;
  }
  else if(d.type==='nombre'||d.type==='fraction')
    corps=nombre(ch,d.defaut!==undefined?String(d.defaut):'',
      d.type==='fraction'?'0.01':'any');
  else corps=texte(ch);
  return champ(d.nom,corps,(d.aide||'')+(d.requis?' <b>Obligatoire.</b>':''));
}
function svgGlyphe(k,teinte){return svgGlypheDe(k,teinte);}

/* ═══════════════ le carnet ═══════════════ */
function rendreListe(){
  const q=filtre.trim().toLowerCase();
  const vus=R.missions.map((m,i)=>({m:m,i:i}))
    .filter(x=>!q||((x.m.titre||'')+' '+(x.m.cle||'')+' '+
      appellation(gensPar(x.m.commanditaire))).toLowerCase().indexOf(q)>=0);
  const par={};
  vus.forEach(x=>{const k=x.m.commanditaire||'';(par[k]=par[k]||[]).push(x);});
  const nomQui=k=>k?(appellation(gensPar(k))||k):'Sans commanditaire';
  const cles=Object.keys(par).sort((a,b)=>nomQui(a).localeCompare(nomQui(b),'fr'));
  $('#liste').innerHTML=cles.map(k=>
    `<div class="groupe">${ech(nomQui(k))}</div>`+
    par[k].map(x=>{
      const pb=controler(x.m,x.i).filter(y=>y.dur).length;
      const t=teinteDe((x.m.ico)||{});
      const nj=(x.m.jalons||[]).length;
      return `<button class="entree${x.i===sel?' actif':''}${pb?' faux':''}" data-sel="${x.i}">`+
        `<span class="jeton">${svgGlyphe((x.m.ico||{}).glyphe,t)}</span>`+
        `<span class="txt"><b>${ech(x.m.titre||'sans titre')}</b>`+
        `<span>${nj} jalon${nj>1?'s':''}`+
        `${MONDE&&etapesTotales(x.m)?' · '+etapesTotales(x.m)+' étapes':''}`+
        `${pb?' · '+pb+' à corriger':''}</span></span></button>`;}).join('')
  ).join('')||`<p class="vide" style="padding:8px">Rien ici.</p>`;
}

/* ═══════════════ les contrôles ═══════════════ */
const TROUS=Object.keys(M.trous);
function controler(m,idx){
  const out=[];
  const dur=t=>out.push({dur:true,txt:t});
  const doux=t=>out.push({dur:false,txt:t});
  if(!m)return out;
  if(!m.cle)dur('Il manque la <b>clé</b>.');
  else if(!/^[a-z0-9-]+$/.test(m.cle))
    dur('La <b>clé</b> ne prend que des minuscules, des chiffres et des tirets.');
  else if(R.missions.some((x,i)=>i!==idx&&x.cle===m.cle))
    dur(`La clé <b>${ech(m.cle)}</b> sert déjà à une autre mission.`);
  if(!m.titre)dur('Il manque le <b>titre</b>.');
  if(!m.oeil)doux('Pas de <b>ligne au-dessus</b> du titre.');
  if(!m.commanditaire)doux('Personne ne la donne : c\'est valable pour l\'écrire, mais elle '+
    'ne sera proposée nulle part tant qu\'un <b>commanditaire</b> ne l\'aura pas prise.');
  else if(GENS&&!gensPar(m.commanditaire))
    dur(`Le commanditaire <b>${ech(m.commanditaire)}</b> n'est pas au répertoire chargé.`);
  if(!(m.offre&&m.offre.recit))dur('Il manque le <b>texte de l\'offre</b>.');
  if(!(m.offre&&m.offre.delai))doux('Pas de <b>délai</b> : la mission ne pourra jamais être '+
    'ratée par le temps.');
  if(m.ico&&m.ico.glyphe&&!glyphesTous()[m.ico.glyphe])
    dur(`Le dessin <b>${ech(m.ico.glyphe)}</b> n'existe pas.`);
  if(m.lieu&&MONDE&&!(MONDE.lieux||[]).some(l=>l.cle===m.lieu))
    dur(`Le lieu <b>${ech(m.lieu)}</b> n'existe pas dans le monde chargé.`);

  verifierTexte(m.offre&&m.offre.recit,'le texte de l\'offre',out);

  const jal=m.jalons||[];
  if(!jal.length)dur('Aucun <b>jalon</b> : elle serait accomplie avant d\'avoir commencé.');
  jal.forEach((j,i)=>{
    const d=M.jalons[j.faire];
    if(!d){dur(`Jalon ${i+1} inconnu du catalogue : <b>${ech(j.faire)}</b>.`);return;}
    Object.entries(d.parametres||{}).forEach(([k,dd])=>{
      if(dd.requis&&(j[k]===undefined||j[k]===''))
        dur(`Jalon ${i+1} « ${ech(d.nom)} » : <b>${ech(dd.nom)}</b> est obligatoire.`);
    });
    if(j.lieu&&MONDE&&!(MONDE.lieux||[]).some(l=>l.cle===j.lieu))
      dur(`Jalon ${i+1} : le lieu <b>${ech(j.lieu)}</b> n'existe pas.`);
    if(j.personnage&&GENS&&!gensPar(j.personnage))
      dur(`Jalon ${i+1} : <b>${ech(j.personnage)}</b> n'est pas au répertoire chargé.`);
    if(j.faire==='rencontrer'&&j.personnage&&GENS&&gensPar(j.personnage)&&
       !gensPar(j.personnage).lieu)
      dur(`Jalon ${i+1} : <b>${ech(appellation(gensPar(j.personnage)))}</b> n'a pas de lieu, `+
        `on ne peut donc pas aller lui parler.`);
    if(!j.texte)doux(`Jalon ${i+1} : rien à lire quand il tombe.`);
    verifierTexte(j.texte,`le jalon ${i+1}`,out);
  });
  /* le fil est-il tenable ? */
  if(MONDE){
    const fil=filDe(m);
    fil.forEach((x,i)=>{
      if(x.genre==='jalon'&&x.lieu&&x.cout===null)
        dur(`Le jalon ${x.i+1} est à <b>${ech(nomLieu(x.lieu))}</b>, qu'aucune voie ne relie `+
          `au reste du trajet.`);
    });
    const t=etapesTotales(m), d=(m.offre||{}).delai||0;
    if(d&&t&&d<t)dur(`Le trajet demande <b>${t} étapes</b> et le délai n'en accorde que `+
      `<b>${d}</b> : la mission est <b>impossible</b>.`);
    else if(d&&t&&d<t+2)doux(`Le délai (<b>${d}</b>) ne laisse que <b>${d-t}</b> étape`+
      `${d-t>1?'s':''} de marge sur <b>${t}</b> de trajet. Un seul détour et c'est raté.`);
  }

  verifierTexte(m.reussite&&m.reussite.texte,'la réussite',out);
  verifierTexte(m.echec&&m.echec.texte,'l\'échec',out);
  if(!(m.reussite&&m.reussite.texte))dur('Il manque le <b>texte de réussite</b>.');
  const rec=(m.reussite||{}).recompenses||[];
  if(!rec.length)doux('Elle ne rapporte <b>rien</b>. Valable si le lore est la récompense, '+
    'mais dites-le dans le texte.');
  [['reussite',rec],['echec',((m.echec||{}).recompenses||[])]].forEach(([ou,l])=>{
    l.forEach((r,i)=>{
      const d=M.recompenses[r.donne];
      if(!d){dur(`Récompense inconnue du catalogue : <b>${ech(r.donne)}</b>.`);return;}
      Object.entries(d.parametres||{}).forEach(([k,dd])=>{
        if(dd.requis&&(r[k]===undefined||r[k]===''))
          dur(`« ${ech(d.nom)} » : <b>${ech(dd.nom)}</b> est obligatoire.`);
      });
      if(r.donne==='objet'&&r.objet){
        if(OBJETS&&!objetPar(r.objet))
          dur(`L'objet <b>${ech(r.objet)}</b> n'est pas au coffre chargé.`);
        else if(OBJETS){
          /* les deux fichiers doivent se citer l'un l'autre */
          const o=objetPar(r.objet), pv=(o||{}).provenance||{};
          if(pv.genre!=='mission')
            dur(`<b>${ech(o.nom)}</b> est donné par cette mission, mais sa provenance est `+
              `« ${ech(pv.genre?(pv.genre):'aucune')} ». Corrigez-la dans l'atelier d'objets.`);
          else if(pv.mission!==m.cle)
            dur(`<b>${ech(o.nom)}</b> dit venir de la mission `+
              `<b>${ech(pv.mission||'—')}</b>, pas de <b>${ech(m.cle||'—')}</b>.`);
        }
      }
      if(r.donne==='ouvreCouche'&&r.personnage&&GENS){
        if(!gensPar(r.personnage))
          dur(`« Une couche de lore » vise <b>${ech(r.personnage)}</b>, hors répertoire.`);
        else if(r.couche&&!couchesDe(r.personnage).some(x=>x[0]===r.couche))
          dur(`« Une couche de lore » vise une couche qui n'existe pas chez `+
            `<b>${ech(appellation(gensPar(r.personnage)))}</b>.`);
      }
      if(ou==='echec'&&(r.donne==='or'||r.donne==='reputation'||r.donne==='karma')&&
         (r.de||0)>0)
        doux(`L'échec <b>récompense</b> ${ech(ditRecompense(r))}. C'est peut-être voulu.`);
    });
  });
  return out;
}
function verifierTexte(txt,ou,out){
  trous(txt).forEach(t=>{
    if(TROUS.indexOf(t.split('.')[0])<0)
      out.push({dur:true,txt:`<b>{${ech(t)}}</b> dans ${ech(ou)} ne correspond à rien. `+
        `Le joueur lira les accolades telles quelles.`});
  });
}

/* ═══════════════ les volets ═══════════════ */
function rendreVolet(){
  const v=$('#volet');
  if(onglet==='offre')v.innerHTML=voletOffre();
  else if(onglet==='fil')v.innerHTML=voletFil();
  else if(onglet==='gens')v.innerHTML=voletGens();
  else if(onglet==='controles')v.innerHTML=voletControles();
  else v.innerHTML=voletConvoi();
}
function voletOffre(){
  const m=MI();
  if(!m)return `<p class="vide">Rien à montrer.</p>`;
  const sac=sacTexte(m);
  const nat=teinteDe(m.ico||{});
  const rec=(m.reussite||{}).recompenses||[];
  const dispo=conditionsVraies((m.offre||{}).si);
  let h=`<div class="offre"><div class="tete">`+
    ((m.ico&&m.ico.glyphe)?`<div class="ico">${svgGlyphe(m.ico.glyphe,nat)}</div>`:'')+
    `<div><p class="oeil">${ech(m.oeil||'Un service')}</p>`+
    `<h3>${ech(m.titre||'Sans titre')}</h3></div></div>`+
    `<p class="recit">${ech(boucher((m.offre||{}).recit,sac))||'<em>…</em>'}</p>`+
    `<dl class="lignes">`+
    `<dt>De</dt><dd>${ech(sac.commanditaire)}</dd>`+
    `<dt>À</dt><dd>${ech(sac.ici)}</dd>`+
    ((m.jalons||[]).length?`<dt>Il faut</dt><dd>${(m.jalons||[]).map(j=>
      ech(ditJalon(j))).join('<br>')}</dd>`:'')+
    ((m.offre||{}).delai?`<dt>Délai</dt><dd>${fmt(m.offre.delai)} étapes`+
      `${MONDE&&etapesTotales(m)?` (trajet : ${etapesTotales(m)})`:''}</dd>`:'')+
    `</dl>`;
  if(rec.length)h+=`<p class="prix">On promet <b>`+
    rec.map(r=>ech(ditRecompense(r))).join('</b>, <b>')+`</b>.</p>`;
  if((m.reussite||{}).texte)h+=`<div class="fin">`+
    `${ech(boucher(m.reussite.texte,sac))}</div>`;
  if((m.echec||{}).texte)h+=`<div class="fin mauvais">`+
    `${ech(boucher(m.echec.texte,sac))}</div>`;
  h+=`</div>`;
  if(!dispo)h+=`<div class="avert doux" style="margin-top:9px">Avec le convoi d'essai, `+
    `elle <b>ne serait pas proposée</b> : `+
    ((m.offre||{}).si||[]).filter(c=>!conditionsVraies([c])).map(c=>ech(ditCondition(c)))
      .join(', ')+`.</div>`;
  return h;
}
function voletFil(){
  const m=MI();
  if(!m)return `<p class="vide">Rien à suivre.</p>`;
  const fil=filDe(m);
  let h=`<p class="aide">Le chemin que la mission fait parcourir, dans l'ordre. Les étapes `+
    `viennent du réseau de voies de votre <b>monde.json</b> — le plus court chemin, profil `+
    `normal.</p><div class="fil" style="margin-top:11px">`;
  fil.forEach((x,i)=>{
    const der=i===fil.length-1;
    const cls=x.genre==='depart'?'dep':(der?'fin':'');
    h+=`<div class="etape"><div class="rail"><div class="pion ${cls}"></div>`+
      (der?'':`<div class="trait"></div>`)+`</div><div class="corps2">`+
      `<b>${x.genre==='depart'?ech(x.texte):ech(ditJalon(x.jalon))}</b>`+
      (x.lieu?`<span>${ech(nomLieu(x.lieu))}`+
        (contreeDe(x.lieu)?' · '+ech(nomContree(contreeDe(x.lieu))):'')+
        `</span>`:`<span>sans lieu</span>`)+
      /* on ne dit le coût que s'il y en a un : « +0 étape » n'apprend rien */
      (x.genre!=='jalon'||!x.lieu?''
        :x.cout===null||x.cout===undefined
          ?`<div class="cout" style="color:var(--minium)">aucune voie connue</div>`
          :x.cout?`<div class="cout">+${x.cout} étape${x.cout>1?'s':''}</div>`
                 :`<div class="cout" style="opacity:.6">sur place</div>`)+
      `</div></div>`;
  });
  h+=`</div>`;
  const t=etapesTotales(m), d=(m.offre||{}).delai||0;
  h+=`<div class="mesures" style="margin-top:10px">`+
    `<span>Trajet total</span><b>${MONDE?t+' étapes':'monde absent'}</b>`+
    (d?`<span>Délai accordé</span><b>${d} étapes</b>`:'')+
    (d&&t?`<span>Marge</span><b>${d-t}</b>`:'')+`</div>`;
  if(!MONDE)h+=`<p class="vide" style="margin-top:8px">Chargez un <b>monde.json</b> et `+
    `l'atelier calculera les distances réelles.</p>`;
  else if(d&&t&&d<t)h+=`<div class="avert" style="margin-top:8px">Le délai ne suffit pas : `+
    `la mission est <b>impossible</b>.</div>`;
  return h;
}
/* ── l'onglet Personnages : qui se trouve dans la zone, et à qui confier ── */
function voletGens(){
  const m=MI();
  if(!GENS)return `<p class="vide">Chargez votre <b>personnages.json</b> pour voir qui `+
    `peuple le monde.</p><p class="aide" style="margin-top:9px">Le lien est enregistré `+
    `<b>dans la mission</b> : votre répertoire de personnages n'est jamais modifié. `+
    `Écrivez vos gens tranquillement, revenez leur confier une mission plus tard.</p>`;
  const zones=[['','Tout le monde']]
    .concat(listeOu('contrees').map(c=>['c:'+c[0],c[1]]))
    .concat(listeOu('lieux').map(l=>['l:'+l[0],'— '+l[1]]));
  let dans=tousGens();
  if(zone.indexOf('l:')===0)dans=dans.filter(p=>p.lieu===zone.slice(2));
  else if(zone.indexOf('c:')===0)dans=dans.filter(p=>contreeDe(p.lieu)===zone.slice(2));
  let h=`<div class="champ large"><label>La zone</label><select id="zone">`+
    zones.map(([k,n])=>`<option value="${ech(k)}"${k===zone?' selected':''}>`+
      `${ech(n)}</option>`).join('')+`</select></div>`;
  if(m)h+=`<p class="aide">Cliquez <b>Confier</b> pour donner « `+
    `${ech(m.titre||'cette mission')} » à quelqu'un.</p>`;
  h+=`<div class="gens" style="margin-top:10px">`;
  if(!dans.length)h+=`<p class="vide">Personne dans cette zone.</p>`;
  dans.forEach(p=>{
    const siennes=missionsDe(p.cle);
    const sien=m&&m.commanditaire===p.cle;
    const prem=String(p.premiere||'').replace(/\s+/g,' ');
    h+=`<div class="carte${sien?' sien':''}"><div class="haut">`+
      `<span class="jeton">${svgGlyphe((p.ico||{}).glyphe,
        teinteDe(p.ico||{}))}</span>`+
      `<span class="txt"><b>${ech(appellation(p))}</b>`+
      `<span class="sous">${ech(nomLieu(p.lieu)||'sans lieu')} · `+
      `<span class="${siennes.length?'':'aucune'}">`+
      `${siennes.length?siennes.length+' mission'+(siennes.length>1?'s':''):'aucune mission'}`+
      `</span></span></span></div>`+
      (prem?`<div class="extrait">${ech(prem.slice(0,120))}`+
        `${prem.length>120?'…':''}</div>`:'')+
      (siennes.length?`<div class="sous" style="margin-top:5px">`+
        siennes.map(x=>`<a href="#" data-sel="${R.missions.indexOf(x)}" `+
          `style="color:var(--or)">${ech(x.titre||x.cle||'?')}</a>`).join(' · ')+`</div>`:'')+
      (m?`<div class="rangee">`+
        (sien?`<button class="outil petit" data-act="qui-oter">Détacher</button>`
             :`<button class="outil petit fort" data-act="confier" `+
              `data-q="${ech(p.cle)}">Confier</button>`)+
        `</div>`:'')+
      `</div>`;
  });
  h+=`</div>`;
  const sans=tousGens().filter(p=>!missionsDe(p.cle).length).length;
  if(sans)h+=`<p class="aide" style="margin-top:10px"><b>${sans}</b> personnage`+
    `${sans>1?'s n\'ont':' n\'a'} encore aucune mission dans ce carnet. C'est normal : on `+
    `écrit ses gens d'abord, on leur confie des missions quand on veut.</p>`;
  return h;
}
function voletControles(){
  const m=MI();
  if(!m)return `<p class="vide">Rien à contrôler.</p>`;
  const l=controler(m,sel);
  const durs=l.filter(x=>x.dur), doux=l.filter(x=>!x.dur);
  let h=`<h4 class="section">Cette mission</h4>`;
  h+=durs.length?durs.map(x=>`<div class="avert">${x.txt}</div>`).join('')
    :`<div class="avert bien">Rien ne bloque : elle est <b>jouable</b>.</div>`;
  if(doux.length)h+=`<h4 class="section">À voir, sans urgence</h4>`+
    doux.map(x=>`<div class="avert doux">${x.txt}</div>`).join('');

  const mauvais=R.missions.map((x,i)=>({x:x,i:i,n:controler(x,i).filter(y=>y.dur).length}))
    .filter(z=>z.n);
  h+=`<h4 class="section">Le carnet</h4><div class="mesures">`+
    `<span>Missions</span><b>${R.missions.length}</b>`+
    `<span>Jalons en tout</span><b>${R.missions.reduce((s,x)=>s+(x.jalons||[]).length,0)}</b>`+
    `<span>Sans commanditaire</span><b>${R.missions.filter(x=>!x.commanditaire).length}</b>`+
    `<span>À corriger</span><b>${mauvais.length}</b></div>`;
  if(mauvais.length)h+=`<div class="avert" style="margin-top:7px">`+
    mauvais.map(z=>`<a href="#" data-sel="${z.i}" style="color:var(--or)">`+
      `${ech(z.x.titre||z.x.cle||'?')}</a>`).join(' · ')+`</div>`;

  /* les objets promis, et si le coffre est d'accord */
  const promis=[];
  R.missions.forEach(x=>((x.reussite||{}).recompenses||[]).forEach(r=>{
    if(r.donne==='objet'&&r.objet)promis.push([r.objet,x.cle]);}));
  h+=`<h4 class="section">Les objets promis</h4>`;
  if(!promis.length)h+=`<p class="vide">Aucune mission ne donne d'objet.</p>`;
  else if(!OBJETS)h+=`<p class="vide">Chargez votre <b>objets.json</b> pour vérifier que `+
    `les deux fichiers se citent bien l'un l'autre.</p><div class="avert doux">`+
    promis.map(([o])=>ech(o)).join(' · ')+`</div>`;
  else h+=`<table class="tableau"><tr><th>Objet</th><th>Le coffre est d'accord</th></tr>`+
    promis.map(([o,mc])=>{
      const ob=objetPar(o), pv=(ob||{}).provenance||{};
      const ok=ob&&pv.genre==='mission'&&pv.mission===mc;
      return `<tr><td>${ech((ob||{}).nom||o)}</td><td style="color:${ok?
        'var(--vert)':'var(--minium)'}">${ok?'oui':(ob?'non':'inconnu')}</td></tr>`;
    }).join('')+`</table>`;

  /* qui donne quoi */
  h+=`<h4 class="section">Qui donne quoi</h4>`;
  if(!GENS)h+=`<p class="vide">Chargez un <b>personnages.json</b>.</p>`;
  else{
    const avec=tousGens().filter(p=>missionsDe(p.cle).length);
    h+=`<div class="mesures"><span>Personnages qui donnent</span>`+
      `<b>${avec.length} / ${tousGens().length}</b></div>`;
    if(avec.length)h+=`<table class="tableau" style="margin-top:7px">`+
      avec.map(p=>`<tr><td>${ech(appellation(p))}</td>`+
        `<td class="n">${missionsDe(p.cle).length}</td></tr>`).join('')+`</table>`;
  }
  return h;
}
function voletConvoi(){
  const l=[['etapes','Étapes parcourues',0,40],['or','Or en bourse',0,20000],
    ['reputation','Réputation',0,100],['karma','Karma',0,100],
    ['gardes','Gardes',0,6],['lieues','Lieues au compteur',0,900],
    ['place','Place libre (kg)',0,3000],['charge','Cargaison (kg)',0,3000],
    ['valeurSoute','Valeur de la cargaison',0,40000],['etatConvoi','Santé du convoi',0,100],
    ['negoce','Négoce',0,100],['vigilance','Vigilance',0,100],['agilite','Agilité',0,100]];
  return `<p class="aide">Le convoi contre lequel les conditions d'apparition sont `+
    `évaluées. C'est ce qui permet de voir si une mission serait proposée au début ou `+
    `seulement à la fin d'une partie.</p>`+
    `<div style="display:flex;flex-direction:column;gap:7px;margin-top:10px">`+
    l.map(([k,n,a,b])=>`<div class="champ"><label>${ech(n)}</label>`+
      `<input type="number" min="${a}" max="${b}" data-essai="${k}" value="${ESSAI[k]}">`+
      `</div>`).join('')+`</div>`+
    `<button class="outil" style="margin-top:10px" data-act="essai-defaut">`+
    `Remettre au milieu</button>`;
}

/* ═══════════════ l'état du bas ═══════════════ */
function rendreEtat(){
  const durs=R.missions.reduce((s,m,i)=>s+controler(m,i).filter(x=>x.dur).length,0);
  $('#etat').innerHTML=
    `<span>Carnet : <b>${R.missions.length}</b> mission${R.missions.length>1?'s':''}</span>`+
    `<span>Jalons : <b>${R.missions.reduce((s,m)=>s+(m.jalons||[]).length,0)}</b></span>`+
    `<span>Monde : <b>${MONDE?(MONDE.lieux||[]).length+' lieux':'aucun'}</b></span>`+
    `<span>Personnages : <b>${GENS?tousGens().length:'aucun'}</b></span>`+
    `<span>Objets : <b>${OBJETS?tousObjets().length:'aucun'}</b></span>`+
    `<span class="${durs?'rouge':''}">À corriger : <b>${durs}</b></span>`+
    `<span style="margin-left:auto">Sauvegardé dans le navigateur — <b>exportez</b> `+
      `régulièrement</span>`;
}
function tout(){rendreListe();rendreFeuille();rendreVolet();rendreEtat();sauver();}
function maj(){rendreListe();rendreVolet();rendreEtat();sauver();}

/* ═══════════════ actions ═══════════════ */
function neuve(){
  return {cle:'',titre:'',oeil:'Un service',
    ico:{glyphe:'sceau',nature:'rencontre'},
    offre:{recit:'',delai:14,si:[]},jalons:[],
    reussite:{texte:'',recompenses:[]},echec:{texte:'',recompenses:[]}};
}
function ajouter(m){R.missions.push(m||neuve());sel=R.missions.length-1;tout();}
const EXEMPLE={
  cle:'le-registre-rature',titre:'Le registre raturé',oeil:'Un service',
  commanditaire:'orlanne',
  ico:{glyphe:'sceau',nature:'tracas'},
  offre:{recit:'{commanditaire} vous retient au moment où vous quittez la halle. Onze '+
    'lignes de son registre ont été grattées, et {il} veut savoir par qui. Le clerc qui '+
    'tenait la plume cette année-là s\'est retiré à {la}.',
    delai:14,si:[{quoi:'reputation',min:35}]},
  jalons:[
    {faire:'atteindre',lieu:'',texte:'Le bourg est plus petit que ce qu\'on vous avait dit.'},
    {faire:'rencontrer',personnage:'',texte:'Le vieux clerc ne nie rien. Il demande '+
      'seulement qu\'on ne lui rapporte pas le registre.'}
  ],
  reussite:{texte:'{commanditaire} écoute jusqu\'au bout sans rien noter. Puis {il} vous '+
    'tend le registre : « Gardez-le. Moi je sais, maintenant. »',
    recompenses:[{donne:'or',de:420},{donne:'reputation',de:9}]},
  echec:{texte:'Quand vous revenez, le registre n\'est plus sur le pupitre, et personne '+
    'ne se souvient qu\'il ait existé.',recompenses:[{donne:'reputation',de:-6}]}
};

document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.dataset.essai!==undefined){
    ESSAI[t.dataset.essai]=t.type==='checkbox'?t.checked:(Number(t.value)||0);
    rendreVolet();sauver();return;
  }
  if(t.id==='filtre'){filtre=t.value;rendreListe();}
});
ecouterSaisie((t,ch)=>{
  if(ch==='titre')rendreListe();
  maj();
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='zone'){zone=t.value;rendreVolet();sauver();return;}
  if(t.dataset.act==='jalon-ajout'){
    if(!t.value)return;
    const d=M.jalons[t.value], j={faire:t.value};
    Object.entries(d.parametres||{}).forEach(([k,dd])=>{
      if(dd.defaut!==undefined)j[k]=dd.defaut;});
    const l=lire('jalons')||[];l.push(j);ecrire('jalons',l);tout();return;
  }
  if(t.dataset.act==='rec-ajout'){
    if(!t.value)return;
    const d=M.recompenses[t.value], r={donne:t.value};
    Object.entries(d.parametres||{}).forEach(([k,dd])=>{
      if(dd.defaut!==undefined)r[k]=dd.defaut;});
    const l=lire(t.dataset.ch)||[];l.push(r);ecrire(t.dataset.ch,l);tout();return;
  }
  const c=t.dataset.ch;
  if(c==='commanditaire'||c==='lieu'||c==='ico.nature'||/\.quoi$/.test(c||'')||
     /\.personnage$/.test(c||''))tout();
});
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act],[data-sel]');
  if(!b)return;
  if(b.dataset.sel!==undefined){ev.preventDefault();sel=Number(b.dataset.sel);tout();return;}
  const a=b.dataset.act, m=MI();
  if(a==='cle-auto'){ecrire('cle',slug(lire('titre')));tout();}
  else if(a==='glyphe'){ecrire('ico.glyphe',b.dataset.g);tout();}
  /* confier : le lien est écrit dans la mission, jamais chez le personnage */
  else if(a==='confier'){if(m){m.commanditaire=b.dataset.q;tout();}}
  else if(a==='qui-oter'){if(m){delete m.commanditaire;tout();}}
  else if(a==='jalon-oter'){m.jalons.splice(Number(b.dataset.i),1);tout();}
  else if(a==='jalon-haut'){bouger(m.jalons,Number(b.dataset.i),-1);tout();}
  else if(a==='jalon-bas'){bouger(m.jalons,Number(b.dataset.i),1);tout();}
  else if(a==='rec-oter'){const l=lire(b.dataset.ch);l.splice(Number(b.dataset.i),1);tout();}
  else if(a==='cond-ajout'){const l=lire(b.dataset.ch)||[];
    l.push({quoi:'etapes',min:1});ecrire(b.dataset.ch,l);tout();}
  else if(a==='cond-oter'){const l=lire(b.dataset.ch);l.splice(Number(b.dataset.i),1);tout();}
  else if(a==='essai-defaut'){ESSAI={etapes:6,or:900,reputation:52,karma:50,gardes:2,
    lieues:120,place:400,charge:620,valeurSoute:1400,etatConvoi:78,vigilance:58,
    agilite:62,negoce:60,puissance:1,troupe:3,chien:false,stock:150};tout();}
});
$$('#onglets button').forEach(b=>b.addEventListener('click',()=>{
  onglet=b.dataset.onglet;
  $$('#onglets button').forEach(x=>x.classList.toggle('actif',x===b));
  rendreVolet();
}));

/* ── la barre ── */
$('#b-nouveau').onclick=()=>ajouter();
$('#b-dupliquer').onclick=()=>{
  if(!MI())return;
  const c=JSON.parse(JSON.stringify(MI()));
  c.cle=(c.cle||'mission')+'-bis';c.titre=(c.titre||'')+' (copie)';
  ajouter(c);
};
$('#b-supprimer').onclick=()=>{
  if(!MI())return;
  if(!confirm('Supprimer « '+(MI().titre||'sans titre')+' » ?'))return;
  R.missions.splice(sel,1);sel=Math.max(0,sel-1);tout();
};
$('#b-exemple').onclick=()=>{
  if(R.missions.some(m=>m.cle==='le-registre-rature')){alert('L\'exemple est déjà là.');return;}
  const e=JSON.parse(JSON.stringify(EXEMPLE));
  /* on remplit ce qu'on peut avec ce qui est chargé */
  const l=listeOu('lieux');
  if(l.length>1){e.jalons[0].lieu=l[1][0];}
  if(!gensPar('orlanne'))delete e.commanditaire;
  ajouter(e);
};
let attente=null;
const ouvrirFichier=accueillirFichiers(d=>avaler(d,attente));
$('#b-ouvrir').onclick=()=>{attente='carnet';ouvrirFichier();};
$('#b-monde').onclick=()=>{attente='monde';ouvrirFichier();};
$('#b-gens').onclick=()=>{attente='gens';ouvrirFichier();};
$('#b-objets').onclick=()=>{attente='objets';ouvrirFichier();};
function avaler(d,quoi){
  attente=null;
  if(quoi==='monde'||(!quoi&&estMonde(d))){mondeEst(d);tout();return;}
  if(quoi==='gens'||(!quoi&&d&&d.personnages)){
    if(!d||!d.personnages){alert('Ce fichier n\'est pas un répertoire de personnages.');return;}
    /* un fichier chargé rejoint le dépôt : les autres ateliers le verront */
    GENS=d;depotEcrire('personnages',d);tout();return;
  }
  if(quoi==='objets'||(!quoi&&d&&d.objets)){
    if(!d||!d.objets){alert('Ce fichier n\'est pas un coffre d\'objets.');return;}
    OBJETS=d;depotEcrire('objets',d);tout();return;
  }
  const l=Array.isArray(d)?d:(d.missions||null);
  if(!l){alert('Ni un carnet de missions, ni un monde, ni un répertoire, ni un coffre.');return;}
  if(R.missions.length&&!confirm('Remplacer le carnet courant ('+R.missions.length+
    ' missions) ?'))return;
  R={format:d.format||'caravane.missions.v1',missions:l};
  sel=0;tout();
}
/* « missions-ecrites.json », et pas « missions.json » : ce nom-là est déjà pris
   dans data/ par ce qui habille les contrats tirés au sort. */
$('#b-exporter').onclick=()=>
  telecharger(FICHIERS_JEU.missions,nettoyer(JSON.parse(JSON.stringify(R))));

addEventListener('keydown',e=>{
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName))return;
  if(e.key==='n'&&!e.ctrlKey&&!e.metaKey){e.preventDefault();ajouter();}
  if(e.key==='ArrowDown'&&sel<R.missions.length-1){e.preventDefault();sel++;tout();}
  if(e.key==='ArrowUp'&&sel>0){e.preventDefault();sel--;tout();}
});

relire();
tout();
/* le codex du hub ouvre un élément par son lien : #cle=… */
ouvrirDemande(R.missions,i=>{sel=i;tout();});
/* une teinte se choisit d'un clic, ici comme dans les autres ateliers */
ecouterTeintes(()=>tout());
/* un autre atelier a écrit dans le dépôt : on se remet à jour */
suivreDepot(()=>{relire();tout();});
habillerMobile(['Le carnet','La mission','L\'offre']);
</script>
</body>
</html>
